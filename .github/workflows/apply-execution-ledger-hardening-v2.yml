name: Apply execution-ledger hardening v2

on:
  push:
    branches: [bootstrap/apply-execution-ledger-hardening-0c7b]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/execution-ledger-v0
          fetch-depth: 0
      - name: Verify target head has not moved
        run: |
          test "$(git rev-parse HEAD)" = "0c7b950c6a30634fd33dc8bfc1289c72958d79b5"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Fetch patch carrier
        run: |
          git fetch origin bootstrap/apply-execution-ledger-hardening-0c7b
          for part in 00 01 02 03; do
            git show "origin/bootstrap/apply-execution-ledger-hardening-0c7b:bootstrap/execution-ledger-hardening.patch.part${part}" > "/tmp/part${part}"
          done
      - name: Reconstruct overlapping patch deterministically
        run: |
          python - <<'PY'
          from pathlib import Path

          parts = [Path(f"/tmp/part{i:02d}").read_text(encoding="utf-8").splitlines(keepends=True) for i in range(4)]
          merged = list(parts[0])
          overlaps = []
          for incoming in parts[1:]:
              max_overlap = min(len(merged), len(incoming))
              overlap = 0
              for size in range(max_overlap, 0, -1):
                  if merged[-size:] == incoming[:size]:
                      overlap = size
                      break
              overlaps.append(overlap)
              merged.extend(incoming[overlap:])

          patch = "".join(merged)
          expected = [
              "docs/execution-ledger-v0.md",
              "migrations/neon/0004_execution_ledger.sql",
              "src/nextgen_memory/execution_ledger.py",
              "tests/test_execution_ledger.py",
              "tests/test_execution_ledger_migration.py",
          ]
          for path in expected:
              header = f"diff --git a/{path} b/{path}"
              if patch.count(header) != 1:
                  raise SystemExit(f"unexpected diff-header count for {path}: {patch.count(header)}")
          if patch.count("diff --git ") != len(expected):
              raise SystemExit(f"unexpected total diff count: {patch.count('diff --git ')}")
          if not all(overlap > 0 for overlap in overlaps):
              raise SystemExit(f"missing expected part overlap: {overlaps}")

          Path("/tmp/execution-ledger-hardening.patch").write_text(patch, encoding="utf-8")
          print({"overlaps": overlaps, "lines": len(merged)})
          PY
      - name: Apply verified patch
        run: |
          git apply --check /tmp/execution-ledger-hardening.patch
          git apply --index /tmp/execution-ledger-hardening.patch
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 5
      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q src
      - name: Commit and push one atomic change
        run: |
          git config user.name "NextGen Memory Automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix: harden execution ledger integrity"
          git push origin HEAD:feat/execution-ledger-v0
