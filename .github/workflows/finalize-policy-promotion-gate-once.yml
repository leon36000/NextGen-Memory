name: Finalize advisory policy promotion gate v0 once

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'feat/advisory-policy-promotion-gate-v0-20260824'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/advisory-policy-promotion-gate-v0-20260824
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Resolve immutable registry base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          base_sha=$(git rev-parse origin/candidate/paired-replay-experiment-registry-v0-20260824)
          test -n "$base_sha"
          test "$(git merge-base HEAD "$base_sha")" = "$base_sha"
          echo "BASE_SHA=$base_sha" >> "$GITHUB_ENV"
          printf 'base_sha=%s\n' "$base_sha"

      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'

      - name: Harden bounded thresholds and incomplete-registry handling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/nextgen_memory/policy_promotion_gate.py')
          source = path.read_text(encoding='utf-8')
          old = '''        maximum_mean_token_delta = _finite_number(
              "maximum_mean_token_delta", self.maximum_mean_token_delta
          )
          maximum_mean_latency_delta_ms = _finite_number(
              "maximum_mean_latency_delta_ms",
              self.maximum_mean_latency_delta_ms,
          )'''
          new = '''        maximum_mean_token_delta = _nonnegative_number(
              "maximum_mean_token_delta", self.maximum_mean_token_delta
          )
          maximum_mean_latency_delta_ms = _nonnegative_number(
              "maximum_mean_latency_delta_ms",
              self.maximum_mean_latency_delta_ms,
          )'''
          if old not in source:
              raise SystemExit('cost-threshold block differs from expected source')
          source = source.replace(old, new, 1)
          old_registry = '''        if evidence.registry_active_count > 0:
              hold_reasons.append(PolicyPromotionReason.REGISTRY_INCOMPLETE)'''
          new_registry = '''        if (
              evidence.registry_active_count > 0
              or evidence.registry_failed_count > 0
              or evidence.registry_cancelled_count > 0
          ):
              hold_reasons.append(PolicyPromotionReason.REGISTRY_INCOMPLETE)'''
          if old_registry not in source:
              raise SystemExit('registry-incomplete block differs from expected source')
          source = source.replace(old_registry, new_registry, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Add exact package-root exports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          path = Path('src/nextgen_memory/__init__.py')
          source = path.read_text(encoding='utf-8')
          required = {
              'AdvisoryPolicyPromotionGate',
              'PairedPolicyEvidence',
              'PolicyIdentity',
              'PolicyOperationalReadiness',
              'PolicyPromotionDecision',
              'PolicyPromotionGateConfig',
              'PolicyPromotionReason',
              'PolicyPromotionRecord',
              'PolicyPromotionRequest',
              'PolicyPromotionValidationError',
          }
          import_block = '''from .policy_promotion_gate import (
              AdvisoryPolicyPromotionGate,
              PairedPolicyEvidence,
              PolicyIdentity,
              PolicyOperationalReadiness,
              PolicyPromotionDecision,
              PolicyPromotionGateConfig,
              PolicyPromotionReason,
              PolicyPromotionRecord,
              PolicyPromotionRequest,
              PolicyPromotionValidationError,
          )
          '''
          import_block = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in import_block.splitlines()
          ).lstrip('\n')
          if 'from .policy_promotion_gate import (' not in source:
              markers = (
                  'from .paired_replay_experiment_registry import (',
                  'from .paired_rerank_policy_evaluation import (',
              )
              marker = next((value for value in markers if source.count(value) == 1), None)
              if marker is None:
                  raise SystemExit('no unambiguous insertion marker for policy promotion imports')
              source = source.replace(marker, import_block + marker, 1)

          tree = ast.parse(source)
          all_values: list[str] | None = None
          for statement in tree.body:
              if (
                  isinstance(statement, ast.Assign)
                  and any(isinstance(target, ast.Name) and target.id == '__all__' for target in statement.targets)
                  and isinstance(statement.value, (ast.List, ast.Tuple))
              ):
                  all_values = [
                      element.value
                      for element in statement.value.elts
                      if isinstance(element, ast.Constant) and isinstance(element.value, str)
                  ]
                  break
          if all_values is None:
              raise SystemExit('package __all__ is not a literal list or tuple')
          start = source.index('__all__ = [')
          end = source.index('\n]', start) + 2
          replacement = '__all__ = [\n' + ''.join(
              f'    "{name}",\n' for name in sorted(set(all_values).union(required))
          ) + ']'
          source = source[:start] + replacement + source[end:]
          path.write_text(source, encoding='utf-8')
          PY

      - name: Add bounded design and implementation plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/superpowers/specs docs/superpowers/plans
          cat > docs/superpowers/specs/2026-08-24-advisory-policy-promotion-gate-v0-design.md <<'EOF'
          # Advisory Policy Promotion Gate v0 Design

          **Date:** 2026-08-24
          **Status:** implementation candidate
          **Base:** `candidate/paired-replay-experiment-registry-v0-20260824`

          ## Goal

          Convert immutable matched-policy evidence and bounded operational readiness into one advisory result: `promote`, `hold`, or `reject`. The result never changes a policy and cannot perform deployment, persistence, feedback, telemetry emission, model execution, migration, or release work.

          ## Inputs

          The gate accepts only validated immutable types:

          - current and candidate policy version, SHA-256 fingerprint, and 40-character Git SHA;
          - paired evaluator identity, control/treatment identity, verdict, matched-pair count, finite score effect, confidence interval, standard error, token/latency deltas, and harm rate;
          - paired registry summary identity and exact complete/failed/cancelled/active partition;
          - boolean test, integration, artifact, rollback, and safety evidence;
          - bounded reviewer count and externally supplied evidence age;
          - versioned finite thresholds.

          No free-form string is admitted except bounded identifiers. The gate reads no clock, environment, filesystem, database, network, worker, lease, model, or agent.

          ## Decision precedence

          Hard rejection is evaluated first and suppresses every hold reason:

          1. safety violation;
          2. current/candidate/evaluation identity mismatch;
          3. registry/evaluation completed-trial mismatch;
          4. `harmful` or `too_costly` evaluator verdict;
          5. negative established mean effect;
          6. excessive token, latency, or harm cost.

          If no rejection exists, the gate returns `hold` for insufficient matched pairs, non-positive lower confidence bound, excessive uncertainty, stale evidence, any unfinished registry state, rollback/test/integration/artifact/reviewer gaps, or evaluator verdict `insufficient_evidence`, `neutral`, or `inconclusive`.

          `promote` is emitted only for evaluator verdict `promising` when every identity, statistical, operational, safety, rollback, artifact, reviewer, freshness, and cost condition passes.

          ## Identity and serialization

          Every input component has canonical sorted compact JSON and SHA-256 identity. The decision record stores component hashes, bounded reason codes, the advisory decision, and `advisory_only=true`. Its content hash covers every material field; its ID is UUID5 over the versioned schema and content hash. No input payload is echoed into the record.

          ## Non-goals

          V0 does not activate, persist, deploy, schedule, retry, monitor, sample, emit feedback, contact infrastructure, or infer current time. A `promote` record is evidence for a later independently authorized operation, not that operation itself.
          EOF
          sed -i 's/^          //' docs/superpowers/specs/2026-08-24-advisory-policy-promotion-gate-v0-design.md

          cat > docs/superpowers/plans/2026-08-24-advisory-policy-promotion-gate-v0.md <<'EOF'
          # Advisory Policy Promotion Gate v0 — Implementation Plan

          **Date:** 2026-08-24
          **Base:** `candidate/paired-replay-experiment-registry-v0-20260824`

          1. Record a Ruff-clean tests-only module-absence RED.
          2. Add strict immutable policy identity, paired evidence, readiness, threshold, request, and record types.
          3. Validate UUID, SHA-256, Git SHA, identifier, enum, bool, integer, finite-number, interval, rate, and registry-partition contracts before decision logic.
          4. Implement hard rejection in fixed precedence and prevent simultaneous hold reasons from leaking into a reject record.
          5. Implement bounded hold conditions and permit promotion only for a fully qualified `promising` evaluation.
          6. Bind all material inputs to canonical SHA-256 and UUID5 decision identity without echoing free-form content.
          7. Prove threshold equality and one-ULP neighborhoods, malformed inputs, identity drift, 5,000 generated valid requests, reject precedence, material-input identity sensitivity, process-hash-seed invariance, and package exports.
          8. Run Ruff, compileall, focused/full tests, strict dependency/privacy/stub audit, isolated wheel installation, Python 3.12/3.13 exact-SHA verification, and cross-Python byte-identity evidence.
          9. Publish an immutable candidate and blind GPT-5.6 Sol packet only after every verifier job succeeds.

          Merge, deployment, policy activation, telemetry emission, feedback, migration application, and release publication remain separate operations.
          EOF
          sed -i 's/^          //' docs/superpowers/plans/2026-08-24-advisory-policy-promotion-gate-v0.md

      - name: Normalize bounded product files
        run: |
          ruff format \
            src/nextgen_memory/__init__.py \
            src/nextgen_memory/policy_promotion_gate.py \
            tests/test_policy_promotion_gate.py \
            tests/test_policy_promotion_gate_properties.py \
            tests/test_policy_promotion_gate_public_api.py
          ruff check --fix \
            src/nextgen_memory/__init__.py \
            src/nextgen_memory/policy_promotion_gate.py \
            tests/test_policy_promotion_gate.py \
            tests/test_policy_promotion_gate_properties.py \
            tests/test_policy_promotion_gate_public_api.py
          ruff check \
            src/nextgen_memory/__init__.py \
            src/nextgen_memory/policy_promotion_gate.py \
            tests/test_policy_promotion_gate.py \
            tests/test_policy_promotion_gate_properties.py \
            tests/test_policy_promotion_gate_public_api.py
          git diff --check

      - name: Focused promotion-gate contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_policy_promotion_gate.py \
            tests/test_policy_promotion_gate_properties.py \
            tests/test_policy_promotion_gate_public_api.py \
            | tee /tmp/promotion-focused.txt

      - name: Strict dependency, privacy, side-effect, and stub audit
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          path = Path('src/nextgen_memory/policy_promotion_gate.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source, filename=str(path))
          allowed_roots = {
              '__future__', 'dataclasses', 'enum', 'hashlib', 'json', 'math',
              're', 'uuid', 'paired_rerank_policy_evaluation',
          }
          forbidden_calls = {
              'eval', 'exec', 'compile', 'open', 'sleep', 'system', 'urlopen',
              'uuid1', 'uuid4', 'write_bytes', 'write_text',
          }
          violations: list[str] = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Pass):
                  violations.append(f'{node.lineno}:pass')
              elif isinstance(node, ast.Raise):
                  exc = node.exc.func if isinstance(node.exc, ast.Call) else node.exc
                  if (
                      isinstance(exc, ast.Name) and exc.id == 'NotImplementedError'
                  ) or (
                      isinstance(exc, ast.Attribute) and exc.attr == 'NotImplementedError'
                  ):
                      violations.append(f'{node.lineno}:NotImplementedError')
              elif isinstance(node, ast.Import):
                  for alias in node.names:
                      root = alias.name.split('.', 1)[0]
                      if root not in allowed_roots:
                          violations.append(f'{node.lineno}:import:{alias.name}')
              elif isinstance(node, ast.ImportFrom):
                  if node.level:
                      root = (node.module or '').split('.', 1)[0]
                  else:
                      root = (node.module or '').split('.', 1)[0]
                  if root not in allowed_roots:
                      violations.append(f'{node.lineno}:import:{node.module}')
              elif isinstance(node, ast.Call):
                  name = node.func.id if isinstance(node.func, ast.Name) else node.func.attr if isinstance(node.func, ast.Attribute) else None
                  if name in forbidden_calls:
                      violations.append(f'{node.lineno}:call:{name}')
          lowered = source.lower()
          for marker in (
              'postgresql://', 'mongodb://', 'http://', 'https://',
              'password', 'credential', '# todo', '# fixme', 'raw_query',
              'raw_prompt', 'response_text', 'memory_body', 'environment',
              'activate_policy(', 'deploy(', 'write_feedback(',
          ):
              if marker in lowered:
                  violations.append(f'text:{marker}')
          if violations:
              raise SystemExit('\n'.join(violations))
          print('promotion_gate_dependency_or_privacy_findings=0')
          PY

      - name: Repository-wide regression
        run: |
          ruff check .
          python -m compileall -q src scripts
          python -m pytest -q | tee /tmp/promotion-full.txt
          git diff --check "$BASE_SHA"...HEAD

      - name: Build and install wheel outside checkout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf wheelhouse "$RUNNER_TEMP/promotion-wheel-venv"
          python -m pip wheel --no-deps . -w wheelhouse
          test "$(find wheelhouse -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          wheel=$(find wheelhouse -maxdepth 1 -type f -name '*.whl')
          python -m venv "$RUNNER_TEMP/promotion-wheel-venv"
          "$RUNNER_TEMP/promotion-wheel-venv/bin/python" -m pip install --no-deps "$wheel"
          "$RUNNER_TEMP/promotion-wheel-venv/bin/python" - <<'PY'
          import nextgen_memory
          from nextgen_memory import AdvisoryPolicyPromotionGate, PolicyPromotionDecision
          assert AdvisoryPolicyPromotionGate is not None
          assert PolicyPromotionDecision.PROMOTE.value == 'promote'
          assert 'AdvisoryPolicyPromotionGate' in nextgen_memory.__all__
          PY
          "$RUNNER_TEMP/promotion-wheel-venv/bin/python" -m pip check

      - name: Remove transport, stage, and prove exact eight-path product surface
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-policy-promotion-gate-once.yml
          git add -A
          mapfile -t changed < <(git diff --cached --name-only "$BASE_SHA" | sort)
          expected=(
            docs/policy-promotion-gate-v0-red.md
            docs/superpowers/plans/2026-08-24-advisory-policy-promotion-gate-v0.md
            docs/superpowers/specs/2026-08-24-advisory-policy-promotion-gate-v0-design.md
            src/nextgen_memory/__init__.py
            src/nextgen_memory/policy_promotion_gate.py
            tests/test_policy_promotion_gate.py
            tests/test_policy_promotion_gate_properties.py
            tests/test_policy_promotion_gate_public_api.py
          )
          printf 'final_product_path_count=%s\n' "${#changed[@]}"
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}")
          test -z "$(git diff --cached --name-only "$BASE_SHA" -- 'migrations/**' '.github/workflows/**' pyproject.toml 'src/nextgen_memory/corrective_retrieval_*')"
          git diff --cached --check

      - name: Commit only the fully verified product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add advisory policy promotion gate v0'
          git push origin HEAD:feat/advisory-policy-promotion-gate-v0-20260824
