name: Diagnose Inherited Credit GREEN 1

on:
  push:
    branches: [bootstrap/inherited-credit-green-check-1]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/inherited-credit-ledger-v0
          fetch-depth: 0
      - name: Verify target head
        run: test "$(git rev-parse HEAD)" = "8eac467709b46e638d2e0e30dc4b7627e4838da2"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Apply mechanical Ruff fixes in disposable workspace
        run: |
          ruff check src/nextgen_memory/provenance_credit_persistence.py tests/test_provenance_credit_persistence.py --fix
          ruff format src/nextgen_memory/provenance_credit_persistence.py tests/test_provenance_credit_persistence.py
      - name: Lint complete tree
        run: ruff check .
      - name: Run focused persistence tests
        run: python -m pytest tests/test_provenance_credit_persistence.py -q
      - name: Run complete suite
        run: python -m pytest -q
      - name: Compile source
        run: python -m compileall -q src
