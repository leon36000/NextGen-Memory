name: One-shot context materialized hash patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.ref == 'fix/context-materialized-content-hash-v1-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/context-materialized-content-hash-v1-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply exact materialized-content hash contract
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, source: str, old: str, new: str) -> str:
              if source.count(old) != 1:
                  raise SystemExit(f'unexpected pattern count in {path}: {old!r}')
              return source.replace(old, new, 1)

          contracts = Path('src/nextgen_memory/context_compiler_contracts.py')
          source = contracts.read_text(encoding='utf-8')
          if 'content_hash must match normalized materialized content' not in source:
              source = replace_once(
                  contracts,
                  source,
                  'import json\nimport re\n',
                  'import hashlib\nimport json\nimport re\n',
              )
              old = '''        object.__setattr__(
              self,
              "content",
              _normalize_required_text("content", self.content),
          )
          _validate_hash("content_hash", self.content_hash)
          '''
              new = '''        normalized_content = _normalize_required_text(
              "content",
              self.content,
          )
          object.__setattr__(self, "content", normalized_content)
          _validate_hash("content_hash", self.content_hash)
          expected_content_hash = hashlib.sha256(
              normalized_content.encode("utf-8")
          ).hexdigest()
          if self.content_hash != expected_content_hash:
              raise ContextCompilerValidationError(
                  "content_hash must match normalized materialized content"
              )
          '''
              source = replace_once(contracts, source, old, new)
              contracts.write_text(source.rstrip() + '\n', encoding='utf-8')

          helper_files = (
              Path('tests/test_context_compiler_contracts.py'),
              Path('tests/test_context_compiler.py'),
              Path('tests/test_context_exact_solver.py'),
              Path('tests/test_context_heuristic_solver.py'),
              Path('tests/test_context_objective.py'),
          )
          helper_patch = '''    values.update(overrides)
          if "content_hash" not in overrides:
              content = values.get("content")
              normalized_content = content.strip() if isinstance(content, str) else ""
              values["content_hash"] = hashlib.sha256(
                  normalized_content.encode("utf-8")
              ).hexdigest()
          return IntegratedContextEvidence(**values)
          '''
          helper_patch = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in helper_patch.splitlines()
          ) + '\n'

          for path in helper_files:
              source = path.read_text(encoding='utf-8')
              if 'import hashlib\n' not in source:
                  source = replace_once(
                      path,
                      source,
                      'from __future__ import annotations\n\n',
                      'from __future__ import annotations\n\nimport hashlib\n',
                  )
              if 'if "content_hash" not in overrides:' not in source:
                  source = replace_once(
                      path,
                      source,
                      '    values.update(overrides)\n    return IntegratedContextEvidence(**values)\n',
                      helper_patch,
                  )
              path.write_text(source, encoding='utf-8')

          fixture_edits: dict[Path, tuple[tuple[str, str], ...]] = {
              Path('tests/test_context_compiler_contracts.py'): (
                  ('        "content_hash": "a" * 64,\n', ''),
                  ('        content_hash="b" * 64,\n', ''),
              ),
              Path('tests/test_context_compiler.py'): (
                  ('    character = "0123456789abcdef"[index % 16]\n', ''),
                  ('        "content_hash": character * 64,\n', ''),
                  (
                      '                evidence(1, content="different", content_hash="f" * 64),\n',
                      '                evidence(1, content="different"),\n',
                  ),
                  ('        content_hash="f" * 64,\n', ''),
              ),
              Path('tests/test_context_exact_solver.py'): (
                  ('    character = "0123456789abcdef"[index % 16]\n', ''),
                  ('        "content_hash": character * 64,\n', ''),
              ),
              Path('tests/test_context_heuristic_solver.py'): (
                  ('    character = "0123456789abcdef"[index % 16]\n', ''),
                  ('        "content_hash": character * 64,\n', ''),
              ),
              Path('tests/test_context_objective.py'): (
                  ('        "content_hash": suffix * 64,\n', ''),
                  ('        content_hash="f" * 64,\n', ''),
              ),
          }
          for path, edits in fixture_edits.items():
              source = path.read_text(encoding='utf-8')
              for old, new in edits:
                  if old in source:
                      source = source.replace(old, new)
              path.write_text(source.rstrip() + '\n', encoding='utf-8')

          properties = Path('tests/test_context_compiler_properties.py')
          source = properties.read_text(encoding='utf-8')
          source = replace_once(
              properties,
              source,
              '        f"context-property:{case_index}:{item_index}".encode()\n',
              '        f"property evidence {case_index}:{item_index}".encode("utf-8")\n',
          )
          properties.write_text(source.rstrip() + '\n', encoding='utf-8')

          design = Path(
              'docs/superpowers/specs/2026-08-14-context-compiler-integrated-v0-design.md'
          )
          source = design.read_text(encoding='utf-8')
          if 'materialized `content_hash` equal to SHA-256' not in source:
              source = replace_once(
                  design,
                  source,
                  '- exact `content`, canonical `content_hash`, and `backend_ref`;\n',
                  '- exact `content`, materialized `content_hash` equal to SHA-256 of the normalized UTF-8 content, and `backend_ref`;\n',
              )
              marker = (
                  '`direct_credit` and `inherited_credit` remain distinct fields in every '
                  'objective and audit artifact. The compiler never adds them upstream or '
                  'rewrites their provenance.\n'
              )
              addition = marker + (
                  '\nAt the compiler boundary, `content_hash` is the hash of the exact '
                  'materialized content admitted to the packet. The upstream Neon canonical '
                  'content hash remains a separate cross-store identity signal and must not be '
                  'substituted for this materialized-content hash. A mismatch fails before '
                  'canonicalization or optimization.\n'
              )
              source = replace_once(design, source, marker, addition)
              source = source.replace(
                  '- content hashes, UUIDs, token estimates, ranks, signals, weights, or interaction statistics are invalid;\n',
                  '- content hashes are malformed or do not match normalized materialized content, or UUIDs, token estimates, ranks, signals, weights, or interaction statistics are invalid;\n',
                  1,
              )
              design.write_text(source.rstrip() + '\n', encoding='utf-8')
          PY
      - name: Diff integrity
        run: git diff --check
      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'
      - name: Focused context verification
        run: python -m pytest -q tests/test_context*.py
      - name: Lint
        run: ruff check .
      - name: Full suite
        run: python -m pytest -q
      - name: Commit verified production and fixture changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nextgen_memory/context_compiler_contracts.py
          git add tests/test_context*.py
          git add docs/superpowers/specs/2026-08-14-context-compiler-integrated-v0-design.md
          if git diff --cached --quiet; then
            echo 'No production changes remain to commit.'
            exit 0
          fi
          git commit -m 'fix: bind context hash to materialized content'
          git push origin HEAD:fix/context-materialized-content-hash-v1-20260822
