name: Qualify memory policy dataset v0 producer

on:
  push:
    branches:
      - bootstrap/verify-memory-policy-dataset-v0-producer-20260831
  workflow_dispatch:

concurrency:
  group: memory-policy-dataset-v0-producer-20260831
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/memory-policy-dataset-v0-20260831
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Resolve exact base, feature, and qualified RED v2
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git show \
            origin/evidence/m-head-main-postmerge-checkpoint-20260831:evidence/m-head-main-postmerge-checkpoint-20260831.json \
            > /tmp/main-checkpoint.json
          base_sha=$(jq -r '.merge.main_merge_sha' /tmp/main-checkpoint.json)
          test "$(git rev-parse origin/main)" = "$base_sha"
          feature_sha=$(git rev-parse HEAD)
          test "$(git rev-parse origin/feat/memory-policy-dataset-v0-20260831)" = "$feature_sha"
          test "$(git merge-base "$base_sha" "$feature_sha")" = "$base_sha"
          red_branch='tdd/memory-policy-dataset-v0-red-v2-20260831'
          red_sha=$(git rev-parse "origin/$red_branch")
          test "$(git merge-base "$base_sha" "$red_sha")" = "$base_sha"
          grep -F "$red_branch" docs/superpowers/plans/2026-08-31-memory-policy-dataset-v0.md >/dev/null
          grep -F "$red_sha" docs/superpowers/plans/2026-08-31-memory-policy-dataset-v0.md >/dev/null
          grep -F "$red_branch" docs/superpowers/specs/2026-08-31-memory-policy-dataset-v0-design.md >/dev/null
          grep -F "$red_sha" docs/superpowers/specs/2026-08-31-memory-policy-dataset-v0-design.md >/dev/null
          printf 'base_sha=%s\nfeature_sha=%s\nred_branch=%s\nred_sha=%s\nshort=%s\n' \
            "$base_sha" "$feature_sha" "$red_branch" "$red_sha" "${feature_sha:0:8}" \
            | tee -a "$GITHUB_OUTPUT"

      - name: Prove the exact nine-path product surface and RED preservation
        shell: bash
        env:
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          RED_SHA: ${{ steps.identity.outputs.red_sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA"...HEAD | sort)
          expected=(
            docs/memory-policy-dataset-v0-red.md
            docs/memory-policy-dataset-v0.md
            docs/superpowers/plans/2026-08-31-memory-policy-dataset-v0.md
            docs/superpowers/specs/2026-08-31-memory-policy-dataset-v0-design.md
            src/nextgen_memory/__init__.py
            src/nextgen_memory/memory_policy_dataset.py
            tests/test_memory_policy_dataset.py
            tests/test_memory_policy_dataset_properties.py
            tests/test_memory_policy_dataset_public_api.py
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}")
          test -z "$(git diff --name-only "$BASE_SHA"...HEAD -- '.github/workflows/**' 'migrations/**' pyproject.toml 'src/nextgen_memory/corrective_retrieval_*')"
          git diff --check "$BASE_SHA"...HEAD
          for path in \
            docs/memory-policy-dataset-v0-red.md \
            tests/test_memory_policy_dataset.py \
            tests/test_memory_policy_dataset_properties.py \
            tests/test_memory_policy_dataset_public_api.py; do
            cmp <(git show "$RED_SHA:$path") "$path"
          done
          test -z "$(git status --porcelain)"

      - name: Install exact development toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install 'ruff==0.16.4'
          ruff --version

      - name: Run static, focused, generated, and complete verification
        shell: bash
        run: |
          set -euo pipefail
          ruff check .
          ruff format --check .
          python -m compileall -q src scripts
          python -m pytest -q \
            tests/test_memory_policy_dataset.py \
            tests/test_memory_policy_dataset_properties.py \
            tests/test_memory_policy_dataset_public_api.py \
            | tee /tmp/focused.txt
          python -m pytest -q \
            tests/test_memory_policy_dataset_properties.py::test_five_thousand_generated_traces_cover_labels_splits_and_retries \
            | tee /tmp/generated-5000.txt
          python -m pytest -q | tee /tmp/full.txt
          test -z "$(git status --porcelain)"

      - name: Run strict dependency, privacy, side-effect, and stub audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          import json
          import sys
          from pathlib import Path

          path = Path('src/nextgen_memory/memory_policy_dataset.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source, filename=str(path))
          allowed_roots = set(sys.stdlib_module_names) | {'__future__'}
          forbidden_calls = {'open', 'eval', 'exec', 'compile', 'input'}
          forbidden_attributes = {
              'connect', 'create_connection', 'request', 'urlopen',
              'system', 'popen', 'run', 'Popen', 'sleep', 'time',
              'uuid1', 'uuid4', 'write_text', 'write_bytes', 'mkdir',
              'unlink', 'rename', 'getenv',
          }
          findings: list[str] = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  for alias in node.names:
                      root = alias.name.split('.', 1)[0]
                      if root not in allowed_roots:
                          findings.append(f'{node.lineno}:nonstdlib:{alias.name}')
              elif isinstance(node, ast.ImportFrom) and node.level == 0:
                  root = (node.module or '').split('.', 1)[0]
                  if root not in allowed_roots:
                      findings.append(f'{node.lineno}:nonstdlib:{node.module}')
              elif isinstance(node, ast.Pass):
                  findings.append(f'{node.lineno}:pass')
              elif (
                  isinstance(node, ast.Expr)
                  and isinstance(node.value, ast.Constant)
                  and node.value.value is Ellipsis
              ):
                  findings.append(f'{node.lineno}:executable-ellipsis')
              elif isinstance(node, ast.Raise):
                  target = node.exc.func if isinstance(node.exc, ast.Call) else node.exc
                  if (
                      isinstance(target, ast.Name)
                      and target.id == 'NotImplementedError'
                  ) or (
                      isinstance(target, ast.Attribute)
                      and target.attr == 'NotImplementedError'
                  ):
                      findings.append(f'{node.lineno}:NotImplementedError')
              elif isinstance(node, ast.Call):
                  if isinstance(node.func, ast.Name) and node.func.id in forbidden_calls:
                      findings.append(f'{node.lineno}:call:{node.func.id}')
                  elif (
                      isinstance(node.func, ast.Attribute)
                      and node.func.attr in forbidden_attributes
                  ):
                      findings.append(f'{node.lineno}:call:{node.func.attr}')

          lowered = source.lower()
          for marker in (
              'raw_prompt', 'raw_query', 'response_text', 'memory_body',
              'credential', 'password', 'reviewer_email', 'reviewer_name',
              'postgresql://', 'mongodb://', 'http://', 'https://',
              'torch', 'transformers', 'optimizer', 'model.fit',
              'merge_pull_request', 'activate_policy', 'write_feedback',
              '# todo', '# fixme',
          ):
              if marker in lowered:
                  findings.append(f'text:{marker}')

          for test_path in (
              Path('tests/test_memory_policy_dataset.py'),
              Path('tests/test_memory_policy_dataset_properties.py'),
              Path('tests/test_memory_policy_dataset_public_api.py'),
          ):
              test_source = test_path.read_text(encoding='utf-8').lower()
              for marker in (
                  'pytest.mark.skip',
                  'pytest.mark.xfail',
                  '# noqa',
                  'notimplementederror',
              ):
                  if marker in test_source:
                      findings.append(f'{test_path}:text:{marker}')

          if findings:
              raise SystemExit('\n'.join(findings))
          Path('/tmp/audit.json').write_text(
              json.dumps({'audit_findings': 0}, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print('audit_findings=0')
          PY

      - name: Prove deterministic dataset semantics and privacy boundary
        shell: bash
        env:
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
        run: |
          set -euo pipefail
          cat > /tmp/semantic.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import sys
          from pathlib import Path
          from uuid import UUID

          from nextgen_memory import (
              InMemoryMemoryPolicyDatasetBuilder,
              MemoryPolicyCandidateFeatures,
              MemoryPolicyCandidateObservation,
              MemoryPolicyCreditKind,
              MemoryPolicyDatasetConfig,
              MemoryPolicyDecisionTrace,
              MemoryPolicyOutcomeLabel,
              MemoryPolicySplit,
          )

          def digest(value: str) -> str:
              return hashlib.sha256(value.encode('utf-8')).hexdigest()

          def features(rank: int) -> MemoryPolicyCandidateFeatures:
              return MemoryPolicyCandidateFeatures(
                  semantic_relevance=0.8,
                  direct_utility_mean=0.2,
                  direct_utility_confidence=0.9,
                  inherited_utility_mean=0.1,
                  inherited_utility_confidence=0.7,
                  interaction_effect_mean=0.0,
                  interaction_confidence=0.0,
                  novelty=0.5,
                  authority=0.8,
                  freshness=0.9,
                  token_cost=120,
                  latency_ms=8.5,
                  prior_retrieval_count=10,
                  prior_use_count=4,
                  original_rank=rank,
              )

          def candidate(
              index: int,
              *,
              mean: float = 0.08,
              lower: float = 0.04,
              upper: float = 0.12,
              kind: MemoryPolicyCreditKind = MemoryPolicyCreditKind.DIRECT_CAUSAL,
              observed: bool = True,
              confidence: float = 0.9,
              selected: bool = True,
              used: bool = True,
          ) -> MemoryPolicyCandidateObservation:
              return MemoryPolicyCandidateObservation(
                  candidate_id=UUID(int=100 + index),
                  candidate_content_hash=digest(f'candidate:{index}'),
                  memory_identity_hash=digest(f'memory:{index}'),
                  expert_key_hash=digest(f'expert:{index}'),
                  features=features(index),
                  selected_by_policy=selected,
                  used_by_action=used,
                  credit_kind=kind,
                  credit_effect_mean=mean,
                  credit_confidence_lower_bound=lower,
                  credit_confidence_upper_bound=upper,
                  attribution_confidence=confidence,
                  outcome_observed=observed,
                  harm_observed=False,
                  credit_evidence_hash=digest(f'credit:{index}'),
                  interaction_bundle_hash=None,
              )

          def trace(
              index: int,
              trajectory: UUID,
              ordinal: int,
              values: object,
          ) -> MemoryPolicyDecisionTrace:
              return MemoryPolicyDecisionTrace(
                  trace_id=UUID(int=1000 + index),
                  trajectory_id=trajectory,
                  event_ordinal=ordinal,
                  policy_version='deterministic-v1',
                  policy_fingerprint=digest('policy'),
                  source_sha=os.environ['BASE_SHA'],
                  task_feature_vector_hash=digest(f'task:{index}'),
                  query_embedding_hash=digest(f'query:{index}'),
                  outcome_content_hash=digest(f'outcome:{index}'),
                  provenance_content_hash=digest(f'provenance:{index}'),
                  decision_budget_tokens=2000,
                  decision_budget_latency_ms=100.0,
                  candidates=values,
              )

          shared = UUID(int=9000)
          none_value = candidate(
              3,
              mean=0.0,
              lower=0.0,
              upper=0.0,
              kind=MemoryPolicyCreditKind.NONE,
              observed=False,
              confidence=0.0,
              selected=False,
              used=False,
          )
          builder = InMemoryMemoryPolicyDatasetBuilder()
          values = {
              trace(0, shared, 5, {candidate(0)}),
              trace(
                  1,
                  shared,
                  25,
                  {
                      candidate(1, mean=0.0, lower=-0.01, upper=0.01),
                      candidate(2, mean=-0.08, lower=-0.12, upper=-0.04),
                      none_value,
                  },
              ),
              trace(2, UUID(int=9001), 10, {candidate(4)}),
              trace(3, UUID(int=9002), 20, {candidate(5)}),
          }
          for value in values:
              builder.register_trace(value)
              assert builder.register_trace(value) is value
          config = MemoryPolicyDatasetConfig(
              train_max_ordinal=10,
              validation_max_ordinal=20,
              minimum_attribution_confidence=0.75,
              beneficial_effect_threshold=0.02,
              harmful_effect_threshold=0.02,
              neutral_effect_band=0.01,
          )
          snapshot = builder.build(config)
          expected = {
              MemoryPolicyOutcomeLabel.BENEFICIAL,
              MemoryPolicyOutcomeLabel.NEUTRAL,
              MemoryPolicyOutcomeLabel.HARMFUL,
              MemoryPolicyOutcomeLabel.ABSTAIN,
          }
          if {example.label for example in snapshot.examples} != expected:
              raise SystemExit('label coverage differs')
          shared_splits = {
              example.split
              for example in snapshot.examples
              if example.trajectory_id == shared
          }
          if shared_splits != {MemoryPolicySplit.TEST}:
              raise SystemExit('trajectory leakage boundary differs')
          for _ in range(1000):
              retry = builder.build(config)
              if retry.render_json() != snapshot.render_json():
                  raise SystemExit('exact dataset retry changed JSON')
              if retry.render_jsonl() != snapshot.render_jsonl():
                  raise SystemExit('exact dataset retry changed JSONL')
          first = snapshot.examples[0]
          forbidden = {
              'selected_by_policy', 'used_by_action', 'credit_kind',
              'credit_evidence_hash', 'label', 'sample_weight',
          }
          if forbidden & set(first.feature_payload()):
              raise SystemExit('feature payload leaks target or audit fields')
          raw = snapshot.render_json() + snapshot.render_jsonl()
          for marker in (
              'raw_prompt', 'raw_query', 'response_text', 'memory_body',
              'credential', 'password', 'reviewer_email', 'reviewer_name',
          ):
              if marker in raw.lower():
                  raise SystemExit(f'dataset leaks forbidden marker: {marker}')
          payload = {
              'schema': 'm-head-memory-policy-dataset-semantic-v1',
              'base_sha': os.environ['BASE_SHA'],
              'snapshot': json.loads(snapshot.render_json()),
              'jsonl_sha256': hashlib.sha256(
                  snapshot.render_jsonl().encode('utf-8')
              ).hexdigest(),
              'exact_retry_count': 1000,
          }
          Path(sys.argv[1]).write_text(
              json.dumps(
                  payload,
                  ensure_ascii=False,
                  allow_nan=False,
                  sort_keys=True,
                  separators=(',', ':'),
              ) + '\n',
              encoding='utf-8',
          )
          PY
          PYTHONHASHSEED=1 python /tmp/semantic.py /tmp/semantic.json
          PYTHONHASHSEED=999 python /tmp/semantic.py /tmp/semantic-seed-999.json
          cmp /tmp/semantic.json /tmp/semantic-seed-999.json

      - name: Build and import isolated product wheel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wheelhouse /tmp/wheel-venv
          mkdir -p /tmp/wheelhouse
          python -m pip wheel --no-deps . -w /tmp/wheelhouse
          wheel=$(find /tmp/wheelhouse -maxdepth 1 -type f -name '*.whl' -print -quit)
          test -n "$wheel"
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install --no-deps "$wheel"
          /tmp/wheel-venv/bin/python -m pip check
          /tmp/wheel-venv/bin/python - <<'PY'
          import nextgen_memory
          from nextgen_memory import (
              InMemoryMemoryPolicyDatasetBuilder,
              MemoryPolicyDatasetSnapshot,
              MemoryPolicyOutcomeLabel,
          )
          assert InMemoryMemoryPolicyDatasetBuilder is not None
          assert MemoryPolicyDatasetSnapshot is not None
          assert MemoryPolicyOutcomeLabel.ABSTAIN.value == 'abstain'
          for name in (
              'InMemoryMemoryPolicyDatasetBuilder',
              'MemoryPolicyCandidateFeatures',
              'MemoryPolicyCandidateObservation',
              'MemoryPolicyCreditKind',
              'MemoryPolicyDatasetConfig',
              'MemoryPolicyDatasetConflictError',
              'MemoryPolicyDatasetSnapshot',
              'MemoryPolicyDatasetStateError',
              'MemoryPolicyDatasetValidationError',
              'MemoryPolicyDecisionTrace',
              'MemoryPolicyOutcomeLabel',
              'MemoryPolicySplit',
              'MemoryPolicyTrainingExample',
          ):
              assert nextgen_memory.__all__.count(name) == 1
          PY
          cp "$wheel" /tmp/product.whl
          sha256sum "$wheel" | awk '{print $1}' > /tmp/wheel.sha256

      - name: Publish immutable candidate, draft PR, and producer evidence
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          FEATURE_SHA: ${{ steps.identity.outputs.feature_sha }}
          RED_BRANCH: ${{ steps.identity.outputs.red_branch }}
          RED_SHA: ${{ steps.identity.outputs.red_sha }}
          SHORT: ${{ steps.identity.outputs.short }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_branch='candidate/memory-policy-dataset-v0-20260831'
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          if git ls-remote --exit-code --heads origin "$candidate_branch"; then
            test "$(git rev-parse "origin/$candidate_branch")" = "$FEATURE_SHA"
          else
            git push origin "$FEATURE_SHA:refs/heads/$candidate_branch"
          fi

          owner=${GITHUB_REPOSITORY%%/*}
          pulls=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f head="$owner:$candidate_branch" -f per_page=100)
          count=$(printf '%s' "$pulls" | jq 'length')
          if [ "$count" -eq 0 ]; then
            body=$(cat <<EOF
          ## Memory Policy Dataset v0

          Pure deterministic dataset boundary for a later learned memory reranker. The candidate binds hashed decision traces and causal/replay credit into immutable pointwise examples with explicit abstention and maximum-ordinal trajectory-safe train/validation/test splits.

          Producer qualification on exact SHA \`$FEATURE_SHA\` passed Ruff 0.16.4, formatting, compileall, focused tests, 5,000 generated traces, the complete suite, privacy/dependency/side-effect/stub audit, 1,000 exact dataset retries, hash-seed comparison, and isolated wheel import.

          No model is trained or executed. No persistence, database, feedback, activation, deployment, migration, merge, or release behavior is included. This PR remains draft pending an independent Python 3.12/3.13 exact-SHA matrix and technical review.
          EOF
            )
            printf '%s\n' "$body" | sed 's/^          //' > /tmp/pr-body.md
            gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" \
              -f title='feat: leakage-safe memory policy dataset v0' \
              -f head="$candidate_branch" \
              -f base='main' \
              -F draft=true \
              --raw-field body="$(cat /tmp/pr-body.md)" > /tmp/pr.json
          elif [ "$count" -eq 1 ]; then
            printf '%s' "$pulls" | jq '.[0]' > /tmp/pr.json
          else
            echo 'multiple candidate PRs exist' >&2
            exit 1
          fi
          product_pr=$(jq -r '.number' /tmp/pr.json)
          test "$(jq -r '.head.sha' /tmp/pr.json)" = "$FEATURE_SHA"
          test "$(jq -r '.base.sha' /tmp/pr.json)" = "$BASE_SHA"
          test "$(jq -r '.draft' /tmp/pr.json)" = true

          focused_count=$(grep -oE '[0-9]+ passed' /tmp/focused.txt | tail -1 | cut -d' ' -f1)
          full_count=$(grep -oE '[0-9]+ passed' /tmp/full.txt | tail -1 | cut -d' ' -f1)
          generated_count=$(grep -oE '[0-9]+ passed' /tmp/generated-5000.txt | tail -1 | cut -d' ' -f1)
          test -n "$focused_count"
          test -n "$full_count"
          test -n "$generated_count"
          semantic_sha=$(sha256sum /tmp/semantic.json | awk '{print $1}')
          wheel_sha=$(cat /tmp/wheel.sha256)

          jq -n \
            --arg schema 'm-head-memory-policy-dataset-producer-v1' \
            --arg status 'producer_green_verification_pending_unmerged' \
            --arg repository '${{ github.repository }}' \
            --arg base_sha "$BASE_SHA" \
            --arg feature_sha "$FEATURE_SHA" \
            --arg candidate_branch "$candidate_branch" \
            --arg red_branch "$RED_BRANCH" \
            --arg red_sha "$RED_SHA" \
            --argjson pull_request "$product_pr" \
            --argjson focused_test_count "$focused_count" \
            --argjson generated_test_count "$generated_count" \
            --argjson full_test_count "$full_count" \
            --arg semantic_sha256 "$semantic_sha" \
            --arg wheel_sha256 "$wheel_sha" \
            --argjson run_id "$GITHUB_RUN_ID" \
            '{schema:$schema,status:$status,repository:$repository,base:{branch:"main",sha:$base_sha},candidate:{branch:$candidate_branch,sha:$feature_sha,pull_request:$pull_request,exact_path_count:9},tdd:{branch:$red_branch,sha:$red_sha,source_preserved:true,tests_weakened:false},verification:{run_id:$run_id,ruff_version:"0.16.4",ruff_green:true,format_green:true,compileall_green:true,focused_test_count:$focused_test_count,generated_5000_trace_test_count:$generated_test_count,full_test_count:$full_test_count,audit_findings:0,semantic_sha256:$semantic_sha256,hash_seed_invariant:true,exact_retry_count:1000,isolated_wheel_import:true,pip_check:true,wheel_sha256:$wheel_sha256},contract:{absent_feedback_is_nonnegative:true,trajectory_split_uses_maximum_ordinal:true,raw_content_surface:false,model_training_surface:false,persistence_surface:false,feedback_surface:false,activation_surface:false},review:{required_runtime:"GPT-5.6 Pro",verdict:"pending",merge_allowed:false},safety:{merged:false,model_trained:false,production_database_contacted:false,production_migration_applied:false,feedback_written:false,policy_activated:false,release_published:false,stubs_added:false},next_action:"Run an independent Python 3.12/3.13 exact-SHA matrix, compare semantic bytes, rehash artifacts, and perform a technical review before merge."}' \
            > /tmp/producer.json

          evidence_branch="evidence/memory-policy-dataset-v0-${SHORT}-producer-20260831"
          evidence_path="evidence/memory-policy-dataset-v0-${SHORT}-producer-20260831.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin "$evidence_branch"; then
            git switch --detach "origin/$evidence_branch"
            cmp /tmp/producer.json "$evidence_path"
          else
            git switch -C "$evidence_branch" "$FEATURE_SHA"
            mkdir -p evidence
            cp /tmp/producer.json "$evidence_path"
            git add "$evidence_path"
            git diff --cached --check
            git commit -m 'evidence: qualify memory policy dataset v0 producer'
            git push origin HEAD:"refs/heads/$evidence_branch"
          fi
          evidence_commit=$(git rev-parse HEAD)
          body=$(cat <<EOF
          ## Memory Policy Dataset v0 producer GREEN

          - candidate SHA: \`$FEATURE_SHA\`;
          - exact surface: nine paths;
          - focused tests: \`$focused_count\`;
          - complete tests: \`$full_count\`;
          - 5,000 generated traces: green;
          - audit findings: \`0\`;
          - exact retries: \`1,000\`;
          - isolated wheel and pip check: green;
          - immutable producer evidence: \`$evidence_branch\` at \`$evidence_commit\`;
          - model trained: \`false\`;
          - merge allowed: \`false\`.
          EOF
          )
          gh api "repos/$GITHUB_REPOSITORY/issues/23/comments" --raw-field body="$body" >/dev/null
          echo "candidate_branch=$candidate_branch" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$FEATURE_SHA" >> "$GITHUB_OUTPUT"
          echo "product_pr=$product_pr" >> "$GITHUB_OUTPUT"
          echo "evidence_branch=$evidence_branch" >> "$GITHUB_OUTPUT"
          echo "evidence_commit=$evidence_commit" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: memory-policy-dataset-v0-producer
          path: |
            /tmp/producer.json
            /tmp/semantic.json
            /tmp/audit.json
            /tmp/focused.txt
            /tmp/generated-5000.txt
            /tmp/full.txt
            /tmp/product.whl
            /tmp/pr.json
          if-no-files-found: error
          retention-days: 14
