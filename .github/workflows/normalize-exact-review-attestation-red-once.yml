name: Normalize exact review attestation registry RED once

on:
  pull_request:

concurrency:
  group: exact-review-attestation-red-normalize
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  normalize-red:
    if: github.event.pull_request.head.ref == 'bootstrap/normalize-exact-review-attestation-red-20260824'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tdd/exact-sha-review-attestation-registry-v0-red-20260824
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Resolve immutable base and current RED head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          base_sha='f4f3aca9759b5b7a60691017c2211152c011ea92'
          red_branch='tdd/exact-sha-review-attestation-registry-v0-red-20260824'
          red_before=$(git rev-parse HEAD)
          test "$(git merge-base "$base_sha" "$red_before")" = "$base_sha"
          printf 'BASE_SHA=%s\nRED_BRANCH=%s\nRED_BEFORE=%s\n' \
            "$base_sha" "$red_branch" "$red_before" | tee -a "$GITHUB_ENV"

      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'

      - name: Normalize only the three tests-only contract files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            tests/test_review_attestation_registry.py
            tests/test_review_attestation_registry_properties.py
            tests/test_review_attestation_registry_public_api.py
          )
          ruff check --fix "${files[@]}"
          ruff format "${files[@]}"
          ruff check "${files[@]}"
          ruff format --check "${files[@]}"
          python -m py_compile "${files[@]}"
          git diff --check
          mapfile -t modified < <(git diff --name-only | sort)
          test "${#modified[@]}" -eq 3
          diff -u \
            <(printf '%s\n' "${files[@]}" | sort) \
            <(printf '%s\n' "${modified[@]}")

      - name: Prove each normalized test reaches only the intended module-absence RED
        shell: bash
        run: |
          set -euo pipefail
          red_root="$RUNNER_TEMP/exact-review-attestation-red"
          rm -rf "$red_root"
          git worktree add --detach "$red_root" "$BASE_SHA"
          mkdir -p "$red_root/tests" "$red_root/docs"
          files=(
            tests/test_review_attestation_registry.py
            tests/test_review_attestation_registry_properties.py
            tests/test_review_attestation_registry_public_api.py
          )
          for file in "${files[@]}"; do
            cp "$file" "$red_root/$file"
          done
          cp \
            docs/exact-sha-review-attestation-registry-v0-red.md \
            "$red_root/docs/exact-sha-review-attestation-registry-v0-red.md"
          cd "$red_root"
          test ! -e src/nextgen_memory/review_attestation_registry.py
          if grep -F 'review_attestation_registry' src/nextgen_memory/__init__.py; then
            echo 'base package root unexpectedly exports the absent module' >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            output="/tmp/$(basename "$file" .py)-normalized-red.txt"
            set +e
            PYTHONPATH="$PWD/src" python -m pytest --collect-only -q "$file" \
              > "$output" 2>&1
            rc=$?
            set -e
            test "$rc" -ne 0
            FILE="$file" OUTPUT="$output" python - <<'PY'
          from __future__ import annotations

          import os
          import re
          from pathlib import Path

          file = os.environ['FILE']
          text = Path(os.environ['OUTPUT']).read_text(
              encoding='utf-8',
              errors='replace',
          )
          modules = set(
              re.findall(
                  r"ModuleNotFoundError: No module named '([^']+)'",
                  text,
              )
          )
          expected = {'nextgen_memory.review_attestation_registry'}
          if modules != expected:
              raise SystemExit(
                  f'{file}: unexpected missing-module set: {sorted(modules)!r}'
              )
          for marker in (
              'SyntaxError',
              'IndentationError',
              'NameError',
              'ERROR at setup',
              'fixture ',
          ):
              if marker in text:
                  raise SystemExit(f'{file}: unintended RED marker: {marker}')
          PY
          done

      - name: Commit normalized immutable RED and prove exact four-path surface
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          files=(
            tests/test_review_attestation_registry.py
            tests/test_review_attestation_registry_properties.py
            tests/test_review_attestation_registry_public_api.py
          )
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          git diff --cached --check
          git commit -m 'test: normalize exact review attestation RED contract'
          red_sha=$(git rev-parse HEAD)
          mapfile -t changed < <(git diff --name-only "$BASE_SHA"...HEAD | sort)
          expected=(
            docs/exact-sha-review-attestation-registry-v0-red.md
            tests/test_review_attestation_registry.py
            tests/test_review_attestation_registry_properties.py
            tests/test_review_attestation_registry_public_api.py
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u \
            <(printf '%s\n' "${expected[@]}" | sort) \
            <(printf '%s\n' "${changed[@]}")
          test -z "$(git diff --name-only "$BASE_SHA"...HEAD -- '.github/workflows/**' 'migrations/**' pyproject.toml 'src/nextgen_memory/corrective_retrieval_*')"
          git push origin HEAD:"$RED_BRANCH"
          printf 'RED_SHA=%s\n' "$red_sha" | tee -a "$GITHUB_ENV"

      - name: Publish corrected RED status and close transport without merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELF_PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          ## Exact-SHA review attestation RED normalized and accepted

          - immutable base: \`$BASE_SHA\`;
          - previous RED head: \`$RED_BEFORE\`;
          - normalized RED head: \`$RED_SHA\`;
          - exact surface: four paths;
          - Ruff, formatting, and syntax: clean;
          - each test file independently reaches only \`ModuleNotFoundError: nextgen_memory.review_attestation_registry\` against the immutable base;
          - implementation and package-root export: absent;
          - merge allowed: false.

          The prior checkpoint claiming acceptance for a lint-failing head is superseded by this exact Git evidence.
          EOF
          )
          gh api "repos/$REPO/issues/165/comments" --raw-field body="$body" >/dev/null
          gh api --method PATCH "repos/$REPO/pulls/$SELF_PR" -f state=closed >/dev/null
