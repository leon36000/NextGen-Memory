name: Finalize lexical AST no-stubs scanner once

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'fix/no-stubs-lexical-green-20260823'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/no-stubs-lexical-green-20260823
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and development tools before any Ruff call
        run: python -m pip install -e '.[dev]'

      - name: Materialize the tested lexical scanner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          from pathlib import Path

          payload = """"""
          destination = Path("scripts/verify_no_stubs.py")
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY

      - name: Add the permanent read-only scanner workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/no-stubs.yml <<'YAML'
          name: AST no-stubs contract

          on:
            pull_request:
              paths:
                - "src/**"
                - "scripts/verify_no_stubs.py"
                - "tests/test_no_stubs.py"
                - "tests/test_no_stubs_workflow.py"
                - "tests/test_no_stubs_exception_shadowing.py"
                - "tests/test_no_stubs_protocol_shadowing.py"
                - ".github/workflows/no-stubs.yml"

          permissions:
            contents: read

          jobs:
            verify:
              runs-on: ubuntu-24.04
              strategy:
                fail-fast: false
                matrix:
                  python-version: ["3.12", "3.13"]
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: ${{ matrix.python-version }}
                    cache: pip
                - name: Install project and development tools
                  run: python -m pip install -e '.[dev]'
                - name: Focused scanner contracts
                  run: python -m pytest -q tests/test_no_stubs.py tests/test_no_stubs_workflow.py tests/test_no_stubs_exception_shadowing.py tests/test_no_stubs_protocol_shadowing.py
                - name: Scan production source
                  run: python scripts/verify_no_stubs.py src
                - name: Static integrity
                  run: |
                    ruff check scripts/verify_no_stubs.py tests/test_no_stubs.py tests/test_no_stubs_workflow.py tests/test_no_stubs_exception_shadowing.py tests/test_no_stubs_protocol_shadowing.py
                    python -m compileall -q src scripts
          YAML

      - name: Remove all one-shot transport workflows
        run: |
          rm -f \
            .github/workflows/no-stubs-patch-once.yml \
            .github/workflows/no-stubs-shadowing-patch-once.yml \
            .github/workflows/finalize-no-stubs-lexical-once.yml

      - name: Normalize the bounded candidate files
        run: |
          ruff format \
            scripts/verify_no_stubs.py \
            tests/test_no_stubs.py \
            tests/test_no_stubs_exception_shadowing.py \
            tests/test_no_stubs_protocol_shadowing.py \
            tests/test_no_stubs_workflow.py
          ruff check --fix \
            scripts/verify_no_stubs.py \
            tests/test_no_stubs.py \
            tests/test_no_stubs_exception_shadowing.py \
            tests/test_no_stubs_protocol_shadowing.py \
            tests/test_no_stubs_workflow.py

      - name: Focused lexical and base scanner verification
        run: |
          python -m pytest -q \
            tests/test_no_stubs.py \
            tests/test_no_stubs_workflow.py \
            tests/test_no_stubs_exception_shadowing.py \
            tests/test_no_stubs_protocol_shadowing.py

      - name: Scan production source and validate safe output
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_no_stubs.py src > /tmp/no-stubs.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/no-stubs.json')
          raw = path.read_text(encoding='utf-8')
          report = json.loads(raw)
          if report != {"finding_count": 0, "findings": []}:
              raise SystemExit(f'unexpected production findings: {report!r}')
          canonical = json.dumps(
              report,
              ensure_ascii=False,
              sort_keys=True,
              separators=(',', ':'),
          ) + '\n'
          if raw != canonical:
              raise SystemExit('scanner output is not canonical JSON')
          PY
          if grep -Eqi '/home/runner|password|secret|token|dsn|connection|postgresql://' /tmp/no-stubs.json; then
            echo 'scanner report leaked forbidden runtime material' >&2
            exit 1
          fi

      - name: Repository-wide verification
        run: |
          ruff check .
          python -m compileall -q src scripts
          python -m pytest -q
          git diff --check 93cce924debb9ae2ff46d71b2e8fa043f4cefa0b...HEAD

      - name: Prove exact six-path final product surface
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only 93cce924debb9ae2ff46d71b2e8fa043f4cefa0b...HEAD | sort)
          expected=(
            .github/workflows/no-stubs.yml
            scripts/verify_no_stubs.py
            tests/test_no_stubs.py
            tests/test_no_stubs_exception_shadowing.py
            tests/test_no_stubs_protocol_shadowing.py
            tests/test_no_stubs_workflow.py
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}")
          test -z "$(git diff --name-only 93cce924debb9ae2ff46d71b2e8fa043f4cefa0b...HEAD -- 'src/**' 'migrations/**' pyproject.toml)"

      - name: Commit only after all checks pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: classify no-stubs exemptions lexically'
          git push origin HEAD:fix/no-stubs-lexical-green-20260823
