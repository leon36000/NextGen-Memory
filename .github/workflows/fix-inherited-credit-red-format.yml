name: Normalize Inherited Credit RED imports

on:
  push:
    branches: [bootstrap/inherited-credit-red-format]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/inherited-credit-ledger-v0
          fetch-depth: 0
      - name: Verify target head
        run: test "$(git rev-parse HEAD)" = "20e7773f51ec0136b5226178f8868187510bf725"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Apply import-only Ruff fix
        run: ruff check tests/test_provenance_credit_persistence.py --select I001 --fix
      - name: Verify scope and lint
        run: |
          ruff check tests/test_provenance_credit_persistence.py
          git diff --check
          test "$(git diff --name-only)" = "tests/test_provenance_credit_persistence.py"
      - name: Commit and push fast-forward
        run: |
          git config user.name "NextGen Memory Automation"
          git config user.email "actions@users.noreply.github.com"
          git add tests/test_provenance_credit_persistence.py
          git commit -m "style: normalize inherited credit RED imports"
          git push origin HEAD:feat/inherited-credit-ledger-v0
