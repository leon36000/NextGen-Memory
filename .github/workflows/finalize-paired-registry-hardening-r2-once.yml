name: Finalize paired replay registry hardening r2

on:
  pull_request:

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'feat/paired-replay-experiment-registry-v0-hardening-r2-20260824'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/paired-replay-experiment-registry-v0-hardening-r2-20260824
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'

      - name: Harden public plan and snapshot constructors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/nextgen_memory/paired_replay_experiment_registry.py')
          source = path.read_text(encoding='utf-8')

          assignment_marker = '''        if any(
              item.experiment_id != self.spec.experiment_id
              or item.space_id != self.spec.space_id
              or item.continuation_set_hash != self.spec.continuation_set_hash
              for item in assignments
          ):
              raise PairedReplayRegistryValidationError(
                  "assignments must match the experiment spec"
              )
          if not isinstance(self.summary, PairedReplayPlanSummary):
          '''
          assignment_marker = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in assignment_marker.splitlines()
          ).lstrip('\n')
          assignment_replacement = '''        if any(
              item.experiment_id != self.spec.experiment_id
              or item.space_id != self.spec.space_id
              or item.continuation_set_hash != self.spec.continuation_set_hash
              for item in assignments
          ):
              raise PairedReplayRegistryValidationError(
                  "assignments must match the experiment spec"
              )
          context_order = tuple(item.context_set_hash for item in assignments)
          if context_order != tuple(sorted(context_order)):
              raise PairedReplayRegistryValidationError(
                  "assignments must use canonical context-set ordering"
              )
          if any(
              item.id != _pair_uuid(self.spec, item.context_set_hash)
              for item in assignments
          ):
              raise PairedReplayRegistryValidationError(
                  "assignment pair id does not match immutable pair identity"
              )
          if not isinstance(self.summary, PairedReplayPlanSummary):
          '''
          assignment_replacement = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in assignment_replacement.splitlines()
          ).lstrip('\n')
          if 'assignment pair id does not match immutable pair identity' not in source:
              if source.count(assignment_marker) != 1:
                  raise SystemExit('assignment validation marker is missing or ambiguous')
              source = source.replace(assignment_marker, assignment_replacement, 1)

          summary_marker = '''        if self.summary.pair_count != len(assignments):
              raise PairedReplayRegistryValidationError(
                  "summary pair_count must match assignments"
              )
          _require_hash("content_hash", self.content_hash)
          '''
          summary_marker = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in summary_marker.splitlines()
          ).lstrip('\n')
          summary_replacement = '''        if self.summary.pair_count != len(assignments):
              raise PairedReplayRegistryValidationError(
                  "summary pair_count must match assignments"
              )
          expected_control_first = sum(
              item.arm_order is ReplayArmOrder.CONTROL_THEN_TREATMENT
              for item in assignments
          )
          expected_treatment_first = len(assignments) - expected_control_first
          expected_tokens = len(assignments) * 2 * self.spec.maximum_tokens_per_arm
          expected_latency = (
              len(assignments) * 2.0 * self.spec.maximum_latency_ms_per_arm
          )
          if (
              self.summary.control_first_count != expected_control_first
              or self.summary.treatment_first_count != expected_treatment_first
              or self.summary.worst_case_total_tokens != expected_tokens
              or self.summary.worst_case_total_latency_ms != expected_latency
          ):
              raise PairedReplayRegistryValidationError(
                  "plan summary does not match assignments and reserved budgets"
              )
          _require_hash("content_hash", self.content_hash)
          '''
          summary_replacement = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in summary_replacement.splitlines()
          ).lstrip('\n')
          if 'plan summary does not match assignments and reserved budgets' not in source:
              if source.count(summary_marker) != 1:
                  raise SystemExit('summary validation marker is missing or ambiguous')
              source = source.replace(summary_marker, summary_replacement, 1)

          snapshot_marker = '''        if self.completed_trial_id is not None:
              _require_uuid("completed_trial_id", self.completed_trial_id)
          object.__setattr__(self, "ordinal", ordinal)
          '''
          snapshot_marker = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in snapshot_marker.splitlines()
          ).lstrip('\n')
          snapshot_replacement = '''        if self.completed_trial_id is not None:
              _require_uuid("completed_trial_id", self.completed_trial_id)
          if self.status is ReplayPairStatus.PLANNED:
              valid_state = (
                  not arms
                  and self.next_step is not None
                  and self.failure_code is None
                  and self.completed_trial_id is None
              )
          elif self.status is ReplayPairStatus.FIRST_ARM_RECORDED:
              valid_state = (
                  len(arms) == 1
                  and self.next_step is not None
                  and self.failure_code is None
                  and self.completed_trial_id is None
              )
          elif self.status is ReplayPairStatus.COMPLETE:
              valid_state = (
                  set(arms) == {ReplayArm.CONTROL, ReplayArm.TREATMENT}
                  and self.next_step is None
                  and self.failure_code is None
                  and self.completed_trial_id is not None
              )
          elif self.status is ReplayPairStatus.CANCELLED:
              valid_state = (
                  len(arms) <= 1
                  and self.next_step is None
                  and self.failure_code is ReplayFailureCode.CANCELLED
                  and self.completed_trial_id is None
              )
          else:
              valid_state = (
                  len(arms) <= 1
                  and self.next_step is None
                  and self.failure_code
                  in {
                      ReplayFailureCode.EXECUTION_FAILED,
                      ReplayFailureCode.BUDGET_EXCEEDED,
                  }
                  and self.completed_trial_id is None
              )
          if not valid_state:
              raise PairedReplayRegistryValidationError(
                  "pair snapshot fields do not match the declared status"
              )
          object.__setattr__(self, "ordinal", ordinal)
          '''
          snapshot_replacement = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in snapshot_replacement.splitlines()
          ).lstrip('\n')
          if 'pair snapshot fields do not match the declared status' not in source:
              if source.count(snapshot_marker) != 1:
                  raise SystemExit('snapshot validation marker is missing or ambiguous')
              source = source.replace(snapshot_marker, snapshot_replacement, 1)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Ensure exact exports, design and plan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          path = Path('src/nextgen_memory/__init__.py')
          source = path.read_text(encoding='utf-8')
          names = (
              'BalancedPairedReplayPlanner',
              'InMemoryPairedReplayExperimentRegistry',
              'PairedReplayArmResult',
              'PairedReplayAssignment',
              'PairedReplayExperimentSpec',
              'PairedReplayExperimentSummary',
              'PairedReplayFailureRecord',
              'PairedReplayPairSnapshot',
              'PairedReplayPlan',
              'PairedReplayPlanSummary',
              'PairedReplayRegistryConflictError',
              'PairedReplayRegistryStateError',
              'PairedReplayRegistryValidationError',
              'PairedReplayStep',
              'ReplayArm',
              'ReplayArmOrder',
              'ReplayFailureCode',
              'ReplayPairStatus',
          )
          if 'from .paired_replay_experiment_registry import (' not in source:
              marker = 'from .paired_rerank_policy_evaluation import ('
              if source.count(marker) != 1:
                  raise SystemExit('paired evaluation import marker is missing')
              block = 'from .paired_replay_experiment_registry import (\n'
              block += ''.join(f'    {name},\n' for name in names)
              block += ')\n'
              source = source.replace(marker, block + marker, 1)
          module = ast.parse(source)
          values = None
          for statement in module.body:
              if isinstance(statement, ast.Assign) and any(
                  isinstance(target, ast.Name) and target.id == '__all__'
                  for target in statement.targets
              ):
                  values = [
                      item.value
                      for item in statement.value.elts
                      if isinstance(item, ast.Constant) and isinstance(item.value, str)
                  ]
                  break
          if values is None:
              raise SystemExit('__all__ is not a literal collection')
          start = source.index('__all__ = [')
          end = source.index('\n]', start) + 2
          replacement = '__all__ = [\n' + ''.join(
              f'    "{name}",\n' for name in sorted(set(values).union(names))
          ) + ']'
          path.write_text(source[:start] + replacement + source[end:], encoding='utf-8')
          PY
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          mkdir -p docs/superpowers/specs docs/superpowers/plans
          git show bdc7c43b3ed85821b025e2e9b25d35199ddd30fd:docs/superpowers/specs/2026-08-15-paired-replay-experiment-registry-v0-design.md \
            > docs/superpowers/specs/2026-08-15-paired-replay-experiment-registry-v0-design.md
          test -f docs/superpowers/plans/2026-08-24-paired-replay-experiment-registry-v0.md

      - name: Normalize and run focused adversarial contract
        shell: bash
        run: |
          set -euo pipefail
          ruff format \
            src/nextgen_memory/__init__.py \
            src/nextgen_memory/paired_replay_experiment_registry.py \
            tests/test_paired_replay_experiment_registry.py \
            tests/test_paired_replay_experiment_registry_properties.py \
            tests/test_paired_replay_experiment_registry_public_api.py \
            tests/test_paired_replay_experiment_registry_adversarial.py
          ruff check --fix \
            src/nextgen_memory/__init__.py \
            src/nextgen_memory/paired_replay_experiment_registry.py \
            tests/test_paired_replay_experiment_registry.py \
            tests/test_paired_replay_experiment_registry_properties.py \
            tests/test_paired_replay_experiment_registry_public_api.py \
            tests/test_paired_replay_experiment_registry_adversarial.py
          ruff check .
          python -m compileall -q src scripts
          python -m pytest -q \
            tests/test_paired_replay_experiment_registry.py \
            tests/test_paired_replay_experiment_registry_properties.py \
            tests/test_paired_replay_experiment_registry_public_api.py \
            tests/test_paired_replay_experiment_registry_adversarial.py \
            | tee /tmp/focused-tests.txt
          python -m pytest -q | tee /tmp/full-tests.txt
          git diff --check

      - name: Strict audit and isolated wheel proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path('src/nextgen_memory/paired_replay_experiment_registry.py').read_text(encoding='utf-8')
          tree = ast.parse(source)
          forbidden_imports = {
              'asyncio','datetime','httpx','os','pathlib','psycopg','pymongo',
              'random','requests','socket','sqlalchemy','subprocess','temporalio',
              'time','urllib',
          }
          forbidden_calls = {
              'eval','exec','open','sleep','system','urlopen','uuid1','uuid4',
              'write_bytes','write_text',
          }
          findings = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Pass):
                  findings.append(f'{node.lineno}:pass')
              elif isinstance(node, ast.Raise):
                  target = node.exc.func if isinstance(node.exc, ast.Call) else node.exc
                  if (
                      isinstance(target, ast.Name) and target.id == 'NotImplementedError'
                  ) or (
                      isinstance(target, ast.Attribute) and target.attr == 'NotImplementedError'
                  ):
                      findings.append(f'{node.lineno}:NotImplementedError')
              elif isinstance(node, ast.Import):
                  for alias in node.names:
                      if alias.name.split('.',1)[0] in forbidden_imports:
                          findings.append(f'{node.lineno}:import:{alias.name}')
              elif isinstance(node, ast.ImportFrom):
                  if (node.module or '').split('.',1)[0] in forbidden_imports:
                      findings.append(f'{node.lineno}:import:{node.module}')
              elif isinstance(node, ast.Call):
                  name = node.func.id if isinstance(node.func, ast.Name) else node.func.attr if isinstance(node.func, ast.Attribute) else None
                  if name in forbidden_calls:
                      findings.append(f'{node.lineno}:call:{name}')
          if findings:
              raise SystemExit('\n'.join(findings))
          PY
          rm -rf wheelhouse "$RUNNER_TEMP/paired-registry-hardening-wheel-venv"
          python -m pip wheel --no-deps . -w wheelhouse
          wheel=$(find wheelhouse -maxdepth 1 -type f -name '*.whl')
          test -n "$wheel"
          python -m venv "$RUNNER_TEMP/paired-registry-hardening-wheel-venv"
          "$RUNNER_TEMP/paired-registry-hardening-wheel-venv/bin/python" -m pip install --no-deps "$wheel"
          "$RUNNER_TEMP/paired-registry-hardening-wheel-venv/bin/python" - <<'PY'
          import nextgen_memory
          from nextgen_memory import BalancedPairedReplayPlanner, PairedReplayPlan
          assert BalancedPairedReplayPlanner is not None
          assert PairedReplayPlan is not None
          assert 'BalancedPairedReplayPlanner' in nextgen_memory.__all__
          PY
          "$RUNNER_TEMP/paired-registry-hardening-wheel-venv/bin/python" -m pip check

      - name: Remove transports and prove exact eight-path tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/*paired*registry*once*.yml
          git add -A
          base='847ea08e9e9a0d9193adac6d465557270da6ef7d'
          mapfile -t changed < <(git diff --cached --name-only "$base" | sort)
          expected=(
            docs/superpowers/plans/2026-08-24-paired-replay-experiment-registry-v0.md
            docs/superpowers/specs/2026-08-15-paired-replay-experiment-registry-v0-design.md
            src/nextgen_memory/__init__.py
            src/nextgen_memory/paired_replay_experiment_registry.py
            tests/test_paired_replay_experiment_registry.py
            tests/test_paired_replay_experiment_registry_adversarial.py
            tests/test_paired_replay_experiment_registry_properties.py
            tests/test_paired_replay_experiment_registry_public_api.py
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}")
          test -z "$(git diff --cached --name-only "$base" -- 'migrations/**' '.github/workflows/**' pyproject.toml 'src/nextgen_memory/corrective_retrieval_*')"
          git diff --cached --check

      - name: Commit and publish immutable r3 candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: harden paired replay registry identities'
          git push origin HEAD:feat/paired-replay-experiment-registry-v0-hardening-r2-20260824
          candidate='candidate/paired-replay-experiment-registry-v0-r3-20260824'
          sha=$(git rev-parse HEAD)
          existing=$(git ls-remote --heads origin "$candidate" | awk '{print $1}')
          if [ -n "$existing" ]; then
            test "$existing" = "$sha"
          else
            git push origin "$sha:refs/heads/$candidate"
          fi
          gh api "repos/$REPO/issues/132/comments" -f body="Hardening producer GREEN at exact SHA \`$sha\` on \`$candidate\`. Exact eight-path scope; public pair identities, canonical ordering, reservations, and snapshot status invariants are now constructor-enforced. Independent Python 3.12/3.13 r3 verification remains required."
