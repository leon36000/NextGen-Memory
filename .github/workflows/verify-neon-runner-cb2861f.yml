name: Verify Neon runner exact SHA with PostgreSQL 18

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-bookworm
        env:
          POSTGRES_DB: nextgen_migration_rehearsal
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-local-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGDATABASE: nextgen_migration_rehearsal
      PGHOST: 127.0.0.1
      PGPASSWORD: synthetic-local-postgres-password
      PGPORT: "5432"
      PGUSER: postgres

    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2b609c98dcdd7fc0b5475205bdf5b635ebab2e7e
          fetch-depth: 0

      - name: Prove exact checkout and five-path candidate surface
        run: |
          test "$(git rev-parse HEAD)" = "2b609c98dcdd7fc0b5475205bdf5b635ebab2e7e"
          test "$(git merge-base HEAD 97a537cdba2e81385088b57bb02987fedb0aff14)" = "97a537cdba2e81385088b57bb02987fedb0aff14"
          mapfile -t changed < <(git diff --name-only 97a537cdba2e81385088b57bb02987fedb0aff14...HEAD | sort)
          expected=(
            .github/workflows/neon-migration-rehearsal.yml
            scripts/neon_migration_runner.py
            tests/fixtures/neon_migration_rehearsal_prerequisites.sql
            tests/test_neon_migration_rehearsal_workflow.py
            tests/test_neon_migration_runner.py
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}")
          test -z "$(git diff --name-only 97a537cdba2e81385088b57bb02987fedb0aff14...HEAD -- 'migrations/neon/*.sql' migrations/neon/manifest.json)"
          git diff --check 97a537cdba2e81385088b57bb02987fedb0aff14...HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install PostgreSQL 18 client
        run: |
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-18
          test "$(psql --version | awk '{print $3}' | cut -d. -f1)" = "18"
          test "$(pg_dump --version | awk '{print $3}' | cut -d. -f1)" = "18"

      - name: Prove synthetic service readiness through environment only
        run: |
          for attempt in $(seq 1 30); do
            if psql -X --no-psqlrc --tuples-only --no-align --quiet \
              --command "SELECT 1" | grep -qx "1"; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'

      - name: Focused manifest, runner and workflow contracts
        run: |
          ruff check scripts/neon_migration_manifest.py \
            scripts/neon_migration_runner.py \
            tests/test_neon_migration_manifest.py \
            tests/test_neon_migration_runner.py \
            tests/test_neon_migration_rehearsal_workflow.py
          python -m pytest -q tests/test_neon_migration_manifest.py \
            tests/test_neon_migration_runner.py \
            tests/test_neon_migration_rehearsal_workflow.py

      - name: Validate canonical plan and bootstrap explicit seed prerequisites
        run: |
          python scripts/neon_migration_manifest.py > manifest-plan.json
          python - <<'PY' > bootstrap-migrations.txt
          from pathlib import Path

          from scripts.neon_migration_manifest import load_manifest

          manifest = load_manifest(Path.cwd())
          expected = (
              "0001_memory_moe_kernel",
              "0002_core_idempotency",
          )
          actual = tuple(entry.id for entry in manifest.migrations[:2])
          if actual != expected:
              raise SystemExit(f"unexpected bootstrap migration prefix: {actual!r}")
          for entry in manifest.migrations[:2]:
              print(entry.path)
          PY
          while IFS= read -r migration_path; do
            psql -X --no-psqlrc -v ON_ERROR_STOP=1 --quiet \
              --file "$migration_path"
          done < bootstrap-migrations.txt
          psql -X --no-psqlrc -v ON_ERROR_STOP=1 --quiet \
            --file tests/fixtures/neon_migration_rehearsal_prerequisites.sql
          rm bootstrap-migrations.txt

      - name: Run canonical two-pass PostgreSQL 18 rehearsal
        run: |
          python scripts/neon_migration_runner.py > migration-rehearsal.json
          psql -X --no-psqlrc --tuples-only --no-align --quiet \
            --command "SELECT tablename FROM pg_catalog.pg_tables WHERE schemaname = 'ngm' ORDER BY tablename" \
            > live-table-list.txt
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path("manifest-plan.json").read_text(encoding="utf-8"))
          report = json.loads(
              Path("migration-rehearsal.json").read_text(encoding="utf-8")
          )
          live_tables = tuple(
              line.strip()
              for line in Path("live-table-list.txt").read_text(
                  encoding="utf-8"
              ).splitlines()
              if line.strip()
          )
          if report["manifest_path"] != plan["manifest_path"]:
              raise SystemExit("manifest path mismatch")
          if report["manifest_plan_hash"] != plan["plan_hash"]:
              raise SystemExit("manifest plan hash mismatch")
          if report["migration_count"] != plan["migration_count"]:
              raise SystemExit("migration count mismatch")
          if report["pass_count"] != 2 or report["stable"] is not True:
              raise SystemExit("two-pass rehearsal is not stable")
          if report["pass_one"] != report["pass_two"]:
              raise SystemExit("semantic state differs between passes")
          captured_tables = tuple(sorted(report["pass_one"]["table_counts"]))
          if captured_tables != live_tables:
              raise SystemExit(
                  f"captured table inventory differs: {captured_tables!r} != {live_tables!r}"
              )
          required_tables = {
              "action_memory_usage_events",
              "memory_nodes",
              "memory_spaces",
              "project_checkpoints",
              "retrieval_events",
              "router_decisions",
              "schema_meta",
              "source_principals",
          }
          if not required_tables.issubset(captured_tables):
              raise SystemExit("required migration tables are missing")
          PY
          rm live-table-list.txt

      - name: Prove reports are canonical and privacy-safe
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for name in ("manifest-plan.json", "migration-rehearsal.json"):
              path = Path(name)
              raw = path.read_text(encoding="utf-8")
              decoded = json.loads(raw)
              canonical = json.dumps(
                  decoded,
                  ensure_ascii=False,
                  allow_nan=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ) + "\n"
              if raw != canonical:
                  raise SystemExit(f"noncanonical report: {name}")
              lowered = raw.lower()
              for forbidden in (
                  "create ",
                  "alter ",
                  "drop ",
                  "password",
                  "secret",
                  "token",
                  "dsn",
                  "connection",
                  "postgresql://",
                  "postgres://",
              ):
                  if forbidden in lowered:
                      raise SystemExit(f"forbidden report content: {forbidden}")
          PY

      - name: Repository-wide exact-candidate verification
        run: |
          ruff check .
          python -m compileall -q src scripts
          python -m pytest -q
          git diff --check 97a537cdba2e81385088b57bb02987fedb0aff14...HEAD

      - name: Upload only canonical privacy-safe reports
        uses: actions/upload-artifact@v4
        with:
          name: neon-runner-2b609c98-python-${{ matrix.python-version }}
          path: |
            manifest-plan.json
            migration-rehearsal.json
          if-no-files-found: error
          retention-days: 7
