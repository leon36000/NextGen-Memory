name: Verify Neon runner exact SHA with PostgreSQL 18

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: nextgen_migration_rehearsal
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-local-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGDATABASE: nextgen_migration_rehearsal
      PGHOST: 127.0.0.1
      PGPASSWORD: synthetic-local-postgres-password
      PGPORT: "5432"
      PGUSER: postgres

    steps:
      - uses: actions/checkout@v4
        with:
          ref: cb2861f054d3781925b6069dfbd64659169ab008
          fetch-depth: 0

      - name: Prove exact checkout and four-path candidate surface
        run: |
          test "$(git rev-parse HEAD)" = "cb2861f054d3781925b6069dfbd64659169ab008"
          test "$(git merge-base HEAD 97a537cdba2e81385088b57bb02987fedb0aff14)" = "97a537cdba2e81385088b57bb02987fedb0aff14"
          mapfile -t changed < <(git diff --name-only 97a537cdba2e81385088b57bb02987fedb0aff14...HEAD | sort)
          expected=(
            .github/workflows/neon-migration-rehearsal.yml
            scripts/neon_migration_runner.py
            tests/test_neon_migration_rehearsal_workflow.py
            tests/test_neon_migration_runner.py
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}")
          test -z "$(git diff --name-only 97a537cdba2e81385088b57bb02987fedb0aff14...HEAD -- 'migrations/neon/*.sql' migrations/neon/manifest.json)"
          git diff --check 97a537cdba2e81385088b57bb02987fedb0aff14...HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install PostgreSQL 18 client
        run: |
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-18
          test "$(psql --version | awk '{print $3}' | cut -d. -f1)" = "18"
          test "$(pg_dump --version | awk '{print $3}' | cut -d. -f1)" = "18"

      - name: Prove synthetic service readiness through environment only
        run: |
          for attempt in $(seq 1 30); do
            if psql -X --no-psqlrc --tuples-only --no-align --quiet \
              --command "SELECT 1" | grep -qx "1"; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'

      - name: Focused manifest, runner and workflow contracts
        run: |
          ruff check scripts/neon_migration_manifest.py \
            scripts/neon_migration_runner.py \
            tests/test_neon_migration_manifest.py \
            tests/test_neon_migration_runner.py \
            tests/test_neon_migration_rehearsal_workflow.py
          python -m pytest -q tests/test_neon_migration_manifest.py \
            tests/test_neon_migration_runner.py \
            tests/test_neon_migration_rehearsal_workflow.py

      - name: Run canonical plan and two-pass PostgreSQL 18 rehearsal
        run: |
          python scripts/neon_migration_manifest.py > manifest-plan.json
          python scripts/neon_migration_runner.py > migration-rehearsal.json
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path("manifest-plan.json").read_text(encoding="utf-8"))
          report = json.loads(
              Path("migration-rehearsal.json").read_text(encoding="utf-8")
          )
          if report["manifest_path"] != plan["manifest_path"]:
              raise SystemExit("manifest path mismatch")
          if report["manifest_plan_hash"] != plan["plan_hash"]:
              raise SystemExit("manifest plan hash mismatch")
          if report["migration_count"] != plan["migration_count"]:
              raise SystemExit("migration count mismatch")
          if report["pass_count"] != 2 or report["stable"] is not True:
              raise SystemExit("two-pass rehearsal is not stable")
          if report["pass_one"] != report["pass_two"]:
              raise SystemExit("semantic state differs between passes")
          if set(report["pass_one"]["table_counts"]) != {
              "action_memory_usage_events",
              "backend_links",
              "consolidation_runs",
              "execution_artifacts",
              "execution_events",
              "execution_runs",
              "expert_registry",
              "memory_edges",
              "memory_feedback",
              "memory_nodes",
              "memory_spaces",
              "resolver_events",
              "retrieval_events",
              "router_decisions",
              "schema_meta",
              "state_events",
              "state_slots",
          }:
              raise SystemExit("unexpected ngm table inventory")
          PY

      - name: Prove reports are canonical and privacy-safe
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for name in ("manifest-plan.json", "migration-rehearsal.json"):
              path = Path(name)
              raw = path.read_text(encoding="utf-8")
              decoded = json.loads(raw)
              canonical = json.dumps(
                  decoded,
                  ensure_ascii=False,
                  allow_nan=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ) + "\n"
              if raw != canonical:
                  raise SystemExit(f"noncanonical report: {name}")
              lowered = raw.lower()
              for forbidden in (
                  "create ",
                  "alter ",
                  "drop ",
                  "password",
                  "secret",
                  "token",
                  "dsn",
                  "connection",
                  "postgresql://",
                  "postgres://",
              ):
                  if forbidden in lowered:
                      raise SystemExit(f"forbidden report content: {forbidden}")
          PY

      - name: Repository-wide exact-candidate verification
        run: |
          ruff check .
          python -m compileall -q src scripts
          python -m pytest -q
          git diff --check 97a537cdba2e81385088b57bb02987fedb0aff14...HEAD

      - name: Upload only canonical privacy-safe reports
        uses: actions/upload-artifact@v4
        with:
          name: neon-runner-cb2861f-python-${{ matrix.python-version }}
          path: |
            manifest-plan.json
            migration-rehearsal.json
          if-no-files-found: error
          retention-days: 7
