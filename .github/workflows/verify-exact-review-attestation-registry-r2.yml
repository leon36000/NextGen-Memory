name: Verify exact review attestation registry candidate r2

on:
  push:
    branches:
      - bootstrap/verify-exact-review-attestation-registry-r2-20260826

concurrency:
  group: exact-review-attestation-registry-r2-verification
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  verify:
    name: verify-${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 008005072f412ecda1bf461f4e875de72c5b808f
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Prove exact immutable identity, ancestry, and nine-path scope
        shell: bash
        run: |
          set -euo pipefail
          candidate='008005072f412ecda1bf461f4e875de72c5b808f'
          source_candidate='bd1d0821e22a733682e13dfc5a4876c0911995d0'
          base='f4f3aca9759b5b7a60691017c2211152c011ea92'
          candidate_branch='candidate/exact-sha-review-attestation-registry-v0-r2-20260826'
          source_branch='candidate/exact-sha-review-attestation-registry-v0-20260824'
          feature_branch='feat/exact-sha-review-attestation-registry-v0-20260824'
          test "$(git rev-parse HEAD)" = "$candidate"
          test "$(git rev-parse HEAD^)" = "$source_candidate"
          test "$(git merge-base "$base" "$candidate")" = "$base"
          git fetch --no-tags origin \
            "+refs/heads/$candidate_branch:refs/remotes/origin/$candidate_branch" \
            "+refs/heads/$source_branch:refs/remotes/origin/$source_branch" \
            "+refs/heads/$feature_branch:refs/remotes/origin/$feature_branch"
          test "$(git rev-parse "origin/$candidate_branch")" = "$candidate"
          test "$(git rev-parse "origin/$source_branch")" = "$source_candidate"
          test "$(git rev-parse "origin/$feature_branch")" = "$candidate"
          mapfile -t changed < <(git diff --name-only "$base"..."$candidate" | sort)
          expected=(
            docs/exact-sha-review-attestation-registry-v0-red.md
            docs/exact-sha-review-attestation-registry-v0.md
            docs/superpowers/plans/2026-08-24-exact-sha-review-attestation-registry-v0.md
            docs/superpowers/specs/2026-08-24-exact-sha-review-attestation-registry-v0-design.md
            src/nextgen_memory/__init__.py
            src/nextgen_memory/review_attestation_registry.py
            tests/test_review_attestation_registry.py
            tests/test_review_attestation_registry_properties.py
            tests/test_review_attestation_registry_public_api.py
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}")
          test "$(git diff --name-only "$source_candidate"..."$candidate" | wc -l)" -eq 1
          test "$(git diff --name-only "$source_candidate"..."$candidate")" = \
            'docs/superpowers/specs/2026-08-24-exact-sha-review-attestation-registry-v0-design.md'
          git diff --check "$base"..."$candidate"
          printf '%s\n' "${changed[@]}" | jq -R . | jq -s . > /tmp/exact-paths.json
          printf 'CANDIDATE_SHA=%s\nBASE_SHA=%s\nCANDIDATE_TREE_SHA=%s\n' \
            "$candidate" "$base" "$(git rev-parse "$candidate^{tree}")" \
            >> "$GITHUB_ENV"

      - name: Install exact test toolchain
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'ruff==0.16.4'
          ruff --version

      - name: Run Ruff, compileall, focused tests, and full suite
        shell: bash
        run: |
          set -euo pipefail
          ruff check .
          ruff format --check \
            src/nextgen_memory/__init__.py \
            src/nextgen_memory/review_attestation_registry.py \
            tests/test_review_attestation_registry.py \
            tests/test_review_attestation_registry_properties.py \
            tests/test_review_attestation_registry_public_api.py
          python -m compileall -q src scripts
          set -o pipefail
          python -m pytest -q \
            tests/test_review_attestation_registry.py \
            tests/test_review_attestation_registry_properties.py \
            tests/test_review_attestation_registry_public_api.py \
            2>&1 | tee /tmp/exact-review-attestation-focused.txt
          grep -F '61 passed' /tmp/exact-review-attestation-focused.txt >/dev/null
          python -m pytest -q 2>&1 | tee /tmp/exact-review-attestation-full.txt
          grep -F '515 passed' /tmp/exact-review-attestation-full.txt >/dev/null

      - name: Run strict dependency, privacy, side-effect, and stub audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          import json
          from pathlib import Path

          path = Path('src/nextgen_memory/review_attestation_registry.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source, filename=str(path))
          allowed_roots = {
              '__future__',
              'collections',
              'dataclasses',
              'enum',
              'hashlib',
              'itertools',
              'json',
              're',
              'uuid',
          }
          imported_roots = set()
          findings = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imported_roots.update(alias.name.split('.', 1)[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  if node.module:
                      imported_roots.add(node.module.split('.', 1)[0])
              elif isinstance(node, ast.Pass):
                  findings.append({'kind': 'pass', 'line': node.lineno})
              elif isinstance(node, ast.Constant) and node.value is Ellipsis:
                  findings.append({'kind': 'ellipsis', 'line': node.lineno})
              elif isinstance(node, ast.Raise):
                  target = node.exc
                  if (
                      isinstance(target, ast.Call)
                      and isinstance(target.func, ast.Name)
                      and target.func.id == 'NotImplementedError'
                  ):
                      findings.append({'kind': 'not_implemented', 'line': node.lineno})
              elif isinstance(node, ast.Call) and isinstance(node.func, ast.Name):
                  if node.func.id in {
                      'open', 'print', 'input', 'exec', 'eval', 'compile', '__import__'
                  }:
                      findings.append(
                          {'kind': f'forbidden_call:{node.func.id}', 'line': node.lineno}
                      )
          unknown_imports = sorted(imported_roots - allowed_roots)
          if unknown_imports:
              findings.append({'kind': 'non_stdlib_or_unapproved_import', 'values': unknown_imports})
          lower = source.lower()
          for marker in (
              'reviewer_email', 'reviewer_name', 'raw_payload', 'raw_review',
              'query_text', 'command_output', 'memory_body', 'credential',
              'api_key', 'access_token', 'password',
          ):
              if marker in lower:
                  findings.append({'kind': f'privacy_surface:{marker}'})
          if 'notimplementederror' in lower:
              findings.append({'kind': 'not_implemented_text'})
          report = {
              'schema': 'm-head-exact-review-attestation-audit-v1',
              'module': str(path),
              'allowed_import_roots': sorted(allowed_roots),
              'observed_import_roots': sorted(imported_roots),
              'finding_count': len(findings),
              'findings': findings,
              'network_surface': False,
              'database_surface': False,
              'filesystem_write_surface': False,
              'environment_surface': False,
              'clock_or_random_surface': False,
              'model_or_agent_surface': False,
              'merge_or_deployment_surface': False,
          }
          Path('/tmp/exact-review-attestation-audit.json').write_text(
              json.dumps(report, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          if findings:
              raise SystemExit(json.dumps(findings, sort_keys=True))
          print(json.dumps(report, sort_keys=True))
          PY

      - name: Generate four-state semantic evidence and prove 1,000 exact retries
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/generate-review-attestation-semantics.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json

          from nextgen_memory import (
              ExactShaReviewAttestation,
              ExactShaReviewRequest,
              InMemoryExactShaReviewAttestationRegistry,
              ReviewAttestationVerdict,
              ReviewerIdentity,
              ReviewFindingCode,
              ReviewModel,
          )


          def digest(value: str) -> str:
              return hashlib.sha256(value.encode('utf-8')).hexdigest()


          reviewers = tuple(digest(f'reviewer:{index}') for index in range(4))
          request = ExactShaReviewRequest(
              repository='leon36000/NextGen-Memory',
              pull_request_number=165,
              base_sha='1' * 40,
              candidate_sha='2' * 40,
              diff_sha256='3' * 64,
              review_packet_sha256='4' * 64,
              acceptance_criteria_sha256='5' * 64,
              required_model=ReviewModel.GPT_5_6_SOL,
              trusted_reviewer_fingerprints=set(reversed(reviewers)),
              minimum_approvals=2,
          )


          def attestation(
              index: int,
              verdict: ReviewAttestationVerdict,
              findings: object,
          ) -> ExactShaReviewAttestation:
              return ExactShaReviewAttestation(
                  request_id=request.id,
                  request_content_hash=request.content_hash,
                  repository=request.repository,
                  pull_request_number=request.pull_request_number,
                  candidate_sha=request.candidate_sha,
                  reviewer=ReviewerIdentity(
                      model=ReviewModel.GPT_5_6_SOL,
                      reviewer_key_fingerprint=reviewers[index],
                  ),
                  verdict=verdict,
                  finding_codes=findings,
                  review_artifact_sha256=digest(f'review:{index}'),
                  evidence_artifact_sha256s={
                      digest(f'evidence:{index}:b'),
                      digest(f'evidence:{index}:a'),
                  },
                  authenticated_envelope_sha256=digest(f'envelope:{index}'),
              )


          approvals = (
              attestation(0, ReviewAttestationVerdict.APPROVE, set()),
              attestation(1, ReviewAttestationVerdict.APPROVE, set()),
          )
          evidence_blocker = attestation(
              2,
              ReviewAttestationVerdict.BLOCKED_BY_EVIDENCE,
              {ReviewFindingCode.MISSING_ARTIFACT},
          )
          hard_blocker = attestation(
              3,
              ReviewAttestationVerdict.CHANGES_REQUIRED,
              {ReviewFindingCode.CONTRACT_VIOLATION},
          )
          scenarios = {
              'pending': (),
              'approved': approvals,
              'evidence_blocked': (*approvals, evidence_blocker),
              'blocked': (*approvals, evidence_blocker, hard_blocker),
          }
          output = {}
          retry_operations = 0
          for name, values in scenarios.items():
              registry = InMemoryExactShaReviewAttestationRegistry()
              assert registry.register_request(request) is request
              for value in values:
                  assert registry.record_attestation(value) is value
              for _ in range(1_000):
                  assert registry.register_request(request) is request
                  retry_operations += 1
                  for value in values:
                      assert registry.record_attestation(value) is value
                      retry_operations += 1
              output[name] = {
                  'summary': json.loads(registry.summary(request.id).render_json()),
                  'decision': json.loads(registry.decision(request.id).render_json()),
              }
          states = {name: value['decision']['state'] for name, value in output.items()}
          assert states == {
              'pending': 'pending',
              'approved': 'approved',
              'evidence_blocked': 'evidence_blocked',
              'blocked': 'blocked',
          }
          payload = {
              'schema': 'm-head-exact-review-attestation-semantics-v1',
              'scenarios': output,
              'retry_operations': retry_operations,
          }
          print(json.dumps(payload, sort_keys=True, separators=(',', ':')))
          PY
          for seed in 1 999; do
            PYTHONHASHSEED="$seed" python /tmp/generate-review-attestation-semantics.py \
              > "/tmp/exact-review-attestation-semantic-$seed.json"
          done
          cmp \
            /tmp/exact-review-attestation-semantic-1.json \
            /tmp/exact-review-attestation-semantic-999.json
          cp /tmp/exact-review-attestation-semantic-1.json \
            /tmp/exact-review-attestation-semantic.json
          semantic_sha=$(sha256sum /tmp/exact-review-attestation-semantic.json | awk '{print $1}')
          echo "SEMANTIC_SHA=$semantic_sha" >> "$GITHUB_ENV"
          jq -e '.retry_operations == 10000' \
            /tmp/exact-review-attestation-semantic.json >/dev/null

      - name: Build and validate isolated wheel
        shell: bash
        run: |
          set -euo pipefail
          wheelhouse="$RUNNER_TEMP/exact-review-attestation-wheelhouse"
          venv="$RUNNER_TEMP/exact-review-attestation-venv"
          mkdir -p "$wheelhouse"
          python -m pip wheel --no-deps . -w "$wheelhouse"
          wheel=$(find "$wheelhouse" -maxdepth 1 -type f -name '*.whl' -print -quit)
          test -n "$wheel"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --no-deps "$wheel"
          "$venv/bin/python" -m pip check
          "$venv/bin/python" - <<'PY'
          import nextgen_memory

          expected = (
              'ExactShaReviewAttestation',
              'ExactShaReviewRequest',
              'InMemoryExactShaReviewAttestationRegistry',
              'ReviewAdvisoryState',
              'ReviewAttestationConflictError',
              'ReviewAttestationDecision',
              'ReviewAttestationRegistrySummary',
              'ReviewAttestationStateError',
              'ReviewAttestationValidationError',
              'ReviewAttestationVerdict',
              'ReviewerIdentity',
              'ReviewFindingCode',
              'ReviewModel',
          )
          for name in expected:
              assert hasattr(nextgen_memory, name)
              assert nextgen_memory.__all__.count(name) == 1
          PY
          cp "$wheel" /tmp/exact-review-attestation-wheel.whl
          wheel_sha=$(sha256sum /tmp/exact-review-attestation-wheel.whl | awk '{print $1}')
          echo "WHEEL_SHA=$wheel_sha" >> "$GITHUB_ENV"

      - name: Build canonical per-Python verification manifest
        shell: bash
        run: |
          set -euo pipefail
          python_version=$(python -c 'import platform; print(platform.python_version())')
          export PYTHON_VERSION="$python_version"
          export EXACT_PATHS_JSON="$(cat /tmp/exact-paths.json)"
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          manifest = {
              'schema': 'm-head-exact-review-attestation-python-verification-v1',
              'repository': 'leon36000/NextGen-Memory',
              'candidate_sha': os.environ['CANDIDATE_SHA'],
              'candidate_tree_sha': os.environ['CANDIDATE_TREE_SHA'],
              'base_sha': os.environ['BASE_SHA'],
              'python_version': os.environ['PYTHON_VERSION'],
              'exact_path_count': 9,
              'paths': json.loads(os.environ['EXACT_PATHS_JSON']),
              'verification': {
                  'ruff_0_16_4': True,
                  'format': True,
                  'compileall': True,
                  'focused_tests': 61,
                  'full_tests': 515,
                  'generated_traces': 5000,
                  'exact_retry_operations': 10000,
                  'hash_seed_invariant': True,
                  'semantic_sha256': os.environ['SEMANTIC_SHA'],
                  'audit_findings': 0,
                  'isolated_wheel_import': True,
                  'wheel_sha256': os.environ['WHEEL_SHA'],
              },
              'safety': {
                  'merged': False,
                  'production_database_contacted': False,
                  'production_migration_applied': False,
                  'feedback_written': False,
                  'policy_activated': False,
                  'release_published': False,
                  'tests_weakened': False,
                  'stubs_added': False,
              },
          }
          Path('/tmp/exact-review-attestation-verification.json').write_text(
              json.dumps(manifest, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          print(Path('/tmp/exact-review-attestation-verification.json').read_text(), end='')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: exact-review-attestation-r2-python-${{ matrix.python-version }}
          path: |
            /tmp/exact-review-attestation-verification.json
            /tmp/exact-review-attestation-semantic.json
            /tmp/exact-review-attestation-audit.json
            /tmp/exact-review-attestation-focused.txt
            /tmp/exact-review-attestation-full.txt
            /tmp/exact-review-attestation-wheel.whl
          if-no-files-found: error
          retention-days: 7

  compare-and-publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 008005072f412ecda1bf461f4e875de72c5b808f
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: exact-review-attestation-r2-python-*
          path: /tmp/exact-review-attestation-matrix

      - name: Compare Python evidence and reconcile artifact metadata
        shell: bash
        run: |
          set -euo pipefail
          p312='/tmp/exact-review-attestation-matrix/exact-review-attestation-r2-python-3.12'
          p313='/tmp/exact-review-attestation-matrix/exact-review-attestation-r2-python-3.13'
          test -d "$p312"
          test -d "$p313"
          cmp \
            "$p312/exact-review-attestation-semantic.json" \
            "$p313/exact-review-attestation-semantic.json"
          candidate='008005072f412ecda1bf461f4e875de72c5b808f'
          base='f4f3aca9759b5b7a60691017c2211152c011ea92'
          for manifest in \
            "$p312/exact-review-attestation-verification.json" \
            "$p313/exact-review-attestation-verification.json"; do
            jq -e --arg candidate "$candidate" --arg base "$base" '
              .candidate_sha == $candidate
              and .base_sha == $base
              and .exact_path_count == 9
              and .verification.focused_tests == 61
              and .verification.full_tests == 515
              and .verification.generated_traces == 5000
              and .verification.exact_retry_operations == 10000
              and .verification.hash_seed_invariant == true
              and .verification.audit_findings == 0
              and .verification.isolated_wheel_import == true
              and .safety.merged == false
            ' "$manifest" >/dev/null
          done
          test "$(jq -r '.verification.semantic_sha256' "$p312/exact-review-attestation-verification.json")" = \
            "$(jq -r '.verification.semantic_sha256' "$p313/exact-review-attestation-verification.json")"
          semantic_sha=$(sha256sum "$p312/exact-review-attestation-semantic.json" | awk '{print $1}')
          test "$semantic_sha" = \
            "$(jq -r '.verification.semantic_sha256' "$p312/exact-review-attestation-verification.json")"

          gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            > /tmp/exact-review-attestation-run-artifacts.json
          jq -e '[.artifacts[] | select(.name | startswith("exact-review-attestation-r2-python-"))] | length == 2' \
            /tmp/exact-review-attestation-run-artifacts.json >/dev/null
          jq -e '[.artifacts[] | select(.name | startswith("exact-review-attestation-r2-python-")) | select(.expired == true)] | length == 0' \
            /tmp/exact-review-attestation-run-artifacts.json >/dev/null
          jq -S -c '[.artifacts[] | select(.name | startswith("exact-review-attestation-r2-python-")) | {id,name,size_in_bytes,digest,expired,created_at,expires_at}] | sort_by(.name)' \
            /tmp/exact-review-attestation-run-artifacts.json \
            > /tmp/exact-review-attestation-matrix-artifacts.json
          cp "$p312/exact-review-attestation-semantic.json" \
            /tmp/exact-review-attestation-cross-python-semantic.json
          printf 'SEMANTIC_SHA=%s\nP312=%s\nP313=%s\n' \
            "$semantic_sha" "$p312" "$p313" >> "$GITHUB_ENV"

      - name: Build immutable evidence and checkpoint documents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          def load(path: str) -> object:
              return json.loads(Path(path).read_text(encoding='utf-8'))

          p312 = load(os.environ['P312'] + '/exact-review-attestation-verification.json')
          p313 = load(os.environ['P313'] + '/exact-review-attestation-verification.json')
          artifacts = load('/tmp/exact-review-attestation-matrix-artifacts.json')
          evidence = {
              'schema': 'm-head-exact-review-attestation-registry-v0-green-v1',
              'status': 'green_review_pending_unmerged',
              'repository': 'leon36000/NextGen-Memory',
              'base': {
                  'branch': 'candidate/advisory-policy-promotion-gate-v0-20260824',
                  'sha': 'f4f3aca9759b5b7a60691017c2211152c011ea92',
              },
              'candidate': {
                  'branch': 'candidate/exact-sha-review-attestation-registry-v0-r2-20260826',
                  'sha': '008005072f412ecda1bf461f4e875de72c5b808f',
                  'tree_sha': p312['candidate_tree_sha'],
                  'exact_path_count': 9,
                  'paths': p312['paths'],
                  'invalid_predecessor_sha': 'bd1d0821e22a733682e13dfc5a4876c0911995d0',
              },
              'tdd': {
                  'qualified_red_branch': 'tdd/exact-sha-review-attestation-registry-v0-red-v5-20260825',
                  'qualified_red_sha': '849df204e899d7570ef469d52307786cf242695a',
                  'generated_trace_count': 5000,
                  'tests_weakened': False,
              },
              'verification': {
                  'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
                  'python': [p312, p313],
                  'cross_python_semantic_sha256': os.environ['SEMANTIC_SHA'],
                  'cross_python_semantic_identical': True,
                  'matrix_artifacts': artifacts,
                  'wheel_byte_identity_claimed': False,
                  'audit_findings': 0,
              },
              'review': {
                  'required_model': 'GPT-5.6 Sol',
                  'verdict': 'pending',
                  'merge_allowed': False,
              },
              'safety': {
                  'actual_product_merge_performed': False,
                  'merged': False,
                  'production_database_contacted': False,
                  'production_migration_applied': False,
                  'production_application_data_written': False,
                  'feedback_written': False,
                  'policy_activated': False,
                  'release_published': False,
                  'tests_weakened': False,
                  'stubs_added': False,
                  'sol_verdict_fabricated': False,
              },
              'next_action': (
                  'Create the canonical draft product PR and perform an independent '
                  'exact-SHA review. Any candidate movement invalidates this evidence.'
              ),
          }
          evidence_path = Path('/tmp/exact-review-attestation-r2-green.json')
          evidence_path.write_text(
              json.dumps(evidence, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          evidence_sha = hashlib.sha256(evidence_path.read_bytes()).hexdigest()
          checkpoint = {
              'checkpoint_key': (
                  'm-head:exact-sha-review-attestation-registry-v0:'
                  'green:00800507:20260826'
              ),
              'status': evidence['status'],
              'repository': evidence['repository'],
              'base': evidence['base'],
              'candidate': evidence['candidate'],
              'evidence_sha256': evidence_sha,
              'verification': evidence['verification'],
              'review': evidence['review'],
              'safety': evidence['safety'],
              'next_action': evidence['next_action'],
          }
          Path('/tmp/exact-review-attestation-r2-checkpoint.json').write_text(
              json.dumps(checkpoint, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          print(evidence_path.read_text(encoding='utf-8'), end='')
          PY

      - name: Publish immutable evidence and checkpoint branches
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          candidate='008005072f412ecda1bf461f4e875de72c5b808f'
          evidence_branch='evidence/exact-sha-review-attestation-registry-v0-00800507-green-20260826'
          checkpoint_branch='evidence/exact-sha-review-attestation-registry-v0-00800507-checkpoint-20260826'
          evidence_file='evidence/exact-sha-review-attestation-registry-v0-00800507-green-20260826.json'
          checkpoint_file='evidence/exact-sha-review-attestation-registry-v0-00800507-checkpoint-20260826.json'
