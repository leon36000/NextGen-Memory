name: Repair merge readiness Ruff SIM102 once

on:
  pull_request:

concurrency:
  group: merge-readiness-payload-repair-once
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'bootstrap/implement-merge-readiness-gate-r4v2-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/implement-merge-readiness-gate-r4v2-20260831
          fetch-depth: 0

      - name: Apply the single confirmed Ruff structural correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/payloads/merge_readiness_gate.py')
          source = path.read_text(encoding='utf-8')
          old = '''            elif decision.state is ReviewAdvisoryState.APPROVED:
                          if not review.authentication_verified:
                              _append_once(block, MergeReadinessReason.UNAUTHENTICATED_APPROVAL)
          '''
          old = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in old.splitlines()
          ) + '\n'
          new = '''            elif (
                          decision.state is ReviewAdvisoryState.APPROVED
                          and not review.authentication_verified
                      ):
                          _append_once(block, MergeReadinessReason.UNAUTHENTICATED_APPROVAL)
          '''
          new = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in new.splitlines()
          ) + '\n'
          if source.count(old) != 1:
              raise SystemExit(
                  f'expected one SIM102 block, found {source.count(old)}'
              )
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/repair-merge-readiness-payload-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: simplify merge readiness approval guard'
          git push origin HEAD:bootstrap/implement-merge-readiness-gate-r4v2-20260831
