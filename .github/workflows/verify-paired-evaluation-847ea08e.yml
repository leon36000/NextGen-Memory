name: Verify paired policy evaluation exact SHA

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 847ea08e9e9a0d9193adac6d465557270da6ef7d
          fetch-depth: 0

      - name: Prove exact checkout, ancestry and seven-path scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "847ea08e9e9a0d9193adac6d465557270da6ef7d"
          test "$(git merge-base HEAD e76275a7d75f06e6510dc72c971d1f198d659107)" = "e76275a7d75f06e6510dc72c971d1f198d659107"
          git merge-base --is-ancestor 67e7c0bc05165c1676541bd3ce7e648e3df54dc7 HEAD
          mapfile -t changed < <(git diff --name-only e76275a7d75f06e6510dc72c971d1f198d659107...HEAD | sort)
          expected=(
            docs/superpowers/plans/2026-08-15-paired-rerank-policy-evaluation-v0.md
            docs/superpowers/specs/2026-08-15-paired-rerank-policy-evaluation-v0-design.md
            scripts/simulate_paired_rerank_policy_evaluation_v0.py
            src/nextgen_memory/paired_rerank_policy_evaluation.py
            tests/test_paired_rerank_policy_evaluation.py
            tests/test_paired_rerank_policy_evaluation_properties.py
            tests/test_paired_rerank_policy_evaluation_simulation.py
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}")
          test -z "$(git diff --name-only e76275a7d75f06e6510dc72c971d1f198d659107...HEAD -- 'migrations/**' '.github/workflows/**' pyproject.toml 'src/nextgen_memory/corrective_retrieval_*')"
          git diff --check e76275a7d75f06e6510dc72c971d1f198d659107...HEAD
          test -z "$(git status --porcelain)"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'

      - name: Static, focused and complete exact-candidate verification
        shell: bash
        run: |
          set -euo pipefail
          ruff check .
          python -m compileall -q src scripts
          python -m pytest -q \
            tests/test_paired_rerank_policy_evaluation.py \
            tests/test_paired_rerank_policy_evaluation_properties.py \
            tests/test_paired_rerank_policy_evaluation_simulation.py \
            | tee /tmp/focused-tests.txt
          python -m pytest -q | tee /tmp/full-tests.txt
          git diff --check e76275a7d75f06e6510dc72c971d1f198d659107...HEAD

      - name: Prove deterministic simulation and verdict matrix
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/paired-evaluation-${{ matrix.python-version }}"
          mkdir -p "$evidence"
          python scripts/simulate_paired_rerank_policy_evaluation_v0.py > "$evidence/simulation.json"
          python scripts/simulate_paired_rerank_policy_evaluation_v0.py > /tmp/simulation-retry.json
          cmp "$evidence/simulation.json" /tmp/simulation-retry.json
          PYTHONHASHSEED=1 python scripts/simulate_paired_rerank_policy_evaluation_v0.py > /tmp/simulation-seed-1.json
          PYTHONHASHSEED=999 python scripts/simulate_paired_rerank_policy_evaluation_v0.py > /tmp/simulation-seed-999.json
          cmp "$evidence/simulation.json" /tmp/simulation-seed-1.json
          cmp "$evidence/simulation.json" /tmp/simulation-seed-999.json
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "paired-evaluation-${{ matrix.python-version }}" / "simulation.json"
          raw = path.read_text(encoding="utf-8")
          decoded = json.loads(raw)
          expected = json.dumps(
              decoded,
              ensure_ascii=False,
              allow_nan=False,
              indent=2,
              sort_keys=True,
          ) + "\n"
          if raw != expected:
              raise SystemExit("simulation output is not deterministic pretty sorted JSON")
          if decoded.get("scenario_count") != 6:
              raise SystemExit("simulation does not cover all six verdict classes")
          expected_verdicts = {
              "harmful": "harmful",
              "inconclusive": "inconclusive",
              "insufficient_evidence": "insufficient_evidence",
              "neutral": "neutral",
              "promising": "promising",
              "too_costly": "too_costly",
          }
          if decoded.get("verdict_scenarios") != expected_verdicts:
              raise SystemExit("simulation verdict matrix differs from contract")
          variance = decoded["variance_experiment"]
          if variance.get("trial_count") != 64:
              raise SystemExit("variance trial count differs")
          if not variance["paired_standard_error"] < variance["unpaired_standard_error"]:
              raise SystemExit("paired estimator did not reduce standard error")
          if not variance["standard_error_ratio"] < 0.25:
              raise SystemExit("paired standard-error reduction is too weak")
          if decoded.get("memory_level_credit_emitted") is not False:
              raise SystemExit("evaluation emitted forbidden memory-level credit")
          digest = hashlib.sha256(raw.encode("utf-8")).hexdigest()
          (path.parent / "simulation.sha256").write_text(digest + "\n", encoding="utf-8")
          PY
          echo "EVIDENCE_ROOT=$evidence" >> "$GITHUB_ENV"

      - name: Audit matched-pair, privacy and side-effect boundary
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          path = Path("src/nextgen_memory/paired_rerank_policy_evaluation.py")
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source, filename=str(path))
          forbidden_roots = {
              "asyncio", "httpx", "os", "pathlib", "psycopg", "pymongo",
              "random", "requests", "socket", "sqlalchemy", "subprocess",
              "temporalio", "time", "urllib",
          }
          forbidden_calls = {
              "eval", "exec", "open", "sleep", "system", "urlopen",
              "uuid1", "uuid4", "write_bytes", "write_text",
          }
          violations: list[str] = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Pass):
                  violations.append(f"{node.lineno}:pass")
              elif isinstance(node, ast.Raise):
                  exc = node.exc.func if isinstance(node.exc, ast.Call) else node.exc
                  if (
                      isinstance(exc, ast.Name) and exc.id == "NotImplementedError"
                  ) or (
                      isinstance(exc, ast.Attribute) and exc.attr == "NotImplementedError"
                  ):
                      violations.append(f"{node.lineno}:NotImplementedError")
              elif isinstance(node, ast.Import):
                  for alias in node.names:
                      if alias.name.split(".", 1)[0] in forbidden_roots:
                          violations.append(f"{node.lineno}:import:{alias.name}")
              elif isinstance(node, ast.ImportFrom):
                  if (node.module or "").split(".", 1)[0] in forbidden_roots:
                      violations.append(f"{node.lineno}:import:{node.module}")
              elif isinstance(node, ast.Call):
                  name = node.func.id if isinstance(node.func, ast.Name) else node.func.attr if isinstance(node.func, ast.Attribute) else None
                  if name in forbidden_calls:
                      violations.append(f"{node.lineno}:call:{name}")
          lowered = source.lower()
          for marker in (
              "postgresql://", "mongodb://", "http://", "https://", "password",
              "credential", "# todo", "# fixme", "raw_query", "raw_prompt",
              "response_text", "memory_body", "write_feedback", "activate_policy",
          ):
              if marker in lowered:
                  violations.append(f"text:{marker}")
          if violations:
              raise SystemExit("\n".join(violations))
          print("paired_policy_evaluation_side_effect_or_privacy_findings=0")
          PY

      - name: Build and install exact wheel outside checkout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf wheelhouse "$RUNNER_TEMP/paired-evaluation-wheel-venv"
          python -m pip wheel --no-deps . -w wheelhouse
          test "$(find wheelhouse -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          wheel=$(find wheelhouse -maxdepth 1 -type f -name '*.whl')
          python -m venv "$RUNNER_TEMP/paired-evaluation-wheel-venv"
          "$RUNNER_TEMP/paired-evaluation-wheel-venv/bin/python" -m pip install --no-deps "$wheel"
          "$RUNNER_TEMP/paired-evaluation-wheel-venv/bin/python" - <<'PY'
          from nextgen_memory.paired_rerank_policy_evaluation import (
              PairedPolicyEvaluationConfig,
              PairedPolicyVerdict,
              PairedRerankPolicyEvaluator,
              PairedRerankPolicyTrial,
          )
          assert PairedPolicyEvaluationConfig is not None
          assert PairedPolicyVerdict.PROMISING.value == "promising"
          assert PairedRerankPolicyEvaluator is not None
          assert PairedRerankPolicyTrial is not None
          PY
          "$RUNNER_TEMP/paired-evaluation-wheel-venv/bin/python" -m pip check
          sha256sum "$wheel" | awk '{print $1}' > "$EVIDENCE_ROOT/wheel.sha256"

      - name: Write bounded exact-head evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          def count(path: str) -> int:
              matches = re.findall(r"(\d+) passed", Path(path).read_text(encoding="utf-8"))
              if not matches:
                  raise SystemExit(f"test count missing: {path}")
              return int(matches[-1])

          root = Path(os.environ["EVIDENCE_ROOT"])
          report = {
              "candidate_sha": "847ea08e9e9a0d9193adac6d465557270da6ef7d",
              "focused_test_count": count("/tmp/focused-tests.txt"),
              "full_test_count": count("/tmp/full-tests.txt"),
              "hash_seed_invariant": True,
              "python_version": ".".join(map(str, sys.version_info[:3])),
              "simulation_sha256": (root / "simulation.sha256").read_text().strip(),
              "wheel_sha256": (root / "wheel.sha256").read_text().strip(),
          }
          (root / "evidence.json").write_text(
              json.dumps(
                  report,
                  ensure_ascii=False,
                  allow_nan=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ) + "\n",
              encoding="utf-8",
          )
          print((root / "evidence.json").read_text(), end="")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: paired-evaluation-847ea08e-python-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/paired-evaluation-${{ matrix.python-version }}/evidence.json
            ${{ runner.temp }}/paired-evaluation-${{ matrix.python-version }}/simulation.json
          if-no-files-found: error
          retention-days: 7

  compare:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: paired-evaluation-847ea08e-python-*
          path: ${{ runner.temp }}/paired-evaluation-matrix

      - name: Require cross-Python identical evaluation simulation evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "paired-evaluation-matrix"
          evidence_paths = sorted(root.rglob("evidence.json"))
          simulation_paths = sorted(root.rglob("simulation.json"))
          if len(evidence_paths) != 2 or len(simulation_paths) != 2:
              raise SystemExit("incomplete paired-evaluation evidence matrix")
          documents = [json.loads(path.read_text(encoding="utf-8")) for path in evidence_paths]
          if {".".join(document["python_version"].split(".")[:2]) for document in documents} != {"3.12", "3.13"}:
              raise SystemExit("unexpected Python evidence set")
          for document in documents:
              if document["candidate_sha"] != "847ea08e9e9a0d9193adac6d465557270da6ef7d":
                  raise SystemExit("candidate SHA drift")
              if document["focused_test_count"] != 28 or document["full_test_count"] != 351:
                  raise SystemExit("unexpected test counts")
              if document["hash_seed_invariant"] is not True:
                  raise SystemExit("hash-seed invariance was not proved")
          if len({document["simulation_sha256"] for document in documents}) != 1:
              raise SystemExit("simulation hash differs across Python versions")
          if simulation_paths[0].read_bytes() != simulation_paths[1].read_bytes():
              raise SystemExit("simulation bytes differ across Python versions")
          summary = {
              "candidate_sha": "847ea08e9e9a0d9193adac6d465557270da6ef7d",
              "cross_python_simulation_identical": True,
              "focused_test_count_each": 28,
              "full_test_count_each": 351,
              "python_versions": ["3.12", "3.13"],
              "simulation_sha256": documents[0]["simulation_sha256"],
          }
          destination = root / "cross-python-summary.json"
          destination.write_text(
              json.dumps(
                  summary,
                  ensure_ascii=False,
                  allow_nan=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ) + "\n",
              encoding="utf-8",
          )
          print(destination.read_text(encoding="utf-8"), end="")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: paired-evaluation-847ea08e-cross-python-summary
          path: ${{ runner.temp }}/paired-evaluation-matrix/cross-python-summary.json
          if-no-files-found: error
          retention-days: 7
