name: Repair release-wheel adversarial fixtures once

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'release/wheel-integrity-reproducibility-v1-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/wheel-integrity-reproducibility-v1-20260823
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Replace unrepresentable synthetic names with real adversarial evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_release_wheel_integrity.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              'import pytest\nfrom scripts.verify_release_wheel import (',
              'import pytest\nimport scripts.verify_release_wheel as release_wheel\nfrom scripts.verify_release_wheel import (',
              1,
          )
          old_cases = (
              '        "nextgen_memory/nul\\x00.py",\n'
              '        "",\n'
          )
          if source.count(old_cases) != 1:
              raise SystemExit('unexpected unsafe-name fixture structure')
          source = source.replace(old_cases, '', 1)
          marker = '\n\ndef test_inspector_rejects_duplicate_archive_members(tmp_path: Path) -> None:\n'
          addition = '''


def test_member_name_validator_rejects_empty_name() -> None:
    with pytest.raises(WheelValidationError, match="archive member name"):
        release_wheel._validate_archive_name("")


def test_inspector_rejects_raw_nul_archive_name(tmp_path: Path) -> None:
    wheel = write_wheel(
        tmp_path / "raw-nul.whl",
        members={"nextgen_memory/nulX.py": "unsafe"},
    )
    source_name = b"nextgen_memory/nulX.py"
    target_name = b"nextgen_memory/nul\\x00.py"
    raw = wheel.read_bytes()
    assert raw.count(source_name) == 2
    wheel.write_bytes(raw.replace(source_name, target_name))

    with pytest.raises(WheelValidationError, match="archive member name"):
        inspect(wheel)
'''
          if source.count(marker) != 1:
              raise SystemExit('duplicate-test insertion point not found')
          source = source.replace(marker, addition + marker, 1)
          source = source.replace(
              'match="\\.whl"',
              'match=r"\\.whl"',
              1,
          )
          path.write_text(source, encoding='utf-8')
          PY
          rm .github/workflows/fix-release-wheel-fixture-once.yml
      - name: Verify corrected adversarial cases
        run: |
          python -m pip install -e '.[dev]'
          ruff check scripts/verify_release_wheel.py tests/test_release_wheel_integrity.py
          python -m pytest -q tests/test_release_wheel_integrity.py \
            -k 'noncanonical_archive_names or empty_name or raw_nul or non_wheel_suffix'
          git diff --check
      - name: Commit corrected tests only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_release_wheel_integrity.py
          git add -u .github/workflows
          git diff --cached --check
          git commit -m 'test: use representable wheel path adversaries'
          git push origin HEAD:release/wheel-integrity-reproducibility-v1-20260823
