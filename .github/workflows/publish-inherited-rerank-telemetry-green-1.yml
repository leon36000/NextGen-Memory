name: Publish Inherited Rerank Telemetry GREEN 1

on:
  push:
    branches: [bootstrap/inherited-rerank-telemetry-green-1]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/inherited-rerank-telemetry-v0
          fetch-depth: 0
      - name: Verify guarded feature head
        run: test "$(git rev-parse HEAD)" = "0e49685c8c627dc5b5f8ff1f1826a7c65d882a4b"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Apply mechanical formatting and import ordering
        run: |
          ruff format \
            src/nextgen_memory/inherited_rerank_telemetry.py \
            tests/test_inherited_rerank_telemetry.py
          ruff check \
            src/nextgen_memory/inherited_rerank_telemetry.py \
            tests/test_inherited_rerank_telemetry.py \
            --fix
      - name: Verify focused and complete behavior
        run: |
          ruff check .
          python -m pytest tests/test_inherited_rerank_telemetry.py -q
          python -m pytest -q
          python -m compileall -q src
          git diff --check
      - name: Verify exact correction scope
        run: |
          cat > /tmp/allowed <<'EOF'
          src/nextgen_memory/inherited_rerank_telemetry.py
          tests/test_inherited_rerank_telemetry.py
          EOF
          git diff --name-only | sort > /tmp/actual
          while read -r path; do grep -Fx "$path" /tmp/allowed >/dev/null; done < /tmp/actual
      - name: Commit and push fast-forward
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "NextGen Memory Automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/nextgen_memory/inherited_rerank_telemetry.py \
            tests/test_inherited_rerank_telemetry.py
          git commit -m "style: finalize inherited rerank telemetry core"
          git push origin HEAD:feat/inherited-rerank-telemetry-v0
