name: Verify and report Mongo canonical gate candidate

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'bootstrap/verify-mongodb-canonical-gate-20260822'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Resolve and checkout immutable candidate SHA
        id: candidate
        run: |
          set -euo pipefail
          expected="$(git ls-remote origin refs/heads/fix/mongodb-post-ranking-canonical-gate-20260822 | awk '{print $1}')"
          test -n "$expected"
          git fetch --depth=1 origin "$expected"
          git checkout --detach "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          printf 'sha=%s\n' "$expected" >> "$GITHUB_OUTPUT"
      - name: Prove final scope and transport cleanup
        run: |
          test ! -e .github/workflows/mongodb-canonical-gate-patch-once.yml
          git fetch --depth=1 origin feat/corrective-retrieval-preproduction-v0.9.3
          git diff --name-only FETCH_HEAD...HEAD > /tmp/changed_paths.txt
          test -s /tmp/changed_paths.txt
          while IFS= read -r path; do
            case "$path" in
              src/nextgen_memory/mongodb_retrieval.py|tests/test_mongodb_retrieval_gate.py) ;;
              *) echo "unexpected candidate path: $path" >&2; exit 1 ;;
            esac
          done < /tmp/changed_paths.txt
          if git diff --unified=0 FETCH_HEAD...HEAD | grep -E '^\+.*(pytest\.mark\.(skip|xfail)|@unittest\.skip|# *noqa|NotImplementedError|TODO|FIXME|pass$)' ; then
            echo 'test weakening, suppression, stub, or deferred implementation detected' >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install exact candidate
        run: python -m pip install -e '.[dev]'
      - name: Focused verification
        run: python -m pytest -q tests/test_mongodb_retrieval.py tests/test_mongodb_retrieval_gate.py
      - name: Complete verification
        run: |
          ruff check .
          python -m compileall -q src
          python -m pytest -q
          git diff --check
      - name: Write immutable evidence record
        run: |
          mkdir -p /tmp/evidence
          python - <<'PY'
          import json
          from pathlib import Path
          record = {
              "candidate_sha": "${{ steps.candidate.outputs.sha }}",
              "python_version": "${{ matrix.python-version }}",
              "focused": "green",
              "ruff": "clean",
              "compileall": "clean",
              "full_suite": "green",
              "diff_check": "clean",
              "scope": [
                  "src/nextgen_memory/mongodb_retrieval.py",
                  "tests/test_mongodb_retrieval_gate.py",
              ],
              "transport_absent": True,
              "run_id": "${{ github.run_id }}",
          }
          Path('/tmp/evidence/record.json').write_text(
              json.dumps(record, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mongodb-gate-${{ matrix.python-version }}
          path: /tmp/evidence/record.json
          if-no-files-found: error

  report:
    if: github.event.pull_request.head.ref == 'bootstrap/verify-mongodb-canonical-gate-20260822'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/records
          pattern: mongodb-gate-*
      - name: Reconcile matrix evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          records = [json.loads(path.read_text(encoding='utf-8')) for path in Path('/tmp/records').glob('**/record.json')]
          if len(records) != 2:
              raise SystemExit(f'expected two records, got {len(records)}')
          if sorted(record['python_version'] for record in records) != ['3.12', '3.13']:
              raise SystemExit('incomplete Python matrix')
          shas = {record['candidate_sha'] for record in records}
          if len(shas) != 1:
              raise SystemExit(f'candidate moved during verification: {shas}')
          expected = {
              'focused': 'green',
              'ruff': 'clean',
              'compileall': 'clean',
              'full_suite': 'green',
              'diff_check': 'clean',
              'transport_absent': True,
          }
          for record in records:
              for key, value in expected.items():
                  if record[key] != value:
                      raise SystemExit(f'failed evidence {key}')
          summary = {
              'candidate_sha': next(iter(shas)),
              'run_id': records[0]['run_id'],
              'scope': records[0]['scope'],
          }
          Path('/tmp/summary.json').write_text(
              json.dumps(summary, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Publish exact-SHA evidence and blind Sol packet
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          repo = os.environ['REPO']
          summary = json.load(open('/tmp/summary.json', encoding='utf-8'))
          rows = json.loads(subprocess.run(
              ['gh', 'pr', 'list', '--repo', repo, '--state', 'open', '--head', 'fix/mongodb-post-ranking-canonical-gate-20260822', '--json', 'number,headRefOid,baseRefName'],
              check=True, text=True, capture_output=True,
          ).stdout)
          if len(rows) != 1:
              raise SystemExit(f'expected one Mongo gate PR, got {rows}')
          pr = rows[0]
          if pr['headRefOid'] != summary['candidate_sha']:
              raise SystemExit('candidate ref moved after exact verification')
          if pr['baseRefName'] != 'feat/corrective-retrieval-preproduction-v0.9.3':
              raise SystemExit('unexpected candidate base')

          packet = f'''## Exact-SHA verification and blind GPT-5.6 Sol review request

Return exactly one verdict: `APPROVE`, `CHANGES_REQUIRED`, or `BLOCKED_BY_EVIDENCE`.

### Review boundary

- Candidate SHA: `{summary['candidate_sha']}`
- Base: `feat/corrective-retrieval-preproduction-v0.9.3`
- Candidate movement invalidates this request.

### Exact scope

- `src/nextgen_memory/mongodb_retrieval.py`
- `tests/test_mongodb_retrieval_gate.py`

### Contract

The historical Mongo retriever must independently validate the post-ranking provider batch before constructing hits: mapping rows, canonical memory UUID, non-empty backend reference, exact requested scope, active lifecycle, non-empty source type, unique memory/backend identities and count within the request limit. The pipeline must expose `space_id`, `status`, and `source_type`. Errors must be bounded and privacy-safe.

### Evidence

- Python 3.12: focused existing+gate tests, Ruff, compileall, complete pytest and diff-check passed.
- Python 3.13: the same checks passed.
- Both jobs resolved and detached-checkout the same immutable remote SHA.
- Candidate diff is exactly the two files above.
- No temporary workflow, test weakening, suppression, stub, TODO/FIXME or `NotImplementedError` remains.
- Verification run: {os.environ['RUN_URL']}

### Review focus

- actual integration around the aggregate result and projection builder;
- scope/lifecycle/identity fail-closed behavior;
- batch materialization and iterator semantics;
- duplicate and result-limit accounting;
- privacy of exceptions;
- compatibility with valid existing Mongo rows and retrieval mapping;
- whether source-type presence, without a new allowlist, correctly matches this deliberately narrow task.

Do not rely on this summary. Inspect the exact diff, tests and immutable workflow evidence. No merge is allowed without a genuine independent Sol `APPROVE` on the unchanged SHA.'''
          subprocess.run(
              ['gh', 'pr', 'comment', str(pr['number']), '--repo', repo, '--body', packet],
              check=True,
          )

          issue_rows = json.loads(subprocess.run(
              ['gh', 'issue', 'list', '--repo', repo, '--state', 'open', '--search', 'add post-ranking canonical gate to historical Mongo retrieval in:title', '--json', 'number,title'],
              check=True, text=True, capture_output=True,
          ).stdout)
          if len(issue_rows) == 1:
              subprocess.run(
                  ['gh', 'issue', 'comment', str(issue_rows[0]['number']), '--repo', repo,
                   '--body', f"Implementation candidate `{summary['candidate_sha']}` is GREEN and exact-SHA verified on Python 3.12/3.13. Blind Sol packet is on PR #{pr['number']}. No merge occurred."],
                  check=True,
              )
          PY
      - name: Record orchestrator checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh issue comment 23 --repo "$REPO" --body "## Mongo canonical-gate checkpoint\n\nThe historical Mongo post-ranking gate candidate passed immutable-ref verification on Python 3.12 and 3.13. Exact evidence and a blind Sol packet were posted on its PR. No merge occurred. Run: $RUN_URL."
      - name: Close this ephemeral verification PR without merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr close "$PR_NUMBER" --repo "$REPO" --comment 'Exact-SHA verification completed successfully. Evidence was copied to the candidate PR; closed without merge.'
