name: One-shot portable causal metadata key count

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.ref == 'fix/causal-feedback-metadata-allowlist-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/causal-feedback-metadata-allowlist-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Replace unavailable JSON object length function
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('migrations/neon/0005_causal_credit_feedback.sql')
          source = path.read_text(encoding='utf-8')
          old = 'IF NOT (jsonb_object_length(p_metadata) = 10) THEN'
          new = 'IF NOT ((SELECT count(*) FROM jsonb_object_keys(p_metadata)) = 10) THEN'
          if source.count(old) != 1:
              raise SystemExit('unexpected JSON object length guard')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/causal-json-key-count-patch-once.yml
      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'
      - name: Focused verification
        run: python -m pytest -q tests/test_causal_feedback.py tests/test_causal_feedback_migration.py
      - name: Lint
        run: ruff check .
      - name: Full suite
        run: python -m pytest -q
      - name: Diff integrity
        run: git diff --check
      - name: Commit portable migration fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add migrations/neon/0005_causal_credit_feedback.sql tests/test_causal_feedback_migration.py
          git add -u .github/workflows
          git commit -m 'fix: use portable causal metadata key count'
          git push origin HEAD:fix/causal-feedback-metadata-allowlist-20260822
