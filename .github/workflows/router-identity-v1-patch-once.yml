name: One-shot routing decision identity v1 patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.ref == 'fix/router-decision-identity-v1-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/router-decision-identity-v1-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply complete privacy-safe identity binding
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('src/nextgen_memory/router.py')
          source = path.read_text(encoding='utf-8')
          if 'POLICY_VERSION = "deterministic-v1"' in source:
              raise SystemExit(0)

          old_imports = dedent('''\
          from __future__ import annotations

          from collections import defaultdict
          from dataclasses import dataclass
          from uuid import NAMESPACE_URL, uuid5
          ''')
          new_imports = dedent('''\
          from __future__ import annotations

          import hashlib
          import json
          from collections import defaultdict
          from dataclasses import dataclass
          from uuid import NAMESPACE_URL, UUID, uuid5
          ''')
          if source.count(old_imports) != 1:
              raise SystemExit('unexpected router import block')
          source = source.replace(old_imports, new_imports, 1)

          if source.count('POLICY_VERSION = "deterministic-v0"') != 1:
              raise SystemExit('unexpected router policy version')
          source = source.replace(
              'POLICY_VERSION = "deterministic-v0"',
              'POLICY_VERSION = "deterministic-v1"',
              1,
          )

          old_identity = '''        decision_id = uuid5(
              NAMESPACE_URL,
              f"nextgen-memory:{POLICY_VERSION}:{request.request_id}",
          )
          '''
          new_identity = '''        decision_id = _routing_decision_id(
              request=request,
              eligible=eligible,
              allocations=allocations,
              escalation=escalation,
              confidence=confidence,
          )
          '''
          old_identity = dedent(old_identity).replace('\n', '\n        ', 1)
          new_identity = dedent(new_identity).replace('\n', '\n        ', 1)
          if source.count(old_identity) != 1:
              # Use the exact literal from the source when textwrap layout differs.
              old_identity = (
                  '        decision_id = uuid5(\n'
                  '            NAMESPACE_URL,\n'
                  '            f"nextgen-memory:{POLICY_VERSION}:{request.request_id}",\n'
                  '        )\n'
              )
              new_identity = (
                  '        decision_id = _routing_decision_id(\n'
                  '            request=request,\n'
                  '            eligible=eligible,\n'
                  '            allocations=allocations,\n'
                  '            escalation=escalation,\n'
                  '            confidence=confidence,\n'
                  '        )\n'
              )
          if source.count(old_identity) != 1:
              raise SystemExit('unexpected request-ID-only decision identity block')
          source = source.replace(old_identity, new_identity, 1)

          helpers = dedent('''\


          def _routing_decision_id(
              *,
              request: RoutingRequest,
              eligible: tuple[ExpertKey, ...],
              allocations: tuple[ExpertAllocation, ...],
              escalation: tuple[ExpertKey, ...],
              confidence: float,
          ) -> UUID:
              """Bind one UUID to the complete privacy-safe routing policy and outcome."""

              payload: dict[str, object] = {
                  "request": {
                      "request_id": str(request.request_id),
                      "query_hash": hashlib.sha256(
                          request.query.encode("utf-8")
                      ).hexdigest(),
                      "scope_fingerprint": _canonical_json_sha256(
                          request.scope.to_dict()
                      ),
                      "task_kind": request.task_kind.value,
                      "plan_phase": request.plan_phase.value,
                      "needs": sorted(need.value for need in request.needs),
                      "temporal_intent": request.temporal_intent.value,
                      "exactness": request.exactness.value,
                      "risk": request.risk.value,
                      "uncertainty": request.uncertainty,
                      "token_budget": request.token_budget,
                      "latency_budget_ms": request.latency_budget_ms,
                      "max_experts": request.max_experts,
                      "minimum_authority": request.minimum_authority,
                  },
                  "outcome": {
                      "eligible_experts": [expert.value for expert in eligible],
                      "allocations": [
                          allocation.to_dict() for allocation in allocations
                      ],
                      "escalation_experts": [
                          expert.value for expert in escalation
                      ],
                      "confidence": confidence,
                      "policy_version": POLICY_VERSION,
                  },
              }
              digest = _canonical_json_sha256(payload)
              return uuid5(
                  NAMESPACE_URL,
                  f"nextgen-memory:routing-decision:{POLICY_VERSION}:{digest}",
              )


          def _canonical_json_sha256(value: object) -> str:
              """Hash an explicitly built JSON value without arbitrary string fallback."""

              encoded = json.dumps(
                  value,
                  ensure_ascii=False,
                  allow_nan=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8")
              return hashlib.sha256(encoded).hexdigest()
          ''')
          if 'def _routing_decision_id(' in source:
              raise SystemExit('routing identity helper already exists unexpectedly')
          path.write_text(source.rstrip() + helpers.rstrip() + '\n', encoding='utf-8')
          PY
      - name: Document the v1 identity contract
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('docs/router-v0.md')
          source = path.read_text(encoding='utf-8')
          if '## Deterministic decision identity' in source:
              raise SystemExit(0)
          marker = '## Non-goals of v0\n'
          if source.count(marker) != 1:
              raise SystemExit('unexpected router documentation structure')
          section = dedent('''\
          ## Deterministic decision identity

          Router policy version `deterministic-v1` binds each `decision_id` to the
          complete privacy-safe request policy and deterministic route outcome. The
          identity includes the request UUID, SHA-256 fingerprints of the normalized
          query and complete hard scope, all routing features and budgets, eligible
          experts, ordered allocations and escalation, confidence, and policy version.

          Raw query text and raw user or agent identifiers never enter the UUID5 name.
          The complete safe payload is serialized as canonical sorted JSON and hashed;
          the UUID5 name contains only the policy version and the final SHA-256 digest.
          Set-like fields are sorted while execution-order fields preserve order.

          Historical `deterministic-v0` rows remain historical evidence. New v1
          decisions receive new identities; no existing row is rewritten.

          ''')
          path.write_text(
              source.replace(marker, section + marker, 1).rstrip() + '\n',
              encoding='utf-8',
          )
          PY
      - name: Diff integrity
        run: git diff --check
      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'
      - name: Focused verification
        run: python -m pytest -q tests/test_router.py tests/test_router_identity.py
      - name: Lint
        run: ruff check .
      - name: Full suite
        run: python -m pytest -q
      - name: Commit verified production changes
        run: |
          if git diff --quiet -- src/nextgen_memory/router.py docs/router-v0.md; then
            echo 'Production patch already applied; no commit required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nextgen_memory/router.py docs/router-v0.md
          git commit -m 'fix: bind routing decision identity to full policy'
          git push origin HEAD:fix/router-decision-identity-v1-20260822
