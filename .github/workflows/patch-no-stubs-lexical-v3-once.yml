name: Apply lexical no-stubs hardening v4 once

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/no-stubs-lexical-green-20260823'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/no-stubs-lexical-green-20260823
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'

      - name: Materialize the exact lexical classifier payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          encoded = Path('.github/no-stubs-v4.payload').read_text(encoding='utf-8')
          content = gzip.decompress(base64.b64decode(encoded))
          digest = hashlib.sha256(content).hexdigest()
          expected = 'fa8c02d4c7aae08e2222610b48f684b92bb96b3fc6619ce3fe6ab3740296f51e'
          if digest != expected:
              raise SystemExit(f'unexpected scanner payload digest: {digest}')
          Path('scripts/verify_no_stubs.py').write_bytes(content)
          PY

      - name: Normalize and verify the complete lexical contract
        run: |
          ruff format scripts/verify_no_stubs.py
          ruff check scripts/verify_no_stubs.py \
            tests/test_no_stubs.py \
            tests/test_no_stubs_workflow.py \
            tests/test_no_stubs_exception_shadowing.py \
            tests/test_no_stubs_protocol_shadowing.py \
            tests/test_no_stubs_lexical_hardening.py
          python -m pytest -q \
            tests/test_no_stubs.py \
            tests/test_no_stubs_workflow.py \
            tests/test_no_stubs_exception_shadowing.py \
            tests/test_no_stubs_protocol_shadowing.py \
            tests/test_no_stubs_lexical_hardening.py

      - name: Self-scan production and run repository regression
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_no_stubs.py src > /tmp/no-stubs.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/no-stubs.json')
          raw = path.read_text(encoding='utf-8')
          report = json.loads(raw)
          if report != {"finding_count": 0, "findings": []}:
              raise SystemExit(f'unexpected production findings: {report!r}')
          canonical = json.dumps(
              report,
              ensure_ascii=False,
              sort_keys=True,
              separators=(',', ':'),
          ) + '\n'
          if raw != canonical:
              raise SystemExit('scanner report is not canonical JSON')
          PY
          ruff check .
          python -m compileall -q src scripts
          python -m pytest -q
          git diff --check 93cce924debb9ae2ff46d71b2e8fa043f4cefa0b...HEAD

      - name: Commit only the scanner replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify_no_stubs.py
          if git diff --cached --quiet; then
            echo 'scanner already matches the verified payload'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'fix: resolve no-stubs exemptions by lexical identity'
          git push origin HEAD:fix/no-stubs-lexical-green-20260823
