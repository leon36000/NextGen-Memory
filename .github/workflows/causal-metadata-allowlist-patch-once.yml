name: One-shot causal metadata allowlist patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.ref == 'fix/causal-feedback-metadata-allowlist-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/causal-feedback-metadata-allowlist-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply exact Python metadata schema
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('src/nextgen_memory/causal_feedback.py')
          source = path.read_text(encoding='utf-8')

          marker = '_ALLOWED_VERDICTS = frozenset(verdict.value for verdict in CreditVerdict)\n'
          constants = dedent('''\
          _CAUSAL_METADATA_KEYS = frozenset(
              {
                  "credit_version",
                  "trial_count",
                  "mean_full_score",
                  "mean_no_memory_score",
                  "mean_without_memory_score",
                  "mean_bundle_uplift",
                  "mean_effect",
                  "standard_error",
                  "context_set_hash",
                  "continuation_set_hash",
              }
          )
          _CAUSAL_NUMERIC_KEYS = (
              "mean_full_score",
              "mean_no_memory_score",
              "mean_without_memory_score",
              "mean_bundle_uplift",
              "mean_effect",
              "standard_error",
          )
          _CAUSAL_HASH_KEYS = ("context_set_hash", "continuation_set_hash")
          ''')
          if source.count(marker) != 1:
              raise SystemExit('unexpected verdict marker count')
          source = source.replace(marker, marker + constants, 1)

          old_line = '        "metadata": _thaw_json(_freeze_metadata(row["metadata"])),\n'
          new_line = '        "metadata": _normalize_stored_metadata(row["metadata"]),\n'
          if source.count(old_line) != 1:
              raise SystemExit('unexpected stored metadata normalization line')
          source = source.replace(old_line, new_line, 1)

          start_marker = 'def _freeze_metadata('
          end_marker = '\ndef _thaw_json('
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('unexpected metadata helper structure')
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          replacement = dedent('''\
          def _freeze_metadata(metadata: object) -> Mapping[str, Any]:
              if not isinstance(metadata, Mapping):
                  raise ValueError("metadata must be a mapping")
              if any(not isinstance(key, str) for key in metadata):
                  raise ValueError("metadata keys must be strings")
              if set(metadata) != _CAUSAL_METADATA_KEYS:
                  raise ValueError("metadata must use the exact causal aggregate schema")

              normalized = dict(metadata)
              if normalized["credit_version"] != EVIDENCE_KEY:
                  raise ValueError(f"credit_version must be {EVIDENCE_KEY}")

              trial_count = normalized["trial_count"]
              if (
                  isinstance(trial_count, bool)
                  or not isinstance(trial_count, int)
                  or trial_count <= 0
              ):
                  raise ValueError("trial_count must be a positive integer")

              for name in _CAUSAL_NUMERIC_KEYS:
                  value = normalized[name]
                  if isinstance(value, bool) or not isinstance(value, (int, float)):
                      raise ValueError(f"{name} must be a finite number")
                  try:
                      finite = isfinite(value)
                  except OverflowError:
                      finite = False
                  if not finite:
                      raise ValueError(f"{name} must be a finite number")
              if normalized["standard_error"] < 0:
                  raise ValueError("standard_error must be non-negative")

              for name in _CAUSAL_HASH_KEYS:
                  value = normalized[name]
                  if (
                      not isinstance(value, str)
                      or len(value) != 64
                      or any(character not in "0123456789abcdef" for character in value)
                  ):
                      raise ValueError(f"{name} must be lowercase SHA-256 hex")
              return MappingProxyType(normalized)


          def _normalize_stored_metadata(metadata: object) -> dict[str, Any]:
              try:
                  return _thaw_json(_freeze_metadata(metadata))
              except (OverflowError, TypeError, ValueError) as exc:
                  raise CausalFeedbackConflictError(
                      "stored causal feedback metadata violates the causal aggregate schema"
                  ) from exc

          ''')
          source = source[:start] + replacement + source[end:]
          path.write_text(source, encoding='utf-8')
          PY
      - name: Apply exact SQL metadata allowlist
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('migrations/neon/0005_causal_credit_feedback.sql')
          source = path.read_text(encoding='utf-8')

          function_start = 'CREATE OR REPLACE FUNCTION ngm.credit_metadata_is_safe(p_metadata jsonb)\n'
          function_end = '\nDO $$\nBEGIN\n  IF NOT EXISTS (\n    SELECT 1\n    FROM pg_constraint\n    WHERE conname = \'memory_feedback_causal_complete_check\''
          if source.count(function_start) != 1 or source.count(function_end) != 1:
              raise SystemExit('unexpected metadata SQL function structure')
          start = source.index(function_start)
          end = source.index(function_end, start)
          function = dedent('''\
          CREATE OR REPLACE FUNCTION ngm.credit_metadata_is_safe(p_metadata jsonb)
          RETURNS boolean
          LANGUAGE plpgsql
          IMMUTABLE
          STRICT
          AS $$
          BEGIN
            IF octet_length(p_metadata::text) > 8192
               OR jsonb_typeof(p_metadata) <> 'object' THEN
              RETURN false;
            END IF;

            IF NOT (jsonb_object_length(p_metadata) = 10) THEN
              RETURN false;
            END IF;
            IF NOT (p_metadata ?& ARRAY[
              'credit_version',
              'trial_count',
              'mean_full_score',
              'mean_no_memory_score',
              'mean_without_memory_score',
              'mean_bundle_uplift',
              'mean_effect',
              'standard_error',
              'context_set_hash',
              'continuation_set_hash'
            ]::text[]) THEN
              RETURN false;
            END IF;
            IF EXISTS (
              SELECT 1
              FROM jsonb_object_keys(p_metadata) AS keys(metadata_key)
              WHERE NOT (metadata_key = ANY (ARRAY[
                'credit_version',
                'trial_count',
                'mean_full_score',
                'mean_no_memory_score',
                'mean_without_memory_score',
                'mean_bundle_uplift',
                'mean_effect',
                'standard_error',
                'context_set_hash',
                'continuation_set_hash'
              ]::text[]))
            ) THEN
              RETURN false;
            END IF;

            IF NOT (
              jsonb_typeof(p_metadata -> 'credit_version') = 'string'
              AND p_metadata ->> 'credit_version' = 'paired_leave_one_out_v0'
            ) THEN
              RETURN false;
            END IF;
            IF NOT (
              jsonb_typeof(p_metadata -> 'trial_count') = 'number'
              AND p_metadata ->> 'trial_count' ~ '^[1-9][0-9]*$'
            ) THEN
              RETURN false;
            END IF;

            IF NOT (
              jsonb_typeof(p_metadata -> 'mean_full_score') = 'number'
              AND jsonb_typeof(p_metadata -> 'mean_no_memory_score') = 'number'
              AND jsonb_typeof(p_metadata -> 'mean_without_memory_score') = 'number'
              AND jsonb_typeof(p_metadata -> 'mean_bundle_uplift') = 'number'
              AND jsonb_typeof(p_metadata -> 'mean_effect') = 'number'
              AND jsonb_typeof(p_metadata -> 'standard_error') = 'number'
            ) THEN
              RETURN false;
            END IF;
            IF NOT ((p_metadata ->> 'standard_error')::numeric >= 0) THEN
              RETURN false;
            END IF;

            IF NOT (
              jsonb_typeof(p_metadata -> 'context_set_hash') = 'string'
              AND p_metadata ->> 'context_set_hash' ~ '^[0-9a-f]{64}$'
              AND jsonb_typeof(p_metadata -> 'continuation_set_hash') = 'string'
              AND p_metadata ->> 'continuation_set_hash' ~ '^[0-9a-f]{64}$'
            ) THEN
              RETURN false;
            END IF;

            RETURN true;
          END;
          $$;
          ''')
          source = source[:start] + function + source[end:]

          marker = '\nCREATE UNIQUE INDEX IF NOT EXISTS memory_feedback_causal_identity_uidx\n'
          if source.count(marker) != 1:
              raise SystemExit('unexpected causal identity index marker')
          constraint = dedent('''\

          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1
              FROM pg_constraint
              WHERE conname = 'memory_feedback_causal_metadata_v0_1_1_check'
                AND conrelid = 'ngm.memory_feedback'::regclass
            ) THEN
              ALTER TABLE ngm.memory_feedback
                ADD CONSTRAINT memory_feedback_causal_metadata_v0_1_1_check
                CHECK (
                  credit_evaluation_id IS NULL
                  OR ngm.credit_metadata_is_safe(metadata)
                ) NOT VALID;
            END IF;
          END;
          $$;

          ALTER TABLE ngm.memory_feedback
            VALIDATE CONSTRAINT memory_feedback_causal_metadata_v0_1_1_check;
          ''')
          source = source.replace(
              marker,
              constraint + marker,
              1,
          )

          if source.count("  '0.1.0',") != 1:
              raise SystemExit('unexpected causal schema version count')
          source = source.replace("  '0.1.0',", "  '0.1.1',", 1)
          capability = "      'safe_aggregate_metadata'\n"
          if source.count(capability) != 1:
              raise SystemExit('unexpected safe metadata capability marker')
          source = source.replace(
              capability,
              "      'safe_aggregate_metadata',\n      'exact_causal_metadata_allowlist'\n",
              1,
          )
          path.write_text(source, encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/causal-metadata-allowlist-patch-once.yml
      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'
      - name: Focused verification
        run: python -m pytest -q tests/test_causal_feedback.py tests/test_causal_feedback_migration.py
      - name: Lint
        run: ruff check .
      - name: Full suite
        run: python -m pytest -q
      - name: Diff integrity
        run: git diff --check
      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nextgen_memory/causal_feedback.py migrations/neon/0005_causal_credit_feedback.sql tests/test_causal_feedback.py tests/test_causal_feedback_migration.py
          git add -u .github/workflows
          git commit -m 'fix: enforce exact causal metadata allowlist'
          git push origin HEAD:fix/causal-feedback-metadata-allowlist-20260822
