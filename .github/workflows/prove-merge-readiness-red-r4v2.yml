name: Prove merge readiness R4-v2 RED

on:
  pull_request:

concurrency:
  group: merge-readiness-r4v2-red
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  red:
    if: github.event.pull_request.head.ref == 'bootstrap/prove-merge-readiness-red-r4v2-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/exact-sha-merge-readiness-gate-v0-r4-v2-20260831
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Freeze exact feature and RED identities
        shell: bash
        run: |
          set -euo pipefail
          feature_sha='e48227896b3dec41b43ab2d92b802714b65db1a1'
          red_sha='be70f08bf1f88e79aec0d4c52de47822e6725946'
          parent_sha='41b0b104e5a3f06c4d238060ad0fd3dd51dd4446'
          test "$(git rev-parse HEAD)" = "$feature_sha"
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git cat-file -e "$red_sha^{commit}"
          test "$(git merge-base "$parent_sha" "$feature_sha")" = "$parent_sha"
          test "$(git merge-base "$feature_sha" "$red_sha")" = "$feature_sha"
          test ! -e src/nextgen_memory/merge_readiness_gate.py
          if grep -F 'merge_readiness_gate' src/nextgen_memory/__init__.py; then
            echo 'feature unexpectedly exports absent merge-readiness module' >&2
            exit 1
          fi
          git checkout "$red_sha" -- \
            docs/exact-sha-merge-readiness-gate-v0-red.md \
            tests/test_merge_readiness_gate.py \
            tests/test_merge_readiness_gate_properties.py \
            tests/test_merge_readiness_gate_public_api.py
          mapfile -t changed < <(git diff --name-only HEAD | sort)
          expected=(
            docs/exact-sha-merge-readiness-gate-v0-red.md
            tests/test_merge_readiness_gate.py
            tests/test_merge_readiness_gate_properties.py
            tests/test_merge_readiness_gate_public_api.py
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}")

      - name: Install development toolchain
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'ruff==0.16.4'

      - name: Prove tests are clean and each independently reaches only module absence
        shell: bash
        run: |
          set -euo pipefail
          files=(
            tests/test_merge_readiness_gate.py
            tests/test_merge_readiness_gate_properties.py
            tests/test_merge_readiness_gate_public_api.py
          )
          ruff check "${files[@]}"
          ruff format --check "${files[@]}"
          python -m py_compile "${files[@]}"
          for file in "${files[@]}"; do
            output="/tmp/$(basename "$file" .py)-red.txt"
            set +e
            PYTHONPATH="$PWD/src" python -m pytest --collect-only -q "$file" >"$output" 2>&1
            rc=$?
            set -e
            test "$rc" -ne 0
            FILE="$file" OUTPUT="$output" python - <<'PY'
          from __future__ import annotations

          import os
          import re
          from pathlib import Path

          text = Path(os.environ['OUTPUT']).read_text(encoding='utf-8', errors='replace')
          modules = set(re.findall(r"ModuleNotFoundError: No module named '([^']+)'", text))
          expected = {'nextgen_memory.merge_readiness_gate'}
          if modules != expected:
              raise SystemExit(
                  f"{os.environ['FILE']}: unexpected missing modules {sorted(modules)!r}"
              )
          for marker in (
              'SyntaxError', 'IndentationError', 'NameError',
              'ERROR at setup', 'fixture ',
          ):
              if marker in text:
                  raise SystemExit(
                      f"{os.environ['FILE']}: unintended RED marker {marker}"
                  )
          PY
          done
          git diff --check

      - name: Publish RED proof and close transport
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELF_PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<'EOF'
          ## Merge Readiness R4-v2 RED independently reproduced

          - exact parent: `41b0b104e5a3f06c4d238060ad0fd3dd51dd4446`;
          - design feature: `e48227896b3dec41b43ab2d92b802714b65db1a1`;
          - immutable RED: `be70f08bf1f88e79aec0d4c52de47822e6725946`;
          - exact RED surface: four paths;
          - Ruff 0.16.4, formatting and syntax: clean;
          - each test file independently fails collection only because `nextgen_memory.merge_readiness_gate` is absent;
          - implementation and exports: absent;
          - tests weakened: false;
          - merge allowed: false.

          This establishes the RED boundary for the next single-writer implementation step.
          EOF
          )
          gh api "repos/$REPO/issues/166/comments" --raw-field body="$body" >/dev/null
          gh api --method PATCH "repos/$REPO/pulls/$SELF_PR" -f state=closed >/dev/null
