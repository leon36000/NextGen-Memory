name: Qualify memory policy training readiness v0 producer

on:
  push:
    branches:
      - bootstrap/verify-memory-policy-training-readiness-v0-producer-20260831
  workflow_dispatch:

concurrency:
  group: memory-policy-training-readiness-v0-producer-20260831
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/memory-policy-training-readiness-v0-20260831
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Freeze exact base, feature, RED, and nine-path surface
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git show \
            origin/evidence/memory-policy-dataset-v0-postmerge-checkpoint-20260831:evidence/memory-policy-dataset-v0-postmerge-checkpoint-20260831.json \
            > /tmp/base-checkpoint.json
          jq -e '.checkpoint_key == "m-head:memory-policy-dataset-v0:postmerge-green:20260831"' /tmp/base-checkpoint.json >/dev/null
          jq -e '.status == "dataset_postmerge_green_no_model_training"' /tmp/base-checkpoint.json >/dev/null
          jq -e '.model_state.training_authorized == false and .model_state.training_performed == false' /tmp/base-checkpoint.json >/dev/null
          base_sha=$(jq -r '.merge.main_merge_sha' /tmp/base-checkpoint.json)
          test "$(git rev-parse origin/main)" = "$base_sha"
          feature_sha=$(git rev-parse HEAD)
          feature_tree=$(git rev-parse HEAD^{tree})
          test "$(git rev-parse origin/feat/memory-policy-training-readiness-v0-20260831)" = "$feature_sha"
          test "$(git merge-base "$base_sha" "$feature_sha")" = "$base_sha"
          red_branch='tdd/memory-policy-training-readiness-v0-red-20260831'
          red_sha=$(git rev-parse "origin/$red_branch")
          test "$(git merge-base "$base_sha" "$red_sha")" = "$base_sha"
          mapfile -t changed < <(git diff --name-only "$base_sha"...HEAD | sort)
          expected=(
            docs/memory-policy-training-readiness-v0-red.md
            docs/memory-policy-training-readiness-v0.md
            docs/superpowers/plans/2026-08-31-memory-policy-training-readiness-v0.md
            docs/superpowers/specs/2026-08-31-memory-policy-training-readiness-v0-design.md
            src/nextgen_memory/__init__.py
            src/nextgen_memory/memory_policy_training_readiness.py
            tests/test_memory_policy_training_readiness.py
            tests/test_memory_policy_training_readiness_properties.py
            tests/test_memory_policy_training_readiness_public_api.py
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}")
          test -z "$(git diff --name-only "$base_sha"...HEAD -- '.github/workflows/**' 'migrations/**' pyproject.toml 'src/nextgen_memory/corrective_retrieval_*')"
          git diff --check "$base_sha"...HEAD
          for path in \
            docs/memory-policy-training-readiness-v0-red.md \
            tests/test_memory_policy_training_readiness.py \
            tests/test_memory_policy_training_readiness_properties.py \
            tests/test_memory_policy_training_readiness_public_api.py; do
            cmp <(git show "$red_sha:$path") "$path"
          done
          grep -F "$red_branch" docs/superpowers/plans/2026-08-31-memory-policy-training-readiness-v0.md >/dev/null
          grep -F "$red_sha" docs/superpowers/plans/2026-08-31-memory-policy-training-readiness-v0.md >/dev/null
          grep -F "$red_branch" docs/superpowers/specs/2026-08-31-memory-policy-training-readiness-v0-design.md >/dev/null
          grep -F "$red_sha" docs/superpowers/specs/2026-08-31-memory-policy-training-readiness-v0-design.md >/dev/null
          test -z "$(git status --porcelain)"
          printf 'base_sha=%s\nfeature_sha=%s\nfeature_tree=%s\nred_branch=%s\nred_sha=%s\nshort=%s\n' \
            "$base_sha" "$feature_sha" "$feature_tree" "$red_branch" "$red_sha" "${feature_sha:0:8}" \
            | tee -a "$GITHUB_OUTPUT"

      - name: Install exact development toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install 'ruff==0.16.4'
          ruff --version

      - name: Run static, focused, generated-10000, and complete suites
        shell: bash
        run: |
          set -euo pipefail
          ruff check .
          ruff format --check .
          python -m compileall -q src scripts
          python -m pytest -q \
            tests/test_memory_policy_training_readiness.py \
            tests/test_memory_policy_training_readiness_properties.py \
            tests/test_memory_policy_training_readiness_public_api.py \
            | tee /tmp/focused.txt
          python -m pytest -q tests/test_memory_policy_training_readiness_properties.py \
            | tee /tmp/generated-10000.txt
          grep -F 'range(10_000)' tests/test_memory_policy_training_readiness_properties.py >/dev/null
          python -m pytest -q | tee /tmp/full.txt
          test -z "$(git status --porcelain)"

      - name: Run strict dependency, privacy, side-effect, and stub audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import ast,json,sys
          from pathlib import Path
          path=Path('src/nextgen_memory/memory_policy_training_readiness.py')
          source=path.read_text(encoding='utf-8')
          tree=ast.parse(source,filename=str(path))
          allowed=set(sys.stdlib_module_names)|{'__future__'}
          findings=[]
          for node in ast.walk(tree):
              if isinstance(node,ast.Import):
                  for alias in node.names:
                      root=alias.name.split('.',1)[0]
                      if root not in allowed:
                          findings.append(f'{node.lineno}:nonstdlib:{alias.name}')
              elif isinstance(node,ast.ImportFrom):
                  if node.level == 0:
                      root=(node.module or '').split('.',1)[0]
                      if root not in allowed:
                          findings.append(f'{node.lineno}:nonstdlib:{node.module}')
                  elif node.level != 1 or node.module != 'memory_policy_dataset':
                      findings.append(f'{node.lineno}:unexpected-local:{node.module}')
              elif isinstance(node,ast.Pass):
                  findings.append(f'{node.lineno}:pass')
              elif isinstance(node,ast.Expr) and isinstance(node.value,ast.Constant) and node.value.value is Ellipsis:
                  findings.append(f'{node.lineno}:ellipsis')
              elif isinstance(node,ast.Raise):
                  target=node.exc.func if isinstance(node.exc,ast.Call) else node.exc
                  if isinstance(target,ast.Name) and target.id=='NotImplementedError':
                      findings.append(f'{node.lineno}:NotImplementedError')
              elif isinstance(node,ast.Call):
                  if isinstance(node.func,ast.Name) and node.func.id in {'open','eval','exec','compile','input'}:
                      findings.append(f'{node.lineno}:call:{node.func.id}')
                  elif isinstance(node.func,ast.Attribute) and node.func.attr in {'connect','request','urlopen','system','popen','run','Popen','sleep','time','uuid1','uuid4','write_text','write_bytes','mkdir','unlink','rename','getenv'}:
                      findings.append(f'{node.lineno}:call:{node.func.attr}')
          lowered=source.lower()
          for marker in ('raw_prompt','raw_query','response_text','memory_body','credential','password','reviewer_email','reviewer_name','postgresql://','mongodb://','http://','https://','torch','transformers','optimizer','trainer','model.fit','merge_pull_request','activate_policy','write_feedback','# todo','# fixme'):
              if marker in lowered:
                  findings.append(f'text:{marker}')
          for test_path in [Path('tests/test_memory_policy_training_readiness.py'),Path('tests/test_memory_policy_training_readiness_properties.py'),Path('tests/test_memory_policy_training_readiness_public_api.py')]:
              text=test_path.read_text(encoding='utf-8').lower()
              for marker in ('pytest.mark.skip','pytest.mark.xfail','# noqa','notimplementederror'):
                  if marker in text:
                      findings.append(f'{test_path}:text:{marker}')
          if findings:
              raise SystemExit('\n'.join(findings))
          Path('/tmp/audit.json').write_text(json.dumps({'audit_findings':0},sort_keys=True)+'\n',encoding='utf-8')
          print('audit_findings=0')
          PY

      - name: Generate deterministic readiness semantic matrix and exact retries
        env:
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          FEATURE_SHA: ${{ steps.identity.outputs.feature_sha }}
          FEATURE_TREE: ${{ steps.identity.outputs.feature_tree }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/semantic.py <<'PY'
          from __future__ import annotations
          import hashlib,json,os,sys
          from dataclasses import replace
          from pathlib import Path
          from uuid import UUID
          from nextgen_memory import (
              AdvisoryMemoryPolicyTrainingReadinessGate,
              MemoryPolicyDatasetReadinessEvidence,
              MemoryPolicyDatasetSplitStatistics,
              MemoryPolicySplit,
              MemoryPolicyTrainingReadinessConfig,
              MemoryPolicyTrainingReadinessReason,
              MemoryPolicyTrainingReadinessRequest,
              MemoryPolicyTrainingReadinessState,
          )
          def digest(v:str)->str: return hashlib.sha256(v.encode()).hexdigest()
          def split(kind,traj,examples,trainable,b,n,h,a,lo,hi):
              return MemoryPolicyDatasetSplitStatistics(split=kind,trajectory_count=traj,example_count=examples,trainable_example_count=trainable,beneficial_count=b,neutral_count=n,harmful_count=h,abstain_count=a,minimum_event_ordinal=lo,maximum_event_ordinal=hi)
          splits={
              split(MemoryPolicySplit.TRAIN,600,6000,4800,1800,1600,1400,1200,0,999),
              split(MemoryPolicySplit.VALIDATION,200,2000,1600,600,500,500,400,1000,1499),
              split(MemoryPolicySplit.TEST,200,2000,1600,600,500,500,400,1500,1999),
          }
          evidence=MemoryPolicyDatasetReadinessEvidence(
              snapshot_id=UUID(int=1),snapshot_content_hash=digest('snapshot'),dataset_artifact_sha256=digest('artifact'),dataset_source_sha=os.environ['BASE_SHA'],dataset_schema_version='memory-policy-dataset-v0',snapshot_trajectory_count=1000,snapshot_example_count=10000,snapshot_trainable_example_count=8000,snapshot_abstention_count=2000,split_statistics=splits,real_operational_trajectory_count=800,controlled_replay_trajectory_count=200,synthetic_fixture_trajectory_count=0,real_operational_trainable_example_count=6800,controlled_replay_trainable_example_count=1200,synthetic_fixture_trainable_example_count=0,direct_causal_example_count=6400,matched_replay_example_count=1200,interaction_allocation_example_count=400,observational_example_count=800,absent_credit_example_count=1200,effective_sample_size=800.0,duplicate_feature_vector_count=100,distinct_policy_version_count=4,distinct_expert_key_count=32,train_validation_trajectory_overlap_count=0,train_test_trajectory_overlap_count=0,validation_test_trajectory_overlap_count=0,evidence_age_seconds=100.0,schema_validation_passed=True,artifact_integrity_passed=True,privacy_audit_passed=True,raw_content_scan_passed=True,provenance_validation_passed=True,safety_violation=False)
          config=MemoryPolicyTrainingReadinessConfig(minimum_real_operational_trajectories=500,minimum_real_operational_trainable_share=0.8,minimum_trainable_examples=5000,minimum_train_trajectories=500,minimum_validation_trajectories=100,minimum_test_trajectories=100,minimum_effective_sample_size=500.0,minimum_chronological_span_ordinals=1500,minimum_distinct_policy_versions=2,minimum_distinct_expert_keys=10,minimum_beneficial_examples=500,minimum_neutral_examples=500,minimum_harmful_examples=500,minimum_direct_causal_trainable_share=0.7,maximum_abstention_rate=0.25,maximum_dominant_label_share=0.5,maximum_controlled_replay_trainable_share=0.2,maximum_duplicate_feature_rate=0.02,maximum_evidence_age_seconds=3600.0)
          def request(value): return MemoryPolicyTrainingReadinessRequest(snapshot_id=evidence.snapshot_id,snapshot_content_hash=evidence.snapshot_content_hash,dataset_source_sha=evidence.dataset_source_sha,dataset_artifact_sha256=evidence.dataset_artifact_sha256,evidence=value)
          gate=AdvisoryMemoryPolicyTrainingReadinessGate()
          ready=gate.evaluate(request(evidence),config)
          if ready.state is not MemoryPolicyTrainingReadinessState.READY or ready.reasons != (MemoryPolicyTrainingReadinessReason.ALL_GATES_PASSED,): raise SystemExit('ready differs')
          hold_evidence=replace(evidence,real_operational_trajectory_count=499,controlled_replay_trajectory_count=501)
          hold=gate.evaluate(request(hold_evidence),config)
          if hold.state is not MemoryPolicyTrainingReadinessState.HOLD or hold.reasons != (MemoryPolicyTrainingReadinessReason.INSUFFICIENT_REAL_TRAJECTORIES,): raise SystemExit(f'hold differs: {hold.reasons}')
          reject_evidence=replace(evidence,safety_violation=True)
          reject_config=replace(config,minimum_real_operational_trajectories=1001,minimum_trainable_examples=9000)
          reject=gate.evaluate(request(reject_evidence),reject_config)
          if reject.state is not MemoryPolicyTrainingReadinessState.REJECT or reject.reasons != (MemoryPolicyTrainingReadinessReason.SAFETY_VIOLATION,): raise SystemExit(f'reject precedence differs: {reject.reasons}')
          for record in (ready,hold,reject):
              if record.model_training_authorized or not record.advisory_only: raise SystemExit('authorization boundary differs')
          expected=ready.render_json()
          for _ in range(1000):
              if gate.evaluate(request(evidence),config).render_json()!=expected: raise SystemExit('retry differs')
          payload={'schema':'m-head-memory-policy-training-readiness-producer-semantic-v1','base_sha':os.environ['BASE_SHA'],'feature_sha':os.environ['FEATURE_SHA'],'feature_tree':os.environ['FEATURE_TREE'],'ready':json.loads(ready.render_json()),'hold':json.loads(hold.render_json()),'reject':json.loads(reject.render_json()),'exact_retry_count':1000,'model_training_authorized':False}
          raw=json.dumps(payload,ensure_ascii=False,allow_nan=False,sort_keys=True,separators=(',',':'))+'\n'
          for marker in ('raw_prompt','raw_query','response_text','memory_body','credential','password','reviewer_email','reviewer_name'):
              if marker in raw.lower(): raise SystemExit(f'forbidden marker {marker}')
          Path(sys.argv[1]).write_text(raw,encoding='utf-8')
          PY
          PYTHONHASHSEED=1 python /tmp/semantic.py /tmp/semantic.json
          PYTHONHASHSEED=37 python /tmp/semantic.py /tmp/semantic-37.json
          PYTHONHASHSEED=999 python /tmp/semantic.py /tmp/semantic-999.json
          cmp /tmp/semantic.json /tmp/semantic-37.json
          cmp /tmp/semantic.json /tmp/semantic-999.json

      - name: Build and import isolated product wheel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wheelhouse /tmp/wheel-venv
          mkdir -p /tmp/wheelhouse
          python -m pip wheel --no-deps . -w /tmp/wheelhouse
          wheel=$(find /tmp/wheelhouse -maxdepth 1 -type f -name '*.whl' -print -quit)
          test -n "$wheel"
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install --no-deps "$wheel"
          /tmp/wheel-venv/bin/python -m pip check
          /tmp/wheel-venv/bin/python - <<'PY'
          import nextgen_memory
          from nextgen_memory import AdvisoryMemoryPolicyTrainingReadinessGate, MemoryPolicyTrainingReadinessState
          assert AdvisoryMemoryPolicyTrainingReadinessGate is not None
          assert MemoryPolicyTrainingReadinessState.READY.value == 'ready'
          assert len(nextgen_memory.__all__) == len(set(nextgen_memory.__all__))
          PY
          cp "$wheel" /tmp/product.whl
          sha256sum "$wheel" | awk '{print $1}' > /tmp/wheel.sha256

      - name: Publish immutable candidate, draft PR, and producer evidence
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          FEATURE_SHA: ${{ steps.identity.outputs.feature_sha }}
          FEATURE_TREE: ${{ steps.identity.outputs.feature_tree }}
          RED_BRANCH: ${{ steps.identity.outputs.red_branch }}
          RED_SHA: ${{ steps.identity.outputs.red_sha }}
          SHORT: ${{ steps.identity.outputs.short }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_branch='candidate/memory-policy-training-readiness-v0-20260831'
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          if git ls-remote --exit-code --heads origin "$candidate_branch"; then
            test "$(git rev-parse "origin/$candidate_branch")" = "$FEATURE_SHA"
          else
            git push origin "$FEATURE_SHA:refs/heads/$candidate_branch"
          fi
          owner=${GITHUB_REPOSITORY%%/*}
          pulls=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f head="$owner:$candidate_branch" -f per_page=100)
          count=$(printf '%s' "$pulls" | jq 'length')
          if [ "$count" -eq 0 ]; then
            body=$(cat <<EOF
          ## Memory Policy Training Readiness Gate v0

          Pure fail-closed advisory gate for real-data readiness before any learned memory reranker experiment. It rejects identity, integrity, privacy, synthetic-trainable, leakage, chronology, and count failures; holds insufficient real volume, diversity, balance, freshness, or causal coverage; and returns `ready` only when every gate passes.

          Exact SHA \`$FEATURE_SHA\` passed Ruff 0.16.4, focused/full suites, 10,000 generated evaluations, every reject/hold reason, 1,000 exact retries, hash-seed comparison, audit zero, and isolated wheel import.

          `model_training_authorized` remains always false. No training, persistence, database, feedback, activation, deployment, migration, or release surface is included. This PR remains draft pending an independent Python 3.12/3.13 exact-SHA matrix and GPT-5.6 Pro technical review.
          EOF
            )
            printf '%s\n' "$body" | sed 's/^          //' > /tmp/pr-body.md
            gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" -f title='feat: gate learned memory training on real-data readiness v0' -f head="$candidate_branch" -f base='main' -F draft=true --raw-field body="$(cat /tmp/pr-body.md)" > /tmp/pr.json
          elif [ "$count" -eq 1 ]; then
            printf '%s' "$pulls" | jq '.[0]' > /tmp/pr.json
          else
            echo 'multiple candidate PRs exist' >&2
            exit 1
          fi
          product_pr=$(jq -r '.number' /tmp/pr.json)
          test "$(jq -r '.head.sha' /tmp/pr.json)" = "$FEATURE_SHA"
          test "$(jq -r '.base.sha' /tmp/pr.json)" = "$BASE_SHA"
          test "$(jq -r '.draft' /tmp/pr.json)" = true
          focused_count=$(grep -oE '[0-9]+ passed' /tmp/focused.txt | tail -1 | cut -d' ' -f1)
          generated_count=$(grep -oE '[0-9]+ passed' /tmp/generated-10000.txt | tail -1 | cut -d' ' -f1)
          full_count=$(grep -oE '[0-9]+ passed' /tmp/full.txt | tail -1 | cut -d' ' -f1)
          test -n "$focused_count"; test -n "$generated_count"; test -n "$full_count"
          semantic_sha=$(sha256sum /tmp/semantic.json | awk '{print $1}')
          wheel_sha=$(cat /tmp/wheel.sha256)
          jq -n --arg schema 'm-head-memory-policy-training-readiness-producer-v1' --arg status 'producer_green_verification_pending_unmerged' --arg repository '${{ github.repository }}' --arg base_sha "$BASE_SHA" --arg feature_sha "$FEATURE_SHA" --arg feature_tree "$FEATURE_TREE" --arg candidate_branch "$candidate_branch" --arg red_branch "$RED_BRANCH" --arg red_sha "$RED_SHA" --argjson pull_request "$product_pr" --argjson focused_test_count "$focused_count" --argjson generated_test_count "$generated_count" --argjson full_test_count "$full_count" --arg semantic_sha256 "$semantic_sha" --arg wheel_sha256 "$wheel_sha" --argjson run_id "$GITHUB_RUN_ID" '{schema:$schema,status:$status,repository:$repository,base:{branch:"main",sha:$base_sha},candidate:{branch:$candidate_branch,sha:$feature_sha,tree_sha:$feature_tree,pull_request:$pull_request,exact_path_count:9},tdd:{branch:$red_branch,sha:$red_sha,source_preserved:true,tests_weakened:false},verification:{run_id:$run_id,ruff_version:"0.16.4",ruff_green:true,format_green:true,compileall_green:true,focused_test_count:$focused_test_count,generated_10000_test_count:$generated_test_count,full_test_count:$full_test_count,audit_findings:0,semantic_sha256:$semantic_sha256,hash_seed_invariant:true,exact_retry_count:1000,isolated_wheel_import:true,pip_check:true,wheel_sha256:$wheel_sha256},contract:{all_reject_reasons:true,all_hold_reasons:true,ready_state:true,hard_reject_precedence:true,model_training_always_unauthorized:true,raw_content_surface:false,model_training_surface:false,persistence_surface:false,feedback_surface:false,activation_surface:false},review:{required_runtime:"GPT-5.6 Pro",verdict:"pending",merge_allowed:false,model_training_authorized:false},safety:{merged:false,model_trained:false,production_database_contacted:false,production_migration_applied:false,feedback_written:false,policy_activated:false,release_published:false,stubs_added:false},next_action:"Run an independent Python 3.12/3.13 exact-SHA matrix, compare semantic bytes, rehash artifacts, and perform a GPT-5.6 Pro technical review before merge."}' > /tmp/producer.json
          evidence_branch="evidence/memory-policy-training-readiness-v0-${SHORT}-producer-20260831"
          evidence_path="evidence/memory-policy-training-readiness-v0-${SHORT}-producer-20260831.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin "$evidence_branch"; then
            git switch --detach "origin/$evidence_branch"
            cmp /tmp/producer.json "$evidence_path"
          else
            git switch -C "$evidence_branch" "$FEATURE_SHA"
            mkdir -p evidence
            cp /tmp/producer.json "$evidence_path"
            git add "$evidence_path"
            git diff --cached --check
            git commit -m 'evidence: qualify memory policy training readiness v0 producer'
            git push origin HEAD:"refs/heads/$evidence_branch"
          fi
          evidence_commit=$(git rev-parse HEAD)
          body=$(cat <<EOF
          ## Memory Policy Training Readiness Gate v0 producer GREEN

          - candidate SHA: \`$FEATURE_SHA\`;
          - exact surface: nine paths;
          - focused tests: \`$focused_count\`;
          - property tests including 10,000 evaluations: \`$generated_count\`;
          - complete tests: \`$full_count\`;
          - audit findings: \`0\`;
          - exact retries: \`1,000\`;
          - isolated wheel and pip check: green;
          - immutable producer evidence: \`$evidence_branch\` at \`$evidence_commit\`;
          - model training authorized/performed: \`false\`;
          - merge allowed: \`false\`.
          EOF
          )
          gh api "repos/$GITHUB_REPOSITORY/issues/23/comments" --raw-field body="$body" >/dev/null
          echo "candidate_branch=$candidate_branch" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$FEATURE_SHA" >> "$GITHUB_OUTPUT"
          echo "product_pr=$product_pr" >> "$GITHUB_OUTPUT"
          echo "evidence_branch=$evidence_branch" >> "$GITHUB_OUTPUT"
          echo "evidence_commit=$evidence_commit" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: memory-policy-training-readiness-v0-producer
          path: |
            /tmp/producer.json
            /tmp/semantic.json
            /tmp/audit.json
            /tmp/focused.txt
            /tmp/generated-10000.txt
            /tmp/full.txt
            /tmp/product.whl
            /tmp/pr.json
          if-no-files-found: error
          retention-days: 21
