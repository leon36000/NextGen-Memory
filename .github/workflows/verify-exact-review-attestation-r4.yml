name: Verify exact review attestation registry R4 exact SHA

on:
  pull_request:

concurrency:
  group: exact-review-attestation-r4-exact
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: read

jobs:
  resolve:
    if: github.event.pull_request.head.ref == 'bootstrap/verify-exact-review-attestation-r4-20260831'
    runs-on: ubuntu-24.04
    outputs:
      candidate_sha: ${{ steps.identity.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/exact-sha-review-attestation-registry-v0-r4-20260831
          fetch-depth: 0

      - name: Freeze exact candidate identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha='41b0b104e5a3f06c4d238060ad0fd3dd51dd4446'
          parent_sha='f4d9388c14dd1f746f904b3724767f73f82786fd'
          base_sha='f4f3aca9759b5b7a60691017c2211152c011ea92'
          test "$(git rev-parse HEAD)" = "$candidate_sha"
          test "$(git merge-base HEAD "$parent_sha")" = "$parent_sha"
          test "$(git merge-base HEAD "$base_sha")" = "$base_sha"
          git diff --check "$base_sha"...HEAD
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/verify-exact-review-attestation-r4-20260831
          path: controller
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          path: product
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: product/pyproject.toml

      - name: Verify exact R4 on Python ${{ matrix.python-version }}
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/exact-review-r4-${{ matrix.python-version }}
        run: |
          bash controller/.github/controllers/verify_exact_review_attestation_r4.sh \
            "$GITHUB_WORKSPACE/product" \
            "$EVIDENCE_ROOT"

      - uses: actions/upload-artifact@v4
        with:
          name: exact-review-attestation-r4-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/exact-review-r4-${{ matrix.python-version }}
          if-no-files-found: error
          retention-days: 7

  compare-and-publish:
    needs: [resolve, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/verify-exact-review-attestation-r4-20260831
          path: controller
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          path: product
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: exact-review-attestation-r4-python-*
          path: ${{ runner.temp }}/exact-review-r4-matrix

      - name: Compare Python evidence and publish immutable R4 proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash controller/.github/controllers/publish_exact_review_attestation_r4.sh \
            "$GITHUB_WORKSPACE/product" \
            '${{ runner.temp }}/exact-review-r4-matrix'

      - uses: actions/upload-artifact@v4
        with:
          name: exact-review-attestation-r4-cross-python-summary
          path: ${{ runner.temp }}/exact-review-r4-matrix/cross-python-summary.json
          if-no-files-found: error
          retention-days: 7
