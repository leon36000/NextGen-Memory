name: Rehearse release tooling v3

on:
  pull_request:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  rehearse:
    if: github.event.pull_request.head.ref == 'bootstrap/rehearse-release-tooling-v3-20260823'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: release_tooling_v3
          POSTGRES_PASSWORD: synthetic-release-tooling-password
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d release_tooling_v3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eada91750b5d577ec452c7f8d1fb72126abb6a54
          fetch-depth: 0
      - name: Resolve immutable tooling candidates and prove clean target
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          encode() { python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$1"; }
          branch_sha() { gh api "repos/$REPO/branches/$(encode "$1")" --jq '.commit.sha'; }

          manifest_sha=$(branch_sha ci/neon-migration-manifest-v1-20260822)
          runner_sha=$(branch_sha candidate/neon-migration-runner-v1-20260823)
          wheel_sha=$(branch_sha candidate/release-wheel-integrity-v1-20260823)
          test "$manifest_sha" = 97a537cdba2e81385088b57bb02987fedb0aff14
          for sha in "$manifest_sha" "$runner_sha" "$wheel_sha"; do
            test -n "$sha"
          done
          if git ls-remote --exit-code --heads origin integration/rehearse-release-tooling-v3-20260823; then
            echo 'stable release-tooling rehearsal branch already exists; refusing overwrite' >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = eada91750b5d577ec452c7f8d1fb72126abb6a54
          echo "manifest_sha=$manifest_sha" >> "$GITHUB_OUTPUT"
          echo "runner_sha=$runner_sha" >> "$GITHUB_OUTPUT"
          echo "wheel_sha=$wheel_sha" >> "$GITHUB_OUTPUT"
          printf 'manifest=%s\nrunner=%s\nwheel=%s\n' "$manifest_sha" "$runner_sha" "$wheel_sha"
      - name: Fetch and merge exact candidates in dependency order
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          candidates=(
            "${{ steps.resolve.outputs.manifest_sha }}"
            "${{ steps.resolve.outputs.runner_sha }}"
            "${{ steps.resolve.outputs.wheel_sha }}"
          )
          for sha in "${candidates[@]}"; do
            git cat-file -e "${sha}^{commit}"
            git merge --no-ff --no-edit "$sha"
          done
          for sha in "${candidates[@]}"; do
            git merge-base --is-ancestor "$sha" HEAD
          done
          test "$(git rev-list --count --merges eada91750b5d577ec452c7f8d1fb72126abb6a54..HEAD)" -eq 3
          test -z "$(git status --porcelain)"
      - name: Prove release-tooling-only integrated surface
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only eada91750b5d577ec452c7f8d1fb72126abb6a54...HEAD | sort)
          required=(
            migrations/neon/manifest.json
            scripts/neon_migration_manifest.py
            scripts/neon_migration_runner.py
            scripts/verify_release_wheel.py
            tests/test_neon_migration_manifest.py
            tests/test_neon_migration_runner.py
            tests/test_release_wheel_integrity.py
            pyproject.toml
          )
          for path in "${required[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx "$path" >/dev/null
          done
          if printf '%s\n' "${changed[@]}" | grep -Eq '^(src/|src/nextgen_memory/corrective_retrieval_)'; then
            echo 'tooling rehearsal modifies runtime source' >&2
            exit 1
          fi
          test -z "$(git diff --name-only eada91750b5d577ec452c7f8d1fb72126abb6a54...HEAD -- 'migrations/neon/*.sql')"
          git diff --check eada91750b5d577ec452c7f8d1fb72126abb6a54...HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install PostgreSQL 18 client and fixed Python build toolchain
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          sudo ln -sf /usr/lib/postgresql/18/bin/psql /usr/bin/psql
          sudo ln -sf /usr/lib/postgresql/18/bin/pg_dump /usr/bin/pg_dump
          psql --version | grep -E '^psql \(PostgreSQL\) 18\.'
          pg_dump --version | grep -E '^pg_dump \(PostgreSQL\) 18\.'
          python -m pip install \
            'pip==25.2' \
            'setuptools==80.9.0' \
            'wheel==0.45.1' \
            'build==1.3.0'
          python -m pip install -e '.[dev]'
      - name: Complete integrated Python and tooling contracts
        env:
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
          PYTHONHASHSEED: '0'
          SOURCE_DATE_EPOCH: '315532800'
          TZ: UTC
        shell: bash
        run: |
          set -euo pipefail
          ruff check .
          python -m compileall -q src scripts
          python -m pytest -q \
            tests/test_neon_migration_manifest.py \
            tests/test_neon_migration_runner.py \
            tests/test_release_wheel_integrity.py
          python -m pytest -q
          python scripts/neon_migration_manifest.py > /tmp/manifest-plan.json
          python scripts/verify_release_wheel.py > /tmp/wheel-verifier.json
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('/tmp/manifest-plan.json').read_text())
          wheel = json.loads(Path('/tmp/wheel-verifier.json').read_text())
          if len(manifest.get('plan_hash','')) != 64:
              raise SystemExit('invalid manifest plan hash')
          for key in ('reproducible','byte_reproducible','semantic_reproducible'):
              if wheel.get(key) is not True:
                  raise SystemExit(f'wheel verifier lacks {key}')
          PY
      - name: Run two complete two-pass PostgreSQL 18 rehearsals
        env:
          PGDATABASE: release_tooling_v3
          PGHOST: 127.0.0.1
          PGPASSWORD: synthetic-release-tooling-password
          PGPORT: '5432'
          PGUSER: postgres
        shell: bash
        run: |
          set -euo pipefail
          python scripts/neon_migration_runner.py > /tmp/runner-a.json
          python scripts/neon_migration_runner.py > /tmp/runner-b.json
          cmp /tmp/runner-a.json /tmp/runner-b.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/runner-a.json').read_text())
          if report.get('stable') is not True or report.get('pass_count') != 2:
              raise SystemExit('migration runner did not prove two-pass stability')
          if report.get('pass_one') != report.get('pass_two'):
              raise SystemExit('semantic state changed between passes')
          if not report['pass_one'].get('table_counts'):
              raise SystemExit('runner table-count state is empty')
          PY
          if grep -Eqi \
            'synthetic-release-tooling-password|CREATE |ALTER |DROP |SELECT |postgresql://|password|secret|token|dsn|connection' \
            /tmp/runner-a.json /tmp/manifest-plan.json /tmp/wheel-verifier.json; then
            echo 'safe tooling report leaked SQL or connection material' >&2
            exit 1
          fi
      - name: Build and reinstall canonical wheel
        env:
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
          PYTHONHASHSEED: '0'
          SOURCE_DATE_EPOCH: '315532800'
          TZ: UTC
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist build *.egg-info src/*.egg-info /tmp/release-tooling-wheel-venv
          python -m build --wheel --no-isolation --outdir dist
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          python -m venv /tmp/release-tooling-wheel-venv
          /tmp/release-tooling-wheel-venv/bin/python -m pip install --no-deps dist/*.whl
          /tmp/release-tooling-wheel-venv/bin/python - <<'PY'
          import nextgen_memory
          required = (
              'ActionMemoryUsageEvent',
              'CausalFeedbackWriter',
              'CreditTargetReader',
              'DeterministicMemoryRouter',
              'IntegratedContextCompiler',
              'MongoResearchRetriever',
              'PrecedenceShapleyEstimator',
              'RetrievalEventWriter',
          )
          missing = [name for name in required if not hasattr(nextgen_memory, name)]
          if missing:
              raise SystemExit(f'missing root exports: {missing}')
          PY
          sha256sum dist/*.whl > /tmp/wheel.sha256
          cat /tmp/wheel.sha256
      - name: Publish immutable rehearsal only after all checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          final_sha=$(git rev-parse HEAD)
          branch='integration/rehearse-release-tooling-v3-20260823'
          git push origin HEAD:"refs/heads/$branch"
          body=$(cat <<EOF
          ## Release tooling integration v3 published

          - immutable branch: \`$branch\`
          - exact SHA: \`$final_sha\`
          - base integration: \`eada91750b5d577ec452c7f8d1fb72126abb6a54\`
          - manifest, runner and release-wheel candidates merged conflict-free in dependency order
          - runtime/migration SQL changes: none
          - Ruff, compileall, focused/full tests: passed
          - PostgreSQL 18 two-pass runner: two byte-identical complete rehearsals
          - wheel verifier: semantic and byte reproducibility true
          - wheel build/install/root API: passed
          - merge: none
          - Sol verdict: pending
          EOF
          )
          gh api "repos/$REPO/issues/23/comments" -f body="$body"
