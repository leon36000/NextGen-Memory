name: Rebuild bounded inherited fixtures v2

on:
  push:
    branches: [bootstrap/rebuild-bounded-inherited-fixtures-v2]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bounded-inherited-reranker-v0
          fetch-depth: 0

      - name: Verify guarded feature head
        run: test "$(git rev-parse HEAD)" = "aa683e2135df6e4e0250b5c7fd8e6516ddbbb458"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development tools
        run: python -m pip install -e '.[dev]'

      - name: Rebuild fixtures from actual dataclass contracts
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import textwrap
          from pathlib import Path

          def replace_function(path: Path, name: str, source: str) -> None:
              text = path.read_text(encoding="utf-8")
              module = ast.parse(text)
              matches = [
                  node
                  for node in module.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                  and node.name == name
              ]
              if len(matches) != 1 or matches[0].end_lineno is None:
                  raise SystemExit(f"{path}: cannot uniquely replace {name}")
              node = matches[0]
              lines = text.splitlines()
              replacement = textwrap.dedent(source).strip("\n").splitlines()
              lines[node.lineno - 1 : node.end_lineno] = [*replacement, ""]
              path.write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8")

          def remove_line(path: Path, line: str) -> None:
              text = path.read_text(encoding="utf-8")
              exact = f"{line}\n"
              if text.count(exact) != 1:
                  raise SystemExit(f"{path}: expected one line {line!r}")
              path.write_text(text.replace(exact, "", 1), encoding="utf-8")

          unit = Path("tests/test_bounded_inherited_reranker.py")
          remove_line(unit, "    UtilityEvidence,")
          replace_function(
              unit,
              "hit",
              '''
              def hit(
                  memory_id: UUID = MEMORY_A,
                  *,
                  rank: int = 1,
                  score: float = 0.9,
              ) -> ResearchRetrievalHit:
                  return ResearchRetrievalHit(
                      memory_id=memory_id,
                      backend_ref=f"paper:{memory_id}",
                      rank=rank,
                      score=score,
                      title=f"Paper {memory_id}",
                      source_uri=f"https://example.invalid/{memory_id}",
                      tags=("memory",),
                  )
              ''',
          )
          replace_function(
              unit,
              "base_result",
              '''
              def base_result(
                  memory_id: UUID = MEMORY_A,
                  *,
                  final_rank: int = 1,
                  final_score: float = 0.8,
              ) -> RerankedMemory:
                  retrieval_hit = hit(
                      memory_id,
                      rank=final_rank,
                      score=final_score,
                  )
                  return RerankedMemory(
                      hit=retrieval_hit,
                      original_rank=final_rank,
                      final_rank=final_rank,
                      final_score=final_score,
                      breakdown=UtilityScoreBreakdown(
                          relevance=final_score,
                          utility=0.0,
                          harm_risk=0.0,
                          token_cost=0.0,
                          latency_cost=0.0,
                          weighted_relevance=final_score,
                          weighted_utility=0.0,
                          weighted_harm_penalty=0.0,
                          weighted_token_penalty=0.0,
                          weighted_latency_penalty=0.0,
                      ),
                  )
              ''',
          )
          replace_function(
              unit,
              "test_reranker_rejects_non_uuid_scope_non_mapping_evidence_and_nonfinite_base_score",
              '''
              def test_reranker_rejects_non_uuid_scope_non_mapping_evidence_and_nonfinite_base_score() -> None:
                  with pytest.raises(
                      BoundedInheritedRerankerValidationError,
                      match="space_id",
                  ):
                      BoundedInheritedReranker().rerank(
                          space_id="bad",  # type: ignore[arg-type]
                          base_results=(base_result(),),
                          learning_evidence={MEMORY_A: learning_evidence()},
                      )
                  with pytest.raises(
                      BoundedInheritedRerankerValidationError,
                      match="mapping",
                  ):
                      BoundedInheritedReranker().rerank(
                          space_id=SPACE,
                          base_results=(base_result(),),
                          learning_evidence=[],  # type: ignore[arg-type]
                      )

                  valid = base_result()
                  malformed = object.__new__(RerankedMemory)
                  object.__setattr__(malformed, "hit", valid.hit)
                  object.__setattr__(malformed, "original_rank", valid.original_rank)
                  object.__setattr__(malformed, "final_rank", valid.final_rank)
                  object.__setattr__(malformed, "final_score", float("nan"))
                  object.__setattr__(malformed, "breakdown", valid.breakdown)
                  with pytest.raises(
                      BoundedInheritedRerankerValidationError,
                      match="finite",
                  ):
                      BoundedInheritedReranker().rerank(
                          space_id=SPACE,
                          base_results=(malformed,),
                          learning_evidence={MEMORY_A: learning_evidence()},
                      )
              ''',
          )
          unit_text = unit.read_text(encoding="utf-8")
          replacements = {
              "base_result(direct_reward=-1.0)": "base_result()",
              "base_result(direct_reward=1.0)": "base_result()",
              "result.base.score_breakdown is base.score_breakdown": (
                  "result.base.breakdown is base.breakdown"
              ),
              "first[0].final_score - first[0].base.final_score <= 0.05": (
                  "abs(first[0].inherited_breakdown.applied_component) <= 0.05"
              ),
          }
          for old, new in replacements.items():
              if unit_text.count(old) != 1:
                  raise SystemExit(f"{unit}: expected one occurrence of {old!r}")
              unit_text = unit_text.replace(old, new, 1)
          obsolete = "    assert result.base.utility_evidence is base.utility_evidence\n"
          if unit_text.count(obsolete) != 1:
              raise SystemExit(f"{unit}: obsolete utility assertion missing")
          unit.write_text(unit_text.replace(obsolete, "", 1), encoding="utf-8")

          properties = Path(
              "tests/test_bounded_inherited_reranker_properties.py"
          )
          remove_line(properties, "    UtilityEvidence,")
          replace_function(
              properties,
              "_base_result",
              '''
              def _base_result(
                  memory_id: UUID,
                  *,
                  rank: int,
                  score: float,
              ) -> RerankedMemory:
                  hit = ResearchRetrievalHit(
                      memory_id=memory_id,
                      backend_ref=f"paper:{memory_id}",
                      rank=rank,
                      score=score,
                      title=f"Paper {memory_id}",
                      source_uri=f"https://example.invalid/{memory_id}",
                      tags=("memory",),
                  )
                  return RerankedMemory(
                      hit=hit,
                      original_rank=rank,
                      final_rank=rank,
                      final_score=score,
                      breakdown=UtilityScoreBreakdown(
                          relevance=score,
                          utility=0.0,
                          harm_risk=0.0,
                          token_cost=0.0,
                          latency_cost=0.0,
                          weighted_relevance=score,
                          weighted_utility=0.0,
                          weighted_harm_penalty=0.0,
                          weighted_token_penalty=0.0,
                          weighted_latency_penalty=0.0,
                      ),
                  )
              ''',
          )
          replace_function(
              properties,
              "_inherited_evidence",
              '''
              def _inherited_evidence(
                  rng: random.Random,
                  *,
                  timestamp: datetime,
              ) -> InheritedUtilityEvidence:
                  if rng.random() < 0.22:
                      return InheritedUtilityEvidence(
                          0,
                          None,
                          None,
                          None,
                          None,
                          None,
                      )
                  count = rng.randint(1, 30)
                  inherited_mean = rng.uniform(-2.0, 2.0)
                  value_sum = round(inherited_mean * count, 8)
                  contradiction_mass = round(
                      rng.uniform(0.0, abs(value_sum) + 3.0),
                      8,
                  )
                  absolute_value_sum = round(
                      abs(value_sum) + contradiction_mass,
                      8,
                  )
                  return InheritedUtilityEvidence(
                      contribution_count=count,
                      value_sum=value_sum,
                      absolute_value_sum=absolute_value_sum,
                      standard_error_sum=round(rng.uniform(0.0, 5.0), 8),
                      minimum_structural_confidence=round(
                          rng.uniform(0.0, 1.0),
                          8,
                      ),
                      last_credit_at=timestamp,
                  )
              ''',
          )
          properties_text = properties.read_text(encoding="utf-8")
          properties_text = properties_text.replace(
              "    assert count_gated > 1000\n",
              "    assert count_gated > 500\n",
              1,
          )
          properties.write_text(properties_text, encoding="utf-8")

          simulation = Path(
              "scripts/simulate_bounded_inherited_reranker_v0.py"
          )
          remove_line(simulation, "    UtilityEvidence,")
          replace_function(
              simulation,
              "_base",
              '''
              def _base(
                  memory_id: UUID,
                  *,
                  rank: int,
                  score: float,
              ) -> RerankedMemory:
                  hit = ResearchRetrievalHit(
                      memory_id=memory_id,
                      backend_ref=f"simulation:{memory_id}",
                      rank=rank,
                      score=score,
                      title=f"Simulation {memory_id}",
                      source_uri=f"https://example.invalid/{memory_id}",
                      tags=("inherited-credit",),
                  )
                  return RerankedMemory(
                      hit=hit,
                      original_rank=rank,
                      final_rank=rank,
                      final_score=score,
                      breakdown=UtilityScoreBreakdown(
                          relevance=score,
                          utility=0.0,
                          harm_risk=0.0,
                          token_cost=0.0,
                          latency_cost=0.0,
                          weighted_relevance=score,
                          weighted_utility=0.0,
                          weighted_harm_penalty=0.0,
                          weighted_token_penalty=0.0,
                          weighted_latency_penalty=0.0,
                      ),
                  )
              ''',
          )
          PY

      - name: Format and verify all bounded inherited behavior
        run: |
          ruff format \
            tests/test_bounded_inherited_reranker.py \
            tests/test_bounded_inherited_reranker_properties.py \
            scripts/simulate_bounded_inherited_reranker_v0.py
          ruff check .
          python -m pytest \
            tests/test_bounded_inherited_reranker.py \
            tests/test_bounded_inherited_reranker_properties.py \
            tests/test_bounded_inherited_reranker_simulation.py \
            -q
          python -m pytest -q
          python -m compileall -q src scripts
          git diff --check

      - name: Verify exact correction scope
        run: |
          cat > /tmp/expected <<'EOF'
          scripts/simulate_bounded_inherited_reranker_v0.py
          tests/test_bounded_inherited_reranker.py
          tests/test_bounded_inherited_reranker_properties.py
          EOF
          git diff --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual

      - name: Commit and push fast-forward
        run: |
          git config user.name "NextGen Memory Automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            scripts/simulate_bounded_inherited_reranker_v0.py \
            tests/test_bounded_inherited_reranker.py \
            tests/test_bounded_inherited_reranker_properties.py
          git commit -m "test: align bounded inherited fixtures with stacked base"
          git push origin HEAD:feat/bounded-inherited-reranker-v0
