name: Patch paired replay failure conflict v2 once

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/paired-replay-experiment-registry-v0-20260824'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/paired-replay-experiment-registry-v0-20260824
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'

      - name: Apply exact two-line test correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_paired_replay_experiment_registry.py')
          source = path.read_text(encoding='utf-8')
          old = (
              '    with pytest.raises(PairedReplayRegistryConflictError, match="failure conflict"):\n'
              '        registry.record_failure(replace(failure, code=ReplayFailureCode.CANCELLED))'
          )
          new = (
              '    conflicting_code = (\n'
              '        ReplayFailureCode.EXECUTION_FAILED\n'
              '        if code is ReplayFailureCode.CANCELLED\n'
              '        else ReplayFailureCode.CANCELLED\n'
              '    )\n'
              '    with pytest.raises(PairedReplayRegistryConflictError, match="failure conflict"):\n'
              '        registry.record_failure(replace(failure, code=conflicting_code))'
          )
          if source.count(old) != 1:
              raise SystemExit(f'exact conflict block count={source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          ruff format tests/test_paired_replay_experiment_registry.py
          ruff check --fix tests/test_paired_replay_experiment_registry.py
          ruff check tests/test_paired_replay_experiment_registry.py
          python -m pytest -q \
            tests/test_paired_replay_experiment_registry.py::test_failure_and_cancellation_are_terminal
          git diff --check

      - name: Remove patch transports and commit the corrected contract
        run: |
          rm -f .github/workflows/patch-paired-replay-failure-conflict*-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: require materially conflicting failure retry'
          git push origin HEAD:feat/paired-replay-experiment-registry-v0-20260824
