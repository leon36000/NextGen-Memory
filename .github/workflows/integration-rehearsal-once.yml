name: One-shot GREEN candidate integration rehearsal

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  rehearse:
    if: github.event.pull_request.head.ref == 'integration/rehearse-green-candidates-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/rehearse-green-candidates-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Initialize fail-closed evidence
        run: |
          mkdir -p /tmp/rehearsal
          python - <<'PY'
          import json
          from pathlib import Path
          Path('/tmp/rehearsal/status.json').write_text(
              json.dumps({
                  'status':'running',
                  'stage':'initialization',
                  'run_id':'${{ github.run_id }}',
              },sort_keys=True,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Resolve and merge immutable candidate refs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          base_branch='feat/corrective-retrieval-preproduction-v0.9.3'
          base_sha="$(git rev-parse "origin/$base_branch")"
          git merge-base --is-ancestor "$base_sha" HEAD
          printf 'BASE_BRANCH=%s\nBASE_SHA=%s\n' "$base_branch" "$base_sha" >> "$GITHUB_ENV"

          manifest_branch='feat/canonical-migration-manifest-v0-20260822'
          if ! git show-ref --verify --quiet "refs/remotes/origin/$manifest_branch"; then
            mapfile -t manifest_candidates < <(
              git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin |
              grep -Ei '^(feat|fix)/.*migration.*manifest.*20260822$' |
              sort -u
            )
            test "${#manifest_candidates[@]}" -eq 1
            manifest_branch="${manifest_candidates[0]}"
          fi

          candidates=(
            docs/autonomous-engineering-policy-20260821
            fix/shapley-order-enumeration-guard-20260821
            fix/retrieval-telemetry-idempotency-readback-20260822
            fix/causal-feedback-metadata-allowlist-20260822
            fix/router-decision-identity-v1-20260822
            fix/mongodb-post-ranking-canonical-gate-20260822
            fix/context-content-hash-contract-v1-20260822
            fix/action-memory-usage-schema-and-reader-20260822
            ci/release-wheel-integrity-v0-20260822
            fix/no-stubs-exception-shadowing-20260822
            "$manifest_branch"
          )
          : > /tmp/rehearsal/candidates.tsv

          for branch in "${candidates[@]}"; do
            ref="refs/remotes/origin/$branch"
            git show-ref --verify --quiet "$ref" || {
              python - <<PY
          import json
          from pathlib import Path
          Path('/tmp/rehearsal/status.json').write_text(json.dumps({
              'status':'failed','stage':'resolve_candidate','candidate':'$branch',
              'reason':'required remote ref is missing','run_id':'${{ github.run_id }}',
          },sort_keys=True,indent=2)+'\n',encoding='utf-8')
          PY
              exit 1
            }
            sha="$(git rev-parse "$ref")"
            merge_base="$(git merge-base "$base_sha" "$sha")"
            if git diff --name-only "$merge_base...$sha" | grep -Eq '^src/nextgen_memory/corrective_retrieval_'; then
              python - <<PY
          import json
          from pathlib import Path
          Path('/tmp/rehearsal/status.json').write_text(json.dumps({
              'status':'failed','stage':'scope_protection','candidate':'$branch',
              'candidate_sha':'$sha','reason':'candidate modifies active Codex corrective-retrieval files',
              'run_id':'${{ github.run_id }}',
          },sort_keys=True,indent=2)+'\n',encoding='utf-8')
          PY
              exit 1
            fi
            printf '%s\t%s\t%s\n' "$branch" "$sha" "$merge_base" >> /tmp/rehearsal/candidates.tsv
            if git merge-base --is-ancestor "$sha" HEAD; then
              continue
            fi
            if ! git merge --no-ff --no-edit "$sha"; then
              git status --porcelain=v1 > /tmp/rehearsal/conflict-status.txt || true
              git diff --name-only --diff-filter=U > /tmp/rehearsal/conflict-paths.txt || true
              git merge --abort || true
              python - <<PY
          import json
          from pathlib import Path
          Path('/tmp/rehearsal/status.json').write_text(json.dumps({
              'status':'failed','stage':'git_merge','candidate':'$branch',
              'candidate_sha':'$sha','reason':'merge conflict',
              'run_id':'${{ github.run_id }}',
          },sort_keys=True,indent=2)+'\n',encoding='utf-8')
          PY
              exit 1
            fi
          done

          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for line in Path('/tmp/rehearsal/candidates.tsv').read_text(encoding='utf-8').splitlines():
              branch,sha,merge_base=line.split('\t')
              rows.append({'branch':branch,'sha':sha,'merge_base':merge_base})
          Path('/tmp/rehearsal/candidates.json').write_text(
              json.dumps(rows,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Remove transport workflow before verification
        run: rm .github/workflows/integration-rehearsal-once.yml
      - name: Validate combined repository structure
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from collections import defaultdict
          from pathlib import Path

          failures=[]

          modules=Path('src/nextgen_memory')
          for directory in sorted(path for path in modules.iterdir() if path.is_dir()):
              module_file=modules/(directory.name+'.py')
              if module_file.exists():
                  failures.append({
                      'kind':'module_package_collision',
                      'module':directory.name,
                      'paths':[directory.as_posix(),module_file.as_posix()],
                  })

          migrations=defaultdict(list)
          for path in sorted(Path('migrations/neon').glob('*.sql')):
              match=re.match(r'^(\d+)_',path.name)
              if not match:
                  failures.append({'kind':'migration_filename','path':path.as_posix()})
                  continue
              migrations[match.group(1)].append(path.as_posix())
          for number,paths in sorted(migrations.items()):
              if len(paths)>1:
                  failures.append({
                      'kind':'duplicate_migration_number','number':number,'paths':paths,
                  })

          workflow_names=defaultdict(list)
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              name=None
              for line in path.read_text(encoding='utf-8').splitlines():
                  if line.startswith('name:'):
                      name=line.split(':',1)[1].strip().strip('"\'')
                      break
              if not name:
                  failures.append({'kind':'workflow_name_missing','path':path.as_posix()})
              else:
                  workflow_names[name].append(path.as_posix())
          for name,paths in sorted(workflow_names.items()):
              if len(paths)>1:
                  failures.append({
                      'kind':'duplicate_workflow_name','name':name,'paths':paths,
                  })

          Path('/tmp/rehearsal/structure.json').write_text(
              json.dumps({'failures':failures},sort_keys=True,indent=2)+'\n',
              encoding='utf-8')
          if failures:
              raise SystemExit('combined repository structure validation failed')
          PY
      - name: Install combined development environment
        run: python -m pip install -e '.[dev]'
      - name: Run focused combined contracts
        shell: bash
        run: |
          set -euo pipefail
          tests=()
          for path in \
            tests/test_action_memory_usage_schema_compatibility.py \
            tests/test_release_artifact.py \
            tests/test_release_integrity_workflow.py \
            tests/test_no_stubs.py \
            tests/test_no_stubs_workflow.py \
            tests/test_no_stubs_exception_shadowing.py \
            tests/test_no_stubs_protocol_shadowing.py; do
            [[ -e "$path" ]] && tests+=("$path")
          done
          mapfile -t manifest_tests < <(find tests -maxdepth 1 -type f \( -iname '*migration*manifest*.py' -o -iname '*migration*inventory*.py' \) -print | sort -u)
          tests+=("${manifest_tests[@]}")
          if ((${#tests[@]})); then
            python -m pytest -q "${tests[@]}"
          fi
      - name: Apply no-stubs and release-artifact contracts to combined tree
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e scripts/verify_no_stubs.py ]]; then
            python scripts/verify_no_stubs.py src > /tmp/rehearsal/no-stubs.json
            python - <<'PY'
          import json
          report=json.load(open('/tmp/rehearsal/no-stubs.json',encoding='utf-8'))
          assert report == {'finding_count':0,'findings':[]}, report
          PY
          fi

          rm -rf /tmp/rehearsal/dist
          mkdir -p /tmp/rehearsal/dist
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir /tmp/rehearsal/dist
          mapfile -t wheels < <(find /tmp/rehearsal/dist -maxdepth 1 -type f -name '*.whl' -print)
          test "${#wheels[@]}" -eq 1
          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])
          PY
          )"
          mapfile -t modules < <(
            find src/nextgen_memory -maxdepth 1 -type f -name '*.py' -printf '%f\n' |
            sed -E 's/\.py$//' |
            awk '$0 == "__init__" {print "nextgen_memory"; next} {print "nextgen_memory." $0}' |
            sort -u
          )
          args=()
          for module in "${modules[@]}"; do args+=(--required-module "$module"); done
          python scripts/verify_release_artifact.py "${wheels[0]}" \
            --expected-name nextgen-memory \
            --expected-version "$version" \
            "${args[@]}" > /tmp/rehearsal/wheel-report.json

          smoke_root="$(mktemp -d)"
          outside="$(mktemp -d)"
          python -m venv "$smoke_root/venv"
          "$smoke_root/venv/bin/python" -m pip install --no-deps "${wheels[0]}"
          (
            cd "$outside"
            REPO_ROOT="$GITHUB_WORKSPACE" "$smoke_root/venv/bin/python" -I - <<'PY'
          import os
          import sys
          from pathlib import Path
          import nextgen_memory
          module_path=Path(nextgen_memory.__file__).resolve()
          assert module_path.is_relative_to(Path(sys.prefix).resolve())
          assert not module_path.is_relative_to(Path(os.environ['REPO_ROOT']).resolve())
          exports=nextgen_memory.__all__
          assert isinstance(exports,tuple) and exports
          assert len(exports)==len(set(exports))
          for name in exports: getattr(nextgen_memory,name)
          PY
          )
          "$smoke_root/venv/bin/python" -m pip check
      - name: Run complete combined verification
        run: |
          ruff check .
          python -m compileall -q src scripts
          python -m pytest -q | tee /tmp/rehearsal/full-pytest.log
          git diff --check
          if git diff --name-only "$BASE_SHA...HEAD" | grep -Eq '^src/nextgen_memory/corrective_retrieval_'; then
            echo 'combined candidates modified active Codex corrective-retrieval files' >&2
            exit 1
          fi
      - name: Finalize immutable rehearsal evidence
        run: |
          git add -u .github/workflows
          final_tree="$(git write-tree)"
          python - <<PY
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          candidates=json.loads(Path('/tmp/rehearsal/candidates.json').read_text(encoding='utf-8'))
          wheel=json.loads(Path('/tmp/rehearsal/wheel-report.json').read_text(encoding='utf-8'))
          pytest_tail=Path('/tmp/rehearsal/full-pytest.log').read_text(encoding='utf-8').strip().splitlines()[-1]
          changed=subprocess.run(
              ['git','diff','--name-only','${BASE_SHA}...HEAD'],
              check=True,text=True,capture_output=True).stdout.splitlines()
          evidence={
              'status':'green_precommit',
              'base_branch':'${BASE_BRANCH}',
              'base_sha':'${BASE_SHA}',
              'candidate_shas':candidates,
              'final_tree_sha':'$final_tree',
              'changed_path_count':len(changed),
              'ruff':'clean','compileall':'clean','full_suite':'green',
              'full_suite_tail':pytest_tail,'diff_check':'clean',
              'no_stubs_findings':0,
              'wheel_filename':wheel['wheel_filename'],
              'wheel_sha256':wheel['wheel_sha256'],
              'wheel_member_count':wheel['member_count'],
              'isolated_import':'green','pip_check':'green',
              'structure_validation':'green',
              'codex_corrective_files_modified':False,
              'run_id':'${{ github.run_id }}',
              'merged_to_product':False,
              'sol_verdict':None,
          }
          payload=json.dumps(evidence,sort_keys=True,indent=2)+'\n'
          Path('/tmp/rehearsal/evidence.json').write_text(payload,encoding='utf-8')
          Path('/tmp/rehearsal/evidence.sha256').write_text(
              hashlib.sha256(payload.encode('utf-8')).hexdigest()+'  evidence.json\n',
              encoding='utf-8')
          Path('/tmp/rehearsal/status.json').write_text(
              json.dumps({'status':'green_precommit','final_tree_sha':'$final_tree','run_id':'${{ github.run_id }}'},sort_keys=True,indent=2)+'\n',
              encoding='utf-8')
          PY
      - name: Commit and push only the verified rehearsal tree
        run: |
          git commit -m 'test: rehearse integration of GREEN candidates'
          git push origin HEAD:integration/rehearse-green-candidates-20260822
      - name: Record final branch SHA
        run: |
          final_sha="$(git rev-parse HEAD)"
          python - <<PY
          import json
          from pathlib import Path
          path=Path('/tmp/rehearsal/evidence.json')
          evidence=json.loads(path.read_text(encoding='utf-8'))
          evidence['final_commit_sha']='$final_sha'
          evidence['status']='green_pushed'
          path.write_text(json.dumps(evidence,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          status=Path('/tmp/rehearsal/status.json')
          status.write_text(json.dumps({'status':'green_pushed','final_commit_sha':'$final_sha','run_id':'${{ github.run_id }}'},sort_keys=True,indent=2)+'\n',encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-rehearsal-evidence
          path: /tmp/rehearsal
          if-no-files-found: error

  report:
    if: always() && github.event.pull_request.head.ref == 'integration/rehearse-green-candidates-20260822'
    needs: rehearse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: integration-rehearsal-evidence
          path: /tmp/rehearsal
      - name: Report exact result without false readiness
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_RESULT: ${{ needs.rehearse.result }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          status=json.loads(Path('/tmp/rehearsal/status.json').read_text(encoding='utf-8'))
          result=os.environ['JOB_RESULT']
          if result=='success' and status.get('status')=='green_pushed':
              evidence=json.loads(Path('/tmp/rehearsal/evidence.json').read_text(encoding='utf-8'))
              body=f'''## Integration rehearsal GREEN — not merge approval

- Final rehearsal SHA: `{evidence['final_commit_sha']}`
- Final tree: `{evidence['final_tree_sha']}`
- Base: `{evidence['base_sha']}`
- Candidates reconciled: {len(evidence['candidate_shas'])}
- Changed paths: {evidence['changed_path_count']}
- Ruff, compileall, complete pytest, diff-check: GREEN
- No-stubs production findings: 0
- Wheel inspection/install/isolated import/pip check: GREEN
- Structural collision checks: GREEN
- Active Codex corrective-retrieval files modified by candidates: false
- Workflow run: {os.environ['RUN_URL']}

This branch is an **ephemeral integration rehearsal**. It is not release-ready, has no aggregate Sol approval, and must not be merged into a product branch. Candidate-specific blind Sol reviews remain required.'''
          else:
              body=f'''## Integration rehearsal blocked

- Job result: `{result}`
- Failure stage: `{status.get('stage','unknown')}`
- Candidate: `{status.get('candidate','not recorded')}`
- Reason: `{status.get('reason','inspect attached workflow artifact')}`
- Workflow run: {os.environ['RUN_URL']}

No merge, skip, suppression or candidate omission was used. The rehearsal remains blocked pending root-cause repair.'''
          subprocess.run(['gh','pr','comment',os.environ['PR_NUMBER'],'--repo',os.environ['REPO'],'--body',body],check=True)
          issue_rows=json.loads(subprocess.run(
              ['gh','issue','list','--repo',os.environ['REPO'],'--state','open','--search','rehearse integration of all GREEN unmerged candidates in:title','--json','number'],
              check=True,text=True,capture_output=True).stdout)
          if len(issue_rows)==1:
              subprocess.run(['gh','issue','comment',str(issue_rows[0]['number']),'--repo',os.environ['REPO'],'--body',body],check=True)
          subprocess.run(['gh','issue','comment','23','--repo',os.environ['REPO'],'--body',body],check=True)
          PY
