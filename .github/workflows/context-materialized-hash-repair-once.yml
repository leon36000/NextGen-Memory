name: Repair context materialized hash patch once

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.ref == 'fix/context-materialized-content-hash-v1-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/context-materialized-content-hash-v1-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply complete one-shot patch
        run: python scripts/patch_context_materialized_hash_once.py
      - name: Repair direct generated fixture hashes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_context_compiler_properties.py')
          source = path.read_text(encoding='utf-8')
          replacements = {
              '                        "content_hash": content_hash(20_000, 1),\n':
                  '                        "content_hash": hashlib.sha256(b"other").hexdigest(),\n',
              '            "content_hash": content_hash(20_001, 0),\n':
                  '            "content_hash": hashlib.sha256(b"first").hexdigest(),\n',
              '            "content_hash": content_hash(20_001, 1),\n':
                  '            "content_hash": hashlib.sha256(b"second").hexdigest(),\n',
          }
          for old, new in replacements.items():
              if old in source:
                  source = source.replace(old, new, 1)
              elif new not in source:
                  raise SystemExit(f'unexpected generated fixture pattern: {old!r}')
          path.write_text(source.rstrip() + '\n', encoding='utf-8')
          PY
      - name: Diff integrity
        run: git diff --check
      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'
      - name: Focused context verification
        run: python -m pytest -q tests/test_context*.py
      - name: Lint
        run: ruff check .
      - name: Full suite
        run: python -m pytest -q
      - name: Commit verified production and fixture changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nextgen_memory/context_compiler_contracts.py
          git add tests/test_context*.py
          git add docs/superpowers/specs/2026-08-14-context-compiler-integrated-v0-design.md
          git add -u scripts
          git commit -m 'fix: bind context hash to materialized content'
          git push origin HEAD:fix/context-materialized-content-hash-v1-20260822
