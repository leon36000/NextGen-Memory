name: Verify no-stubs lexical scanner exact SHA

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3021cd8b0504b313d395838e28a78eb00b54af9b
          fetch-depth: 0

      - name: Prove exact checkout and seven-path product surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3021cd8b0504b313d395838e28a78eb00b54af9b"
          test "$(git merge-base HEAD 93cce924debb9ae2ff46d71b2e8fa043f4cefa0b)" = "93cce924debb9ae2ff46d71b2e8fa043f4cefa0b"
          mapfile -t changed < <(git diff --name-only 93cce924debb9ae2ff46d71b2e8fa043f4cefa0b...HEAD | sort)
          expected=(
            .github/workflows/no-stubs.yml
            scripts/verify_no_stubs.py
            tests/test_no_stubs.py
            tests/test_no_stubs_exception_shadowing.py
            tests/test_no_stubs_lexical_hardening.py
            tests/test_no_stubs_protocol_shadowing.py
            tests/test_no_stubs_workflow.py
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}")
          test -z "$(git diff --name-only 93cce924debb9ae2ff46d71b2e8fa043f4cefa0b...HEAD -- 'src/**' 'migrations/**' pyproject.toml)"
          git diff --check 93cce924debb9ae2ff46d71b2e8fa043f4cefa0b...HEAD
          test -z "$(git status --porcelain)"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'

      - name: Static, focused and complete verification
        run: |
          ruff check .
          python -m compileall -q src scripts
          python -m pytest -q \
            tests/test_no_stubs.py \
            tests/test_no_stubs_workflow.py \
            tests/test_no_stubs_exception_shadowing.py \
            tests/test_no_stubs_protocol_shadowing.py \
            tests/test_no_stubs_lexical_hardening.py
          python -m pytest -q

      - name: Prove canonical production and scanner self-reports
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/no-stubs-evidence-${{ matrix.python-version }}"
          mkdir -p "$evidence"
          python scripts/verify_no_stubs.py src > "$evidence/production-scan.json"
          python scripts/verify_no_stubs.py scripts/verify_no_stubs.py > "$evidence/scanner-self-scan.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "no-stubs-evidence-${{ matrix.python-version }}"
          expected = {"finding_count": 0, "findings": []}
          for name in ("production-scan.json", "scanner-self-scan.json"):
              path = root / name
              raw = path.read_text(encoding="utf-8")
              report = json.loads(raw)
              if report != expected:
                  raise SystemExit(f"unexpected {name}: {report!r}")
              canonical = json.dumps(
                  report,
                  ensure_ascii=False,
                  allow_nan=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ) + "\n"
              if raw != canonical:
                  raise SystemExit(f"noncanonical report: {name}")
          PY
          echo "EVIDENCE_ROOT=$evidence" >> "$GITHUB_ENV"

      - name: Prove process-hash and filesystem-location determinism
        shell: bash
        run: |
          set -euo pipefail
          fixture=$(mktemp -d)
          mkdir -p "$fixture/src"
          cat > "$fixture/src/b.py" <<'PY'
          class Hidden:
              pass
          PY
          cat > "$fixture/src/a.py" <<'PY'
          def unfinished() -> None:
              raise NotImplementedError
          PY
          set +e
          PYTHONHASHSEED=1 python scripts/verify_no_stubs.py "$fixture/src" > "$EVIDENCE_ROOT/determinism-seed-1.json"
          first_rc=$?
          PYTHONHASHSEED=999 python scripts/verify_no_stubs.py "$fixture/src" > "$EVIDENCE_ROOT/determinism-seed-999.json"
          second_rc=$?
          set -e
          test "$first_rc" -eq 1
          test "$second_rc" -eq 1
          cmp "$EVIDENCE_ROOT/determinism-seed-1.json" "$EVIDENCE_ROOT/determinism-seed-999.json"
          cp "$EVIDENCE_ROOT/determinism-seed-1.json" "$EVIDENCE_ROOT/deterministic-fixture-report.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_ROOT"])
          path = root / "deterministic-fixture-report.json"
          raw = path.read_text(encoding="utf-8")
          report = json.loads(raw)
          if report["finding_count"] != 2:
              raise SystemExit(f"unexpected deterministic finding count: {report!r}")
          expected = [
              ("not_implemented_error", "src/a.py", "unfinished"),
              ("class_stub", "src/b.py", "Hidden"),
          ]
          actual = [
              (finding["kind"], finding["path"], finding["symbol"])
              for finding in report["findings"]
          ]
          if actual != expected:
              raise SystemExit(f"unexpected deterministic findings: {actual!r}")
          if "/tmp/" in raw or "private" in raw:
              raise SystemExit("deterministic report leaked an absolute fixture path")
          PY

      - name: Audit scanner dependency, side-effect and privacy surface
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          path = Path("scripts/verify_no_stubs.py")
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source, filename=str(path))
          allowed_import_roots = {
              "__future__",
              "argparse",
              "ast",
              "builtins",
              "collections",
              "dataclasses",
              "io",
              "json",
              "pathlib",
              "tokenize",
              "typing",
          }
          forbidden_calls = {
              "eval",
              "exec",
              "compile",
              "open",
              "write_text",
              "write_bytes",
              "unlink",
              "rename",
              "replace",
              "system",
              "popen",
          }
          violations: list[str] = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  for alias in node.names:
                      root = alias.name.split(".", 1)[0]
                      if root not in allowed_import_roots:
                          violations.append(f"{node.lineno}:import:{alias.name}")
              elif isinstance(node, ast.ImportFrom):
                  root = (node.module or "").split(".", 1)[0]
                  if root not in allowed_import_roots:
                      violations.append(f"{node.lineno}:import:{node.module}")
              elif isinstance(node, ast.Call):
                  name = None
                  if isinstance(node.func, ast.Name):
                      name = node.func.id
                  elif isinstance(node.func, ast.Attribute):
                      name = node.func.attr
                  if name in forbidden_calls:
                      violations.append(f"{node.lineno}:call:{name}")
              elif isinstance(node, ast.Raise):
                  exc = node.exc.func if isinstance(node.exc, ast.Call) else node.exc
                  if (
                      isinstance(exc, ast.Name)
                      and exc.id == "NotImplementedError"
                  ) or (
                      isinstance(exc, ast.Attribute)
                      and exc.attr == "NotImplementedError"
                  ):
                      violations.append(f"{node.lineno}:NotImplementedError")
          lowered = source.lower()
          for marker in (
              "postgresql://",
              "mongodb://",
              "http://",
              "https://",
              "password",
              "credential",
              "# todo",
              "# fixme",
          ):
              if marker in lowered:
                  violations.append(f"text:{marker}")
          if violations:
              raise SystemExit("\n".join(violations))
          print("scanner_side_effect_or_privacy_findings=0")
          PY

      - name: Write one bounded verification report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          report = {
              "candidate_sha": "3021cd8b0504b313d395838e28a78eb00b54af9b",
              "changed_path_count": 7,
              "compileall": "clean",
              "focused_contracts": "passed",
              "full_suite": "passed",
              "production_findings": 0,
              "python_version": ".".join(map(str, sys.version_info[:3])),
              "ruff": "clean",
              "scanner_self_findings": 0,
          }
          destination = Path(os.environ["EVIDENCE_ROOT"]) / "verification.json"
          destination.write_text(
              json.dumps(
                  report,
                  ensure_ascii=False,
                  allow_nan=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: no-stubs-exact-python-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/no-stubs-evidence-${{ matrix.python-version }}/production-scan.json
            ${{ runner.temp }}/no-stubs-evidence-${{ matrix.python-version }}/scanner-self-scan.json
            ${{ runner.temp }}/no-stubs-evidence-${{ matrix.python-version }}/deterministic-fixture-report.json
            ${{ runner.temp }}/no-stubs-evidence-${{ matrix.python-version }}/verification.json
          if-no-files-found: error
          retention-days: 7

  compare:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: no-stubs-exact-python-*
          path: ${{ runner.temp }}/no-stubs-exact-matrix

      - name: Compare cross-Python scanner evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "no-stubs-exact-matrix"
          production = sorted(root.rglob("production-scan.json"))
          self_scans = sorted(root.rglob("scanner-self-scan.json"))
          deterministic = sorted(root.rglob("deterministic-fixture-report.json"))
          verification = sorted(root.rglob("verification.json"))
          if tuple(map(len, (production, self_scans, deterministic, verification))) != (2, 2, 2, 2):
              raise SystemExit("incomplete cross-Python evidence set")
          for paths in (production, self_scans, deterministic):
              documents = [json.loads(path.read_text(encoding="utf-8")) for path in paths]
              if documents[0] != documents[1]:
                  raise SystemExit(f"cross-Python scanner evidence differs: {paths!r}")
          verification_documents = [
              json.loads(path.read_text(encoding="utf-8"))
              for path in verification
          ]
          if {
              ".".join(document["python_version"].split(".")[:2])
              for document in verification_documents
          } != {"3.12", "3.13"}:
              raise SystemExit("unexpected Python evidence set")
          for document in verification_documents:
              if document["candidate_sha"] != "3021cd8b0504b313d395838e28a78eb00b54af9b":
                  raise SystemExit("candidate SHA drift")
              if document["production_findings"] != 0 or document["scanner_self_findings"] != 0:
                  raise SystemExit("scanner evidence is not clean")
          summary = {
              "candidate_sha": "3021cd8b0504b313d395838e28a78eb00b54af9b",
              "cross_python_deterministic": True,
              "deterministic_fixture_finding_count": 2,
              "production_findings": 0,
              "python_versions": ["3.12", "3.13"],
              "scanner_self_findings": 0,
          }
          destination = root / "cross-python-summary.json"
          destination.write_text(
              json.dumps(
                  summary,
                  ensure_ascii=False,
                  allow_nan=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ) + "\n",
              encoding="utf-8",
          )
          print(destination.read_text(encoding="utf-8"), end="")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: no-stubs-exact-cross-python-summary
          path: ${{ runner.temp }}/no-stubs-exact-matrix/cross-python-summary.json
          if-no-files-found: error
          retention-days: 7
