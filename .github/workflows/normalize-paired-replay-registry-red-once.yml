name: Normalize paired replay registry RED once

on:
  pull_request:

permissions:
  contents: write

jobs:
  normalize-red:
    if: github.event.pull_request.head.ref == 'feat/paired-replay-experiment-registry-v0-20260824'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/paired-replay-experiment-registry-v0-20260824
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'

      - name: Normalize only the test contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_paired_replay_experiment_registry_properties.py')
          source = path.read_text(encoding='utf-8')
          old = 'from nextgen_memory.paired_replay_experiment_registry import BalancedPairedReplayPlanner, PairedReplayExperimentSpec'
          new = '''from nextgen_memory.paired_replay_experiment_registry import (
              BalancedPairedReplayPlanner,
              PairedReplayExperimentSpec,
          )'''
          if source.count(old) != 1:
              raise SystemExit('unexpected embedded registry import structure')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          ruff format \
            tests/test_paired_replay_experiment_registry.py \
            tests/test_paired_replay_experiment_registry_properties.py \
            tests/test_paired_replay_experiment_registry_public_api.py
          ruff check --fix \
            tests/test_paired_replay_experiment_registry.py \
            tests/test_paired_replay_experiment_registry_properties.py \
            tests/test_paired_replay_experiment_registry_public_api.py
          ruff check \
            tests/test_paired_replay_experiment_registry.py \
            tests/test_paired_replay_experiment_registry_properties.py \
            tests/test_paired_replay_experiment_registry_public_api.py
          git diff --check

      - name: Prove precise module-absence RED
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/nextgen_memory/paired_replay_experiment_registry.py
          set +e
          python -m pytest -q \
            tests/test_paired_replay_experiment_registry.py \
            tests/test_paired_replay_experiment_registry_properties.py \
            tests/test_paired_replay_experiment_registry_public_api.py \
            > /tmp/paired-registry-red.txt 2>&1
          red_rc=$?
          set -e
          test "$red_rc" -ne 0
          grep -F "ModuleNotFoundError: No module named 'nextgen_memory.paired_replay_experiment_registry'" \
            /tmp/paired-registry-red.txt >/dev/null
          if grep -E 'SyntaxError|IndentationError|NameError|ImportError:' /tmp/paired-registry-red.txt; then
            echo 'RED contains an unintended failure class' >&2
            exit 1
          fi
          tail -n 140 /tmp/paired-registry-red.txt

      - name: Remove transport and commit clean RED evidence
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/normalize-paired-replay-registry-red-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tests/test_paired_replay_experiment_registry.py \
            tests/test_paired_replay_experiment_registry_properties.py \
            tests/test_paired_replay_experiment_registry_public_api.py
          git add -u .github/workflows
          git diff --cached --check
          git commit -m 'test: normalize paired replay registry RED contract'
          git push origin HEAD:feat/paired-replay-experiment-registry-v0-20260824
