name: Generate canonical Neon migration manifest once

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate-and-verify:
    if: github.event.pull_request.head.ref == 'ci/neon-migration-manifest-v1-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/neon-migration-manifest-v1-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Generate manifest from exact SQL bytes
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          ordered = (
              ("0001_memory_moe_kernel", ()),
              ("0002_core_idempotency", ("0001_memory_moe_kernel",)),
              ("0003_research_sources_seed", ("0002_core_idempotency",)),
              ("0005_causal_credit_feedback", ("0003_research_sources_seed",)),
              ("0006_action_memory_usage_events", ("0005_causal_credit_feedback",)),
          )
          migrations = []
          for migration_id, dependencies in ordered:
              relative = f"migrations/neon/{migration_id}.sql"
              path = Path(relative)
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"unsafe or missing migration: {relative}")
              migrations.append(
                  {
                      "depends_on": list(dependencies),
                      "id": migration_id,
                      "path": relative,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
              )

          actual_sql = sorted(
              path.as_posix()
              for path in Path("migrations/neon").glob("*.sql")
          )
          planned_sql = sorted(migration["path"] for migration in migrations)
          if actual_sql != planned_sql:
              raise SystemExit(
                  f"migration coverage mismatch: actual={actual_sql}, planned={planned_sql}"
              )

          document = {
              "manifest_version": 1,
              "migrations": migrations,
              "schema": "nextgen-memory-neon-migrations",
          }
          Path("migrations/neon/manifest.json").write_text(
              json.dumps(document, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          rm .github/workflows/generate-neon-manifest-once.yml
      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'
      - name: Focused manifest verification
        run: |
          ruff check scripts/neon_migration_manifest.py tests/test_neon_migration_manifest.py
          python -m pytest -q tests/test_neon_migration_manifest.py
          python scripts/neon_migration_manifest.py
      - name: Repository verification
        run: |
          ruff check .
          python -m compileall -q src scripts
          python -m pytest -q
          git diff --check eada91750b5d577ec452c7f8d1fb72126abb6a54...HEAD
      - name: Commit verified manifest implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add migrations/neon/manifest.json scripts/neon_migration_manifest.py tests/test_neon_migration_manifest.py
          git add -u .github/workflows
          git commit -m 'feat: add canonical Neon migration manifest'
          git push origin HEAD:ci/neon-migration-manifest-v1-20260822
