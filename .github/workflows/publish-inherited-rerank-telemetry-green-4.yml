name: Publish Inherited Rerank Telemetry GREEN 4

on:
  push:
    branches: [bootstrap/inherited-rerank-telemetry-green-4]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/inherited-rerank-telemetry-v0
          fetch-depth: 0

      - name: Verify guarded feature head
        run: test "$(git rev-parse HEAD)" = "0e49685c8c627dc5b5f8ff1f1826a7c65d882a4b"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development tools
        run: python -m pip install -e '.[dev]'

      - name: Insert rank-valid context into each negative fixture block
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_inherited_rerank_telemetry.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          target_texts = (
              "final_score=0.90,",
              "final_score=0.89,",
              'policy_version="other",',
          )
          targets: list[tuple[int, str]] = []
          for target in target_texts:
              positions = [
                  index for index, line in enumerate(lines)
                  if line.strip() == target
              ]
              if len(positions) != 1:
                  raise SystemExit(
                      f"{target}: expected one target line, found {len(positions)}"
                  )
              targets.append((positions[0], target))

          inserted = 0
          for target_index, target in sorted(targets, reverse=True):
              outer_index = next(
                  (
                      index
                      for index in range(target_index - 1, -1, -1)
                      if lines[index].strip() == "reranked_results()[0],"
                  ),
                  None,
              )
              if outer_index is None:
                  raise SystemExit(f"{target}: outer replace fixture not found")
              indentation = lines[outer_index][
                  : len(lines[outer_index]) - len(lines[outer_index].lstrip())
              ]
              local_tail = lines[outer_index + 1 : min(outer_index + 5, len(lines))]
              if any("base=replace(reranked_results()[0].base" in line for line in local_tail):
                  raise SystemExit(f"{target}: local rank patch already present")
              lines[outer_index + 1 : outer_index + 1] = [
                  (
                      f"{indentation}base=replace("
                      "reranked_results()[0].base, final_rank=1),"
                  ),
                  f"{indentation}final_rank=1,",
              ]
              inserted += 1

          patched_text = "\n".join(lines) + "\n"
          if patched_text.count(
              "base=replace(reranked_results()[0].base, final_rank=1),"
          ) != 3:
              raise SystemExit("expected exactly three rank-valid fixture patches")
          if inserted != 3:
              raise SystemExit(f"expected three insertions, got {inserted}")
          path.write_text(patched_text, encoding="utf-8")
          PY

      - name: Format and verify focused and complete behavior
        run: |
          ruff format \
            src/nextgen_memory/inherited_rerank_telemetry.py \
            tests/test_inherited_rerank_telemetry.py
          ruff check \
            src/nextgen_memory/inherited_rerank_telemetry.py \
            tests/test_inherited_rerank_telemetry.py \
            --fix
          ruff check .
          python -m pytest tests/test_inherited_rerank_telemetry.py -q
          python -m pytest -q
          python -m compileall -q src
          git diff --check

      - name: Verify exact correction scope
        run: |
          cat > /tmp/allowed <<'EOF'
          src/nextgen_memory/inherited_rerank_telemetry.py
          tests/test_inherited_rerank_telemetry.py
          EOF
          git diff --name-only | sort > /tmp/actual
          while read -r path; do grep -Fx "$path" /tmp/allowed >/dev/null; done < /tmp/actual

      - name: Commit and push fast-forward
        run: |
          git config user.name "NextGen Memory Automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/nextgen_memory/inherited_rerank_telemetry.py \
            tests/test_inherited_rerank_telemetry.py
          git commit -m "test: target inherited telemetry validation cases"
          git push origin HEAD:feat/inherited-rerank-telemetry-v0
