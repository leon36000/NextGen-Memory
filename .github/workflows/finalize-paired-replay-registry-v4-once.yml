name: Finalize paired replay registry v0 safely

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'feat/paired-replay-experiment-registry-v0-20260824'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/paired-replay-experiment-registry-v0-20260824
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'

      - name: Materialize public exports against the real API file
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          path = Path('src/nextgen_memory/__init__.py')
          source = path.read_text(encoding='utf-8')
          names = (
              'BalancedPairedReplayPlanner',
              'InMemoryPairedReplayExperimentRegistry',
              'PairedReplayArmResult',
              'PairedReplayAssignment',
              'PairedReplayExperimentSpec',
              'PairedReplayExperimentSummary',
              'PairedReplayFailureRecord',
              'PairedReplayPairSnapshot',
              'PairedReplayPlan',
              'PairedReplayPlanSummary',
              'PairedReplayRegistryConflictError',
              'PairedReplayRegistryStateError',
              'PairedReplayRegistryValidationError',
              'PairedReplayStep',
              'ReplayArm',
              'ReplayArmOrder',
              'ReplayFailureCode',
              'ReplayPairStatus',
          )
          block = 'from .paired_replay_experiment_registry import (\n' + ''.join(
              f'    {name},\n' for name in names
          ) + ')\n'
          if 'from .paired_replay_experiment_registry import (' not in source:
              marker = 'from .pairwise_interactions import ('
              if source.count(marker) != 1:
                  raise SystemExit('pairwise-interactions marker drift')
              source = source.replace(marker, block + marker, 1)

          tree = ast.parse(source)
          assignment = next(
              statement
              for statement in tree.body
              if isinstance(statement, ast.Assign)
              and any(
                  isinstance(target, ast.Name) and target.id == '__all__'
                  for target in statement.targets
              )
          )
          if not isinstance(assignment.value, ast.List):
              raise SystemExit('__all__ is not a literal list')
          current = [
              item.value
              for item in assignment.value.elts
              if isinstance(item, ast.Constant) and isinstance(item.value, str)
          ]
          if len(current) != len(assignment.value.elts):
              raise SystemExit('__all__ has non-string entries')
          merged = sorted(set(current).union(names))
          start = source.index('__all__ = [')
          end = source.index('\n]', start) + 2
          source = (
              source[:start]
              + '__all__ = [\n'
              + ''.join(f'    "{name}",\n' for name in merged)
              + ']'
              + source[end:]
          )
          ast.parse(source)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Restore approved design and implementation plan
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e bdc7c43b3ed85821b025e2e9b25d35199ddd30fd^{commit}
          mkdir -p docs/superpowers/specs docs/superpowers/plans
          git show bdc7c43b3ed85821b025e2e9b25d35199ddd30fd:docs/superpowers/specs/2026-08-15-paired-replay-experiment-registry-v0-design.md \
            > docs/superpowers/specs/2026-08-15-paired-replay-experiment-registry-v0-design.md
          cat > docs/superpowers/plans/2026-08-24-paired-replay-experiment-registry-v0.md <<'EOF'
          # Paired Replay Experiment Registry v0 — Implementation Plan

          **Date:** 2026-08-24
          **Base:** `candidate/paired-rerank-policy-evaluation-v0-20260824`
          **Issue:** #132

          ## Goal

          Implement a deterministic in-memory planner and registry that produces complete matched `PairedRerankPolicyTrial` values without executing models, persisting state, activating policy, or emitting feedback.

          ## Sequence

          1. Prove a Ruff-clean module-absence RED.
          2. Validate immutable experiment and budget contracts.
          3. Generate seed-independent pair IDs and balanced seed-driven arm order.
          4. Register exact plans idempotently and expose one schedulable arm per pair.
          5. Validate step, pair, experiment, space, policy, router decision, and per-arm budgets before mutation.
          6. Complete one evaluator trial only after two matched arms.
          7. Preserve terminal failure and cancellation with bounded codes.
          8. Prove deterministic snapshots, summaries, 5,000 generated traces, and process-hash-seed invariance.
          9. Verify Python 3.12/3.13, isolated wheel import, and blind GPT-5.6 Sol review before merge.

          ## Safety boundary

          No model execution, persistence, database, migration, network, filesystem write, workflow engine, lease, worker, feedback write, policy activation, raw content, arbitrary error text, stub, skipped test, or automatic merge belongs in v0.
          EOF
          sed -i 's/^          //' docs/superpowers/plans/2026-08-24-paired-replay-experiment-registry-v0.md

      - name: Normalize product files
        run: |
          ruff format \
            src/nextgen_memory/__init__.py \
            src/nextgen_memory/paired_replay_experiment_registry.py \
            tests/test_paired_replay_experiment_registry.py \
            tests/test_paired_replay_experiment_registry_properties.py \
            tests/test_paired_replay_experiment_registry_public_api.py
          ruff check --fix \
            src/nextgen_memory/__init__.py \
            src/nextgen_memory/paired_replay_experiment_registry.py \
            tests/test_paired_replay_experiment_registry.py \
            tests/test_paired_replay_experiment_registry_properties.py \
            tests/test_paired_replay_experiment_registry_public_api.py
          ruff check \
            src/nextgen_memory/__init__.py \
            src/nextgen_memory/paired_replay_experiment_registry.py \
            tests/test_paired_replay_experiment_registry.py \
            tests/test_paired_replay_experiment_registry_properties.py \
            tests/test_paired_replay_experiment_registry_public_api.py
          git diff --check

      - name: Run focused registry contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_paired_replay_experiment_registry.py \
            tests/test_paired_replay_experiment_registry_properties.py \
            tests/test_paired_replay_experiment_registry_public_api.py \
            | tee /tmp/focused.txt

      - name: Audit dependency, privacy, and stub boundaries
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          path = Path('src/nextgen_memory/paired_replay_experiment_registry.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source, filename=str(path))
          forbidden_imports = {
              'asyncio', 'datetime', 'httpx', 'os', 'pathlib', 'psycopg',
              'pymongo', 'random', 'requests', 'socket', 'sqlalchemy',
              'subprocess', 'temporalio', 'time', 'urllib',
          }
          forbidden_calls = {
              'eval', 'exec', 'open', 'sleep', 'system', 'urlopen',
              'uuid1', 'uuid4', 'write_bytes', 'write_text',
          }
          findings: list[str] = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Pass):
                  findings.append(f'{node.lineno}:pass')
              elif isinstance(node, ast.Raise):
                  exc = node.exc.func if isinstance(node.exc, ast.Call) else node.exc
                  if (
                      isinstance(exc, ast.Name) and exc.id == 'NotImplementedError'
                  ) or (
                      isinstance(exc, ast.Attribute) and exc.attr == 'NotImplementedError'
                  ):
                      findings.append(f'{node.lineno}:NotImplementedError')
              elif isinstance(node, ast.Import):
                  for alias in node.names:
                      if alias.name.split('.', 1)[0] in forbidden_imports:
                          findings.append(f'{node.lineno}:import:{alias.name}')
              elif isinstance(node, ast.ImportFrom):
                  if (node.module or '').split('.', 1)[0] in forbidden_imports:
                      findings.append(f'{node.lineno}:import:{node.module}')
              elif isinstance(node, ast.Call):
                  name = (
                      node.func.id
                      if isinstance(node.func, ast.Name)
                      else node.func.attr
                      if isinstance(node.func, ast.Attribute)
                      else None
                  )
                  if name in forbidden_calls:
                      findings.append(f'{node.lineno}:call:{name}')
          lowered = source.lower()
          for marker in (
              'postgresql://', 'mongodb://', 'http://', 'https://',
              'password', 'credential', '# todo', '# fixme', 'raw_query',
              'raw_prompt', 'response_text', 'memory_body', 'lease_timestamp',
              'worker_identity', 'activate_policy', 'write_feedback',
          ):
              if marker in lowered:
                  findings.append(f'text:{marker}')
          if findings:
              raise SystemExit('\n'.join(findings))
          print('paired_registry_audit_findings=0')
          PY

      - name: Run repository-wide regression
        run: |
          ruff check .
          python -m compileall -q src scripts
          python -m pytest -q
          git diff --check 847ea08e9e9a0d9193adac6d465557270da6ef7d...HEAD

      - name: Remove every transport and prove exact product scope
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-paired-replay-registry-*-once.yml
          git add -A
          mapfile -t changed < <(git diff --cached --name-only 847ea08e9e9a0d9193adac6d465557270da6ef7d | sort)
          expected=(
            docs/superpowers/plans/2026-08-24-paired-replay-experiment-registry-v0.md
            docs/superpowers/specs/2026-08-15-paired-replay-experiment-registry-v0-design.md
            src/nextgen_memory/__init__.py
            src/nextgen_memory/paired_replay_experiment_registry.py
            tests/test_paired_replay_experiment_registry.py
            tests/test_paired_replay_experiment_registry_properties.py
            tests/test_paired_replay_experiment_registry_public_api.py
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}")
          test -z "$(git diff --cached --name-only 847ea08e9e9a0d9193adac6d465557270da6ef7d -- 'migrations/**' '.github/workflows/**' pyproject.toml 'src/nextgen_memory/corrective_retrieval_*')"
          git diff --cached --check

      - name: Commit only the fully verified product
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add paired replay experiment registry v0'
          git push origin HEAD:feat/paired-replay-experiment-registry-v0-20260824
