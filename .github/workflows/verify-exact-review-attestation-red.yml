name: Verify exact review attestation registry RED

on:
  pull_request:

concurrency:
  group: exact-review-attestation-registry-red
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  verify-red:
    if: github.event.pull_request.head.ref == 'bootstrap/verify-exact-review-attestation-red-20260824'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/verify-exact-review-attestation-red-20260824
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project development tools
        run: python -m pip install -e '.[dev]'

      - name: Normalize and prove exact tests-only RED
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/controllers/verify_exact_review_attestation_red.sh
