name: Rebase merge readiness gate design and RED on R4 v2

on:
  pull_request:

concurrency:
  group: exact-sha-merge-readiness-r4-rebase-v3
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  rebase:
    if: github.event.pull_request.head.ref == 'bootstrap/rebase-merge-readiness-gate-on-r4-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/rebase-merge-readiness-gate-on-r4-20260831
          path: controller
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          ref: 41b0b104e5a3f06c4d238060ad0fd3dd51dd4446
          path: workspace
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact R4 development tools
        run: python -m pip install -e "$GITHUB_WORKSPACE/workspace[dev]"

      - name: Publish R4-v2 design and tests-only RED
        env:
          GH_TOKEN: ${{ github.token }}
          SELF_PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          bash controller/.github/controllers/rebase_merge_readiness_gate_on_r4_v2.sh \
            "$GITHUB_WORKSPACE/workspace"

      - uses: actions/upload-artifact@v4
        with:
          name: merge-readiness-r4-v2-rebase-evidence
          path: |
            /tmp/merge-readiness-red-r4-ast.json
            /tmp/merge-readiness-r4-rebase-summary.json
          if-no-files-found: error
          retention-days: 7
