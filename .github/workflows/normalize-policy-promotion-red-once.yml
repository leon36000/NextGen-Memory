name: Record policy promotion gate RED once

on:
  pull_request:

permissions:
  contents: write

jobs:
  red:
    if: github.event.pull_request.head.ref == 'feat/policy-promotion-gate-v0-20260824'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/policy-promotion-gate-v0-20260824
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'
      - name: Normalize tests and prove Ruff-clean contract
        run: |
          ruff format \
            tests/test_policy_promotion.py \
            tests/test_policy_promotion_properties.py \
            tests/test_policy_promotion_public_api.py
          ruff check --fix \
            tests/test_policy_promotion.py \
            tests/test_policy_promotion_properties.py \
            tests/test_policy_promotion_public_api.py
          ruff check \
            tests/test_policy_promotion.py \
            tests/test_policy_promotion_properties.py \
            tests/test_policy_promotion_public_api.py
          git diff --check
      - name: Prove exact module-absence RED
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/nextgen_memory/policy_promotion.py
          set +e
          python -m pytest -q \
            tests/test_policy_promotion.py \
            tests/test_policy_promotion_properties.py \
            tests/test_policy_promotion_public_api.py \
            > /tmp/policy-promotion-red.txt 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -F "ModuleNotFoundError: No module named 'nextgen_memory.policy_promotion'" /tmp/policy-promotion-red.txt >/dev/null
          test "$(grep -c "ModuleNotFoundError: No module named 'nextgen_memory.policy_promotion'" /tmp/policy-promotion-red.txt)" -eq 3
          if grep -E 'SyntaxError|IndentationError|NameError|ImportError:' /tmp/policy-promotion-red.txt; then
            echo 'RED contains an unintended failure class' >&2
            exit 1
          fi
          tail -n 160 /tmp/policy-promotion-red.txt
      - name: Remove transport and commit normalized tests-only RED
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/normalize-policy-promotion-red-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: record policy promotion gate module-absence RED'
          git push origin HEAD:feat/policy-promotion-gate-v0-20260824
