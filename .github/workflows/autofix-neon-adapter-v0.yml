name: Autofix Neon adapter v0

on:
  push:
    branches: [bootstrap/adapter-v0-autofix]

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: leon36000/NextGen-Memory
      TARGET_BRANCH: feat/neon-execution-ledger-adapter-v0
    steps:
      - name: Resolve guarded target SHA
        id: target
        run: |
          SHA=$(gh api "repos/$REPO/git/ref/heads/$TARGET_BRANCH" --jq '.object.sha')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: feat/neon-execution-ledger-adapter-v0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Confirm checkout SHA
        run: test "$(git rev-parse HEAD)" = "${{ steps.target.outputs.sha }}"
      - name: Install tools
        run: python -m pip install -e '.[dev]'
      - name: Apply mechanical formatting only
        run: |
          ruff format .
          ruff check . --fix
          ruff check .
      - name: Run complete tests before any push
        run: python -m pytest -q
      - name: Push formatting commit only when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git diff --check
          git config user.name "NextGen Memory Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/nextgen_memory/neon_execution_ledger.py tests/test_neon_execution_ledger.py tests/test_neon_execution_ledger_sql_contract.py docs/superpowers/specs/2026-08-14-neon-execution-ledger-adapter-v0-design.md docs/superpowers/plans/2026-08-14-neon-execution-ledger-adapter-v0.md
          git commit -m "style: format Neon execution ledger adapter"
          git push origin HEAD:$TARGET_BRANCH
