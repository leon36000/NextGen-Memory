name: Repair routing identity transport once

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'fix/router-decision-identity-v1-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/router-decision-identity-v1-20260822
          fetch-depth: 0
      - name: Repair EOF normalization and remove this workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/router-identity-v1-patch-once.yml')
          source = path.read_text(encoding='utf-8')
          old = "                  '\\n'.join(line.rstrip() for line in lines) + '\\n',"
          new = "                  '\\n'.join(line.rstrip() for line in lines).rstrip() + '\\n',"
          if source.count(old) != 1:
              raise SystemExit('unexpected normalization expression')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/repair-router-identity-transport-once.yml').unlink()
          PY
      - name: Verify transport diff
        run: git diff --check
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/router-identity-v1-patch-once.yml
          git add -u .github/workflows
          git commit -m 'chore: repair router identity patch transport'
          git push origin HEAD:fix/router-decision-identity-v1-20260822
