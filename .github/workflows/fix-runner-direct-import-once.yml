name: Fix Neon runner direct import boundary once

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.ref == 'ci/neon-migration-runner-v1-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/neon-migration-runner-v1-20260822
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply explicit package/direct-script import boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/neon_migration_runner.py')
          source = path.read_text(encoding='utf-8')
          old = (
              'from scripts.neon_migration_manifest import '
              'MigrationManifest, load_manifest\n'
          )
          new = (
              'if __package__:\n'
              '    from scripts.neon_migration_manifest import (\n'
              '        MigrationManifest,\n'
              '        load_manifest,\n'
              '    )\n'
              'else:\n'
              '    from neon_migration_manifest import MigrationManifest, load_manifest\n'
          )
          if source.count(old) != 1:
              raise SystemExit('unexpected runner manifest import structure')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/fix-runner-direct-import-once.yml

      - name: Prove direct script reaches main without import failure
        run: |
          set +e
          env -i PATH="$PATH" HOME="$HOME" \
            python scripts/neon_migration_runner.py \
            >/tmp/runner-direct-out.txt 2>/tmp/runner-direct-error.txt
          rc=$?
          set -e
          test "$rc" -ne 0
          if grep -q 'ModuleNotFoundError' /tmp/runner-direct-error.txt; then
            cat /tmp/runner-direct-error.txt >&2
            exit 1
          fi
          grep -q 'environment is missing required PostgreSQL variables' \
            /tmp/runner-direct-error.txt
          if grep -Eqi 'password|secret|token|dsn|connection' \
            /tmp/runner-direct-out.txt /tmp/runner-direct-error.txt; then
            echo 'direct invocation error leaked forbidden connection material' >&2
            exit 1
          fi

      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'

      - name: Verify focused and complete contracts
        run: |
          ruff check scripts/neon_migration_runner.py \
            tests/test_neon_migration_runner.py \
            tests/test_neon_migration_rehearsal_workflow.py
          python -m pytest -q tests/test_neon_migration_manifest.py \
            tests/test_neon_migration_runner.py \
            tests/test_neon_migration_rehearsal_workflow.py
          ruff check .
          python -m compileall -q src scripts
          python -m pytest -q
          git diff --check 97a537cdba2e81385088b57bb02987fedb0aff14...HEAD

      - name: Commit only the verified import correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/neon_migration_runner.py
          git add -u .github/workflows
          git diff --cached --check
          git commit -m 'fix: support direct Neon runner execution'
          git push origin HEAD:ci/neon-migration-runner-v1-20260822
