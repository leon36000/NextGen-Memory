name: Harden canonical Neon manifest paths once

on:
  pull_request:

permissions:
  contents: write

jobs:
  harden-and-verify:
    if: github.event.pull_request.head.ref == 'ci/neon-migration-manifest-v1-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/neon-migration-manifest-v1-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Add canonical-path adversarial cases and guard
        run: |
          python - <<'PY'
          from pathlib import Path

          parser = Path('scripts/neon_migration_manifest.py')
          parser_lines = parser.read_text(encoding='utf-8').splitlines()
          guard_line = '        and bool(pure_path.name)'
          if parser_lines.count(guard_line) != 1:
              raise SystemExit('unexpected path guard structure')
          guard_index = parser_lines.index(guard_line)
          canonical_line = '        and pure_path.as_posix() == path'
          if canonical_line in parser_lines:
              raise SystemExit('canonical path guard already exists')
          parser_lines.insert(guard_index + 1, canonical_line)
          parser.write_text('\n'.join(parser_lines) + '\n', encoding='utf-8')

          tests = Path('tests/test_neon_migration_manifest.py')
          test_lines = tests.read_text(encoding='utf-8').splitlines()
          backslash_fragment = 'migrations\\\\neon\\\\0001_alpha.sql'
          matching = [
              index for index, line in enumerate(test_lines)
              if backslash_fragment in line
          ]
          if len(matching) != 1:
              raise SystemExit('unexpected unsafe-path test structure')
          insertion_index = matching[0] - 1
          if test_lines[insertion_index].strip() != '(':
              raise SystemExit('unsafe-path parameter block start not found')
          additions = [
              '        (',
              '            lambda entries: entries[0].update(',
              '                {"path": "migrations/neon/./0001_alpha.sql"}',
              '            ),',
              '            "safe repository-relative",',
              '        ),',
              '        (',
              '            lambda entries: entries[0].update(',
              '                {"path": "migrations//neon/0001_alpha.sql"}',
              '            ),',
              '            "safe repository-relative",',
              '        ),',
          ]
          test_lines[insertion_index:insertion_index] = additions
          tests.write_text('\n'.join(test_lines) + '\n', encoding='utf-8')
          PY
          rm .github/workflows/harden-neon-manifest-paths-once.yml
      - name: Install and verify
        run: |
          python -m pip install -e '.[dev]'
          ruff check scripts/neon_migration_manifest.py tests/test_neon_migration_manifest.py
          python -m pytest -q tests/test_neon_migration_manifest.py
          python scripts/neon_migration_manifest.py
          ruff check .
          python -m compileall -q src scripts
          python -m pytest -q
          git diff --check eada91750b5d577ec452c7f8d1fb72126abb6a54...HEAD
      - name: Commit verified canonical-path hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/neon_migration_manifest.py tests/test_neon_migration_manifest.py
          git add -u .github/workflows
          git commit -m 'fix: require canonical POSIX migration paths'
          git push origin HEAD:ci/neon-migration-manifest-v1-20260822
