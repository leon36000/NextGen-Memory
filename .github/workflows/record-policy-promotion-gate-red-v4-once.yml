name: Record advisory policy promotion gate RED v4 once

on:
  pull_request:

concurrency:
  group: advisory-policy-promotion-gate-v0-red-v4
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  record-red:
    if: github.event.pull_request.head.ref == 'feat/advisory-policy-promotion-gate-v0-20260824'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/advisory-policy-promotion-gate-v0-20260824
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'

      - name: Resolve immutable registry base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          base_sha=$(git rev-parse origin/candidate/paired-replay-experiment-registry-v0-20260824)
          test "$(git merge-base HEAD "$base_sha")" = "$base_sha"
          printf 'BASE_SHA=%s\n' "$base_sha" | tee -a "$GITHUB_ENV"

      - name: Format the embedded subprocess program as real Python
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_policy_promotion_gate_properties.py')
          source = path.read_text(encoding='utf-8')
          marker = "    script = r'''"
          start = source.index(marker)
          body_start = source.index('\n', start) + 1
          body_end = source.index("\n'''", body_start)
          Path('/tmp/policy-promotion-subprocess.py').write_text(
              source[body_start:body_end].strip() + '\n',
              encoding='utf-8',
          )
          Path('/tmp/policy-promotion-source-prefix.txt').write_text(
              source[:start],
              encoding='utf-8',
          )
          Path('/tmp/policy-promotion-source-suffix.txt').write_text(
              source[body_end + len("\n'''"):],
              encoding='utf-8',
          )
          PY

          ruff check --fix /tmp/policy-promotion-subprocess.py
          ruff format /tmp/policy-promotion-subprocess.py
          ruff check /tmp/policy-promotion-subprocess.py
          ruff format --check /tmp/policy-promotion-subprocess.py

          python - <<'PY'
          from pathlib import Path

          prefix = Path('/tmp/policy-promotion-source-prefix.txt').read_text(
              encoding='utf-8'
          )
          suffix = Path('/tmp/policy-promotion-source-suffix.txt').read_text(
              encoding='utf-8'
          )
          embedded = Path('/tmp/policy-promotion-subprocess.py').read_text(
              encoding='utf-8'
          ).rstrip()
          replacement = "    script = r'''\n" + embedded + "\n'''"
          Path('tests/test_policy_promotion_gate_properties.py').write_text(
              prefix + replacement + suffix,
              encoding='utf-8',
          )
          PY

      - name: Normalize and statically prove the tests-only contract
        shell: bash
        run: |
          set -euo pipefail
          files=(
            tests/test_policy_promotion_gate.py
            tests/test_policy_promotion_gate_properties.py
            tests/test_policy_promotion_gate_public_api.py
          )
          ruff check --fix "${files[@]}"
          ruff format "${files[@]}"
          ruff check "${files[@]}"
          ruff format --check "${files[@]}"
          python -m py_compile "${files[@]}"
          git diff --check

      - name: Build an isolated base-plus-tests-only worktree
        shell: bash
        run: |
          set -euo pipefail
          red_root="$RUNNER_TEMP/advisory-policy-promotion-red"
          rm -rf "$red_root"
          git worktree add --detach "$red_root" "$BASE_SHA"
          mkdir -p "$red_root/tests" "$red_root/docs"
          cp tests/test_policy_promotion_gate.py "$red_root/tests/"
          cp tests/test_policy_promotion_gate_properties.py "$red_root/tests/"
          cp tests/test_policy_promotion_gate_public_api.py "$red_root/tests/"
          cat > "$red_root/docs/policy-promotion-gate-v0-red.md" <<EOF
          # Advisory Policy Promotion Gate v0 — TDD RED Evidence

          **Date:** 2026-08-24
          **Base branch:** \`candidate/paired-replay-experiment-registry-v0-20260824\`
          **Base SHA:** \`$BASE_SHA\`
          **TDD branch:** \`tdd/advisory-policy-promotion-gate-v0-red-20260824\`

          All three tests-only contract files are Ruff-clean and syntactically valid. In an isolated worktree at the immutable base SHA, pytest collection fails only because \`nextgen_memory.policy_promotion_gate\` does not exist. The implementation module and package-root exports are absent.

          This RED fixes the advisory decision, hard-rejection precedence, hold conditions, identity drift, threshold neighborhoods, registry completeness, generated properties, canonical JSON, privacy, retries, process-hash-seed invariance, and public API before implementation qualification.
          EOF
          sed -i 's/^          //' "$red_root/docs/policy-promotion-gate-v0-red.md"

      - name: Prove the precise module-absence RED
        shell: bash
        run: |
          set -euo pipefail
          red_root="$RUNNER_TEMP/advisory-policy-promotion-red"
          cd "$red_root"
          test ! -e src/nextgen_memory/policy_promotion_gate.py
          if grep -F 'policy_promotion_gate' src/nextgen_memory/__init__.py; then
            echo 'base package root unexpectedly exports the absent module' >&2
            exit 1
          fi

          set +e
          PYTHONPATH="$PWD/src" python -m pytest -q \
            tests/test_policy_promotion_gate.py \
            tests/test_policy_promotion_gate_properties.py \
            tests/test_policy_promotion_gate_public_api.py \
            > /tmp/advisory-policy-promotion-red.txt 2>&1
          red_rc=$?
          set -e
          cat /tmp/advisory-policy-promotion-red.txt
          test "$red_rc" -ne 0
          test "$(grep -c '^ERROR collecting ' /tmp/advisory-policy-promotion-red.txt)" -eq 3
          test "$(grep -c "^E   ModuleNotFoundError: No module named 'nextgen_memory.policy_promotion_gate'" /tmp/advisory-policy-promotion-red.txt)" -eq 3
          unexpected=$(grep '^E   ' /tmp/advisory-policy-promotion-red.txt \
            | grep -Fv "E   ModuleNotFoundError: No module named 'nextgen_memory.policy_promotion_gate'" \
            || true)
          test -z "$unexpected"
          if grep -E 'SyntaxError|IndentationError|NameError|ImportError:' \
            /tmp/advisory-policy-promotion-red.txt; then
            echo 'RED contains an unintended failure class' >&2
            exit 1
          fi

      - name: Publish immutable deterministic RED branch
        shell: bash
        run: |
          set -euo pipefail
          red_root="$RUNNER_TEMP/advisory-policy-promotion-red"
          red_branch='tdd/advisory-policy-promotion-gate-v0-red-20260824'
          cd "$red_root"
          git add \
            docs/policy-promotion-gate-v0-red.md \
            tests/test_policy_promotion_gate.py \
            tests/test_policy_promotion_gate_properties.py \
            tests/test_policy_promotion_gate_public_api.py
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            docs/policy-promotion-gate-v0-red.md
            tests/test_policy_promotion_gate.py
            tests/test_policy_promotion_gate_properties.py
            tests/test_policy_promotion_gate_public_api.py
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}")

          proposed_tree=$(git write-tree)
          remote_sha=$(git ls-remote --heads origin "$red_branch" | awk '{print $1}')
          if [ -n "$remote_sha" ]; then
            git fetch --no-tags origin "+refs/heads/$red_branch:refs/remotes/origin/$red_branch"
            remote_tree=$(git rev-parse "origin/$red_branch^{tree}")
            test "$remote_tree" = "$proposed_tree"
            red_sha=$remote_sha
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'test: record advisory policy promotion gate RED'
            red_sha=$(git rev-parse HEAD)
            git push origin "$red_sha:refs/heads/$red_branch"
          fi
          printf 'RED_SHA=%s\n' "$red_sha" | tee -a "$GITHUB_ENV"

      - name: Commit normalized tests and remove all obsolete RED transports
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -f \
            .github/workflows/record-policy-promotion-gate-red-once.yml \
            .github/workflows/record-policy-promotion-gate-red-v3-once.yml \
            .github/workflows/record-policy-promotion-gate-red-v4-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: normalize advisory policy promotion gate contract'
          git push origin HEAD:feat/advisory-policy-promotion-gate-v0-20260824
