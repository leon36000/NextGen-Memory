name: Format Inherited Rerank Telemetry RED

on:
  push:
    branches: [bootstrap/inherited-rerank-telemetry-red-format]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/inherited-rerank-telemetry-v0
          fetch-depth: 0
      - name: Verify guarded target head
        run: test "$(git rev-parse HEAD)" = "7639b02962fa4283e08265269225d5d7ce7053ba"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Apply import-only correction
        run: ruff check tests/test_inherited_rerank_telemetry.py --select I001 --fix
      - name: Require lint GREEN and exact missing-module RED
        run: |
          ruff check .
          set +e
          python -m pytest tests/test_inherited_rerank_telemetry.py -q > /tmp/red.txt 2>&1
          status=$?
          set -e
          cat /tmp/red.txt
          test "$status" -ne 0
          grep -F "No module named 'nextgen_memory.inherited_rerank_telemetry'" /tmp/red.txt
      - name: Verify exact scope
        run: |
          test "$(git diff --name-only)" = "tests/test_inherited_rerank_telemetry.py"
          git diff --check
      - name: Commit and push fast-forward
        run: |
          git config user.name "NextGen Memory Automation"
          git config user.email "actions@users.noreply.github.com"
          git add tests/test_inherited_rerank_telemetry.py
          git commit -m "style: normalize inherited rerank telemetry RED imports"
          git push origin HEAD:feat/inherited-rerank-telemetry-v0
