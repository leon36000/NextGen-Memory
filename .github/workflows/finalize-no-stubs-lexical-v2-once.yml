name: Finalize lexical AST no-stubs scanner v2 once

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'fix/no-stubs-lexical-green-20260823'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/no-stubs-lexical-green-20260823
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'

      - name: Recover the already-tested scanner payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import re
          from pathlib import Path

          transport = Path('.github/workflows/finalize-no-stubs-lexical-once.yml')
          source = transport.read_text(encoding='utf-8')
          match = re.search(r'payload = """([A-Za-z0-9+/=]+)"""', source)
          if match is None:
              raise SystemExit('tested scanner payload not found')
          scanner = gzip.decompress(base64.b64decode(match.group(1)))
          if len(scanner) != 22486:
              raise SystemExit(f'unexpected scanner byte length: {len(scanner)}')
          destination = Path('scripts/verify_no_stubs.py')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_bytes(scanner)
          PY
          test "$(sha256sum scripts/verify_no_stubs.py | awk '{print $1}')" = \
            'ae71c71121d0efd23936d0a0fedb57ff0e3f412bfcaec601d88d2145e4352866'

      - name: Write the permanent read-only matrix workflow safely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          matrix_expression = '$' + '{{ matrix.python-version }}'
          workflow = f'''name: AST no-stubs contract

          on:
            pull_request:
              paths:
                - "src/**"
                - "scripts/verify_no_stubs.py"
                - "tests/test_no_stubs.py"
                - "tests/test_no_stubs_workflow.py"
                - "tests/test_no_stubs_exception_shadowing.py"
                - "tests/test_no_stubs_protocol_shadowing.py"
                - ".github/workflows/no-stubs.yml"

          permissions:
            contents: read

          jobs:
            verify:
              runs-on: ubuntu-24.04
              strategy:
                fail-fast: false
                matrix:
                  python-version: ["3.12", "3.13"]
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: {matrix_expression}
                    cache: pip
                - name: Install project and development tools
                  run: python -m pip install -e '.[dev]'
                - name: Focused scanner contracts
                  run: python -m pytest -q tests/test_no_stubs.py tests/test_no_stubs_workflow.py tests/test_no_stubs_exception_shadowing.py tests/test_no_stubs_protocol_shadowing.py
                - name: Scan production source
                  run: python scripts/verify_no_stubs.py src
                - name: Static integrity
                  run: |
                    ruff check scripts/verify_no_stubs.py tests/test_no_stubs.py tests/test_no_stubs_workflow.py tests/test_no_stubs_exception_shadowing.py tests/test_no_stubs_protocol_shadowing.py
                    python -m compileall -q src scripts
          '''
          normalized = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in workflow.splitlines()
          ).lstrip('\n')
          destination = Path('.github/workflows/no-stubs.yml')
          destination.write_text(normalized, encoding='utf-8')
          PY
          grep -F 'python-version: ${{ matrix.python-version }}' \
            .github/workflows/no-stubs.yml >/dev/null

      - name: Remove every one-shot transport
        run: |
          rm -f \
            .github/workflows/no-stubs-patch-once.yml \
            .github/workflows/no-stubs-shadowing-patch-once.yml \
            .github/workflows/finalize-no-stubs-lexical-once.yml \
            .github/workflows/finalize-no-stubs-lexical-v2-once.yml

      - name: Normalize bounded candidate files
        run: |
          ruff format \
            scripts/verify_no_stubs.py \
            tests/test_no_stubs.py \
            tests/test_no_stubs_exception_shadowing.py \
            tests/test_no_stubs_protocol_shadowing.py \
            tests/test_no_stubs_workflow.py
          ruff check --fix \
            scripts/verify_no_stubs.py \
            tests/test_no_stubs.py \
            tests/test_no_stubs_exception_shadowing.py \
            tests/test_no_stubs_protocol_shadowing.py \
            tests/test_no_stubs_workflow.py

      - name: Focused scanner verification
        run: |
          python -m pytest -q \
            tests/test_no_stubs.py \
            tests/test_no_stubs_workflow.py \
            tests/test_no_stubs_exception_shadowing.py \
            tests/test_no_stubs_protocol_shadowing.py

      - name: Production self-scan and canonical privacy proof
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_no_stubs.py src > /tmp/no-stubs.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/no-stubs.json')
          raw = path.read_text(encoding='utf-8')
          report = json.loads(raw)
          expected = {"finding_count": 0, "findings": []}
          if report != expected:
              raise SystemExit(f'unexpected production findings: {report!r}')
          canonical = json.dumps(
              report,
              ensure_ascii=False,
              sort_keys=True,
              separators=(',', ':'),
          ) + '\n'
          if raw != canonical:
              raise SystemExit('scanner output is not canonical JSON')
          PY
          if grep -Eqi '/home/runner|password|secret|token|dsn|connection|postgresql://' /tmp/no-stubs.json; then
            echo 'scanner report leaked forbidden runtime material' >&2
            exit 1
          fi

      - name: Repository-wide verification
        run: |
          ruff check .
          python -m compileall -q src scripts
          python -m pytest -q
          git diff --check 93cce924debb9ae2ff46d71b2e8fa043f4cefa0b

      - name: Stage and prove exact six-path final product surface
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          mapfile -t changed < <(git diff --cached --name-only \
            93cce924debb9ae2ff46d71b2e8fa043f4cefa0b | sort)
          expected=(
            .github/workflows/no-stubs.yml
            scripts/verify_no_stubs.py
            tests/test_no_stubs.py
            tests/test_no_stubs_exception_shadowing.py
            tests/test_no_stubs_protocol_shadowing.py
            tests/test_no_stubs_workflow.py
          )
          printf 'final_changed_paths=%s\n' "${#changed[@]}"
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) \
            <(printf '%s\n' "${changed[@]}")
          test -z "$(git diff --cached --name-only \
            93cce924debb9ae2ff46d71b2e8fa043f4cefa0b -- \
            'src/**' 'migrations/**' pyproject.toml)"
          git diff --cached --check

      - name: Commit only the verified final candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: classify no-stubs exemptions lexically'
          git push origin HEAD:fix/no-stubs-lexical-green-20260823
