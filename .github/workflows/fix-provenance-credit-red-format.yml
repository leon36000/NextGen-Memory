name: Normalize Provenance Credit RED test imports

on:
  push:
    branches: [bootstrap/provenance-credit-red-format]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/provenance-credit-v0
          fetch-depth: 0
      - name: Verify target head
        run: test "$(git rev-parse HEAD)" = "24c0bdb601d4aadf411cf212bfdb8024baff3605"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Apply import-only Ruff fix
        run: ruff check tests/test_provenance_credit.py --select I001 --fix
      - name: Verify scope and lint
        run: |
          ruff check tests/test_provenance_credit.py
          git diff --check
          test "$(git diff --name-only)" = "tests/test_provenance_credit.py"
      - name: Commit and push fast-forward
        run: |
          git config user.name "NextGen Memory Automation"
          git config user.email "actions@users.noreply.github.com"
          git add tests/test_provenance_credit.py
          git commit -m "style: normalize provenance credit RED imports"
          git push origin HEAD:feat/provenance-credit-v0
