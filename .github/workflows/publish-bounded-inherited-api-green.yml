name: Verify RED and publish Bounded Inherited API

on:
  push:
    branches: [bootstrap/bounded-inherited-api-green]

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bounded-inherited-reranker-v0
          fetch-depth: 0

      - name: Guard the checked-out feature head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT=$(gh api repos/${{ github.repository }}/git/ref/heads/feat/bounded-inherited-reranker-v0 --jq '.object.sha')
          test "$(git rev-parse HEAD)" = "$CURRENT"
          echo "TARGET_SHA=$CURRENT" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install development tools
        run: python -m pip install -e '.[dev]'

      - name: Normalize feature-local formatting
        run: |
          ruff format \
            src/nextgen_memory/bounded_inherited_reranker.py \
            tests/test_bounded_inherited_reranker.py \
            tests/test_bounded_inherited_reranker_properties.py \
            tests/test_bounded_inherited_reranker_simulation.py \
            tests/test_bounded_inherited_reranker_public_api.py \
            scripts/simulate_bounded_inherited_reranker_v0.py
          ruff check \
            src/nextgen_memory/bounded_inherited_reranker.py \
            tests/test_bounded_inherited_reranker.py \
            tests/test_bounded_inherited_reranker_properties.py \
            tests/test_bounded_inherited_reranker_simulation.py \
            tests/test_bounded_inherited_reranker_public_api.py \
            scripts/simulate_bounded_inherited_reranker_v0.py \
            --fix
          ruff check .

      - name: Require internal GREEN before public export
        run: |
          set -euo pipefail
          python -m pytest \
            tests/test_bounded_inherited_reranker.py \
            tests/test_bounded_inherited_reranker_properties.py \
            tests/test_bounded_inherited_reranker_simulation.py \
            -q
          python scripts/simulate_bounded_inherited_reranker_v0.py > /tmp/simulation.json
          jq -e '.naive_false_promotions == 4' /tmp/simulation.json
          jq -e '.bounded_false_promotions == 0' /tmp/simulation.json
          jq -e '.bounded_strong_promotions == 1' /tmp/simulation.json

      - name: Require exact public API RED
        run: |
          set +e
          python -m pytest tests/test_bounded_inherited_reranker_public_api.py -q > /tmp/api-red.txt 2>&1
          STATUS=$?
          set -e
          cat /tmp/api-red.txt
          test "$STATUS" -ne 0
          grep -F 'test_package_exports_stable_bounded_inherited_reranker_v0_api' /tmp/api-red.txt
          grep -E 'AttributeError|has no attribute' /tmp/api-red.txt
          test "$(grep -Eo '[0-9]+ failed' /tmp/api-red.txt | tail -n 1 | awk '{print $1}')" = '1'

      - name: Add only the stable public exports
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          path = Path('src/nextgen_memory/__init__.py')
          text = path.read_text(encoding='utf-8')
          import_block = '''from .bounded_inherited_reranker import (
              BoundedInheritedReranker,
              BoundedInheritedRerankerConfig,
              BoundedInheritedRerankerValidationError,
              InheritedAwareRerankedMemory,
              InheritedEvidenceDisposition,
              InheritedScoreBreakdown,
          )
          '''
          import_block = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in import_block.splitlines()
          ) + '\n'
          if 'from .bounded_inherited_reranker import (' not in text:
              marker = 'from .causal_credit import ('
              if text.count(marker) != 1:
                  raise SystemExit('unable to locate stable import insertion point')
              text = text.replace(marker, import_block + marker, 1)

          module = ast.parse(text)
          assignment = next(
              node
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(
                  isinstance(target, ast.Name) and target.id == '__all__'
                  for target in node.targets
              )
          )
          if not isinstance(assignment.value, (ast.List, ast.Tuple)):
              raise SystemExit('__all__ is not a static sequence')
          current = [ast.literal_eval(item) for item in assignment.value.elts]
          additions = [
              'BoundedInheritedReranker',
              'BoundedInheritedRerankerConfig',
              'BoundedInheritedRerankerValidationError',
              'InheritedAwareRerankedMemory',
              'InheritedEvidenceDisposition',
              'InheritedScoreBreakdown',
          ]
          names = sorted(set(current).union(additions))
          replacement = '__all__ = [\n' + ''.join(
              f'    {name!r},\n' for name in names
          ) + ']'
          lines = text.splitlines()
          lines[assignment.lineno - 1 : assignment.end_lineno] = (
              replacement.splitlines()
          )
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          ruff format src/nextgen_memory/__init__.py
          ruff check src/nextgen_memory/__init__.py --fix

      - name: Verify final GREEN on the complete tree
        run: |
          set -euo pipefail
          ruff check .
          python -m pytest -q
          python -m compileall -q src
          git diff --check
          BASE=$(git merge-base HEAD origin/feat/learning-evidence-reader-v0)
          test -z "$(git diff --name-only "$BASE...HEAD" -- src/nextgen_memory/utility_reranker.py src/nextgen_memory/neon_utility.py migrations)"

      - name: Commit and push fast-forward
        run: |
          set -euo pipefail
          git config user.name 'NextGen Memory Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            src/nextgen_memory/__init__.py \
            src/nextgen_memory/bounded_inherited_reranker.py \
            tests/test_bounded_inherited_reranker.py \
            tests/test_bounded_inherited_reranker_properties.py \
            tests/test_bounded_inherited_reranker_simulation.py \
            tests/test_bounded_inherited_reranker_public_api.py \
            scripts/simulate_bounded_inherited_reranker_v0.py
          git commit -m 'feat: publish bounded inherited reranker v0 API'
          test "$(git rev-parse HEAD^)" = "$TARGET_SHA"
          git push origin HEAD:feat/bounded-inherited-reranker-v0
