name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.ref == 'fix/shapley-order-enumeration-guard-20260821'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shapley-order-enumeration-guard-20260821
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply exact bounded-order patch
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          path = Path('src/nextgen_memory/interaction_credit.py')
          source = path.read_text(encoding='utf-8')
          start_marker = '    def _resolve_orders(\n'
          end_marker = '\n    @staticmethod\n    def _validate_trials('
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('unexpected _resolve_orders structure')
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          replacement = indent(
              dedent(
                  '''\
          def _resolve_orders(
              self,
              graph: MemoryDependencyGraph,
              orders: Sequence[Sequence[UUID]] | None,
          ) -> tuple[tuple[tuple[UUID, ...], ...], InteractionEstimationMode]:
              player_count = len(graph.players)
              if orders is None:
                  if player_count > self.config.exact_player_limit:
                      raise ValueError(
                          "sampled orders are required above exact_player_limit"
                      )
                  return graph.topological_orders(), InteractionEstimationMode.EXACT

              normalized = tuple(tuple(order) for order in orders)
              if not normalized:
                  raise ValueError("at least one sampled order is required")
              if len(normalized) > self.config.max_sampled_orders:
                  raise ValueError("orders exceed max_sampled_orders")
              if len(set(normalized)) != len(normalized):
                  raise ValueError("orders must not contain duplicates")
              if any(not graph.is_valid_order(order) for order in normalized):
                  raise ValueError("every order must be a valid topological order")
              normalized = tuple(sorted(normalized, key=_order_sort_key))
              if player_count > self.config.exact_player_limit:
                  return normalized, InteractionEstimationMode.SAMPLED

              all_orders = graph.topological_orders()
              mode = (
                  InteractionEstimationMode.EXACT
                  if normalized == all_orders
                  else InteractionEstimationMode.SAMPLED
              )
              return normalized, mode
          '''
              ),
              '    ',
          )
          updated = source[:start] + replacement + source[end:]
          if updated == source or updated.count('player_count = len(graph.players)') != 1:
              raise SystemExit('bounded-order patch was not applied exactly once')
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Restore ordinary CI definition and remove transport workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          ordinary = '''name: CI

          on:
            push:
              branches: [main]
            pull_request:

          permissions:
            contents: read

          jobs:
            test:
              runs-on: ubuntu-latest
              strategy:
                matrix:
                  python-version: ["3.12", "3.13"]
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: __MATRIX_VERSION__
                    cache: pip
                - name: Install project and development tools
                  run: python -m pip install -e '.[dev]'
                - name: Lint
                  run: ruff check .
                - name: Test
                  run: python -m pytest -q
          '''
          matrix_expression = '$' + '{{ matrix.python-version }}'
          Path('.github/workflows/ci.yml').write_text(
              ordinary.replace('__MATRIX_VERSION__', matrix_expression),
              encoding='utf-8',
          )
          Path('.github/workflows/shapley-patch-once.yml').unlink(missing_ok=True)
          PY
      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'
      - name: Focused verification
        run: python -m pytest -q tests/test_shapley_order_resolution_complexity.py tests/test_precedence_shapley.py
      - name: Lint
        run: ruff check .
      - name: Full suite
        run: python -m pytest -q
      - name: Diff integrity
        run: git diff --check
      - name: Commit verified patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nextgen_memory/interaction_credit.py .github/workflows/ci.yml
          git add -u .github/workflows
          git commit -m 'fix: avoid factorial Shapley order enumeration'
          git push origin HEAD:fix/shapley-order-enumeration-guard-20260821
