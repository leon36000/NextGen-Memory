name: Export exact review attestation candidate r2 for independent audit

on:
  push:
    branches:
      - bootstrap/export-exact-review-attestation-candidate-20260826

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 008005072f412ecda1bf461f4e875de72c5b808f
          fetch-depth: 0

      - name: Prove exact identity and product surface
        shell: bash
        run: |
          set -euo pipefail
          candidate='008005072f412ecda1bf461f4e875de72c5b808f'
          base='f4f3aca9759b5b7a60691017c2211152c011ea92'
          test "$(git rev-parse HEAD)" = "$candidate"
          test "$(git merge-base "$base" "$candidate")" = "$base"
          mapfile -t changed < <(git diff --name-only "$base"..."$candidate" | sort)
          expected=(
            docs/exact-sha-review-attestation-registry-v0-red.md
            docs/exact-sha-review-attestation-registry-v0.md
            docs/superpowers/plans/2026-08-24-exact-sha-review-attestation-registry-v0.md
            docs/superpowers/specs/2026-08-24-exact-sha-review-attestation-registry-v0-design.md
            src/nextgen_memory/__init__.py
            src/nextgen_memory/review_attestation_registry.py
            tests/test_review_attestation_registry.py
            tests/test_review_attestation_registry_properties.py
            tests/test_review_attestation_registry_public_api.py
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}")
          git diff --check "$base"..."$candidate"
          jq -n \
            --arg schema 'm-head-exact-review-attestation-candidate-export-v2' \
            --arg repository '${{ github.repository }}' \
            --arg candidate_sha "$candidate" \
            --arg candidate_tree_sha "$(git rev-parse "$candidate^{tree}")" \
            --arg base_sha "$base" \
            --arg base_tree_sha "$(git rev-parse "$base^{tree}")" \
            --argjson paths "$(printf '%s\n' "${changed[@]}" | jq -R . | jq -s .)" \
            '{schema:$schema,repository:$repository,candidate_sha:$candidate_sha,candidate_tree_sha:$candidate_tree_sha,base_sha:$base_sha,base_tree_sha:$base_tree_sha,exact_path_count:($paths|length),paths:$paths}' \
            > /tmp/candidate-export-manifest.json
          cat /tmp/candidate-export-manifest.json

      - name: Create deterministic Git archive
        shell: bash
        run: |
          set -euo pipefail
          git archive \
            --format=tar.gz \
            --prefix=NextGen-Memory-00800507/ \
            --output=/tmp/nextgen-memory-00800507.tar.gz \
            008005072f412ecda1bf461f4e875de72c5b808f
          sha256sum /tmp/nextgen-memory-00800507.tar.gz \
            > /tmp/nextgen-memory-00800507.tar.gz.sha256
          cat /tmp/nextgen-memory-00800507.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: exact-review-attestation-candidate-00800507
          path: |
            /tmp/candidate-export-manifest.json
            /tmp/nextgen-memory-00800507.tar.gz
            /tmp/nextgen-memory-00800507.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
