name: Publish Inherited Rerank Telemetry API GREEN

on:
  push:
    branches: [bootstrap/inherited-rerank-telemetry-api-green]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/inherited-rerank-telemetry-v0
          fetch-depth: 0

      - name: Verify guarded feature head
        run: test "$(git rev-parse HEAD)" = "03ee35ff58aae0d55377bcca9c213a9e2ddc33d4"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development tools
        run: python -m pip install -e '.[dev]'

      - name: Add only stable telemetry exports
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          path = Path("src/nextgen_memory/__init__.py")
          text = path.read_text(encoding="utf-8")
          import_block = '''from .inherited_rerank_telemetry import (
              InMemoryInheritedRerankTelemetrySink,
              InheritedRerankObservation,
              InheritedRerankSummary,
              InheritedRerankTelemetryBatch,
              InheritedRerankTelemetryConflictError,
              InheritedRerankTelemetrySink,
              InheritedRerankTelemetryValidationError,
              build_inherited_rerank_telemetry,
              fingerprint_bounded_inherited_policy,
          )
          '''
          import_block = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in import_block.splitlines()
          ) + "\n"
          if "from .inherited_rerank_telemetry import (" not in text:
              marker = "from .interaction_credit import ("
              if text.count(marker) != 1:
                  raise SystemExit("unable to locate import insertion point")
              text = text.replace(marker, import_block + marker, 1)

          module = ast.parse(text)
          assignment = next(
              node
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(
                  isinstance(target, ast.Name) and target.id == "__all__"
                  for target in node.targets
              )
          )
          if not isinstance(assignment.value, (ast.List, ast.Tuple)):
              raise SystemExit("__all__ is not a static sequence")
          current = [ast.literal_eval(item) for item in assignment.value.elts]
          additions = [
              "InMemoryInheritedRerankTelemetrySink",
              "InheritedRerankObservation",
              "InheritedRerankSummary",
              "InheritedRerankTelemetryBatch",
              "InheritedRerankTelemetryConflictError",
              "InheritedRerankTelemetrySink",
              "InheritedRerankTelemetryValidationError",
              "build_inherited_rerank_telemetry",
              "fingerprint_bounded_inherited_policy",
          ]
          names = sorted(set(current).union(additions))
          replacement = "__all__ = [\n" + "".join(
              f"    {name!r},\n" for name in names
          ) + "]"
          lines = text.splitlines()
          lines[assignment.lineno - 1 : assignment.end_lineno] = (
              replacement.splitlines()
          )
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          ruff format src/nextgen_memory/__init__.py
          ruff check src/nextgen_memory/__init__.py --fix

      - name: Verify public and complete GREEN
        run: |
          ruff check .
          python -m pytest tests/test_inherited_rerank_telemetry_public_api.py -q
          python -m pytest -q
          python -m compileall -q src
          git diff --check

      - name: Verify exact publication scope
        run: test "$(git diff --name-only)" = "src/nextgen_memory/__init__.py"

      - name: Commit and push fast-forward
        run: |
          git config user.name "NextGen Memory Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/nextgen_memory/__init__.py
          git commit -m "feat: export inherited rerank telemetry v0 API"
          git push origin HEAD:feat/inherited-rerank-telemetry-v0
