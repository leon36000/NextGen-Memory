name: Verify Bounded Inherited Reranker GREEN 1

on:
  push:
    branches: [bootstrap/bounded-inherited-green-check-1]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bounded-inherited-reranker-v0
          fetch-depth: 0
      - name: Capture guarded feature SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT=$(gh api repos/${{ github.repository }}/git/ref/heads/feat/bounded-inherited-reranker-v0 --jq '.object.sha')
          test "$(git rev-parse HEAD)" = "$CURRENT"
          echo "TARGET_SHA=$CURRENT" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Apply mechanical formatting in disposable workspace
        run: |
          ruff format \
            src/nextgen_memory/bounded_inherited_reranker.py \
            tests/test_bounded_inherited_reranker.py
          ruff check \
            src/nextgen_memory/bounded_inherited_reranker.py \
            tests/test_bounded_inherited_reranker.py \
            --fix
      - name: Verify focused and complete GREEN
        run: |
          set -euo pipefail
          ruff check .
          python -m pytest tests/test_bounded_inherited_reranker.py -q
          python -m pytest -q
          python -m compileall -q src
          git diff --check
      - name: Verify correction scope
        run: |
          git diff --name-only | sort > /tmp/actual
          if [ -s /tmp/actual ]; then
            cat > /tmp/allowed <<'EOF'
          src/nextgen_memory/bounded_inherited_reranker.py
          tests/test_bounded_inherited_reranker.py
          EOF
            while read -r path; do grep -Fx "$path" /tmp/allowed >/dev/null; done < /tmp/actual
          fi
      - name: Publish formatting correction when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'NextGen Memory Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/nextgen_memory/bounded_inherited_reranker.py tests/test_bounded_inherited_reranker.py
          git commit -m 'style: format bounded inherited reranker v0'
          test "$(git rev-parse HEAD^)" = "$TARGET_SHA"
          git push origin HEAD:feat/bounded-inherited-reranker-v0
