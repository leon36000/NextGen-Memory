name: Verify Inherited Rerank Telemetry API RED

on:
  push:
    branches: [bootstrap/inherited-rerank-telemetry-api-red]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/inherited-rerank-telemetry-v0
          fetch-depth: 0

      - name: Verify guarded feature head
        run: test "$(git rev-parse HEAD)" = "8a91c777626a2e072bbf230121a0c00629c6f10f"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development tools
        run: python -m pip install -e '.[dev]'

      - name: Normalize public API test imports
        run: ruff check tests/test_inherited_rerank_telemetry_public_api.py --select I001 --fix

      - name: Require internal GREEN
        run: |
          ruff check .
          python -m pytest \
            --ignore=tests/test_inherited_rerank_telemetry_public_api.py \
            -q

      - name: Require exact public API RED
        run: |
          set +e
          python -m pytest tests/test_inherited_rerank_telemetry_public_api.py -q > /tmp/api-red.txt 2>&1
          status=$?
          set -e
          cat /tmp/api-red.txt
          test "$status" -ne 0
          grep -F 'test_package_exports_stable_inherited_rerank_telemetry_v0_api' /tmp/api-red.txt
          grep -E 'AttributeError|has no attribute' /tmp/api-red.txt
          test "$(grep -Eo '[0-9]+ failed' /tmp/api-red.txt | tail -n 1 | awk '{print $1}')" = "1"

      - name: Verify exact correction scope
        run: |
          test "$(git diff --name-only)" = "tests/test_inherited_rerank_telemetry_public_api.py"
          git diff --check

      - name: Commit and push formatting correction
        run: |
          git config user.name "NextGen Memory Automation"
          git config user.email "actions@users.noreply.github.com"
          git add tests/test_inherited_rerank_telemetry_public_api.py
          git commit -m "style: normalize inherited rerank telemetry API imports"
          git push origin HEAD:feat/inherited-rerank-telemetry-v0
