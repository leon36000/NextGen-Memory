name: Export PR5 workspace

on:
  push:
    branches: [bootstrap/export-execution-ledger-pr5]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact source tree
        uses: actions/upload-artifact@v4
        with:
          name: nextgen-memory-pr5-05c7
          path: .
          include-hidden-files: true
          retention-days: 1
