name: Rebuild bounded inherited fixtures v3

on:
  push:
    branches: [bootstrap/rebuild-bounded-inherited-fixtures-v3]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bounded-inherited-reranker-v0
          fetch-depth: 0

      - name: Verify guarded feature head
        run: test "$(git rev-parse HEAD)" = "aa683e2135df6e4e0250b5c7fd8e6516ddbbb458"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development tools
        run: python -m pip install -e '.[dev]'

      - name: Reuse the reviewed AST fixture rebuild
        run: |
          git fetch origin bootstrap/rebuild-bounded-inherited-fixtures-v2
          git show origin/bootstrap/rebuild-bounded-inherited-fixtures-v2:.github/workflows/rebuild-bounded-inherited-fixtures-v2.yml > /tmp/rebuild-source.yml
          python - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/rebuild-source.yml').read_text(encoding='utf-8').splitlines()
          start = next(
              index
              for index, line in enumerate(lines)
              if line == "          python - <<'PY'"
          )
          end = next(
              index
              for index in range(start + 1, len(lines))
              if lines[index] == '          PY'
          )
          code_lines = []
          for line in lines[start + 1 : end]:
              if not line.startswith('          '):
                  raise SystemExit(f'unexpected YAML indentation: {line!r}')
              code_lines.append(line[10:])
          Path('/tmp/rebuild-fixtures.py').write_text(
              '\n'.join(code_lines) + '\n',
              encoding='utf-8',
          )
          PY
          python /tmp/rebuild-fixtures.py

      - name: Apply mechanical lint cleanup and verify behavior
        run: |
          ruff format \
            tests/test_bounded_inherited_reranker.py \
            tests/test_bounded_inherited_reranker_properties.py \
            scripts/simulate_bounded_inherited_reranker_v0.py
          ruff check . --fix
          ruff check .
          python -m pytest \
            tests/test_bounded_inherited_reranker.py \
            tests/test_bounded_inherited_reranker_properties.py \
            tests/test_bounded_inherited_reranker_simulation.py \
            -q
          python -m pytest -q
          python -m compileall -q src scripts
          git diff --check

      - name: Verify exact correction scope
        run: |
          cat > /tmp/expected <<'EOF'
          scripts/simulate_bounded_inherited_reranker_v0.py
          tests/test_bounded_inherited_reranker.py
          tests/test_bounded_inherited_reranker_properties.py
          EOF
          git diff --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual

      - name: Commit and push fast-forward
        run: |
          git config user.name "NextGen Memory Automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            scripts/simulate_bounded_inherited_reranker_v0.py \
            tests/test_bounded_inherited_reranker.py \
            tests/test_bounded_inherited_reranker_properties.py
          git commit -m "test: align bounded inherited fixtures with stacked base"
          git push origin HEAD:feat/bounded-inherited-reranker-v0
