name: Rebind exact review attestation RED v4 qualifier once

on:
  pull_request:

concurrency:
  group: exact-review-attestation-red-v4-rebind
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rebind:
    if: github.event.pull_request.head.ref == 'bootstrap/qualify-exact-review-attestation-red-v4-20260825'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/qualify-exact-review-attestation-red-v4-20260825
          fetch-depth: 0

      - name: Bind qualifier to the canonical Ruff-formatted RED v4 SHA
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/qualify-exact-review-attestation-red-v4.yml'
          old='54966cca4af918ec2be7f3da158d21b82cefaaa9'
          new='130db57eaa2fe0f9809bfa672c0467ce087a8089'
          test "$(grep -Foc "$old" "$workflow")" -eq 1
          test "$(grep -Foc "$new" "$workflow")" -eq 0
          sed -i "s/$old/$new/" "$workflow"
          test "$(grep -Foc "$new" "$workflow")" -eq 1
          rm .github/workflows/rebind-exact-review-attestation-red-v4-qualifier-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'ci: bind RED v4 qualifier to canonical formatted SHA'
          git push origin HEAD:bootstrap/qualify-exact-review-attestation-red-v4-20260825
