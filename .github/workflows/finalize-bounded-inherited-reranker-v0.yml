name: Finalize Bounded Inherited Reranker v0

on:
  push:
    branches: [bootstrap/bounded-inherited-reranker-v0-finalize]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: leon36000/NextGen-Memory
      TARGET_BRANCH: feat/bounded-inherited-reranker-v0
      TARGET_SHA: 5036d90c6eed13969ada559a6fa4ccb2d9414ba4
      BASE_SHA: 0d50f92f23e326a61b13b3ef7987a1b67ea18108
      CI_RUN_ID: 31858034365
      PR_NUMBER: '15'
      MARKER_BRANCH: bootstrap/bounded-inherited-reranker-v0-finalize
    steps:
      - name: Verify exact feature head and ordinary PR matrix
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPO/git/ref/heads/$TARGET_BRANCH" --jq '.object.sha')" = "$TARGET_SHA"
          RUN=$(gh api "repos/$REPO/actions/runs/$CI_RUN_ID")
          test "$(printf '%s' "$RUN" | jq -r '.head_sha')" = "$TARGET_SHA"
          test "$(printf '%s' "$RUN" | jq -r '.event')" = 'pull_request'
          test "$(printf '%s' "$RUN" | jq -r '.conclusion')" = 'success'
          gh api "repos/$REPO/actions/runs/$CI_RUN_ID/jobs?per_page=100" > /tmp/jobs.json
          jq -e '[.jobs[] | select(.name | contains("3.12")) | .conclusion] | length > 0 and all(. == "success")' /tmp/jobs.json
          jq -e '[.jobs[] | select(.name | contains("3.13")) | .conclusion] | length > 0 and all(. == "success")' /tmp/jobs.json

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify exact diff surface and protected files
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --check "$BASE_SHA...$TARGET_SHA"
          git diff --name-only "$BASE_SHA...$TARGET_SHA" | sort > /tmp/files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          docs/bounded-inherited-reranker-v0-red.md
          docs/bounded-inherited-reranker-v0-verification.md
          docs/bounded-inherited-reranker-v0.md
          docs/superpowers/plans/2026-08-14-bounded-inherited-reranker-v0.md
          docs/superpowers/specs/2026-08-14-bounded-inherited-reranker-v0-design.md
          scripts/simulate_bounded_inherited_reranker_v0.py
          src/nextgen_memory/__init__.py
          src/nextgen_memory/bounded_inherited_reranker.py
          tests/test_bounded_inherited_reranker.py
          tests/test_bounded_inherited_reranker_properties.py
          tests/test_bounded_inherited_reranker_public_api.py
          tests/test_bounded_inherited_reranker_simulation.py
          EOF
          diff -u /tmp/expected-files.txt /tmp/files.txt
          test -z "$(git diff --name-only "$BASE_SHA...$TARGET_SHA" -- src/nextgen_memory/utility_reranker.py src/nextgen_memory/neon_utility.py migrations)"

      - name: Install development tools
        run: python -m pip install -e '.[dev]'

      - name: Reproduce lint, tests, coverage, compile and wheel
        run: |
          set -euo pipefail
          ruff check .
          python -m pytest -q
          python -m pytest --cov=nextgen_memory --cov-report=json -q
          python -m compileall -q src scripts
          python -m pip wheel . --no-deps -w /tmp/wheel
          python -m pip install --force-reinstall /tmp/wheel/*.whl
          python - <<'PY'
          from nextgen_memory import (
              BoundedInheritedReranker,
              BoundedInheritedRerankerConfig,
              BoundedInheritedRerankerValidationError,
              InheritedAwareRerankedMemory,
              InheritedEvidenceDisposition,
              InheritedScoreBreakdown,
          )
          assert BoundedInheritedReranker.__name__ == 'BoundedInheritedReranker'
          assert BoundedInheritedRerankerConfig().maximum_absolute_adjustment == 0.05
          assert BoundedInheritedRerankerValidationError.__name__.endswith('ValidationError')
          assert InheritedAwareRerankedMemory.__name__ == 'InheritedAwareRerankedMemory'
          assert InheritedEvidenceDisposition.APPLIED.value == 'applied'
          assert InheritedScoreBreakdown.__name__ == 'InheritedScoreBreakdown'
          PY
          python -m pytest --collect-only -q > /tmp/collect.txt
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/collect.txt').read_text(encoding='utf-8')
          matches = re.findall(r'(\d+) tests? collected', text)
          if not matches:
              raise SystemExit('unable to parse test count')
          Path('/tmp/tests.txt').write_text(matches[-1], encoding='utf-8')
          PY
          jq -r '.totals.percent_covered' coverage.json > /tmp/coverage.txt
          sha256sum /tmp/wheel/*.whl | awk '{print $1}' > /tmp/wheel-sha.txt

      - name: Verify deterministic simulation twice
        run: |
          set -euo pipefail
          python scripts/simulate_bounded_inherited_reranker_v0.py > /tmp/simulation-1.json
          python scripts/simulate_bounded_inherited_reranker_v0.py > /tmp/simulation-2.json
          cmp /tmp/simulation-1.json /tmp/simulation-2.json
          jq -e '.scenario_count == 5' /tmp/simulation-1.json
          jq -e '.naive_false_promotions == 4' /tmp/simulation-1.json
          jq -e '.bounded_false_promotions == 0' /tmp/simulation-1.json
          jq -e '.bounded_strong_promotions == 1' /tmp/simulation-1.json
          jq -e '.maximum_absolute_adjustment == 0.05' /tmp/simulation-1.json
          jq -e '[.scenarios[].bounded_adjustment_b | abs] | max <= 0.05' /tmp/simulation-1.json
          jq -e '[.scenarios[] | select(.name == "rare_large_value")][0].bounded_disposition_b == "below_minimum_count"' /tmp/simulation-1.json
          jq -e '[.scenarios[] | select(.name == "low_structural_confidence")][0].bounded_disposition_b == "below_minimum_confidence"' /tmp/simulation-1.json
          sha256sum /tmp/simulation-1.json | awk '{print $1}' > /tmp/simulation-sha.txt

      - name: Verify direct/inherited separation and privacy boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          module = Path('src/nextgen_memory/bounded_inherited_reranker.py').read_text(encoding='utf-8').lower()
          for forbidden in (
              'query_text', 'memory_body', 'body_text', 'command_text',
              'stdout', 'stderr', 'raw_payload', 'feedback_note',
          ):
              assert forbidden not in module, forbidden
          assert 'evidence.direct' not in module
          assert 'evidence.inherited' in module
          assert 'maximum_absolute_adjustment' in module
          assert 'utility_reranker.py' not in module
          PY
          if git diff "$BASE_SHA...$TARGET_SHA" | grep -E '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|mongodb\+srv://|postgres(ql)?://|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)'; then
            echo 'High-signal secret pattern found' >&2
            exit 1
          fi

      - name: Compute exact verification facts
        id: facts
        run: |
          echo "tests=$(cat /tmp/tests.txt)" >> "$GITHUB_OUTPUT"
          echo "coverage=$(cat /tmp/coverage.txt)" >> "$GITHUB_OUTPUT"
          echo "wheel_sha=$(cat /tmp/wheel-sha.txt)" >> "$GITHUB_OUTPUT"
          echo "simulation_sha=$(cat /tmp/simulation-sha.txt)" >> "$GITHUB_OUTPUT"

      - name: Update draft PR with exact evidence
        run: |
          cat > /tmp/pr-body.md <<EOF
          ## Résumé

          Ajoute **Bounded Inherited Reranker v0**, un second étage conservateur qui ajuste le score utility-aware uniquement avec les preuves de provenance héritées.

          La PR reste empilée sur \`feat/learning-evidence-reader-v0\`, brouillon et non fusionnée.

          ## Formule et garde-fous

          - saturation signée par \`tanh\` ;
          - shrinkage par nombre de contributions ;
          - cohérence des chemins pour pénaliser les contributions opposées ;
          - fiabilité réduite par l'incertitude conservative ;
          - confiance structurelle minimale ;
          - gates stricts de quantité et de confiance ;
          - ajustement absolu borné à **0,05** par défaut ;
          - aucun double comptage du feedback direct ;
          - ensemble candidat/preuve exactement identique ;
          - aucune modification de l'éligibilité, du reranker direct ou de la base.

          ## TDD

          - RED noyau : module de production absent ;
          - réparation des fixtures contre les contrats réels de la pile ;
          - RED API final : **304 tests réussis**, un seul échec sur l'export racine absent ;
          - GREEN final : **${{ steps.facts.outputs.tests }} tests**.

          ## Vérification GitHub Actions

          - commit exact : \`$TARGET_SHA\` ;
          - base exacte : \`$BASE_SHA\` ;
          - workflow CI : \`$CI_RUN_ID\` ;
          - Python 3.12.13 : Ruff et **305 tests** réussis ;
          - Python 3.13 : Ruff et **305 tests** réussis ;
          - conclusion globale : **success**.

          ## Propriétés et simulation

          - **10 000 classements déterministes** : cap, neutralité, scope, unicité, rangs contigus et permutations ;
          - **2 000 permutations du feedback direct** : aucun effet sur le composant hérité ;
          - scénarios : **5** ;
          - faux reclassements naïfs : **4** ;
          - faux reclassements bornés : **0** ;
          - promotion forte conservée : **1** ;
          - SHA-256 de simulation : \`${{ steps.facts.outputs.simulation_sha }}\`.

          ## Reproduction indépendante

          - couverture globale : **${{ steps.facts.outputs.coverage }} %** ;
          - compileall source et simulation : réussi ;
          - wheel construit, réinstallé et API importée ;
          - SHA-256 du wheel : \`${{ steps.facts.outputs.wheel_sha }}\` ;
          - diff exact limité aux **12 fichiers** prévus ;
          - \`utility_reranker.py\`, \`neon_utility.py\` et les migrations inchangés ;
          - scan de secrets et frontière de confidentialité : propres.

          ## Garde-fous de publication

          - aucune fusion ;
          - aucune modification de main ;
          - aucune migration ou écriture DB ;
          - aucune activation en production ;
          - apprentissage des coefficients reporté jusqu'à disposer d'évidence interventionnelle calibrée.
          EOF
          sed -i 's/^          //' /tmp/pr-body.md
          gh pr edit "$PR_NUMBER" --repo "$REPO" --body-file /tmp/pr-body.md

      - name: Persist machine-readable verification marker
        run: |
          set -euo pipefail
          jq -n \
            --argjson pull_request 15 \
            --arg head_sha "$TARGET_SHA" \
            --arg base_sha "$BASE_SHA" \
            --argjson ci_run_id "$CI_RUN_ID" \
            --argjson tests '${{ steps.facts.outputs.tests }}' \
            --argjson coverage '${{ steps.facts.outputs.coverage }}' \
            --arg wheel_sha256 '${{ steps.facts.outputs.wheel_sha }}' \
            --arg simulation_sha256 '${{ steps.facts.outputs.simulation_sha }}' \
            '{pull_request:$pull_request,branch:"feat/bounded-inherited-reranker-v0",base_sha:$base_sha,head_sha:$head_sha,ci_run_id:$ci_run_id,conclusion:"success",python:["3.12.13","3.13"],tests:$tests,coverage_percent:$coverage,property_cases:10000,direct_permutation_cases:2000,changed_files:12,wheel_sha256:$wheel_sha256,simulation:{scenario_count:5,naive_false_promotions:4,bounded_false_promotions:0,bounded_strong_promotions:1,maximum_absolute_adjustment:0.05,sha256:$simulation_sha256},protected_files_changed:false,direct_double_counted:false,database_changed:false,merged:false,verified_at:(now|todate)}' > /tmp/marker.json
          CONTENT=$(base64 -w0 /tmp/marker.json)
          PATH_NAME='bootstrap/bounded-inherited-reranker-v0-verification.json'
          EXISTING_SHA=$(gh api "repos/$REPO/contents/$PATH_NAME?ref=$MARKER_BRANCH" --jq '.sha' 2>/dev/null || true)
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "repos/$REPO/contents/$PATH_NAME" -f message='chore: record Bounded Inherited Reranker v0 verification' -f branch="$MARKER_BRANCH" -f sha="$EXISTING_SHA" -f content="$CONTENT" >/dev/null
          else
            gh api --method PUT "repos/$REPO/contents/$PATH_NAME" -f message='chore: record Bounded Inherited Reranker v0 verification' -f branch="$MARKER_BRANCH" -f content="$CONTENT" >/dev/null
          fi
