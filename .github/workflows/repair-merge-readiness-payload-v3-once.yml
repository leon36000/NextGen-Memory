name: Apply bounded merge readiness lint corrections once

on:
  pull_request:

concurrency:
  group: merge-readiness-payload-repair-v3-once
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'bootstrap/implement-merge-readiness-gate-r4v2-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/implement-merge-readiness-gate-r4v2-20260831
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply the three confirmed lint corrections only
        shell: bash
        run: |
          set -euo pipefail
          payload='.github/payloads/merge_readiness_gate.py'
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/payloads/merge_readiness_gate.py')
          source = path.read_text(encoding='utf-8')

          old_import = '''    ReviewAttestationDecision,
              ReviewAttestationRegistrySummary,
          )
          '''
          old_import = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in old_import.splitlines()
          ) + '\n'
          new_import = '''    ReviewAttestationDecision,
              ReviewAttestationRegistrySummary,
              ReviewAttestationValidationError,
          )
          '''
          new_import = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in new_import.splitlines()
          ) + '\n'
          if source.count(old_import) != 1:
              raise SystemExit(f'import anchor count={source.count(old_import)}')
          source = source.replace(old_import, new_import, 1)

          old_except = '    except Exception:\n        return False\n'
          new_except = '    except ReviewAttestationValidationError:\n        return False\n'
          if source.count(old_except) != 1:
              raise SystemExit(f'broad-except count={source.count(old_except)}')
          source = source.replace(old_except, new_except, 1)

          old_approval = '''            elif decision.state is ReviewAdvisoryState.APPROVED:
                          if not review.authentication_verified:
                              _append_once(block, MergeReadinessReason.UNAUTHENTICATED_APPROVAL)
          '''
          old_approval = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in old_approval.splitlines()
          ) + '\n'
          new_approval = '''            elif (
                          decision.state is ReviewAdvisoryState.APPROVED
                          and not review.authentication_verified
                      ):
                          _append_once(block, MergeReadinessReason.UNAUTHENTICATED_APPROVAL)
          '''
          new_approval = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in new_approval.splitlines()
          ) + '\n'
          if source.count(old_approval) != 1:
              raise SystemExit(f'approval-SIM102 count={source.count(old_approval)}')
          source = source.replace(old_approval, new_approval, 1)

          old_summary = '''        if summary_integrity and request_integrity:
              if (
                  summary.approval_count < review_request.minimum_approvals
                  or summary.missing_approval_count != 0
              ):
                  _append_once(hold, MergeReadinessReason.INSUFFICIENT_APPROVALS)
          '''
          old_summary = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in old_summary.splitlines()
          ) + '\n'
          new_summary = '''        if (
              summary_integrity
              and request_integrity
              and (
                  summary.approval_count < review_request.minimum_approvals
                  or summary.missing_approval_count != 0
              )
          ):
              _append_once(hold, MergeReadinessReason.INSUFFICIENT_APPROVALS)
          '''
          new_summary = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in new_summary.splitlines()
          ) + '\n'
          if source.count(old_summary) != 1:
              raise SystemExit(f'summary-SIM102 count={source.count(old_summary)}')
          source = source.replace(old_summary, new_summary, 1)

          path.write_text(source, encoding='utf-8')
          PY

          python -m pip install 'ruff==0.16.4'
          ruff check "$payload"
          ruff format "$payload"
          ruff check "$payload"
          ruff format --check "$payload"
          python -m py_compile "$payload"
          git diff --check
          git diff -- "$payload" | tee /tmp/payload-repair-v3.diff
          grep -F 'ReviewAttestationValidationError' /tmp/payload-repair-v3.diff >/dev/null
          grep -F 'UNAUTHENTICATED_APPROVAL' /tmp/payload-repair-v3.diff >/dev/null
          grep -F 'INSUFFICIENT_APPROVALS' /tmp/payload-repair-v3.diff >/dev/null
          if grep -E '^\+.*(TODO|FIXME|noqa|skip|xfail|NotImplemented)' /tmp/payload-repair-v3.diff; then
            echo 'unexpected weakening marker in bounded repair' >&2
            exit 1
          fi

      - name: Commit bounded repair and remove all repair transports
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/repair-merge-readiness-payload-once.yml \
            .github/workflows/repair-merge-readiness-payload-v2-once.yml \
            .github/workflows/repair-merge-readiness-payload-v3-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: make merge readiness payload lint-clean'
          git push origin HEAD:bootstrap/implement-merge-readiness-gate-r4v2-20260831
