name: Rebuild bounded inherited fixtures against stacked base

on:
  push:
    branches: [bootstrap/rebuild-bounded-inherited-fixtures]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bounded-inherited-reranker-v0
          fetch-depth: 0

      - name: Verify guarded feature head
        run: test "$(git rev-parse HEAD)" = "aa683e2135df6e4e0250b5c7fd8e6516ddbbb458"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development tools
        run: python -m pip install -e '.[dev]'

      - name: Rebuild fixture functions from the actual stacked contracts
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import textwrap
          from pathlib import Path

          def replace_top_level_function(
              path: Path,
              function_name: str,
              replacement: str,
          ) -> None:
              text = path.read_text(encoding="utf-8")
              module = ast.parse(text)
              matches = [
                  node
                  for node in module.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                  and node.name == function_name
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"{path}: expected one top-level {function_name}, found {len(matches)}"
                  )
              node = matches[0]
              if node.end_lineno is None:
                  raise SystemExit(f"{path}: no end line for {function_name}")
              lines = text.splitlines()
              new_lines = textwrap.dedent(replacement).strip("\n").splitlines()
              lines[node.lineno - 1 : node.end_lineno] = [*new_lines, ""]
              path.write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8")

          def remove_exact_line(path: Path, line: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              exact = f"{line}\n"
              count = text.count(exact)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one {label} line, found {count}"
                  )
              path.write_text(text.replace(exact, "", 1), encoding="utf-8")

          unit_path = Path("tests/test_bounded_inherited_reranker.py")
          remove_exact_line(unit_path, "    UtilityEvidence,", "UtilityEvidence import")
          replace_top_level_function(
              unit_path,
              "hit",
              '''
              def hit(
                  memory_id: UUID = MEMORY_A,
                  *,
                  rank: int = 1,
                  score: float = 0.9,
              ) -> ResearchRetrievalHit:
                  return ResearchRetrievalHit(
                      memory_id=memory_id,
                      backend_ref=f"paper:{memory_id}",
                      rank=rank,
                      score=score,
                      title=f"Paper {memory_id}",
                      source_uri=f"https://example.invalid/{memory_id}",
                      tags=("memory",),
                  )
              ''',
          )
          replace_top_level_function(
              unit_path,
              "base_result",
              '''
              def base_result(
                  memory_id: UUID = MEMORY_A,
                  *,
                  final_rank: int = 1,
                  final_score: float = 0.8,
              ) -> RerankedMemory:
                  retrieval_hit = hit(
                      memory_id,
                      rank=final_rank,
                      score=final_score,
                  )
                  return RerankedMemory(
                      hit=retrieval_hit,
                      original_rank=final_rank,
                      final_rank=final_rank,
                      final_score=final_score,
                      breakdown=UtilityScoreBreakdown(
                          relevance=final_score,
                          utility=0.0,
                          harm_risk=0.0,
                          token_cost=0.0,
                          latency_cost=0.0,
                          weighted_relevance=final_score,
                          weighted_utility=0.0,
                          weighted_harm_penalty=0.0,
                          weighted_token_penalty=0.0,
                          weighted_latency_penalty=0.0,
                      ),
                  )
              ''',
          )
          unit_text = unit_path.read_text(encoding="utf-8")
          replacements = {
              "base_result(direct_reward=-1.0)": "base_result()",
              "base_result(direct_reward=1.0)": "base_result()",
              "result.base.score_breakdown is base.score_breakdown": (
                  "result.base.breakdown is base.breakdown"
              ),
          }
          for old, new in replacements.items():
              count = unit_text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{unit_path}: expected one occurrence of {old!r}, found {count}"
                  )
              unit_text = unit_text.replace(old, new, 1)
          obsolete_assertion = (
              "    assert result.base.utility_evidence is base.utility_evidence\n"
          )
          if unit_text.count(obsolete_assertion) != 1:
              raise SystemExit(
                  f"{unit_path}: expected one obsolete utility-evidence assertion"
              )
          unit_path.write_text(
              unit_text.replace(obsolete_assertion, "", 1),
              encoding="utf-8",
          )

          property_path = Path(
              "tests/test_bounded_inherited_reranker_properties.py"
          )
          remove_exact_line(
              property_path,
              "    UtilityEvidence,",
              "UtilityEvidence import",
          )
          replace_top_level_function(
              property_path,
              "_base_result",
              '''
              def _base_result(
                  memory_id: UUID,
                  *,
                  rank: int,
                  score: float,
              ) -> RerankedMemory:
                  hit = ResearchRetrievalHit(
                      memory_id=memory_id,
                      backend_ref=f"paper:{memory_id}",
                      rank=rank,
                      score=score,
                      title=f"Paper {memory_id}",
                      source_uri=f"https://example.invalid/{memory_id}",
                      tags=("memory",),
                  )
                  return RerankedMemory(
                      hit=hit,
                      original_rank=rank,
                      final_rank=rank,
                      final_score=score,
                      breakdown=UtilityScoreBreakdown(
                          relevance=score,
                          utility=0.0,
                          harm_risk=0.0,
                          token_cost=0.0,
                          latency_cost=0.0,
                          weighted_relevance=score,
                          weighted_utility=0.0,
                          weighted_harm_penalty=0.0,
                          weighted_token_penalty=0.0,
                          weighted_latency_penalty=0.0,
                      ),
                  )
              ''',
          )
          replace_top_level_function(
              property_path,
              "_inherited_evidence",
              '''
              def _inherited_evidence(
                  rng: random.Random,
                  *,
                  timestamp: datetime,
              ) -> InheritedUtilityEvidence:
                  if rng.random() < 0.22:
                      return InheritedUtilityEvidence(
                          0,
                          None,
                          None,
                          None,
                          None,
                          None,
                      )
                  count = rng.randint(1, 30)
                  inherited_mean = rng.uniform(-2.0, 2.0)
                  value_sum = round(inherited_mean * count, 8)
                  contradiction_mass = round(
                      rng.uniform(0.0, abs(value_sum) + 3.0),
                      8,
                  )
                  absolute_value_sum = round(
                      abs(value_sum) + contradiction_mass,
                      8,
                  )
                  standard_error_sum = round(rng.uniform(0.0, 5.0), 8)
                  confidence = round(rng.uniform(0.0, 1.0), 8)
                  return InheritedUtilityEvidence(
                      contribution_count=count,
                      value_sum=value_sum,
                      absolute_value_sum=absolute_value_sum,
                      standard_error_sum=standard_error_sum,
                      minimum_structural_confidence=confidence,
                      last_credit_at=timestamp,
                  )
              ''',
          )
          property_text = property_path.read_text(encoding="utf-8")
          old_threshold = "    assert count_gated > 1000\n"
          if property_text.count(old_threshold) == 1:
              property_text = property_text.replace(
                  old_threshold,
                  "    assert count_gated > 500\n",
                  1,
              )
          property_path.write_text(property_text, encoding="utf-8")

          simulation_path = Path(
              "scripts/simulate_bounded_inherited_reranker_v0.py"
          )
          remove_exact_line(
              simulation_path,
              "    UtilityEvidence,",
              "UtilityEvidence import",
          )
          replace_top_level_function(
              simulation_path,
              "_base",
              '''
              def _base(
                  memory_id: UUID,
                  *,
                  rank: int,
                  score: float,
              ) -> RerankedMemory:
                  hit = ResearchRetrievalHit(
                      memory_id=memory_id,
                      backend_ref=f"simulation:{memory_id}",
                      rank=rank,
                      score=score,
                      title=f"Simulation {memory_id}",
                      source_uri=f"https://example.invalid/{memory_id}",
                      tags=("inherited-credit",),
                  )
                  return RerankedMemory(
                      hit=hit,
                      original_rank=rank,
                      final_rank=rank,
                      final_score=score,
                      breakdown=UtilityScoreBreakdown(
                          relevance=score,
                          utility=0.0,
                          harm_risk=0.0,
                          token_cost=0.0,
                          latency_cost=0.0,
                          weighted_relevance=score,
                          weighted_utility=0.0,
                          weighted_harm_penalty=0.0,
                          weighted_token_penalty=0.0,
                          weighted_latency_penalty=0.0,
                      ),
                  )
              ''',
          )
          PY

      - name: Format and verify the integrated correction
        run: |
          ruff format \
            tests/test_bounded_inherited_reranker.py \
            tests/test_bounded_inherited_reranker_properties.py \
            scripts/simulate_bounded_inherited_reranker_v0.py
          ruff check .
          python -m pytest \
            tests/test_bounded_inherited_reranker.py \
            tests/test_bounded_inherited_reranker_properties.py \
            tests/test_bounded_inherited_reranker_simulation.py \
            -q
          python -m pytest -q
          python -m compileall -q src scripts
          git diff --check

      - name: Verify exact correction scope
        run: |
          cat > /tmp/expected <<'EOF'
          scripts/simulate_bounded_inherited_reranker_v0.py
          tests/test_bounded_inherited_reranker.py
          tests/test_bounded_inherited_reranker_properties.py
          EOF
          git diff --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual

      - name: Commit and push fast-forward
        run: |
          git config user.name "NextGen Memory Automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            scripts/simulate_bounded_inherited_reranker_v0.py \
            tests/test_bounded_inherited_reranker.py \
            tests/test_bounded_inherited_reranker_properties.py
          git commit -m "test: align bounded inherited fixtures with stacked base"
          git push origin HEAD:feat/bounded-inherited-reranker-v0
