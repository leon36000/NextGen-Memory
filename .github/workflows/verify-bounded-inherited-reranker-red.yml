name: Verify Bounded Inherited Reranker RED

on:
  push:
    branches: [bootstrap/bounded-inherited-reranker-red]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      MARKER_BRANCH: bootstrap/bounded-inherited-reranker-red
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bounded-inherited-reranker-v0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Require Ruff GREEN
        run: ruff check .
      - name: Require exact missing-module RED
        run: |
          set +e
          python -m pytest tests/test_bounded_inherited_reranker.py -q > /tmp/red.txt 2>&1
          STATUS=$?
          set -e
          cat /tmp/red.txt
          test "$STATUS" -ne 0
          grep -F "No module named 'nextgen_memory.bounded_inherited_reranker'" /tmp/red.txt
          grep -E '1 error|1 failed' /tmp/red.txt
          if grep -E 'E[0-9]{3}|F[0-9]{3}' /tmp/red.txt; then
            echo 'Unexpected lint-style failure in pytest output' >&2
            exit 1
          fi
      - name: Verify protected files remain unchanged in feature diff
        run: |
          BASE=$(git merge-base HEAD origin/feat/learning-evidence-reader-v0)
          test -z "$(git diff --name-only "$BASE...HEAD" -- src/nextgen_memory/utility_reranker.py src/nextgen_memory/neon_utility.py migrations)"
      - name: Persist RED marker
        run: |
          jq -n \
            --arg feature_sha "$(git rev-parse HEAD)" \
            '{feature_branch:"feat/bounded-inherited-reranker-v0",feature_sha:$feature_sha,ruff:true,expected_error:"ModuleNotFoundError: nextgen_memory.bounded_inherited_reranker",direct_reranker_changed:false,node_utility_reader_changed:false,migration_changed:false,verified_at:(now|todate)}' > /tmp/marker.json
          CONTENT=$(base64 -w0 /tmp/marker.json)
          PATH_NAME='bootstrap/bounded-inherited-reranker-v0-red.json'
          EXISTING_SHA=$(gh api "repos/${{ github.repository }}/contents/$PATH_NAME?ref=$MARKER_BRANCH" --jq '.sha' 2>/dev/null || true)
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "repos/${{ github.repository }}/contents/$PATH_NAME" -f message='chore: record bounded inherited reranker RED' -f branch="$MARKER_BRANCH" -f sha="$EXISTING_SHA" -f content="$CONTENT" >/dev/null
          else
            gh api --method PUT "repos/${{ github.repository }}/contents/$PATH_NAME" -f message='chore: record bounded inherited reranker RED' -f branch="$MARKER_BRANCH" -f content="$CONTENT" >/dev/null
          fi
