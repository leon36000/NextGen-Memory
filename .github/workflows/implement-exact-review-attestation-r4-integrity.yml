name: Implement exact review attestation registry R4 integrity

on:
  pull_request:

concurrency:
  group: exact-review-attestation-r4-integrity-producer
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  implement:
    if: github.event.pull_request.head.ref == 'bootstrap/implement-exact-review-attestation-r4-integrity-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/implement-exact-review-attestation-r4-integrity-20260831
          path: controller
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          ref: fix/exact-sha-review-attestation-registry-v0-post-init-integrity-20260831
          path: product
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: product/pyproject.toml

      - name: Freeze exact parent and apply the TDD fix
        shell: bash
        run: |
          set -euo pipefail
          cd product
          parent='f4d9388c14dd1f746f904b3724767f73f82786fd'
          base='f4f3aca9759b5b7a60691017c2211152c011ea92'
          test "$(git rev-parse HEAD)" = "$parent"
          test "$(git merge-base "$base" HEAD)" = "$base"
          cd ..
          python controller/.github/controllers/patch_exact_review_attestation_r4_integrity.py \
            --root "$GITHUB_WORKSPACE/product"

      - name: Normalize without weakening tests
        shell: bash
        run: |
          set -euo pipefail
          cd product
          python -m pip install -e '.[dev]'
          python -m pip install 'ruff==0.16.4'
          files=(
            src/nextgen_memory/review_attestation_registry.py
            tests/test_review_attestation_registry.py
            tests/test_review_attestation_registry_properties.py
            tests/test_review_attestation_registry_public_api.py
          )
          ruff format "${files[@]}"
          ruff check --fix "${files[@]}"
          ruff check "${files[@]}"
          ruff format --check "${files[@]}"
          python -m compileall -q src scripts
          git diff --check
          if grep -R -n -E 'pytest\.mark\.(skip|xfail)|# noqa|NotImplementedError' \
            tests/test_review_attestation_registry.py \
            tests/test_review_attestation_registry_properties.py \
            tests/test_review_attestation_registry_public_api.py; then
            echo 'test weakening or executable placeholder detected' >&2
            exit 1
          fi

      - name: Prove the five post-init RED cases are GREEN
        shell: bash
        run: |
          set -euo pipefail
          cd product
          python -m pytest -q \
            tests/test_review_attestation_registry.py::test_request_tampering_before_registration_is_rejected \
            tests/test_review_attestation_registry.py::test_request_tampering_after_registration_cannot_change_decision \
            tests/test_review_attestation_registry.py::test_reviewer_tampering_is_rejected_before_attestation_identity_is_built \
            tests/test_review_attestation_registry.py::test_attestation_tampering_before_record_is_rejected \
            tests/test_review_attestation_registry.py::test_attestation_tampering_after_record_cannot_rewrite_registry_history

      - name: Run focused, generated-property and full suites
        shell: bash
        run: |
          set -euo pipefail
          cd product
          python -m pytest -q \
            tests/test_review_attestation_registry.py \
            tests/test_review_attestation_registry_properties.py \
            tests/test_review_attestation_registry_public_api.py \
            | tee /tmp/exact-review-r4-focused.txt
          python -m pytest -q | tee /tmp/exact-review-r4-full.txt
          python - <<'PY'
          from pathlib import Path
          import re
          def count(path: str) -> int:
              matches = re.findall(r'(\d+) passed', Path(path).read_text(encoding='utf-8'))
              if not matches:
                  raise SystemExit(f'missing pytest count: {path}')
              return int(matches[-1])
          focused = count('/tmp/exact-review-r4-focused.txt')
          full = count('/tmp/exact-review-r4-full.txt')
          if focused != 72:
              raise SystemExit(f'focused count drift: {focused} != 72')
          if full != 526:
              raise SystemExit(f'full count drift: {full} != 526')
          print(f'focused={focused} full={full}')
          PY

      - name: Strict dependency, privacy, side-effect and stub audit
        shell: bash
        run: |
          set -euo pipefail
          cd product
          python - <<'PY'
          from __future__ import annotations
          import ast
          from pathlib import Path
          path = Path('src/nextgen_memory/review_attestation_registry.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source, filename=str(path))
          allowed = {
              '__future__', 'collections', 'dataclasses', 'enum', 'hashlib',
              'itertools', 'json', 're', 'uuid',
          }
          forbidden_builtins = {'eval', 'exec', 'compile', 'open'}
          forbidden_attributes = {
              'sleep', 'system', 'urlopen', 'uuid1', 'uuid4',
              'write_bytes', 'write_text',
          }
          findings = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Pass):
                  findings.append(f'{node.lineno}:pass')
              elif (
                  isinstance(node, ast.Expr)
                  and isinstance(node.value, ast.Constant)
                  and node.value.value is Ellipsis
              ):
                  findings.append(f'{node.lineno}:executable_ellipsis')
              elif isinstance(node, ast.Import):
                  for alias in node.names:
                      if alias.name.split('.', 1)[0] not in allowed:
                          findings.append(f'{node.lineno}:import:{alias.name}')
              elif isinstance(node, ast.ImportFrom):
                  root = (node.module or '').split('.', 1)[0]
                  if node.level == 0 and root not in allowed:
                      findings.append(f'{node.lineno}:import:{node.module}')
              elif isinstance(node, ast.Call):
                  if isinstance(node.func, ast.Name) and node.func.id in forbidden_builtins:
                      findings.append(f'{node.lineno}:call:{node.func.id}')
                  elif (
                      isinstance(node.func, ast.Attribute)
                      and node.func.attr in forbidden_attributes
                  ):
                      findings.append(f'{node.lineno}:call:{node.func.attr}')
          lowered = source.lower()
          for marker in (
              'postgresql://', 'mongodb://', 'http://', 'https://',
              'password', 'credential', 'raw_query', 'raw_prompt',
              'response_text', 'memory_body', 'reviewer_email', 'reviewer_name',
              'activate_policy(', 'write_feedback(', '# todo', '# fixme',
          ):
              if marker in lowered:
                  findings.append(f'text:{marker}')
          if findings:
              raise SystemExit('\n'.join(findings))
          print('exact_review_attestation_r4_audit_findings=0')
          PY

      - name: Build and import isolated wheel
        shell: bash
        run: |
          set -euo pipefail
          cd product
          wheelhouse="$RUNNER_TEMP/r4-wheelhouse"
          venv="$RUNNER_TEMP/r4-wheel-venv"
          rm -rf "$wheelhouse" "$venv"
          mkdir -p "$wheelhouse"
          python -m pip wheel --no-deps . -w "$wheelhouse"
          wheel=$(find "$wheelhouse" -maxdepth 1 -name '*.whl' -type f -print -quit)
          test -n "$wheel"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --no-deps "$wheel"
          "$venv/bin/python" - <<'PY'
          import nextgen_memory
          from nextgen_memory import InMemoryExactShaReviewAttestationRegistry
          assert InMemoryExactShaReviewAttestationRegistry is not None
          assert 'InMemoryExactShaReviewAttestationRegistry' in nextgen_memory.__all__
          PY
          "$venv/bin/python" -m pip check
          cp "$wheel" /tmp/exact-review-attestation-r4.whl

      - name: Prove exact scope and publish immutable R4 only after GREEN
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd product
          base='f4f3aca9759b5b7a60691017c2211152c011ea92'
          parent='f4d9388c14dd1f746f904b3724767f73f82786fd'
          mapfile -t parent_delta < <(git diff --name-only "$parent" | sort)
          expected_parent=(
            docs/exact-sha-review-attestation-registry-v0.md
            docs/superpowers/specs/2026-08-24-exact-sha-review-attestation-registry-v0-design.md
            src/nextgen_memory/review_attestation_registry.py
            tests/test_review_attestation_registry.py
          )
          test "${#parent_delta[@]}" -eq "${#expected_parent[@]}"
          diff -u <(printf '%s\n' "${expected_parent[@]}" | sort) \
            <(printf '%s\n' "${parent_delta[@]}")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: enforce post-init exact review integrity'
          candidate_sha=$(git rev-parse HEAD)
          mapfile -t changed < <(git diff --name-only "$base"...HEAD | sort)
          expected=(
            docs/exact-sha-review-attestation-registry-v0-red.md
            docs/exact-sha-review-attestation-registry-v0.md
            docs/superpowers/plans/2026-08-24-exact-sha-review-attestation-registry-v0.md
            docs/superpowers/specs/2026-08-24-exact-sha-review-attestation-registry-v0-design.md
            src/nextgen_memory/__init__.py
            src/nextgen_memory/review_attestation_registry.py
            tests/test_review_attestation_registry.py
            tests/test_review_attestation_registry_properties.py
            tests/test_review_attestation_registry_public_api.py
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) \
            <(printf '%s\n' "${changed[@]}")
          git push origin HEAD:fix/exact-sha-review-attestation-registry-v0-post-init-integrity-20260831
          existing=$(git ls-remote --heads origin candidate/exact-sha-review-attestation-registry-v0-r4-20260831 | awk '{print $1}')
          if [ -n "$existing" ]; then
            test "$existing" = "$candidate_sha"
          else
            git push origin "$candidate_sha":refs/heads/candidate/exact-sha-review-attestation-registry-v0-r4-20260831
          fi
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Publish bounded producer status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          body=$(cat <<EOF
          ## Exact review attestation R4 producer GREEN

          - parent R3: \`f4d9388c14dd1f746f904b3724767f73f82786fd\`;
          - candidate R4: \`${{ steps.publish.outputs.candidate_sha }}\`;
          - five post-init integrity RED cases: green;
          - focused/full: 72 / 526;
          - generated property contract: 5,000 traces;
          - audit findings: 0;
          - isolated wheel: green;
          - exact product surface: nine paths;
          - merge allowed: false pending independent Python 3.12/3.13 exact-SHA verification and fresh GPT-5.6 Sol review.
          EOF
          )
          gh api "repos/$REPO/issues/165/comments" --raw-field body="$body" >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: exact-review-attestation-r4-producer
          path: |
            /tmp/exact-review-r4-focused.txt
            /tmp/exact-review-r4-full.txt
            /tmp/exact-review-attestation-r4.whl
          if-no-files-found: error
          retention-days: 7
