name: Record advisory policy promotion gate RED once

on:
  pull_request:

permissions:
  contents: write

jobs:
  record-red:
    if: github.event.pull_request.head.ref == 'feat/advisory-policy-promotion-gate-v0-20260824'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/advisory-policy-promotion-gate-v0-20260824
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'

      - name: Normalize and statically verify the tests-only contract
        run: |
          ruff format \
            tests/test_policy_promotion_gate.py \
            tests/test_policy_promotion_gate_properties.py \
            tests/test_policy_promotion_gate_public_api.py
          ruff check --fix \
            tests/test_policy_promotion_gate.py \
            tests/test_policy_promotion_gate_properties.py \
            tests/test_policy_promotion_gate_public_api.py
          ruff check \
            tests/test_policy_promotion_gate.py \
            tests/test_policy_promotion_gate_properties.py \
            tests/test_policy_promotion_gate_public_api.py
          git diff --check

      - name: Prove precise module-absence RED
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/nextgen_memory/policy_promotion_gate.py
          set +e
          python -m pytest -q \
            tests/test_policy_promotion_gate.py \
            tests/test_policy_promotion_gate_properties.py \
            tests/test_policy_promotion_gate_public_api.py \
            > /tmp/policy-promotion-red.txt 2>&1
          red_rc=$?
          set -e
          test "$red_rc" -ne 0
          grep -F "ModuleNotFoundError: No module named 'nextgen_memory.policy_promotion_gate'" \
            /tmp/policy-promotion-red.txt >/dev/null
          test "$(grep -c "ModuleNotFoundError: No module named 'nextgen_memory.policy_promotion_gate'" /tmp/policy-promotion-red.txt)" -ge 3
          if grep -E 'SyntaxError|IndentationError|NameError|ImportError:' /tmp/policy-promotion-red.txt; then
            echo 'RED contains an unintended failure class' >&2
            exit 1
          fi
          tail -n 160 /tmp/policy-promotion-red.txt

      - name: Persist bounded RED evidence and remove the transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          cat > docs/policy-promotion-gate-v0-red.md <<EOF
          # Advisory Policy Promotion Gate v0 — TDD RED Evidence

          **Date:** 2026-08-24
          **Base branch:** \`candidate/paired-replay-experiment-registry-v0-20260824\`
          **Development branch:** \`feat/advisory-policy-promotion-gate-v0-20260824\`
          **Workflow run:** \`${GITHUB_RUN_ID}\`

          Ruff passed for all three tests-only contract files. Pytest collection then failed specifically because \`nextgen_memory.policy_promotion_gate\` did not exist. No implementation module or package-root export was present.

          This RED establishes the advisory decision, rejection precedence, hold conditions, identity drift, threshold neighborhoods, generated-property, canonical-JSON, privacy and public-API contract before implementation.
          EOF
          sed -i 's/^          //' docs/policy-promotion-gate-v0-red.md
          rm .github/workflows/record-policy-promotion-gate-red-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: record advisory policy promotion gate RED'
          git push origin HEAD:feat/advisory-policy-promotion-gate-v0-20260824
