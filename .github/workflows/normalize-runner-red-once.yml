name: Normalize Neon runner RED test once

on:
  pull_request:

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.ref == 'ci/neon-migration-runner-v1-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/neon-migration-runner-v1-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Apply only deterministic Ruff formatting
        run: |
          ruff format tests/test_neon_migration_runner.py
          ruff check tests/test_neon_migration_runner.py
          rm .github/workflows/normalize-runner-red-once.yml
          git diff --check
      - name: Commit normalized RED test
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_neon_migration_runner.py
          git add -u .github/workflows
          git commit -m 'test: normalize Neon migration runner RED formatting'
          git push origin HEAD:ci/neon-migration-runner-v1-20260822
