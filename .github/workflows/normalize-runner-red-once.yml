name: Normalize Neon runner RED test once

on:
  pull_request:

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.ref == 'ci/neon-migration-runner-v1-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/neon-migration-runner-v1-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Split the one overlong bytes fixture only
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_neon_migration_runner.py')
          source = path.read_text(encoding='utf-8')
          old = "            b'[ { \"metadata\": { \"a\": 1, \"b\": 2 }, \"schema_version\": \"1\", \"schema_key\": \"alpha\" } ]\\n',"
          new = "            (\n                b'[ { \"metadata\": { \"a\": 1, \"b\": 2 }, '\n                b'\"schema_version\": \"1\", \"schema_key\": \"alpha\" } ]\\n'\n            ),"
          if source.count(old) != 1:
              raise SystemExit('unexpected long bytes fixture structure')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          ruff check tests/test_neon_migration_runner.py
          rm .github/workflows/normalize-runner-red-once.yml
          git diff --check
      - name: Commit normalized RED test
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_neon_migration_runner.py
          git add -u .github/workflows
          git commit -m 'test: normalize Neon migration runner RED fixture'
          git push origin HEAD:ci/neon-migration-runner-v1-20260822
