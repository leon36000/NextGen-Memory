name: One-shot PR17 rehabilitation

on:
  pull_request:

permissions:
  contents: write

jobs:
  diagnose-fix-verify:
    if: github.event.pull_request.head.ref == 'fix/pr17-exact-ci-rehabilitation-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr17-exact-ci-rehabilitation-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Establish exact stack boundary
        run: |
          git fetch origin feat/inherited-rerank-telemetry-v0:refs/remotes/origin/feat/inherited-rerank-telemetry-v0
          git merge-base --is-ancestor origin/feat/inherited-rerank-telemetry-v0 HEAD
          git diff --name-only origin/feat/inherited-rerank-telemetry-v0...HEAD > /tmp/pr17_changed_paths.txt
          test -s /tmp/pr17_changed_paths.txt
      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'
      - name: Record baseline without masking failures
        shell: bash
        run: |
          set +e
          ruff check . > /tmp/ruff_baseline.log 2>&1
          printf '%s' "$?" > /tmp/ruff_baseline_status
          python -m pytest -q > /tmp/pytest_baseline.log 2>&1
          printf '%s' "$?" > /tmp/pytest_baseline_status
          set -e
      - name: Apply only deterministic Ruff fixes inside PR17 scope
        run: |
          mapfile -t python_paths < <(grep -E '\.py$' /tmp/pr17_changed_paths.txt || true)
          if ((${#python_paths[@]})); then
            ruff check --fix "${python_paths[@]}"
          fi
      - name: Reject scope expansion and test weakening
        run: |
          git diff --name-only origin/feat/paired-rerank-policy-evaluation-v0...HEAD > /tmp/rehab_changed_paths.txt
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/pr17-rehabilitation-once.yml) ;;
              *) grep -Fxq "$path" /tmp/pr17_changed_paths.txt || {
                   echo "unexpected path outside original PR17 scope: $path" >&2
                   exit 1
                 } ;;
            esac
          done < /tmp/rehab_changed_paths.txt
          if git diff --unified=0 | grep -E '^\+.*(pytest\.mark\.(skip|xfail)|@unittest\.skip|# *noqa|NotImplementedError|TODO|FIXME|pass$)' ; then
            echo 'test weakening, suppression, stub, or deferred implementation detected' >&2
            exit 1
          fi
      - name: Verify repaired candidate
        run: |
          ruff check .
          python -m compileall -q src
          python -m pytest -q
          git diff --check
      - name: Remove one-shot workflow
        run: rm .github/workflows/pr17-rehabilitation-once.yml
      - name: Commit only verified repairs
        run: |
          git diff --check
          if git diff --quiet; then
            echo 'No repair was required; exact branch already verifies.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'fix: rehabilitate PR17 exact CI state'
          git push origin HEAD:fix/pr17-exact-ci-rehabilitation-20260822
