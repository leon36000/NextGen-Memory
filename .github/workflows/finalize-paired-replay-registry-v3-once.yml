name: Finalize paired replay registry v0 fail closed

on:
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'feat/paired-replay-experiment-registry-v0-20260824'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/paired-replay-experiment-registry-v0-20260824
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'

      - name: Materialize exact package-root exports idempotently
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          path = Path('src/nextgen_memory/__init__.py')
          source = path.read_text(encoding='utf-8')
          names = (
              'BalancedPairedReplayPlanner',
              'InMemoryPairedReplayExperimentRegistry',
              'PairedReplayArmResult',
              'PairedReplayAssignment',
              'PairedReplayExperimentSpec',
              'PairedReplayExperimentSummary',
              'PairedReplayFailureRecord',
              'PairedReplayPairSnapshot',
              'PairedReplayPlan',
              'PairedReplayPlanSummary',
              'PairedReplayRegistryConflictError',
              'PairedReplayRegistryStateError',
              'PairedReplayRegistryValidationError',
              'PairedReplayStep',
              'ReplayArm',
              'ReplayArmOrder',
              'ReplayFailureCode',
              'ReplayPairStatus',
          )
          if 'from .paired_replay_experiment_registry import (' not in source:
              marker = 'from .paired_rerank_policy_evaluation import ('
              if source.count(marker) != 1:
                  raise SystemExit('paired evaluation import marker is missing or ambiguous')
              block = 'from .paired_replay_experiment_registry import (\n'
              block += ''.join(f'    {name},\n' for name in names)
              block += ')\n'
              source = source.replace(marker, block + marker, 1)

          module = ast.parse(source)
          all_values: list[str] | None = None
          for statement in module.body:
              if (
                  isinstance(statement, ast.Assign)
                  and any(isinstance(target, ast.Name) and target.id == '__all__' for target in statement.targets)
                  and isinstance(statement.value, (ast.List, ast.Tuple))
              ):
                  all_values = [
                      element.value
                      for element in statement.value.elts
                      if isinstance(element, ast.Constant) and isinstance(element.value, str)
                  ]
                  break
          if all_values is None:
              raise SystemExit('package __all__ is not a literal list or tuple')
          start = source.index('__all__ = [')
          end = source.index('\n]', start) + 2
          merged = sorted(set(all_values).union(names))
          replacement = '__all__ = [\n' + ''.join(f'    "{name}",\n' for name in merged) + ']'
          path.write_text(source[:start] + replacement + source[end:], encoding='utf-8')
          PY

      - name: Restore approved design and bounded implementation plan
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git cat-file -e 'bdc7c43b3ed85821b025e2e9b25d35199ddd30fd^{commit}'
          mkdir -p docs/superpowers/specs docs/superpowers/plans
          git show bdc7c43b3ed85821b025e2e9b25d35199ddd30fd:docs/superpowers/specs/2026-08-15-paired-replay-experiment-registry-v0-design.md \
            > docs/superpowers/specs/2026-08-15-paired-replay-experiment-registry-v0-design.md
          cat > docs/superpowers/plans/2026-08-24-paired-replay-experiment-registry-v0.md <<'EOF'
          # Paired Replay Experiment Registry v0 — Implementation Plan

          **Date:** 2026-08-24
          **Base:** `candidate/paired-rerank-policy-evaluation-v0-20260824`
          **Issue:** #132

          ## Goal

          Implement the approved deterministic in-memory registry that turns bounded replay plans into complete matched `PairedRerankPolicyTrial` values without executing models, persisting state, activating policy or emitting feedback.

          ## TDD sequence

          1. Record a tests-only module-absence RED with Ruff clean.
          2. Validate immutable experiment specifications and canonical context hashes.
          3. Preflight worst-case token and latency reservations before registration.
          4. Generate pair IDs independent of the order seed and balanced arm orders dependent on the seed.
          5. Register exact plans idempotently and reject immutable experiment conflicts.
          6. Expose only one currently schedulable arm per non-terminal pair.
          7. Validate step, pair, experiment, space, policy, router-decision and per-arm budgets before mutation.
          8. Construct one evaluator trial only after two truly matched arms validate together.
          9. Preserve terminal failure and cancellation with bounded codes and exact retry semantics.
          10. Prove deterministic snapshots, summaries, completed-trial ordering, 5,000 generated traces and hash-seed invariance.
          11. Export the API, install the wheel outside the checkout and run exact Python 3.12/3.13 verification before blind GPT-5.6 Sol review.

          ## Safety boundaries

          V0 contains no persistence adapter, migration, database or network dependency, Temporal/lease/worker behavior, model execution, feedback write, policy activation, raw content, arbitrary error text, stub, skipped test or automatic merge.
          EOF
          sed -i 's/^          //' docs/superpowers/plans/2026-08-24-paired-replay-experiment-registry-v0.md

      - name: Normalize the bounded product surface
        run: |
          ruff format \
            src/nextgen_memory/__init__.py \
            src/nextgen_memory/paired_replay_experiment_registry.py \
            tests/test_paired_replay_experiment_registry.py \
            tests/test_paired_replay_experiment_registry_properties.py \
            tests/test_paired_replay_experiment_registry_public_api.py
          ruff check --fix \
            src/nextgen_memory/__init__.py \
            src/nextgen_memory/paired_replay_experiment_registry.py \
            tests/test_paired_replay_experiment_registry.py \
            tests/test_paired_replay_experiment_registry_properties.py \
            tests/test_paired_replay_experiment_registry_public_api.py
          ruff check \
            src/nextgen_memory/__init__.py \
            src/nextgen_memory/paired_replay_experiment_registry.py \
            tests/test_paired_replay_experiment_registry.py \
            tests/test_paired_replay_experiment_registry_properties.py \
            tests/test_paired_replay_experiment_registry_public_api.py
          git diff --check

      - name: Focused contract including generated properties
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_paired_replay_experiment_registry.py \
            tests/test_paired_replay_experiment_registry_properties.py \
            tests/test_paired_replay_experiment_registry_public_api.py \
            | tee /tmp/focused-tests.txt

      - name: Strict dependency, privacy and stub audit
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          path = Path('src/nextgen_memory/paired_replay_experiment_registry.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source, filename=str(path))
          forbidden_imports = {
              'asyncio', 'datetime', 'httpx', 'os', 'pathlib', 'psycopg',
              'pymongo', 'random', 'requests', 'socket', 'sqlalchemy',
              'subprocess', 'temporalio', 'time', 'urllib',
          }
          forbidden_calls = {
              'eval', 'exec', 'open', 'sleep', 'system', 'urlopen',
              'uuid1', 'uuid4', 'write_bytes', 'write_text',
          }
          findings: list[str] = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Pass):
                  findings.append(f'{node.lineno}:pass')
              elif isinstance(node, ast.Raise):
                  target = node.exc.func if isinstance(node.exc, ast.Call) else node.exc
                  if (
                      isinstance(target, ast.Name) and target.id == 'NotImplementedError'
                  ) or (
                      isinstance(target, ast.Attribute) and target.attr == 'NotImplementedError'
                  ):
                      findings.append(f'{node.lineno}:NotImplementedError')
              elif isinstance(node, ast.Import):
                  for alias in node.names:
                      if alias.name.split('.', 1)[0] in forbidden_imports:
                          findings.append(f'{node.lineno}:import:{alias.name}')
              elif isinstance(node, ast.ImportFrom):
                  if (node.module or '').split('.', 1)[0] in forbidden_imports:
                      findings.append(f'{node.lineno}:import:{node.module}')
              elif isinstance(node, ast.Call):
                  name = node.func.id if isinstance(node.func, ast.Name) else node.func.attr if isinstance(node.func, ast.Attribute) else None
                  if name in forbidden_calls:
                      findings.append(f'{node.lineno}:call:{name}')
          lowered = source.lower()
          for marker in (
              'postgresql://', 'mongodb://', 'http://', 'https://',
              'password', 'credential', '# todo', '# fixme', 'raw_query',
              'raw_prompt', 'response_text', 'memory_body', 'lease_timestamp',
              'worker_identity', 'activate_policy', 'write_feedback',
          ):
              if marker in lowered:
                  findings.append(f'text:{marker}')
          if findings:
              raise SystemExit('\n'.join(findings))
          print('paired_registry_audit_findings=0')
          PY

      - name: Repository-wide regression
        shell: bash
        run: |
          set -euo pipefail
          ruff check .
          python -m compileall -q src scripts
          python -m pytest -q | tee /tmp/full-tests.txt
          git diff --check 847ea08e9e9a0d9193adac6d465557270da6ef7d...HEAD

      - name: Isolated wheel public API proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf wheelhouse "$RUNNER_TEMP/paired-registry-wheel-venv"
          python -m pip wheel --no-deps . -w wheelhouse
          test "$(find wheelhouse -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          wheel=$(find wheelhouse -maxdepth 1 -type f -name '*.whl')
          python -m venv "$RUNNER_TEMP/paired-registry-wheel-venv"
          "$RUNNER_TEMP/paired-registry-wheel-venv/bin/python" -m pip install --no-deps "$wheel"
          "$RUNNER_TEMP/paired-registry-wheel-venv/bin/python" - <<'PY'
          import nextgen_memory
          from nextgen_memory import (
              BalancedPairedReplayPlanner,
              InMemoryPairedReplayExperimentRegistry,
              ReplayPairStatus,
          )
          assert BalancedPairedReplayPlanner is not None
          assert InMemoryPairedReplayExperimentRegistry is not None
          assert ReplayPairStatus.COMPLETE.value == 'complete'
          assert 'BalancedPairedReplayPlanner' in nextgen_memory.__all__
          PY
          "$RUNNER_TEMP/paired-registry-wheel-venv/bin/python" -m pip check

      - name: Remove every transport and prove exact seven-path final tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/normalize-paired-replay-registry-red-once.yml \
            .github/workflows/finalize-paired-replay-registry-once.yml \
            .github/workflows/finalize-paired-replay-registry-v2-once.yml \
            .github/workflows/finalize-paired-replay-registry-v3-once.yml
          git add -A
          mapfile -t changed < <(git diff --cached --name-only 847ea08e9e9a0d9193adac6d465557270da6ef7d | sort)
          expected=(
            docs/superpowers/plans/2026-08-24-paired-replay-experiment-registry-v0.md
            docs/superpowers/specs/2026-08-15-paired-replay-experiment-registry-v0-design.md
            src/nextgen_memory/__init__.py
            src/nextgen_memory/paired_replay_experiment_registry.py
            tests/test_paired_replay_experiment_registry.py
            tests/test_paired_replay_experiment_registry_properties.py
            tests/test_paired_replay_experiment_registry_public_api.py
          )
          printf 'final_path_count=%s\n' "${#changed[@]}"
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}")
          test -z "$(git diff --cached --name-only 847ea08e9e9a0d9193adac6d465557270da6ef7d -- 'migrations/**' '.github/workflows/**' pyproject.toml 'src/nextgen_memory/corrective_retrieval_*')"
          git diff --cached --check

      - name: Commit product and publish immutable candidate only after GREEN
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'feat: add paired replay experiment registry v0'
          fi
          git push origin HEAD:feat/paired-replay-experiment-registry-v0-20260824
          candidate='candidate/paired-replay-experiment-registry-v0-20260824'
          head_sha=$(git rev-parse HEAD)
          existing=$(git ls-remote --heads origin "$candidate" | awk '{print $1}')
          if [ -n "$existing" ]; then
            test "$existing" = "$head_sha"
          else
            git push origin "$head_sha:refs/heads/$candidate"
          fi
          body=$(cat <<EOF
          ## Paired replay registry producer GREEN

          - base: \`847ea08e9e9a0d9193adac6d465557270da6ef7d\`;
          - immutable candidate: \`$head_sha\`;
          - exact final scope: seven product/test/document paths;
          - focused generated-property suite and full repository suite: green;
          - audit and isolated wheel public API: green;
          - migrations, dependencies, persistence, execution, feedback and activation: none.

          Independent Python 3.12/3.13 exact-SHA verification and blind GPT-5.6 Sol review remain mandatory.
          EOF
          )
          gh api "repos/$REPO/issues/132/comments" -f body="$body"
          gh api "repos/$REPO/issues/23/comments" -f body="$body"
