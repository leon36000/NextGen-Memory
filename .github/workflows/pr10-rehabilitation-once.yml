name: PR 10 exact-stack root-cause repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.event.pull_request.head.ref == 'fix/pr10-ci-rehabilitation-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr10-ci-rehabilitation-20260822
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Prove exact stack and unresolved root cause
        run: |
          test "$(git merge-base HEAD 4dde625a2c8af82f5f36dc3923bf86debbb4dd5b)" = "4dde625a2c8af82f5f36dc3923bf86debbb4dd5b"
          grep -Fx 'from collections.abc import ContextManager, Iterable, Mapping, Sequence' \
            src/nextgen_memory/neon_execution_ledger.py
          grep -Fx '    def transaction(self) -> ContextManager[Any]: ...' \
            src/nextgen_memory/neon_execution_ledger.py
          grep -Fx '    def __init__(self, connection: "FakeConnection") -> None:' \
            tests/test_neon_execution_ledger.py

      - name: Apply the two proven compatibility corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          module = Path('src/nextgen_memory/neon_execution_ledger.py')
          source = module.read_text(encoding='utf-8')
          old_import = (
              'from collections.abc import ContextManager, Iterable, Mapping, Sequence\n'
          )
          new_import = (
              'from collections.abc import Iterable, Mapping, Sequence\n'
              'from contextlib import AbstractContextManager\n'
          )
          old_protocol = '    def transaction(self) -> ContextManager[Any]: ...\n'
          new_protocol = (
              '    def transaction(self) -> AbstractContextManager[Any]: ...\n'
          )
          if source.count(old_import) != 1 or source.count(old_protocol) != 1:
              raise SystemExit('unexpected execution-ledger adapter structure')
          source = source.replace(old_import, new_import, 1)
          source = source.replace(old_protocol, new_protocol, 1)
          module.write_text(source, encoding='utf-8')

          tests = Path('tests/test_neon_execution_ledger.py')
          test_source = tests.read_text(encoding='utf-8')
          old_annotation = (
              '    def __init__(self, connection: "FakeConnection") -> None:\n'
          )
          new_annotation = (
              '    def __init__(self, connection: FakeConnection) -> None:\n'
          )
          if test_source.count(old_annotation) != 1:
              raise SystemExit('unexpected FakeTransaction annotation structure')
          tests.write_text(
              test_source.replace(old_annotation, new_annotation, 1),
              encoding='utf-8',
          )
          PY

      - name: Prove bounded repair surface and no weakening
        run: |
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            src/nextgen_memory/neon_execution_ledger.py
            tests/test_neon_execution_ledger.py
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) \
            <(printf '%s\n' "${changed[@]}")
          if git diff | grep -E '^[-+].*(pass$|NotImplementedError|pytest\.skip|pytest\.mark\.xfail|# noqa)'; then
            echo 'forbidden test or implementation weakening detected' >&2
            exit 1
          fi
          git diff --check

      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'

      - name: Focused execution-ledger adapter verification
        run: |
          python -m pytest -q \
            tests/test_neon_execution_ledger.py \
            tests/test_neon_execution_ledger_sql_contract.py

      - name: Repository-wide verification
        run: |
          ruff check .
          python -m compileall -q src
          python -m pytest -q
          git diff --check

      - name: Remove one-shot workflow and commit verified repair
        run: |
          rm .github/workflows/pr10-rehabilitation-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nextgen_memory/neon_execution_ledger.py \
            tests/test_neon_execution_ledger.py
          git add -u .github/workflows
          git diff --cached --check
          git commit -m 'fix: use a valid execution-ledger context manager protocol'
          git push origin HEAD:fix/pr10-ci-rehabilitation-20260822
