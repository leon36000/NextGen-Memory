name: Publish Paired Policy Evaluation GREEN 1

on:
  push:
    branches: [bootstrap/paired-policy-evaluation-green-1]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/paired-rerank-policy-evaluation-v0
          fetch-depth: 0
      - name: Verify guarded feature head
        run: test "$(git rev-parse HEAD)" = "669a6f9005f1cf3cead9882cab50a9d571c1f15f"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Apply mechanical formatting and lint fixes
        run: |
          ruff format \
            src/nextgen_memory/paired_rerank_policy_evaluation.py \
            tests/test_paired_rerank_policy_evaluation.py
          ruff check \
            src/nextgen_memory/paired_rerank_policy_evaluation.py \
            tests/test_paired_rerank_policy_evaluation.py \
            --fix
      - name: Verify focused and complete behavior
        run: |
          ruff check .
          python -m pytest tests/test_paired_rerank_policy_evaluation.py -q
          python -m pytest -q
          python -m compileall -q src
          git diff --check
      - name: Verify correction scope
        run: |
          cat > /tmp/allowed <<'EOF'
          src/nextgen_memory/paired_rerank_policy_evaluation.py
          tests/test_paired_rerank_policy_evaluation.py
          EOF
          git diff --name-only | sort > /tmp/actual
          while read -r path; do grep -Fx "$path" /tmp/allowed >/dev/null; done < /tmp/actual
      - name: Commit and push fast-forward
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "NextGen Memory Automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/nextgen_memory/paired_rerank_policy_evaluation.py \
            tests/test_paired_rerank_policy_evaluation.py
          git commit -m "style: finalize paired policy evaluation core"
          git push origin HEAD:feat/paired-rerank-policy-evaluation-v0
