name: Normalize Context Compiler RED imports

on:
  push:
    branches: [bootstrap/fix-context-compiler-red-import]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/context-compiler-v0
          fetch-depth: 0
      - name: Verify target head
        run: test "$(git rev-parse HEAD)" = "3b63c9efac114a37323a3dad3c45aa3bae7641b8"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project tools
        run: python -m pip install -e '.[dev]'
      - name: Apply the exact Ruff import fix
        run: ruff check tests/test_context_compiler.py --select I001 --fix
      - name: Verify scope and lint
        run: |
          git diff --check
          test "$(git diff --name-only)" = "tests/test_context_compiler.py"
          ruff check tests/test_context_compiler.py
      - name: Commit and push fast-forward
        run: |
          git config user.name "NextGen Memory Automation"
          git config user.email "actions@users.noreply.github.com"
          git add tests/test_context_compiler.py
          git commit -m "style: normalize context compiler test imports"
          git push origin HEAD:feat/context-compiler-v0
