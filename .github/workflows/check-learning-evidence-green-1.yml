name: Verify Learning Evidence Reader GREEN 1

on:
  push:
    branches: [bootstrap/learning-evidence-green-check-1]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/learning-evidence-reader-v0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Apply mechanical formatting in the disposable workspace
        run: |
          ruff format src/nextgen_memory/learning_evidence.py tests/test_learning_evidence.py tests/test_learning_evidence_sql.py
          ruff check src/nextgen_memory/learning_evidence.py tests/test_learning_evidence.py tests/test_learning_evidence_sql.py --fix
      - name: Verify complete tree
        run: |
          ruff check .
          python -m pytest tests/test_learning_evidence.py tests/test_learning_evidence_sql.py -q
          python -m pytest -q
          python -m compileall -q src
          git diff --check
      - name: Verify changes are formatting-only and scoped
        run: |
          git diff --name-only | sort > /tmp/actual
          if [ -s /tmp/actual ]; then
            cat > /tmp/allowed <<'EOF'
          src/nextgen_memory/learning_evidence.py
          tests/test_learning_evidence.py
          tests/test_learning_evidence_sql.py
          EOF
            while read -r path; do grep -Fx "$path" /tmp/allowed >/dev/null; done < /tmp/actual
          fi
      - name: Publish formatting correction when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "NextGen Memory Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/nextgen_memory/learning_evidence.py tests/test_learning_evidence.py tests/test_learning_evidence_sql.py
          git commit -m "style: format learning evidence reader v0"
          git push origin HEAD:feat/learning-evidence-reader-v0
