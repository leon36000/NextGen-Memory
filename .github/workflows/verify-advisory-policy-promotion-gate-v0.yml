name: Verify advisory policy promotion gate v0 exact candidate

on:
  pull_request:

concurrency:
  group: advisory-policy-promotion-gate-v0-exact-verifier
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: read

jobs:
  resolve:
    if: github.event.pull_request.head.ref == 'bootstrap/verify-advisory-policy-promotion-gate-v0-20260824'
    runs-on: ubuntu-24.04
    outputs:
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/advisory-policy-promotion-gate-v0-20260824
          fetch-depth: 0

      - name: Resolve exact immutable candidate graph
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          base_sha='91d14e9ff9f8c89d05cb2349b012a6681bf3d828'
          candidate_sha='f4f3aca9759b5b7a60691017c2211152c011ea92'
          test "$(git rev-parse HEAD)" = "$candidate_sha"
          test "$(git merge-base HEAD "$base_sha")" = "$base_sha"
          mapfile -t changed < <(git diff --name-only "$base_sha"...HEAD | sort)
          expected=(
            docs/policy-promotion-gate-v0-red.md
            docs/superpowers/plans/2026-08-24-advisory-policy-promotion-gate-v0.md
            docs/superpowers/specs/2026-08-24-advisory-policy-promotion-gate-v0-design.md
            src/nextgen_memory/__init__.py
            src/nextgen_memory/policy_promotion_gate.py
            tests/test_policy_promotion_gate.py
            tests/test_policy_promotion_gate_properties.py
            tests/test_policy_promotion_gate_public_api.py
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}")
          test -z "$(git diff --name-only "$base_sha"...HEAD -- '.github/workflows/**' 'migrations/**' pyproject.toml 'src/nextgen_memory/corrective_retrieval_*')"
          git diff --check "$base_sha"...HEAD
          test -z "$(git status --porcelain)"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/verify-advisory-policy-promotion-gate-v0-20260824
          path: controller
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          path: product
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: product/pyproject.toml

      - name: Verify exact product under Python ${{ matrix.python-version }}
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/advisory-policy-promotion-${{ matrix.python-version }}
        run: |
          bash controller/.github/controllers/verify_advisory_policy_promotion_candidate.sh \
            "$GITHUB_WORKSPACE/product" \
            "$EVIDENCE_ROOT" \
            '${{ needs.resolve.outputs.candidate_sha }}' \
            '${{ needs.resolve.outputs.base_sha }}'

      - uses: actions/upload-artifact@v4
        with:
          name: advisory-policy-promotion-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/advisory-policy-promotion-${{ matrix.python-version }}
          if-no-files-found: error
          retention-days: 7

  compare-and-publish:
    needs: [resolve, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/verify-advisory-policy-promotion-gate-v0-20260824
          path: controller
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          path: product
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: advisory-policy-promotion-python-*
          path: ${{ runner.temp }}/advisory-policy-promotion-matrix

      - name: Compare, bind artifacts, and publish immutable evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash controller/.github/controllers/compare_publish_advisory_policy_promotion_candidate.sh \
            "$GITHUB_WORKSPACE/product" \
            '${{ runner.temp }}/advisory-policy-promotion-matrix' \
            '${{ needs.resolve.outputs.candidate_sha }}' \
            '${{ needs.resolve.outputs.base_sha }}'

      - uses: actions/upload-artifact@v4
        with:
          name: advisory-policy-promotion-cross-python-summary
          path: ${{ runner.temp }}/advisory-policy-promotion-matrix/publish-summary.json
          if-no-files-found: error
          retention-days: 7
