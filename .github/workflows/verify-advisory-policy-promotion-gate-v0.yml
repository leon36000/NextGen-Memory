name: Refresh advisory policy promotion gate exact-SHA evidence for Sol review

on:
  pull_request:

concurrency:
  group: advisory-policy-promotion-gate-sol-refresh-20260831
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  resolve:
    if: github.event.pull_request.head.ref == 'bootstrap/refresh-advisory-policy-promotion-gate-sol-20260831'
    runs-on: ubuntu-24.04
    outputs:
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/advisory-policy-promotion-gate-v0-20260824
          fetch-depth: 0

      - name: Freeze exact candidate and eight-path surface
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          base_sha='91d14e9ff9f8c89d05cb2349b012a6681bf3d828'
          candidate_sha='f4f3aca9759b5b7a60691017c2211152c011ea92'
          test "$(git rev-parse HEAD)" = "$candidate_sha"
          test "$(git merge-base HEAD "$base_sha")" = "$base_sha"
          mapfile -t changed < <(git diff --name-only "$base_sha"...HEAD | sort)
          expected=(
            docs/policy-promotion-gate-v0-red.md
            docs/superpowers/plans/2026-08-24-advisory-policy-promotion-gate-v0.md
            docs/superpowers/specs/2026-08-24-advisory-policy-promotion-gate-v0-design.md
            src/nextgen_memory/__init__.py
            src/nextgen_memory/policy_promotion_gate.py
            tests/test_policy_promotion_gate.py
            tests/test_policy_promotion_gate_properties.py
            tests/test_policy_promotion_gate_public_api.py
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}")
          test -z "$(git diff --name-only "$base_sha"...HEAD -- '.github/workflows/**' 'migrations/**' pyproject.toml 'src/nextgen_memory/corrective_retrieval_*')"
          git diff --check "$base_sha"...HEAD
          test -z "$(git status --porcelain)"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/refresh-advisory-policy-promotion-gate-sol-20260831
          path: controller
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          path: product
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: product/pyproject.toml

      - name: Re-verify exact candidate under Python ${{ matrix.python-version }}
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/advisory-policy-promotion-refresh-${{ matrix.python-version }}
        run: |
          bash controller/.github/controllers/verify_advisory_policy_promotion_candidate_v2.sh \
            "$GITHUB_WORKSPACE/product" \
            "$EVIDENCE_ROOT" \
            '${{ needs.resolve.outputs.candidate_sha }}' \
            '${{ needs.resolve.outputs.base_sha }}'

      - uses: actions/upload-artifact@v4
        with:
          name: advisory-policy-promotion-refresh-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/advisory-policy-promotion-refresh-${{ matrix.python-version }}
          if-no-files-found: error
          retention-days: 7

  compare:
    needs: [resolve, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: advisory-policy-promotion-refresh-python-*
          path: ${{ runner.temp }}/matrix

      - name: Require byte-identical semantic evidence and build refresh summary
        env:
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          root='${{ runner.temp }}/matrix'
          py312="$root/advisory-policy-promotion-refresh-python-3.12/semantic.json"
          py313="$root/advisory-policy-promotion-refresh-python-3.13/semantic.json"
          test -f "$py312"
          test -f "$py313"
          cmp "$py312" "$py313"
          semantic_sha=$(sha256sum "$py312" | awk '{print $1}')
          test "$semantic_sha" = '2a107078babc84ef4a02270a5d7e1c11725b27f35b893d12d1042d70d7b296d7'
          jq -e --arg base "$BASE_SHA" --arg candidate "$CANDIDATE_SHA" \
            '.base_sha == $base and .candidate_sha == $candidate and .retry_count == 1000 and .records.promote.decision == "promote" and .records.hold_failed.decision == "hold" and .records.hold_cancelled.decision == "hold" and .records.reject_safety.decision == "reject"' \
            "$py312" >/dev/null
          mkdir -p '${{ runner.temp }}/summary'
          jq -n \
            --arg schema 'm-head-advisory-policy-promotion-sol-refresh-v1' \
            --arg status 'fresh_exact_sha_evidence_green' \
            --arg base_sha "$BASE_SHA" \
            --arg candidate_sha "$CANDIDATE_SHA" \
            --arg semantic_sha256 "$semantic_sha" \
            '{schema:$schema,status:$status,base_sha:$base_sha,candidate_sha:$candidate_sha,python_versions:["3.12","3.13"],focused_tests_each:61,full_tests_each:454,exact_retries_each:1000,hash_seed_invariant:true,cross_python_semantic_evidence_identical:true,semantic_sha256:$semantic_sha256,audit_findings:0,isolated_wheel_import:true,merged:false}' \
            > '${{ runner.temp }}/summary/refresh-summary.json'
          cat '${{ runner.temp }}/summary/refresh-summary.json'

      - uses: actions/upload-artifact@v4
        with:
          name: advisory-policy-promotion-sol-refresh-summary
          path: ${{ runner.temp }}/summary/refresh-summary.json
          if-no-files-found: error
          retention-days: 7
