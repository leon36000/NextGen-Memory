name: Repair merge readiness payload with Ruff once

on:
  pull_request:

concurrency:
  group: merge-readiness-payload-repair-v2-once
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'bootstrap/implement-merge-readiness-gate-r4v2-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/implement-merge-readiness-gate-r4v2-20260831
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply only Ruff's safe structural correction to the staged payload
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'ruff==0.16.4'
          payload='.github/payloads/merge_readiness_gate.py'
          before=$(sha256sum "$payload" | awk '{print $1}')
          set +e
          ruff check "$payload" > /tmp/ruff-before.txt 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -F 'SIM102' /tmp/ruff-before.txt >/dev/null
          ruff check --fix "$payload"
          ruff format "$payload"
          ruff check "$payload"
          ruff format --check "$payload"
          python -m py_compile "$payload"
          after=$(sha256sum "$payload" | awk '{print $1}')
          test "$before" != "$after"
          git diff --check
          git diff -- "$payload" | tee /tmp/payload-repair.diff
          grep -F 'ReviewAdvisoryState.APPROVED' /tmp/payload-repair.diff >/dev/null
          if grep -E '^[-+].*(TODO|FIXME|noqa|skip|xfail|NotImplemented)' /tmp/payload-repair.diff; then
            echo 'unexpected weakening marker in Ruff repair' >&2
            exit 1
          fi

      - name: Commit the payload correction and remove repair transports
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/repair-merge-readiness-payload-once.yml \
            .github/workflows/repair-merge-readiness-payload-v2-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: normalize merge readiness approval guard'
          git push origin HEAD:bootstrap/implement-merge-readiness-gate-r4v2-20260831
