name: Record Bounded Inherited Properties GREEN

on:
  push:
    branches: [bootstrap/bounded-inherited-properties-marker]

permissions:
  contents: write

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      FEATURE_BRANCH: feat/bounded-inherited-reranker-v0
      MARKER_BRANCH: bootstrap/bounded-inherited-properties-marker
    steps:
      - name: Wait for corrected generated-property revision
        id: target
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            SHA=$(gh api repos/${{ github.repository }}/git/ref/heads/$FEATURE_BRANCH --jq '.object.sha')
            CONTENT=$(gh api "repos/${{ github.repository }}/contents/tests/test_bounded_inherited_reranker_properties.py?ref=$FEATURE_BRANCH" --jq '.content' | tr -d '\n' | base64 -d)
            if printf '%s' "$CONTENT" | grep -q 'assert count_gated > 500' \
              && printf '%s' "$CONTENT" | grep -q 'value_sum = round(inherited_mean \* count, 8)'; then
              echo "sha=$SHA" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo 'Corrected generated-property revision did not appear' >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify core, 10000 cases and simulation
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          ruff check .
          python -m pytest \
            tests/test_bounded_inherited_reranker.py \
            tests/test_bounded_inherited_reranker_properties.py \
            tests/test_bounded_inherited_reranker_simulation.py \
            -q
          python scripts/simulate_bounded_inherited_reranker_v0.py > /tmp/simulation.json
          jq -e '.scenario_count == 5' /tmp/simulation.json
          jq -e '.naive_false_promotions == 4' /tmp/simulation.json
          jq -e '.bounded_false_promotions == 0' /tmp/simulation.json
          jq -e '.bounded_strong_promotions == 1' /tmp/simulation.json
          jq -e '[.scenarios[].bounded_adjustment_b | abs] | max <= .05' /tmp/simulation.json
          python -m pytest -q
          python -m compileall -q src
          git diff --check

      - name: Verify protected implementation boundaries
        run: |
          BASE=$(git merge-base HEAD origin/feat/learning-evidence-reader-v0)
          test -z "$(git diff --name-only "$BASE...HEAD" -- src/nextgen_memory/utility_reranker.py src/nextgen_memory/neon_utility.py migrations)"

      - name: Persist machine-readable properties marker
        run: |
          jq -n \
            --arg feature_sha '${{ steps.target.outputs.sha }}' \
            --slurpfile simulation /tmp/simulation.json \
            '{feature_branch:"feat/bounded-inherited-reranker-v0",feature_sha:$feature_sha,ruff:true,focused_tests:true,full_suite:true,compileall:true,property_cases:10000,direct_reranker_changed:false,node_utility_reader_changed:false,migration_changed:false,simulation:$simulation[0],verified_at:(now|todate)}' > /tmp/marker.json
          CONTENT=$(base64 -w0 /tmp/marker.json)
          PATH_NAME='bootstrap/bounded-inherited-reranker-v0-properties-green.json'
          EXISTING_SHA=$(gh api "repos/${{ github.repository }}/contents/$PATH_NAME?ref=$MARKER_BRANCH" --jq '.sha' 2>/dev/null || true)
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "repos/${{ github.repository }}/contents/$PATH_NAME" -f message='chore: record bounded inherited properties GREEN' -f branch="$MARKER_BRANCH" -f sha="$EXISTING_SHA" -f content="$CONTENT" >/dev/null
          else
            gh api --method PUT "repos/${{ github.repository }}/contents/$PATH_NAME" -f message='chore: record bounded inherited properties GREEN' -f branch="$MARKER_BRANCH" -f content="$CONTENT" >/dev/null
          fi
