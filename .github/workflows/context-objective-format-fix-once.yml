name: One-shot context objective formatting fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.event.pull_request.head.ref == 'fix/context-materialized-content-hash-v1-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/context-materialized-content-hash-v1-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Normalize objective fixture indentation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_context_objective.py')
          source = path.read_text(encoding='utf-8')
          old = '                                coverage_keys=("cause",),\n'
          new = '                    coverage_keys=("cause",),\n'
          if source.count(old) != 2:
              raise SystemExit('expected exactly two misindented coverage arguments')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
      - name: Diff integrity
        run: git diff --check
      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'
      - name: Focused objective verification
        run: python -m pytest -q tests/test_context_objective.py
      - name: Context regression
        run: python -m pytest -q tests/test_context*.py
      - name: Lint
        run: ruff check .
      - name: Full suite
        run: python -m pytest -q
      - name: Commit verified formatting correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_context_objective.py
          git commit -m 'test: normalize context objective fixture layout'
          git push origin HEAD:fix/context-materialized-content-hash-v1-20260822
