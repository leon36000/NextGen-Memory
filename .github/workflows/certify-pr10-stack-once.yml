name: Certify PR 10 exact stack

on:
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  certify:
    if: github.event.pull_request.head.ref == 'fix/pr10-exact-certification-20260823'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr10-exact-certification-20260823
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Prove exact stack and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 4dde625a2c8af82f5f36dc3923bf86debbb4dd5b)" = "4dde625a2c8af82f5f36dc3923bf86debbb4dd5b"
          mapfile -t product_paths < <(git diff --name-only 4dde625a2c8af82f5f36dc3923bf86debbb4dd5b...HEAD | grep -v '^\.github/workflows/' | sort)
          expected=(
            docs/neon-execution-ledger-adapter-v0.md
            docs/superpowers/plans/2026-08-14-neon-execution-ledger-adapter-v0.md
            docs/superpowers/specs/2026-08-14-neon-execution-ledger-adapter-v0-design.md
            src/nextgen_memory/neon_execution_ledger.py
            tests/test_neon_execution_ledger.py
          )
          test "${#product_paths[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${product_paths[@]}")
          if printf '%s\n' "${product_paths[@]}" | grep -Eq '^src/nextgen_memory/corrective_retrieval_'; then
            echo 'PR 10 certification touches active corrective-retrieval code' >&2
            exit 1
          fi
      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'
      - name: Capture exact verification with bounded failure report
        id: verify
        shell: bash
        run: |
          set +e
          ruff check . > /tmp/pr10-ruff.txt 2>&1
          ruff_rc=$?
          python -m pytest -q > /tmp/pr10-pytest.txt 2>&1
          pytest_rc=$?
          python -m compileall -q src > /tmp/pr10-compile.txt 2>&1
          compile_rc=$?
          git diff --check 4dde625a2c8af82f5f36dc3923bf86debbb4dd5b...HEAD > /tmp/pr10-diff.txt 2>&1
          diff_rc=$?
          set -e
          echo "ruff_rc=$ruff_rc" >> "$GITHUB_OUTPUT"
          echo "pytest_rc=$pytest_rc" >> "$GITHUB_OUTPUT"
          echo "compile_rc=$compile_rc" >> "$GITHUB_OUTPUT"
          echo "diff_rc=$diff_rc" >> "$GITHUB_OUTPUT"
          if [ "$ruff_rc" -ne 0 ] || [ "$pytest_rc" -ne 0 ] || [ "$compile_rc" -ne 0 ] || [ "$diff_rc" -ne 0 ]; then
            {
              echo '## PR #10 exact certification blocked'
              echo
              printf -- '- exact branch head: `%s`\n' "$(git rev-parse HEAD)"
              printf -- '- Ruff exit: `%s`\n' "$ruff_rc"
              printf -- '- pytest exit: `%s`\n' "$pytest_rc"
              printf -- '- compileall exit: `%s`\n' "$compile_rc"
              printf -- '- diff-check exit: `%s`\n' "$diff_rc"
              echo
              echo '### Ruff tail'
              echo '```text'
              tail -n 100 /tmp/pr10-ruff.txt
              echo '```'
              echo
              echo '### Pytest tail'
              echo '```text'
              tail -n 160 /tmp/pr10-pytest.txt
              echo '```'
              echo
              echo 'No semantic repair, test weakening, stub, merge or migration application was performed.'
            } > /tmp/pr10-blocked.md
            exit 1
          fi
      - name: Publish blocked evidence when verification fails
        if: failure() && steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/issues/10/comments -f body="$(cat /tmp/pr10-blocked.md)"
      - name: Scan exact candidate for weakening markers
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if git diff -U0 4dde625a2c8af82f5f36dc3923bf86debbb4dd5b...HEAD -- '*.py' \
            | grep -E '^\+.*(pytest\.skip|pytest\.mark\.xfail|NotImplementedError|# noqa|pragma: no cover|pass[[:space:]]*$)'; then
            echo 'candidate contains a weakening or stub marker' >&2
            exit 1
          fi
      - name: Remove transport workflows and reverify final tree
        if: success()
        run: |
          rm -f \
            .github/workflows/pr10-rehabilitation-once.yml \
            .github/workflows/certify-pr10-stack-once.yml
          ruff check .
          python -m pytest -q
          python -m compileall -q src
          git diff --check 4dde625a2c8af82f5f36dc3923bf86debbb4dd5b...HEAD
      - name: Commit and publish immutable PR 10 candidate
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            git commit --allow-empty -m 'chore: certify PR 10 exact stack'
          else
            git commit -m 'fix: certify Neon execution-ledger adapter stack'
          fi
          candidate_sha=$(git rev-parse HEAD)
          git push origin HEAD:fix/pr10-exact-certification-20260823
          if git ls-remote --exit-code --heads origin candidate/pr10-neon-ledger-adapter-20260823; then
            echo 'immutable candidate branch already exists; refusing overwrite' >&2
            exit 1
          fi
          git push origin HEAD:refs/heads/candidate/pr10-neon-ledger-adapter-20260823
          body=$(cat <<EOF
          ## PR #10 exact stack certified

          - exact candidate SHA: \`$candidate_sha\`
          - base: \`4dde625a2c8af82f5f36dc3923bf86debbb4dd5b\`
          - product surface: five expected adapter/doc/test files only
          - Ruff, full pytest, compileall and diff-check: passed
          - weakening/stub scan: passed
          - migration application: none
          - merge: none

          Immutable Python 3.12/3.13 raw-SHA verification and blind GPT-5.6 Sol review remain required before promotion.
          EOF
          )
          gh api repos/${{ github.repository }}/issues/10/comments -f body="$body"
