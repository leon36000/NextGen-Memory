name: Finalize advisory policy promotion gate v7

on:
  pull_request:

concurrency:
  group: advisory-policy-promotion-gate-v0-finalize-v7
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'feat/advisory-policy-promotion-gate-v0-20260824'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/advisory-policy-promotion-gate-v0-20260824
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Resolve immutable base and accepted tests-only RED
        shell: bash
        run: |
          set -euo pipefail
          base_branch='candidate/paired-replay-experiment-registry-v0-20260824'
          red_branch='tdd/advisory-policy-promotion-gate-v0-red-20260824'
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          base_sha=$(git rev-parse "origin/$base_branch")
          red_sha=$(git rev-parse "origin/$red_branch")
          test "$base_sha" = '91d14e9ff9f8c89d05cb2349b012a6681bf3d828'
          test "$(git merge-base "$base_sha" "$red_sha")" = "$base_sha"
          test "$(git merge-base "$base_sha" HEAD)" = "$base_sha"

          mapfile -t red_paths < <(git diff --name-only "$base_sha"..."$red_sha" | sort)
          expected_red=(
            docs/policy-promotion-gate-v0-red.md
            tests/test_policy_promotion_gate.py
            tests/test_policy_promotion_gate_properties.py
            tests/test_policy_promotion_gate_public_api.py
          )
          test "${#red_paths[@]}" -eq "${#expected_red[@]}"
          diff -u <(printf '%s\n' "${expected_red[@]}" | sort) <(printf '%s\n' "${red_paths[@]}")
          git diff --check "$base_sha"..."$red_sha"

          git checkout "$red_sha" -- \
            docs/policy-promotion-gate-v0-red.md \
            tests/test_policy_promotion_gate.py \
            tests/test_policy_promotion_gate_properties.py \
            tests/test_policy_promotion_gate_public_api.py
          printf 'BASE_SHA=%s\nRED_SHA=%s\n' "$base_sha" "$red_sha" | tee -a "$GITHUB_ENV"

      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'

      - name: Add bounded semantic regression tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_policy_promotion_gate.py')
          source = path.read_text(encoding='utf-8')
          marker = 'def test_cost_thresholds_must_be_nonnegative() -> None:'
          if marker not in source:
              source += '''


@pytest.mark.parametrize(
    "field_name",
    ("maximum_mean_token_delta", "maximum_mean_latency_delta_ms"),
)
def test_cost_thresholds_must_be_nonnegative(field_name: str) -> None:
    with pytest.raises(PolicyPromotionValidationError, match=field_name):
        config(**{field_name: -0.001})


@pytest.mark.parametrize(
    "terminal_counts",
    (
        {"registry_failed_count": 1},
        {"registry_cancelled_count": 1},
    ),
)
def test_terminal_non_complete_registry_state_holds(
    terminal_counts: dict[str, int],
) -> None:
    values: dict[str, object] = {
        "registry_pair_count": 25,
        "registry_completed_trial_count": 24,
        "registry_failed_count": 0,
        "registry_cancelled_count": 0,
        "registry_active_count": 0,
    }
    values.update(terminal_counts)

    record = evaluate(request(evaluation=paired_evidence(**values)))

    assert record.decision is PolicyPromotionDecision.HOLD
    assert PolicyPromotionReason.REGISTRY_INCOMPLETE in record.reasons
'''
          path.write_text(source, encoding='utf-8')
          PY
          ruff format tests/test_policy_promotion_gate.py
          ruff check --fix tests/test_policy_promotion_gate.py
          ruff check tests/test_policy_promotion_gate.py
          python -m py_compile tests/test_policy_promotion_gate.py

      - name: Prove both semantic contracts are RED before the fix
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q \
            tests/test_policy_promotion_gate.py::test_cost_thresholds_must_be_nonnegative \
            tests/test_policy_promotion_gate.py::test_terminal_non_complete_registry_state_holds \
            > /tmp/semantic-red.txt 2>&1
          rc=$?
          set -e
          cat /tmp/semantic-red.txt
          test "$rc" -ne 0
          grep -F 'test_cost_thresholds_must_be_nonnegative' /tmp/semantic-red.txt >/dev/null
          grep -F 'test_terminal_non_complete_registry_state_holds' /tmp/semantic-red.txt >/dev/null
          grep -F 'failed' /tmp/semantic-red.txt >/dev/null

      - name: Apply minimal semantic hardening to the real source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/nextgen_memory/policy_promotion_gate.py')
          source = path.read_text(encoding='utf-8')

          replacements = (
              (
                  'maximum_mean_token_delta = _finite_number(\n'
                  '            "maximum_mean_token_delta", self.maximum_mean_token_delta\n'
                  '        )',
                  'maximum_mean_token_delta = _nonnegative_number(\n'
                  '            "maximum_mean_token_delta", self.maximum_mean_token_delta\n'
                  '        )',
              ),
              (
                  'maximum_mean_latency_delta_ms = _finite_number(\n'
                  '            "maximum_mean_latency_delta_ms",\n'
                  '            self.maximum_mean_latency_delta_ms,\n'
                  '        )',
                  'maximum_mean_latency_delta_ms = _nonnegative_number(\n'
                  '            "maximum_mean_latency_delta_ms",\n'
                  '            self.maximum_mean_latency_delta_ms,\n'
                  '        )',
              ),
          )
          for old, new in replacements:
              if new not in source:
                  if source.count(old) != 1:
                      raise SystemExit(f'expected one exact threshold block: {old!r}')
                  source = source.replace(old, new, 1)

          old_registry = (
              '        if evidence.registry_active_count > 0:\n'
              '            hold_reasons.append(PolicyPromotionReason.REGISTRY_INCOMPLETE)'
          )
          new_registry = (
              '        if (\n'
              '            evidence.registry_active_count > 0\n'
              '            or evidence.registry_failed_count > 0\n'
              '            or evidence.registry_cancelled_count > 0\n'
              '        ):\n'
              '            hold_reasons.append(PolicyPromotionReason.REGISTRY_INCOMPLETE)'
          )
          if new_registry not in source:
              if source.count(old_registry) != 1:
                  raise SystemExit('expected one exact registry-incomplete block')
              source = source.replace(old_registry, new_registry, 1)

          path.write_text(source, encoding='utf-8')
          PY
          ruff format src/nextgen_memory/policy_promotion_gate.py
          ruff check --fix src/nextgen_memory/policy_promotion_gate.py
          ruff check src/nextgen_memory/policy_promotion_gate.py

      - name: Prove semantic RED becomes GREEN
        run: |
          python -m pytest -q \
            tests/test_policy_promotion_gate.py::test_cost_thresholds_must_be_nonnegative \
            tests/test_policy_promotion_gate.py::test_terminal_non_complete_registry_state_holds

      - name: Add exact package-root exports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          path = Path('src/nextgen_memory/__init__.py')
          source = path.read_text(encoding='utf-8')
          required = {
              'AdvisoryPolicyPromotionGate',
              'PairedPolicyEvidence',
              'PolicyIdentity',
              'PolicyOperationalReadiness',
              'PolicyPromotionDecision',
              'PolicyPromotionGateConfig',
              'PolicyPromotionReason',
              'PolicyPromotionRecord',
              'PolicyPromotionRequest',
              'PolicyPromotionValidationError',
          }
          block = '''from .policy_promotion_gate import (
              AdvisoryPolicyPromotionGate,
              PairedPolicyEvidence,
              PolicyIdentity,
              PolicyOperationalReadiness,
              PolicyPromotionDecision,
              PolicyPromotionGateConfig,
              PolicyPromotionReason,
              PolicyPromotionRecord,
              PolicyPromotionRequest,
              PolicyPromotionValidationError,
          )
          '''
          block = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          ).lstrip('\n')
          if 'from .policy_promotion_gate import (' not in source:
              markers = (
                  'from .paired_replay_experiment_registry import (',
                  'from .paired_rerank_policy_evaluation import (',
              )
              marker = next(
                  (item for item in markers if source.count(item) == 1),
                  None,
              )
              if marker is None:
                  raise SystemExit('no unambiguous package import marker')
              source = source.replace(marker, block + marker, 1)

          module = ast.parse(source)
          values: list[str] | None = None
          for statement in module.body:
              if (
                  isinstance(statement, ast.Assign)
                  and any(
                      isinstance(target, ast.Name) and target.id == '__all__'
                      for target in statement.targets
                  )
                  and isinstance(statement.value, (ast.List, ast.Tuple))
              ):
                  values = [
                      item.value
                      for item in statement.value.elts
                      if isinstance(item, ast.Constant)
                      and isinstance(item.value, str)
                  ]
                  break
          if values is None:
              raise SystemExit('package __all__ is not a literal list or tuple')
          start = source.index('__all__ = [')
          end = source.index('\n]', start) + 2
          replacement = '__all__ = [\n' + ''.join(
              f'    "{name}",\n'
              for name in sorted(set(values).union(required))
          ) + ']'
          source = source[:start] + replacement + source[end:]
          ast.parse(source)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Materialize bounded design and implementation plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/superpowers/specs docs/superpowers/plans
          cat > docs/superpowers/specs/2026-08-24-advisory-policy-promotion-gate-v0-design.md <<'EOF'
          # Advisory Policy Promotion Gate v0 Design

          **Date:** 2026-08-24
          **Status:** implementation candidate
          **Base:** `candidate/paired-replay-experiment-registry-v0-20260824`

          ## Goal

          Convert immutable matched-policy evidence and bounded operational readiness into exactly one advisory result: `promote`, `hold`, or `reject`. The result never activates, deploys, persists, emits feedback, executes a model, applies a migration, or publishes a release.

          ## Decision precedence

          Hard rejection is evaluated first: safety violation, policy or source-SHA mismatch, registry/evaluation mismatch, harmful or too-costly verdict, established negative mean effect, or token/latency/harm threshold breach. Hold reasons are not included once any rejection applies.

          If no rejection exists, the gate holds for insufficient pairs, a non-positive conservative lower bound, excessive standard error, stale evidence, any active, failed, or cancelled registry pair, missing rollback/tests/integration/artifact evidence, insufficient reviewers, or an insufficient/neutral/inconclusive evaluator verdict.

          Promotion is possible only for a `promising` evaluator verdict when every identity, statistical, registry, operational, reviewer, freshness, and safety condition passes.

          ## Determinism and privacy

          Every input is frozen and bounded. Booleans cannot satisfy numeric fields; non-finite values and malformed UUID/SHA identifiers fail closed. Token and latency thresholds are non-negative. Canonical sorted compact JSON, SHA-256 content identity, and UUID5 record identity bind every material input. No free-form query, prompt, answer, memory body, command output, credential, worker identity, or arbitrary error payload is accepted or emitted.

          ## Non-goals

          V0 has no database, network, filesystem write, clock, environment, random UUID, worker, lease, scheduler, activation, deployment, feedback, migration, merge, or release surface. A `promote` record remains evidence for a separately authorized process.
          EOF
          sed -i 's/^          //' docs/superpowers/specs/2026-08-24-advisory-policy-promotion-gate-v0-design.md

          cat > docs/superpowers/plans/2026-08-24-advisory-policy-promotion-gate-v0.md <<'EOF'
          # Advisory Policy Promotion Gate v0 — Implementation Plan

          **Date:** 2026-08-24
          **Base:** `candidate/paired-replay-experiment-registry-v0-20260824`

          1. Preserve the immutable Ruff-clean tests-only module-absence RED.
          2. Validate policy identity, paired evidence, registry partition, readiness, thresholds, and request identity before decision logic.
          3. Prove new RED tests for non-negative cost thresholds and failed/cancelled registry pairs before applying their minimal fixes.
          4. Enforce fixed hard-rejection precedence and suppress hold reasons on rejection.
          5. Hold on every non-complete registry state; promote only complete `promising` evidence.
          6. Bind canonical SHA-256 and UUID5 identities without free-form payloads or side effects.
          7. Run threshold-neighborhood, malformed-input, identity-drift, generated-property, exact-retry, hash-seed, public-API, full-regression, audit, and isolated-wheel checks.
          8. Publish an immutable candidate only after all checks pass; then run an independent Python 3.12/3.13 exact-SHA matrix and blind GPT-5.6 Sol review.

          Merge, deployment, migration, feedback, activation, and release remain separate operations.
          EOF
          sed -i 's/^          //' docs/superpowers/plans/2026-08-24-advisory-policy-promotion-gate-v0.md

      - name: Normalize bounded product files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/nextgen_memory/__init__.py
            src/nextgen_memory/policy_promotion_gate.py
            tests/test_policy_promotion_gate.py
            tests/test_policy_promotion_gate_properties.py
            tests/test_policy_promotion_gate_public_api.py
          )
          ruff format "${files[@]}"
          ruff check --fix "${files[@]}"
          ruff check "${files[@]}"
          ruff format --check "${files[@]}"
          python -m compileall -q src scripts
          git diff --check

      - name: Run focused and complete test suites
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_policy_promotion_gate.py \
            tests/test_policy_promotion_gate_properties.py \
            tests/test_policy_promotion_gate_public_api.py \
            | tee /tmp/promotion-focused.txt
          ruff check .
          python -m pytest -q | tee /tmp/promotion-full.txt

      - name: Strict dependency, privacy, side-effect, and stub audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          path = Path('src/nextgen_memory/policy_promotion_gate.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source, filename=str(path))
          forbidden_roots = {
              'asyncio', 'datetime', 'httpx', 'os', 'pathlib', 'psycopg',
              'pymongo', 'random', 'requests', 'socket', 'sqlalchemy',
              'subprocess', 'temporalio', 'time', 'urllib',
          }
          forbidden_calls = {
              'eval', 'exec', 'compile', 'open', 'sleep', 'system',
              'urlopen', 'uuid1', 'uuid4', 'write_bytes', 'write_text',
          }
          findings: list[str] = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Pass):
                  findings.append(f'{node.lineno}:pass')
              elif isinstance(node, ast.Raise):
                  exc = node.exc.func if isinstance(node.exc, ast.Call) else node.exc
                  if (
                      isinstance(exc, ast.Name)
                      and exc.id == 'NotImplementedError'
                  ) or (
                      isinstance(exc, ast.Attribute)
                      and exc.attr == 'NotImplementedError'
                  ):
                      findings.append(f'{node.lineno}:NotImplementedError')
              elif isinstance(node, ast.Import):
                  for alias in node.names:
                      if alias.name.split('.', 1)[0] in forbidden_roots:
                          findings.append(f'{node.lineno}:import:{alias.name}')
              elif isinstance(node, ast.ImportFrom):
                  if node.level == 0 and (
                      (node.module or '').split('.', 1)[0] in forbidden_roots
                  ):
                      findings.append(f'{node.lineno}:import:{node.module}')
              elif isinstance(node, ast.Call):
                  name = (
                      node.func.id
                      if isinstance(node.func, ast.Name)
                      else node.func.attr
                      if isinstance(node.func, ast.Attribute)
                      else None
                  )
                  if name in forbidden_calls:
                      findings.append(f'{node.lineno}:call:{name}')
          lowered = source.lower()
          for marker in (
              'postgresql://', 'mongodb://', 'http://', 'https://',
              'password', 'credential', '# todo', '# fixme', 'raw_query',
              'raw_prompt', 'response_text', 'memory_body', 'lease_timestamp',
              'worker_identity', 'activate_policy(', 'write_feedback(',
          ):
              if marker in lowered:
                  findings.append(f'text:{marker}')
          if findings:
              raise SystemExit('\n'.join(findings))
          print('policy_promotion_gate_audit_findings=0')
          PY

      - name: Build and install wheel outside checkout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf wheelhouse "$RUNNER_TEMP/promotion-gate-wheel-venv"
          python -m pip wheel --no-deps . -w wheelhouse
          test "$(find wheelhouse -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          wheel=$(find wheelhouse -maxdepth 1 -type f -name '*.whl')
          python -m venv "$RUNNER_TEMP/promotion-gate-wheel-venv"
          "$RUNNER_TEMP/promotion-gate-wheel-venv/bin/python" -m pip install --no-deps "$wheel"
          "$RUNNER_TEMP/promotion-gate-wheel-venv/bin/python" - <<'PY'
          import nextgen_memory
          from nextgen_memory import (
              AdvisoryPolicyPromotionGate,
              PolicyPromotionDecision,
          )
          assert AdvisoryPolicyPromotionGate is not None
          assert PolicyPromotionDecision.PROMOTE.value == 'promote'
          assert 'AdvisoryPolicyPromotionGate' in nextgen_memory.__all__
          PY
          "$RUNNER_TEMP/promotion-gate-wheel-venv/bin/python" -m pip check

      - name: Remove transports and prove exact eight-path product surface
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/finalize-advisory-policy-promotion-gate-v7.yml \
            .github/workflows/finalize-policy-promotion-gate-once.yml \
            .github/workflows/record-policy-promotion-gate-red-once.yml \
            .github/workflows/record-policy-promotion-gate-red-v3-once.yml \
            .github/workflows/record-policy-promotion-gate-red-v4-once.yml \
            .github/workflows/record-policy-promotion-gate-red-v5-once.yml
          git add -A
          mapfile -t changed < <(git diff --cached --name-only "$BASE_SHA" | sort)
          expected=(
            docs/policy-promotion-gate-v0-red.md
            docs/superpowers/plans/2026-08-24-advisory-policy-promotion-gate-v0.md
            docs/superpowers/specs/2026-08-24-advisory-policy-promotion-gate-v0-design.md
            src/nextgen_memory/__init__.py
            src/nextgen_memory/policy_promotion_gate.py
            tests/test_policy_promotion_gate.py
            tests/test_policy_promotion_gate_properties.py
            tests/test_policy_promotion_gate_public_api.py
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}")
          test -z "$(git diff --cached --name-only "$BASE_SHA" -- '.github/workflows/**' 'migrations/**' pyproject.toml 'src/nextgen_memory/corrective_retrieval_*')"
          git diff --cached --check

      - name: Commit verified product and publish immutable candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add advisory policy promotion gate v0'
          product_sha=$(git rev-parse HEAD)
          git push origin HEAD:feat/advisory-policy-promotion-gate-v0-20260824

          candidate='candidate/advisory-policy-promotion-gate-v0-20260824'
          existing=$(git ls-remote --heads origin "$candidate" | awk '{print $1}')
          if [ -n "$existing" ]; then
            test "$existing" = "$product_sha"
          else
            git push origin "$product_sha:refs/heads/$candidate"
          fi

          body=$(cat <<EOF
          ## Advisory policy promotion gate producer GREEN

          - base: \`$BASE_SHA\`;
          - accepted tests-only RED: \`$RED_SHA\`;
          - product: \`$product_sha\`;
          - exact eight-path product surface;
          - semantic RED→GREEN for non-negative cost thresholds and terminal registry states;
          - focused/full tests, strict audit, and isolated wheel import: green;
          - activation, persistence, feedback, migration, deployment, merge, and release: none;
          - exact Python 3.12/3.13 verifier and genuine GPT-5.6 Sol review remain mandatory.
          EOF
          )
          gh api "repos/$REPO/issues/23/comments" --raw-field body="$body" >/dev/null
