name: Publish Inherited Rerank Telemetry GREEN 2

on:
  push:
    branches: [bootstrap/inherited-rerank-telemetry-green-2]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/inherited-rerank-telemetry-v0
          fetch-depth: 0
      - name: Verify guarded feature head
        run: test "$(git rev-parse HEAD)" = "0e49685c8c627dc5b5f8ff1f1826a7c65d882a4b"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Make score, cap, and policy cases rank-valid
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_inherited_rerank_telemetry.py")
          text = path.read_text(encoding="utf-8")

          old_score = '''                replace(
                      reranked_results()[0],
                      final_score=0.90,
                  ),
          '''
          new_score = '''                replace(
                      reranked_results()[0],
                      base=replace(reranked_results()[0].base, final_rank=1),
                      final_rank=1,
                      final_score=0.90,
                  ),
          '''
          old_cap = '''                replace(
                      reranked_results()[0],
                      final_score=0.89,
                      inherited_breakdown=replace(
          '''
          new_cap = '''                replace(
                      reranked_results()[0],
                      base=replace(reranked_results()[0].base, final_rank=1),
                      final_rank=1,
                      final_score=0.89,
                      inherited_breakdown=replace(
          '''
          old_policy = '''                replace(
                      reranked_results()[0],
                      inherited_breakdown=replace(
          '''
          new_policy = '''                replace(
                      reranked_results()[0],
                      base=replace(reranked_results()[0].base, final_rank=1),
                      final_rank=1,
                      inherited_breakdown=replace(
          '''

          for label, old, new in (
              ("score", old_score, new_score),
              ("cap", old_cap, new_cap),
              ("policy", old_policy, new_policy),
          ):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one fixture block, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Format and verify focused and complete behavior
        run: |
          ruff format \
            src/nextgen_memory/inherited_rerank_telemetry.py \
            tests/test_inherited_rerank_telemetry.py
          ruff check \
            src/nextgen_memory/inherited_rerank_telemetry.py \
            tests/test_inherited_rerank_telemetry.py \
            --fix
          ruff check .
          python -m pytest tests/test_inherited_rerank_telemetry.py -q
          python -m pytest -q
          python -m compileall -q src
          git diff --check
      - name: Verify exact correction scope
        run: |
          cat > /tmp/allowed <<'EOF'
          src/nextgen_memory/inherited_rerank_telemetry.py
          tests/test_inherited_rerank_telemetry.py
          EOF
          git diff --name-only | sort > /tmp/actual
          while read -r path; do grep -Fx "$path" /tmp/allowed >/dev/null; done < /tmp/actual
      - name: Commit and push fast-forward
        run: |
          git config user.name "NextGen Memory Automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/nextgen_memory/inherited_rerank_telemetry.py \
            tests/test_inherited_rerank_telemetry.py
          git commit -m "test: target inherited telemetry validation cases"
          git push origin HEAD:feat/inherited-rerank-telemetry-v0
