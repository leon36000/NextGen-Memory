name: Verify Context Compiler GREEN

on:
  push:
    branches: [bootstrap/verify-context-compiler-green]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/context-compiler-v0
          fetch-depth: 0
      - name: Verify target head
        run: test "$(git rev-parse HEAD)" = "c36bbb60fd4051c1360d22d48e59f1543179b075"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project tools
        run: python -m pip install -e '.[dev]'
      - name: Normalize test imports
        run: ruff check tests/test_context_compiler.py --select I001 --fix
      - name: Lint complete tree
        run: ruff check .
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Compile source
        run: python -m compileall -q src
      - name: Verify correction scope
        run: |
          git diff --check
          test "$(git diff --name-only)" = "tests/test_context_compiler.py"
      - name: Commit passing formatting correction
        run: |
          git config user.name "NextGen Memory Automation"
          git config user.email "actions@users.noreply.github.com"
          git add tests/test_context_compiler.py
          git commit -m "style: finalize context compiler test imports"
          git push origin HEAD:feat/context-compiler-v0
