name: Verify release wheel exact SHA

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONHASHSEED: '0'
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f9cc0b3fca65e9ce68694255c7b5c5a84686b532
          fetch-depth: 0

      - name: Prove exact checkout and eight-path candidate surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f9cc0b3fca65e9ce68694255c7b5c5a84686b532"
          test "$(git merge-base HEAD 937385e4d9235841a38fb28d079fcc0c7c3abe79)" = "937385e4d9235841a38fb28d079fcc0c7c3abe79"
          mapfile -t changed < <(git diff --name-only 937385e4d9235841a38fb28d079fcc0c7c3abe79...HEAD | sort)
          expected=(
            .github/workflows/release-wheel-integrity.yml
            docs/superpowers/plans/2026-08-23-release-wheel-integrity-v1.md
            docs/superpowers/specs/2026-08-23-release-wheel-integrity-v1-design.md
            scripts/verify_release_wheel.py
            tests/test_release_wheel_cli.py
            tests/test_release_wheel_integrity.py
            tests/test_release_wheel_reproducibility.py
            tests/test_release_wheel_workflow.py
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}")
          test -z "$(git diff --name-only 937385e4d9235841a38fb28d079fcc0c7c3abe79...HEAD -- 'src/**' 'migrations/**' pyproject.toml)"
          if printf '%s\n' "${changed[@]}" | grep -Eq '^src/nextgen_memory/corrective_retrieval_'; then
            echo 'candidate modifies active corrective-retrieval code' >&2
            exit 1
          fi
          git diff --check 937385e4d9235841a38fb28d079fcc0c7c3abe79...HEAD
          test -z "$(git status --porcelain)"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Derive exact commit epoch and install fixed toolchain
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch=$(git show -s --format=%ct HEAD)
          python scripts/verify_release_wheel.py \
            validate-source-date-epoch "$source_date_epoch" \
            > "$RUNNER_TEMP/source-date-epoch.json"
          echo "SOURCE_DATE_EPOCH=$source_date_epoch" >> "$GITHUB_ENV"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python -m pip install --upgrade \
            'pip==25.2' \
            'setuptools==80.9.0' \
            'wheel==0.45.1' \
            'build==1.3.0'
          python -m pip install -e '.[dev]'

      - name: Static, focused and complete exact-candidate verification
        run: |
          ruff check .
          python -m compileall -q src scripts
          python -m pytest -q \
            tests/test_release_wheel_integrity.py \
            tests/test_release_wheel_reproducibility.py \
            tests/test_release_wheel_cli.py \
            tests/test_release_wheel_workflow.py
          python -m pytest -q

      - name: Build the exact Git tree twice
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/raw-release-wheel-${{ matrix.python-version }}"
          rm -rf "$root"
          mkdir -p \
            "$root/source-a" \
            "$root/source-b" \
            "$root/build-a" \
            "$root/build-b" \
            "$root/evidence/wheel-a" \
            "$root/evidence/wheel-b"
          git archive --format=tar HEAD | tar -xf - -C "$root/source-a"
          git archive --format=tar HEAD | tar -xf - -C "$root/source-b"
          (
            cd "$root/source-a"
            python -m build --wheel --no-isolation --outdir "$root/build-a"
          )
          (
            cd "$root/source-b"
            python -m build --wheel --no-isolation --outdir "$root/build-b"
          )
          mapfile -t wheels_a < <(find "$root/build-a" -maxdepth 1 -type f -name '*.whl' | sort)
          mapfile -t wheels_b < <(find "$root/build-b" -maxdepth 1 -type f -name '*.whl' | sort)
          test "${#wheels_a[@]}" -eq 1
          test "${#wheels_b[@]}" -eq 1
          test "$(basename "${wheels_a[0]}")" = "$(basename "${wheels_b[0]}")"
          cp "${wheels_a[0]}" "$root/evidence/wheel-a/"
          cp "${wheels_b[0]}" "$root/evidence/wheel-b/"
          echo "RAW_RELEASE_ROOT=$root" >> "$GITHUB_ENV"
          echo "RAW_WHEEL_A=$root/evidence/wheel-a/$(basename "${wheels_a[0]}")" >> "$GITHUB_ENV"
          echo "RAW_WHEEL_B=$root/evidence/wheel-b/$(basename "${wheels_b[0]}")" >> "$GITHUB_ENV"

      - name: Independently inspect, compare and record safe evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > "$RAW_RELEASE_ROOT/evidence/required-modules.txt"
          from pathlib import Path

          modules = {"nextgen_memory"}
          for path in Path("src/nextgen_memory").rglob("*.py"):
              relative = path.relative_to("src").with_suffix("")
              parts = list(relative.parts)
              if parts[-1] == "__init__":
                  parts.pop()
              if parts:
                  modules.add(".".join(parts))
          print("\n".join(sorted(modules)))
          PY
          args=(
            --expected-name nextgen-memory
            --expected-version 0.1.0
            --required-module nextgen_memory
          )
          while IFS= read -r module; do
            if [ "$module" != "nextgen_memory" ]; then
              args+=(--required-module "$module")
            fi
          done < "$RAW_RELEASE_ROOT/evidence/required-modules.txt"
          python scripts/verify_release_wheel.py inspect \
            "$RAW_WHEEL_A" "${args[@]}" \
            > "$RAW_RELEASE_ROOT/evidence/inspection-a.json"
          python scripts/verify_release_wheel.py inspect \
            "$RAW_WHEEL_B" "${args[@]}" \
            > "$RAW_RELEASE_ROOT/evidence/inspection-b.json"
          python scripts/verify_release_wheel.py compare \
            "$RAW_WHEEL_A" "$RAW_WHEEL_B" "${args[@]}" \
            > "$RAW_RELEASE_ROOT/evidence/comparison.json"
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(os.environ["RAW_RELEASE_ROOT"])
          wheel_a = Path(os.environ["RAW_WHEEL_A"])
          wheel_b = Path(os.environ["RAW_WHEEL_B"])
          sha_a = hashlib.sha256(wheel_a.read_bytes()).hexdigest()
          sha_b = hashlib.sha256(wheel_b.read_bytes()).hexdigest()
          if sha_a != sha_b:
              raise SystemExit("same-interpreter raw bytes differ")
          comparison = json.loads((root / "evidence" / "comparison.json").read_text())
          if comparison["byte_reproducible"] is not True:
              raise SystemExit("comparison did not prove byte equality")
          if comparison["semantic_reproducible"] is not True:
              raise SystemExit("comparison did not prove semantic equality")
          if comparison["differences"] != []:
              raise SystemExit("comparison contains unexpected differences")
          report = {
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "python_version": ".".join(map(str, sys.version_info[:3])),
              "same_interpreter_reproducible": True,
              "source_date_epoch": int(os.environ["SOURCE_DATE_EPOCH"]),
              "wheel_filename": wheel_a.name,
              "wheel_sha256": sha_a,
              "wheel_size_bytes": wheel_a.stat().st_size,
          }
          (root / "evidence" / "build.json").write_text(
              json.dumps(
                  report,
                  ensure_ascii=False,
                  allow_nan=False,
                  sort_keys=True,
                  separators=(",", ":"),
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Install outside checkout and verify package-root API
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/raw-release-wheel-venv-${{ matrix.python-version }}"
          rm -rf "$venv"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --no-deps "$RAW_WHEEL_A"
          isolated_directory=$(mktemp -d)
          (
            cd "$isolated_directory"
            "$venv/bin/python" -I - <<'PY'
          from pathlib import Path
          import sys

          import nextgen_memory

          prefix = Path(sys.prefix).resolve()
          module_path = Path(nextgen_memory.__file__).resolve()
          if not module_path.is_relative_to(prefix):
              raise SystemExit("installed package resolved outside the isolated environment")
          missing = [name for name in nextgen_memory.__all__ if not hasattr(nextgen_memory, name)]
          if missing:
              raise SystemExit(f"missing package-root exports: {missing}")
          PY
          )
          "$venv/bin/python" -m pip check

      - name: Privacy-scan exact-candidate reports
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIEi \
            '/home/runner|password|secret|token|dsn|connection|CREATE |ALTER |DROP |SELECT |Metadata-Version:' \
            "$RAW_RELEASE_ROOT/evidence" --include='*.json'; then
            echo 'safe release evidence contains forbidden runtime material' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: raw-release-wheel-python-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/raw-release-wheel-${{ matrix.python-version }}/evidence/wheel-a/*.whl
            ${{ runner.temp }}/raw-release-wheel-${{ matrix.python-version }}/evidence/wheel-b/*.whl
            ${{ runner.temp }}/raw-release-wheel-${{ matrix.python-version }}/evidence/inspection-a.json
            ${{ runner.temp }}/raw-release-wheel-${{ matrix.python-version }}/evidence/inspection-b.json
            ${{ runner.temp }}/raw-release-wheel-${{ matrix.python-version }}/evidence/comparison.json
            ${{ runner.temp }}/raw-release-wheel-${{ matrix.python-version }}/evidence/build.json
          if-no-files-found: error
          retention-days: 7

  compare-cross-python:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: raw-release-wheel-python-*
          path: ${{ runner.temp }}/raw-release-wheel-matrix

      - name: Compare exact-candidate evidence across Python versions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "raw-release-wheel-matrix"
          reports: dict[str, dict[str, object]] = {}
          for path in root.rglob("build.json"):
              report = json.loads(path.read_text(encoding="utf-8"))
              minor = ".".join(str(report["python_version"]).split(".")[:2])
              if minor in reports:
                  raise SystemExit(f"duplicate Python evidence: {minor}")
              if report["candidate_sha"] != "f9cc0b3fca65e9ce68694255c7b5c5a84686b532":
                  raise SystemExit("candidate SHA drift")
              if report["same_interpreter_reproducible"] is not True:
                  raise SystemExit("same-interpreter reproducibility failed")
              artifact_root = path.parent
              wheels = sorted(artifact_root.glob("wheel-*/*.whl"))
              if len(wheels) != 2:
                  raise SystemExit(f"incomplete wheel set: {minor}")
              hashes = [hashlib.sha256(wheel.read_bytes()).hexdigest() for wheel in wheels]
              if len(set(hashes)) != 1 or hashes[0] != report["wheel_sha256"]:
                  raise SystemExit(f"wheel bytes differ from report: {minor}")
              reports[minor] = report
          if set(reports) != {"3.12", "3.13"}:
              raise SystemExit(f"unexpected Python evidence set: {sorted(reports)}")
          sha_312 = str(reports["3.12"]["wheel_sha256"])
          sha_313 = str(reports["3.13"]["wheel_sha256"])
          summary = {
              "candidate_sha": "f9cc0b3fca65e9ce68694255c7b5c5a84686b532",
              "cross_python_byte_identical": sha_312 == sha_313,
              "python_3_12_sha256": sha_312,
              "python_3_13_sha256": sha_313,
              "same_interpreter_reproducible": True,
          }
          destination = root / "raw-cross-python-summary.json"
          destination.write_text(
              json.dumps(
                  summary,
                  ensure_ascii=False,
                  allow_nan=False,
                  sort_keys=True,
                  separators=(",", ":"),
              )
              + "\n",
              encoding="utf-8",
          )
          print(destination.read_text(encoding="utf-8"), end="")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: raw-release-wheel-cross-python-summary
          path: ${{ runner.temp }}/raw-release-wheel-matrix/raw-cross-python-summary.json
          if-no-files-found: error
          retention-days: 7
