          source = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'patch count={count} for:\n{old}')
              source = source.replace(old, new, 1)

          replace_once(
              '''    normalized = float(value)
              if not isfinite(normalized):
                  invalid.add(name)
                  return None
              ''',
              '''    try:
                  normalized = float(value)
              except (OverflowError, ValueError):
                  invalid.add(name)
                  return None
              if not isfinite(normalized):
                  invalid.add(name)
                  return None
              ''',
          )
          replace_once(
              '''    try:
                  offset = value.utcoffset()
              except Exception:
                  invalid.add(name)
                  return None
              if offset is None:
                  invalid.add(name)
                  return None
              return value.astimezone(UTC)
              ''',
              '''    try:
                  offset = value.utcoffset()
                  if offset is None:
                      invalid.add(name)
                      return None
                  return value.astimezone(UTC)
              except Exception:
                  invalid.add(name)
                  return None
              ''',
          )
          replace_once(
              '''    if depth >= 8:
                  return {"kind": "depth_limit"}
              if value is None:
              ''',
              '''    if depth >= 8:
                  return {"kind": "depth_limit"}
              value_type = object.__getattribute__(value, "__class__")
              if value is None:
              ''',
          )
          replace_once(
              '''    if isinstance(value, int):
                  return {"kind": "int", "value": value}
              ''',
              '''    if isinstance(value, int):
                  if -_MAX_COUNT <= value <= _MAX_COUNT:
                      return {"kind": "int", "value": value}
                  magnitude = abs(value)
                  byte_length = max(1, (magnitude.bit_length() + 7) // 8)
                  return {
                      "kind": "int",
                      "sign": -1 if value < 0 else 1,
                      "bit_length": magnitude.bit_length(),
                      "sha256": hashlib.sha256(
                          magnitude.to_bytes(byte_length, "big")
                      ).hexdigest(),
                  }
              ''',
          )
          replace_once(
              '''        except (ValueError, OverflowError):
                  canonical = "invalid_datetime"
              ''',
              '''        except Exception:
                  canonical = "invalid_datetime"
              ''',
          )
          replace_once(
              '''    if isinstance(value, Mapping):
                  entries = [
                      {
                          "key": _sanitize_untrusted(key, depth=depth + 1),
                          "value": _sanitize_untrusted(item, depth=depth + 1),
                      }
                      for key, item in value.items()
                  ]
                  entries.sort(key=_canonical_json)
                  return {"kind": "mapping", "items": entries}
              if isinstance(value, (list, tuple, set, frozenset)):
                  items = [
                      _sanitize_untrusted(item, depth=depth + 1)
                      for item in tuple(value)[:_MAX_SIGNAL_VALUES]
                  ]
                  items.sort(key=_canonical_json)
                  return {
                      "kind": "collection",
                      "type": _safe_type_name(value),
                      "items": items,
                      "truncated": len(value) > _MAX_SIGNAL_VALUES,
                  }
              ''',
              '''    if value_type is dict:
                  bounded_entries = tuple(value.items())[:_MAX_SIGNAL_VALUES]
                  entries = [
                      {
                          "key": _sanitize_untrusted(key, depth=depth + 1),
                          "value": _sanitize_untrusted(item, depth=depth + 1),
                      }
                      for key, item in bounded_entries
                  ]
                  entries.sort(key=_canonical_json)
                  return {
                      "kind": "mapping",
                      "items": entries,
                      "truncated": len(value) > _MAX_SIGNAL_VALUES,
                  }
              if value_type in (list, tuple, set, frozenset):
                  bounded_items = tuple(value)[:_MAX_SIGNAL_VALUES]
                  items = [
                      _sanitize_untrusted(item, depth=depth + 1)
                      for item in bounded_items
                  ]
                  items.sort(key=_canonical_json)
                  return {
                      "kind": "collection",
                      "type": _safe_type_name(value),
                      "items": items,
                      "truncated": len(value) > _MAX_SIGNAL_VALUES,
                  }
              ''',
          )
          replace_once(
              '''    normalized = float(value)
              if not isfinite(normalized) or normalized < 0.0:
                  raise PolicyPromotionValidationError(
                      f"{name} must be a non-negative finite number"
                  )
              ''',
              '''    try:
                  normalized = float(value)
              except (OverflowError, ValueError) as exc:
                  raise PolicyPromotionValidationError(
                      f"{name} must be a non-negative finite number"
                  ) from exc
              if not isfinite(normalized) or normalized < 0.0:
                  raise PolicyPromotionValidationError(
                      f"{name} must be a non-negative finite number"
                  )
              ''',
          )
          replace_once(
              '''    normalized = float(value)
              if not isfinite(normalized):
                  raise PolicyPromotionValidationError(
                      f"{name} must be a finite number"
                  )
              ''',
              '''    try:
                  normalized = float(value)
              except (OverflowError, ValueError) as exc:
                  raise PolicyPromotionValidationError(
                      f"{name} must be a finite number"
                  ) from exc
              if not isfinite(normalized):
                  raise PolicyPromotionValidationError(
                      f"{name} must be a finite number"
                  )
              ''',
          )
          path.write_text(source, encoding='utf-8')
          PY
          ruff format \
            src/nextgen_memory/policy_promotion.py \
            tests/test_policy_promotion.py
          ruff check --fix \
            src/nextgen_memory/policy_promotion.py \
            tests/test_policy_promotion.py
          ruff check \
            src/nextgen_memory/policy_promotion.py \
            tests/test_policy_promotion.py

      - name: Prove adversarial GREEN
        run: |
          python -m pytest -q \
            tests/test_policy_promotion.py::test_huge_evidence_number_rejects_without_overflow \
            tests/test_policy_promotion.py::test_huge_config_number_raises_bounded_validation_error \
            tests/test_policy_promotion.py::test_hostile_timezone_rejects_without_exception \
            tests/test_policy_promotion.py::test_hostile_signal_container_rejects_without_exception

      - name: Materialize package-root exports and normalize the product
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          path = Path('src/nextgen_memory/__init__.py')
          source = path.read_text(encoding='utf-8')
          names = (
              'DeterministicPolicyPromotionGate',
              'PolicyPromotionDecision',
              'PolicyPromotionDisposition',
              'PolicyPromotionEvidence',
              'PolicyPromotionGateConfig',
              'PolicyPromotionReason',
              'PolicyPromotionSafeMetrics',
              'PolicyPromotionValidationError',
              'PolicyVerificationSignal',
              'fingerprint_policy_promotion_config',
          )
          if 'from .policy_promotion import (' not in source:
              block = 'from .policy_promotion import (\n' + ''.join(
                  f'    {name},\n' for name in names
              ) + ')\n'
              marker = 'from .provenance_credit import ('
              if source.count(marker) != 1:
                  raise SystemExit('provenance-credit marker drift')
              source = source.replace(marker, block + marker, 1)

          tree = ast.parse(source)
          assignment = next(
              statement
              for statement in tree.body
              if isinstance(statement, ast.Assign)
              and any(
                  isinstance(target, ast.Name) and target.id == '__all__'
                  for target in statement.targets
              )
          )
          if not isinstance(assignment.value, ast.List):
              raise SystemExit('__all__ must remain a literal list')
          current = [
              item.value
              for item in assignment.value.elts
              if isinstance(item, ast.Constant) and isinstance(item.value, str)
          ]
          if len(current) != len(assignment.value.elts):
              raise SystemExit('__all__ contains a non-string entry')
          merged = sorted(set(current).union(names))
          start = source.index('__all__ = [')
          end = source.index('\n]', start) + 2
          source = (
              source[:start]
              + '__all__ = [\n'
              + ''.join(f'    "{name}",\n' for name in merged)
              + ']'
              + source[end:]
          )
          ast.parse(source)
          path.write_text(source, encoding='utf-8')
          PY
          python - <<'PY'
          from pathlib import Path

          for relative in (
              'docs/superpowers/specs/2026-08-24-policy-promotion-gate-v0-design.md',
              'docs/superpowers/plans/2026-08-24-policy-promotion-gate-v0.md',
          ):
              path = Path(relative)
              lines = path.read_text(encoding='utf-8').splitlines()
              path.write_text(
                  '\n'.join(line.rstrip() for line in lines) + '\n',
                  encoding='utf-8',
              )
          PY
          files=(
            src/nextgen_memory/__init__.py
            src/nextgen_memory/policy_promotion.py
            tests/test_policy_promotion.py
            tests/test_policy_promotion_properties.py
            tests/test_policy_promotion_public_api.py
          )
          ruff check --fix "${files[@]}"
          ruff format "${files[@]}"
          ruff check "${files[@]}"
          python -m compileall -q src scripts
          git diff --check

      - name: Run focused and complete regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_policy_promotion.py \
            tests/test_policy_promotion_properties.py \
            tests/test_policy_promotion_public_api.py \
            | tee /tmp/focused-tests.txt
          ruff check .
          python -m pytest -q | tee /tmp/full-tests.txt
          git diff --check 91d14e9ff9f8c89d05cb2349b012a6681bf3d828...HEAD

      - name: Audit pure deterministic safety boundary
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          path = Path('src/nextgen_memory/policy_promotion.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source, filename=str(path))
          forbidden_imports = {
              'asyncio', 'httpx', 'os', 'pathlib', 'psycopg', 'pymongo',
              'random', 'requests', 'socket', 'sqlalchemy', 'subprocess',
              'temporalio', 'time', 'urllib',
          }
          forbidden_calls = {
              'eval', 'exec', 'open', 'sleep', 'system', 'urlopen',
              'uuid1', 'uuid4', 'write_bytes', 'write_text', 'now',
              'utcnow', 'today', 'getenv',
          }
          findings: list[str] = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Pass):
                  findings.append(f'{node.lineno}:pass')
              elif (
                  isinstance(node, ast.Expr)
                  and isinstance(node.value, ast.Constant)
                  and node.value.value is Ellipsis
              ):
                  findings.append(f'{node.lineno}:ellipsis')
              elif isinstance(node, ast.Raise):
                  exc = node.exc.func if isinstance(node.exc, ast.Call) else node.exc
                  if (
                      isinstance(exc, ast.Name)
                      and exc.id == 'NotImplementedError'
                  ) or (
                      isinstance(exc, ast.Attribute)
                      and exc.attr == 'NotImplementedError'
                  ):
                      findings.append(f'{node.lineno}:NotImplementedError')
              elif isinstance(node, ast.Import):
                  for alias in node.names:
                      if alias.name.split('.', 1)[0] in forbidden_imports:
                          findings.append(f'{node.lineno}:import:{alias.name}')
              elif isinstance(node, ast.ImportFrom):
                  if (node.module or '').split('.', 1)[0] in forbidden_imports:
                      findings.append(f'{node.lineno}:import:{node.module}')
              elif isinstance(node, ast.Call):
                  name = (
                      node.func.id
                      if isinstance(node.func, ast.Name)
                      else node.func.attr
                      if isinstance(node.func, ast.Attribute)
                      else None
                  )
                  if name in forbidden_calls:
                      findings.append(f'{node.lineno}:call:{name}')
          lowered = source.lower()
          for marker in (
              'postgresql://', 'mongodb://', 'http://', 'https://',
              'password', 'credential', '# todo', '# fixme', 'raw_query',
              'raw_prompt', 'response_text', 'memory_body', 'lease_timestamp',
              'worker_identity', 'activate_policy', 'write_feedback',
          ):
              if marker in lowered:
                  findings.append(f'text:{marker}')
          if findings:
              raise SystemExit('\n'.join(findings))
          print('policy_promotion_safety_findings=0')
          PY

      - name: Build and install the wheel outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf wheelhouse "$RUNNER_TEMP/policy-promotion-wheel"
          python -m pip wheel --no-deps . -w wheelhouse
          test "$(find wheelhouse -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          python -m venv "$RUNNER_TEMP/policy-promotion-wheel"
          "$RUNNER_TEMP/policy-promotion-wheel/bin/python" -m pip install --no-deps wheelhouse/*.whl
          "$RUNNER_TEMP/policy-promotion-wheel/bin/python" - <<'PY'
          import nextgen_memory
          from nextgen_memory import (
              DeterministicPolicyPromotionGate,
              PolicyPromotionDisposition,
          )
          assert DeterministicPolicyPromotionGate is not None
          assert PolicyPromotionDisposition.PROMOTE.value == 'promote'
          assert 'DeterministicPolicyPromotionGate' in nextgen_memory.__all__
          PY
          "$RUNNER_TEMP/policy-promotion-wheel/bin/python" -m pip check
          sha256sum wheelhouse/*.whl | awk '{print $1}' > /tmp/wheel.sha256

      - name: Remove every transport and prove exact seven-file product scope
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/diagnose-policy-promotion-green.yml \
            .github/workflows/normalize-policy-promotion-design-whitespace-once.yml \
            .github/workflows/finalize-policy-promotion-gate-v0-once.yml
          git add -A
          mapfile -t changed < <(git diff --cached --name-only 91d14e9ff9f8c89d05cb2349b012a6681bf3d828 | sort)
          expected=(
            docs/superpowers/plans/2026-08-24-policy-promotion-gate-v0.md
            docs/superpowers/specs/2026-08-24-policy-promotion-gate-v0-design.md
            src/nextgen_memory/__init__.py
            src/nextgen_memory/policy_promotion.py
            tests/test_policy_promotion.py
            tests/test_policy_promotion_properties.py
            tests/test_policy_promotion_public_api.py
          )
          printf 'product_path_count=%s\n' "${#changed[@]}"
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}")
          test -z "$(git diff --cached --name-only 91d14e9ff9f8c89d05cb2349b012a6681bf3d828 -- 'migrations/**' '.github/workflows/**' pyproject.toml 'src/nextgen_memory/corrective_retrieval_*')"
          git diff --cached --check

      - name: Commit only the fully verified product candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add deterministic policy promotion gate v0'
          git push origin HEAD:feat/policy-promotion-gate-v0-20260824
