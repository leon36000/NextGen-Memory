name: Finalize deterministic policy promotion gate v0 once

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'feat/policy-promotion-gate-v0-20260824'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/policy-promotion-gate-v0-20260824
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'

      - name: Add adversarial overflow and hostile-object tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_policy_promotion.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              'from datetime import UTC, datetime, timedelta\n',
              'from datetime import UTC, datetime, timedelta, tzinfo\n',
              1,
          )
          marker = 'def test_huge_evidence_number_rejects_without_overflow() -> None:'
          if marker not in source:
              source += '''

class ExplosiveTimezone(tzinfo):
    def utcoffset(self, dt):
        raise RuntimeError("timezone access must be contained")

    def dst(self, dt):
        return None


class ExplosiveMapping(dict):
    def items(self):
        raise RuntimeError("mapping iteration must be contained")


class ExplosiveList(list):
    def __iter__(self):
        raise RuntimeError("collection iteration must be contained")


def test_huge_evidence_number_rejects_without_overflow() -> None:
    decision = evaluate(valid_evidence(mean_effect=10**10_000))

    assert decision.disposition is PolicyPromotionDisposition.REJECT
    assert decision.reasons == (PolicyPromotionReason.MALFORMED_EVIDENCE,)
    assert "mean_effect" in decision.invalid_fields


def test_huge_config_number_raises_bounded_validation_error() -> None:
    with pytest.raises(
        PolicyPromotionValidationError,
        match="maximum_standard_error",
    ):
        PolicyPromotionGateConfig(maximum_standard_error=10**10_000)


def test_hostile_timezone_rejects_without_exception() -> None:
    hostile = datetime(2026, 8, 24, 3, 0, tzinfo=ExplosiveTimezone())

    decision = evaluate(valid_evidence(evidence_at=hostile))

    assert decision.disposition is PolicyPromotionDisposition.REJECT
    assert decision.reasons == (PolicyPromotionReason.MALFORMED_EVIDENCE,)
    assert "evidence_at" in decision.invalid_fields


@pytest.mark.parametrize(
    "hostile_collection",
    [ExplosiveMapping(), ExplosiveList()],
)
def test_hostile_signal_container_rejects_without_exception(
    hostile_collection: object,
) -> None:
    decision = evaluate(
        valid_evidence(required_signals=hostile_collection)
    )

    assert decision.disposition is PolicyPromotionDisposition.REJECT
    assert decision.reasons == (PolicyPromotionReason.MALFORMED_EVIDENCE,)
    assert "required_signals" in decision.invalid_fields
'''
          path.write_text(source, encoding='utf-8')
          PY
          ruff format tests/test_policy_promotion.py
          ruff check --fix tests/test_policy_promotion.py
          ruff check tests/test_policy_promotion.py

      - name: Prove adversarial RED against the current implementation
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q \
            tests/test_policy_promotion.py::test_huge_evidence_number_rejects_without_overflow \
            tests/test_policy_promotion.py::test_huge_config_number_raises_bounded_validation_error \
            tests/test_policy_promotion.py::test_hostile_timezone_rejects_without_exception \
            tests/test_policy_promotion.py::test_hostile_signal_container_rejects_without_exception \
            > /tmp/policy-promotion-hardening-red.txt 2>&1
          red_rc=$?
          set -e
          test "$red_rc" -ne 0
          grep -E 'OverflowError|RuntimeError' \
            /tmp/policy-promotion-hardening-red.txt >/dev/null
          grep -E '5 failed' /tmp/policy-promotion-hardening-red.txt >/dev/null
          tail -n 180 /tmp/policy-promotion-hardening-red.txt

      - name: Harden numeric conversion and malformed-value sanitization
        shell: bash
        run: |
